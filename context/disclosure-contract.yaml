# ServerOS progressive disclosure.
#
# Why this file exists
# --------------------
# `docs/capability-discovery.md` already states the principle — "big package,
# small context" — and states it about packaging. It does not say what a session
# is told at startup, in what order, or what it must never be told. So the
# startup view grew the way such views do: every round added one true and useful
# line, and no round removed any, because each line was individually justified.
#
# The result is the failure this file prevents: a startup context that is read
# once, believed generally, and used specifically — which is to say, not used.
#
# Disclosure is three separate things disclosed separately, because they are
# needed at different moments and one of them is needed before any action.
schema: serveros/disclosure.v1
version: 1

axes:
  context:
    question: "what is this session working on"
    needed: first
    owner: context/
  capability:
    question: "what can this machine do about it"
    needed: when choosing an approach
    owner: abilities/
  authority:
    question: "what may I do without asking"
    needed: before acting
    owner: policies

# ---------------------------------------------------------------------------
# Levels. L0 is unconditional; everything above it is requested.
# ---------------------------------------------------------------------------
levels:
  context:
    L0: "project · Item id · Run id"
    L1: "the Item's current state, milestone, and open blockers"
    L2: "the Run's evidence locator and recent Activity"
    L3: "the full Context Capsule, claims and provenance"
  capability:
    L0: "native discovery and an on-demand query; a count only when already supplied"
    L1: "names of abilities likely relevant to this Item"
    L2: "a specific ability's provider, status and reason"
    L3: "the full resolved capability set with every input"
  authority:
    L0: "placement root count and the reminder that grants/owner rules still apply"
    L1: "the policy set that applies to this project"
    L2: "a specific denial and its reason"
    L3: "the full authority statement"

# ---------------------------------------------------------------------------
# When a capability count is supplied, why it is not a list.
# ---------------------------------------------------------------------------
capability_l0:
  because: >
    a list is a menu, a menu invites browsing, and browsing is how a session
    spends its first thousand tokens reading a catalogue instead of working.
    A caller may supply an existing count, but startup need not fetch one.
    The native agent already has Skill discovery; it does not need to wait
    for a second catalogue before using an available tool.

  # TWO numbers, and they are not the same number. This section used to
  # declare one shape — "N abilities resolvable on this device" — while
  # a cheap catalogue read used to be priced as "one manifest read, no probes".
  # A probe-free read cannot produce a resolved count: resolution is the
  # eight-input intersection. So the declaration asked for a number its own
  # cost model could not pay for, and the cheap read would have been rendered
  # under the expensive word. That is the union wearing the intersection's
  # name, one layer above where `abilities/resolver.py` refuses to do it.
  shapes:
    deferred:
      renders: "use native discovery; ServerOS lookup on request"
      produced_by: "no read or IPC; a startup does not require a live ability count"
      means: "discovery has not been requested; this is not an availability failure"
    catalogue:
      renders: "N known to this authority; resolve one with `serverosctl ability resolve`"
      produced_by: "one projection read — the count of abilities the authority carries"
      means: "ServerOS has a catalogue. It does NOT mean this device can use them."
    resolved:
      renders: "N resolvable[, M undecided]"
      produced_by: "`abilities/resolver.py` over the eight inputs; `count_abilities`"
      means: "the intersection agreed for these. M is the number nobody could decide."
  default: deferred
  because_two_shapes: >
    a caller that does not say which number it has does not get the stronger
    claim. A bare integer is a catalogue count, because that is the only read
    a bare integer can have come from.
  forbidden_at_l0:
    - "any ability list longer than a count"
    - "per-device resolution of anything"
    - "a file tree, a map, or a generated projection"
    - "anything a previous session learned that this one has not asked for"

# ---------------------------------------------------------------------------
# The contract between levels. Three rules, all testable.
# ---------------------------------------------------------------------------
contract:
  implicit_disclosure: forbidden
  monotonicity: >
    a higher level never contradicts a lower one. If it does, the lower level
    was wrong and the defect is there, not in the higher one.
  skipping: allowed
  because: >
    this describes what ServerOS OFFERS, not a protocol an agent must walk. An
    agent that already knows what it needs asks for exactly that, and the
    honest response is the answer plus which level it came from.

# ---------------------------------------------------------------------------
# Cost, stated per level, because a level that costs a probe is a level a
# session will stop requesting and then stop trusting.
# ---------------------------------------------------------------------------
costs:
  context: {L0: "none", L1: "one state read", L2: "one state read", L3: "one state read"}
  capability: {L0: "none by default; a supplied count requires no additional read", L1: "one manifest read, no probes",
               L2: "may run one probe", L3: "runs every probe"}
  authority: {L0: "none", L1: "one policy read", L2: "none — it is already known",
              L3: "one policy read"}
  rule: "a level that runs a probe is never disclosed at startup"

# ---------------------------------------------------------------------------
# The startup view, declared exactly. This is the whole of what is rendered
# before the agent has asked for anything.
# ---------------------------------------------------------------------------
startup_view:
  lines:
    - "ServerOS is present on this device"
    - "context: <project>/<Item>/<Run>          (context L0)"
    - "capabilities: use native discovery; ServerOS lookup on request  (capability L0)"
    - "authority: <N> bound roots define placement, not permission; existing grants and owner rules apply  (authority L0)"
    - "details on request: `serverosctl context current`; `serverosctl ability resolve --request <file>`"
  budget_lines: 6
  budget_tokens: 120
  because: >
    a budget with a number is the only version of "keep it small" that survives
    contact with a round that has one more useful thing to add. When a future
    line does not fit, the choice is which line to remove, made explicitly.

# ---------------------------------------------------------------------------
# Degradation. What is disclosed when an input is missing.
# ---------------------------------------------------------------------------
degradation:
  rule: >
    a level that cannot be produced says so at its own level, and never falls
    back to a lower level's silence. "capabilities: unknown (device profile
    incompletely bound)" is a disclosure. Omitting the line is not.
  because: >
    an absent line reads as "nothing to report", which is the same defect the
    board view has: a projection that renders an unknown as an empty.

# ---------------------------------------------------------------------------
# The rule behind "capability L0 is a number", stated once for all three axes.
# ---------------------------------------------------------------------------
l0_never_enumerates:
  rule: >
    no L0 line enumerates a collection. A count, a boundary and a pointer,
    never the members.
  because: >
    this was learned twice in one afternoon, which is why it is written down
    once rather than beside the axis it was first noticed on. Capability L0
    was designed as a number and stayed one. Authority L0 was written as
    "writes under <bound roots> are admitted" and the first live run rendered
    it as twelve absolute paths — about half the entire budget on the one line
    a reader skips — together with a context line carrying a full exception
    sentence. A five-line view measured 160 tokens against a budget of 120.
  found_by: >
    running the command. Not by review, and not by the mutation tests, which
    had imagined the failure only on the axis where it was already refused.
    A budget with a number is what turned it from a matter of taste into a
    failing measurement.
  corollary: >
    when a level cannot be produced, the L0 line says so in a few words and
    names the command that has the long answer. The detail is not discarded,
    it is one level down — `context: unknown (ValueError; `serverosctl
    context current` explains)` is a disclosure; a pasted stack message is a
    transcript.

rules:
  - "Disclosure is a floor. It never restricts what the native agent may
     discover on its own — see the non-regression contract in
     `docs/capability-discovery.md`."
  - "Every disclosed line names its level. A line whose level cannot be stated
     is a line nobody can reason about the cost of. The presence preamble and
     the closing pointer line are exempt and carry `axis: null`, because they
     disclose no axis and are the same at every level — the exemption is a
     value in the record, not an unstated exception."
  - "Memory is queried, never preloaded. Opening a session with everything the
     last one learned is not context, it is a transcript."
  - "Startup performs no daemon lookup or catalogue read. Discovery is deferred;
     a caller that attempted counting and failed supplies null, not a false zero."
