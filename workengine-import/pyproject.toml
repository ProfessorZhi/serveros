[project]
name = "workengine"
version = "0.1.0"
description = "Autonomous Delivery Workflow v0 - C1 Work Engine: persistent Work Item + state machine + cross-session resume."
requires-python = ">=3.11"
license = { text = "PROPRIETARY" }
dependencies = []

[project.scripts]
workengine = "workengine.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["workengine*"]
