[project]
name = "workengine"
version = "0.3.0"
description = "ServerOS v3 federated workflow control plane for information, Items, Runs, evidence, and feedback."
requires-python = ">=3.11"
license = { text = "PROPRIETARY" }
dependencies = []

[project.scripts]
workengine = "workengine.cli:main"
serverosctl = "workengine.cli:main"
# The MCP adapter is a separate process from the CLI on purpose: an agent that
# holds the control surface must not thereby hold the maintenance one.
serveros-work-mcp = "workengine.mcp:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["workengine*"]

[tool.setuptools.package-data]
workengine = ["schema.sql", "schemas/*.json"]
