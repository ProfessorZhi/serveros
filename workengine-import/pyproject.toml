[project]
name = "workengine"
version = "0.2.0"
description = "ServerOS v2 Item, Activity, Run, context, evidence, and migration control plane."
requires-python = ">=3.11"
license = { text = "PROPRIETARY" }
dependencies = []

[project.scripts]
workengine = "workengine.cli:main"
serverosctl = "workengine.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["workengine*"]

[tool.setuptools.package-data]
workengine = ["schema.sql"]
