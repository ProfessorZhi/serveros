# ServerOS Managed Runtime Registry — the schema.
#
# Why this file exists
# --------------------
# On 2026-09-12 this host's Remote Desktop Commander endpoint was functionally
# offline for 54 minutes. Every process-level indicator said otherwise:
#
#     process_running       true       the PID existed the whole time
#     active (running)      true       systemd agreed
#     transport_connected   true       ESTABLISHED to 142.251.33.211:443
#     service_healthy       ???        it could not serve one single request
#
# The endpoint was in a device-authorization wait loop, restarting every ~24
# minutes as each device code expired, and systemd's `Restart=always` dutifully
# brought it back each time. That is the shape of failure this registry exists
# to make reportable. Nothing about it is exotic — it is what "a long-running
# user-space thing" does when the thing it depends on is a *session* rather than
# a *process*, and process supervision cannot renew a session.
#
# Three consequences are written into the schema below.
#
# 1. NEVER call these things `service`. A process, a user systemd unit, a
#    container, an MCP server, a relay endpoint and a test runtime have
#    different lifetimes, different owners and different kill semantics. One
#    word for all of them is how "stop the dev container" becomes "stop the
#    baseline".
#
# 2. Health is FOUR axes, not one boolean. `process running = HEALTHY` is the
#    single most expensive simplification available here, and this machine has
#    already paid for it once.
#
# 3. `observe` and `probe` are different questions with different answers.
#    `observe` finds the thing. `probe` asks whether it can do what it claims.
#    Collapsing them is exactly how `endpoint_present: true` came to sit beside
#    a service that could not serve a request: it was a true report from a
#    probe that measured the wrong thing.
schema: serveros/managed-runtime.v1
version: 1

# ---------------------------------------------------------------------------
# Vocabulary. Closed sets; a value outside one is a validation failure, not a
# guess. Adding a value means editing this file, which is the point.
# ---------------------------------------------------------------------------

kinds:
  # A bare user-space process this node started or adopted.
  - process
  # A systemd --user unit. Lifecycle is systemd's; ServerOS only asks.
  - systemd-user-service
  # A container. Docker is the supervisor; ServerOS never forks it.
  - container
  # An MCP server process serving tools over stdio or a socket.
  - mcp-server
  # A long-lived outbound connection that makes this machine reachable by a
  # control plane. It LISTENS on nothing; it dials out. See fleet/README.md.
  - transport-endpoint
  # A helper an agent runtime depends on (bridge, proxy, sidecar).
  - agent-helper
  # A test runtime stood up for a bounded purpose. Usually reclaimable.
  - test-runtime
  # An agent's own supervisor process: app-server, proxy, session broker. The
  # thing that keeps running when the task that started it does not. See
  # `kind_requirements` — this kind may NOT be registered without a decisive
  # owner, because an unowned one is precisely the 2026-09-13 case.
  - agent-runtime
  # A forwarding path between two machines. First-class for the same reason
  # `attribution-contract.yaml` makes it first-class: it is the join between a
  # runtime here and the device that owns it, and it is the runtime kind whose
  # failure is most often reported as success. `liveness: RUNNING` for a tunnel
  # means a forwarding process exists; it never means traffic flows.
  - tunnel
  # Several runtimes that belong to ONE piece of work and are meaningless
  # judged apart. Registered rarely and deliberately: this is what stops a
  # half-reclaim of a live task.
  - runtime-group

# ---------------------------------------------------------------------------
# Where an MCP server lives, by how it is reached (§40).
#
# The request behind this section was to stop treating every MCP server as
# `persistent`. The useful answer turned out not to be a second lifetime
# vocabulary, because only two of the four modes are lifetimes at all:
#
#   persistent      a process that is up continuously   -> a MANAGED RUNTIME
#   session-scoped  a process bound to an agent session -> a MANAGED RUNTIME
#   on-demand       no long-lived process; spawned per   -> PROVIDER LAYER
#                   call and gone
#   external        not this node's process at all;      -> PROVIDER LAYER
#                   reached over a network
#
# An on-demand server has no process to observe between calls, so registering
# one here would create a resource whose liveness axis is UNKNOWN forever —
# the permanently-DEGRADED shape `kind_requirements.tunnel` already refuses
# for tunnels. What it IS is a way this device can realize an ability, which
# is exactly what a provider describes, and `abilities/provider-contract.yaml`
# is where it goes.
#
# The same argument covers `external`, one step further: ServerOS does not own
# a process on another host, so a registration would be a claim about somebody
# else's runtime. `materialization.path_role: none` already expresses it.
#
# So this section adds no value to `lifecycle_classes`. It names which of the
# two existing surfaces owns each mode, and the test file asserts the mapping
# is total — because "every MCP is persistent" was never a decision anybody
# made, it was the absence of a place to say otherwise.
# ---------------------------------------------------------------------------
mcp_placement:
  modes:
    - id: persistent
      surface: managed-runtime
      lifecycle_class: persistent
    - id: session-scoped
      surface: managed-runtime
      lifecycle_class: session-scoped
    - id: on-demand
      surface: provider-layer
      because: >
        spawned per call and gone. There is no process between calls, so there
        is nothing for a managed runtime to observe — `liveness` would be
        UNKNOWN forever. It is a way to realize an ability, which is a
        provider.
    - id: external
      surface: provider-layer
      because: >
        another host's process. Registering it would be a claim about a runtime
        this node does not own, and `path_role: none` already says it has no
        on-disk footprint here.
  rule: >
    an MCP server registered as a managed runtime names a lifetime of
    `persistent` or `session-scoped`. A server with no process between calls,
    or one that belongs to another host, is a provider — and registering it
    here would be the mistake of giving an ability a runtime identity.

owner_types:
  # A named project (litellm, multi-user-claw, ...). Owner is the project.
  - project
  # A specific work item. The resource dies with the item.
  - work-item
  # ServerOS itself — this node's own control plane.
  - serveros
  # An ability/skill's own runtime dependency.
  - ability

scopes:
  # Runs as the invoking user. Everything on this node, for now.
  - user
  # Would require elevation. DECLARED ONLY — ServerOS performs no system-scope
  # action in v1 and will report NEEDS_HUMAN rather than escalate.
  - system


lifecycle_classes:
  # Expected to be up continuously and to survive a reboot of the user session.
  - persistent
  # Bound to one work item or task; reclaimable when that closes.
  - task-scoped
  # Bound to an agent/login session; expected to disappear with it.
  - session-scoped
  # Nobody should depend on it; safe to reclaim by policy.
  - disposable

desired_states:
  - running
  - stopped

protection_levels:
  # Not reclaimable by any automatic action, ever. Removal is a human decision.
  - protected
  # Reclaimable only by an explicit admission decision with evidence.
  - normal
  # Reclaimable by policy when its owner says so.
  - disposable

# ---------------------------------------------------------------------------
# Criticality. Ranks what to look at first when the host is under pressure.
# It confers NOTHING.
#
# Spelled out here, in the registration contract, because the failure mode is
# obvious and it is not exotic: an operator reads `critical` as "may do more",
# and a resource management layer that escalates its own authority on the
# strength of a label it set itself is a privilege escalation with extra steps.
#
# The values are shared with `attribution-contract.yaml`, which assigns
# criticality to things that were never registered. Two files, one vocabulary,
# and `tests/test_infrastructure.py` asserts the two lists are identical rather
# than trusting that they stay so.
# ---------------------------------------------------------------------------
criticality:
  values: [critical, important, normal]
  # Applied when a registration declares none. Taken from the lifecycle class
  # rather than from the kind, because lifetime is what the ranking is about:
  # something expected to be up across reboots outranks something that dies
  # with the task. `disposable` is the one class that defaults DOWN, and it is
  # the only default that can be wrong in the direction of ignoring something.
  default_by_lifecycle:
    persistent: important
    task-scoped: normal
    session-scoped: normal
    disposable: normal
  # Ranks attention only. Every clause here is a prohibition against reading
  # the field as authority, because that is the only way it can be misused.
  confers: >
    PRIORITY OF ATTENTION ONLY. It does not grant authority to act, it does not
    relax the retry budget, it does not change `is_automatable`, and it does not
    exempt a resource from the protection rules. A `critical` resource with
    `protection: protected` is still never restarted, never stopped and never
    removed by ServerOS — the two fields are checked independently and the
    stricter one wins, always.
  meaning:
    critical: >
      its absence degrades the node's ability to observe or control itself, or
      cuts the path back to the device that owns the work: the RDC endpoint,
      serverosd, control tunnels.
    important: >
      long-lived references other work depends on: the LiteLLM baseline,
      persistent MCP servers.
    normal: "everything else, including every temporary helper"

health_axes:
  # Does the thing exist and is it up? The WEAKEST axis, and the only one a
  # process table can answer.
  liveness:
    values: [RUNNING, STOPPED, UNKNOWN, UNAVAILABLE]
    means_unknown: "no observation has been recorded for this resource"
  # Is the channel it depends on actually carrying anything? Measured, not
  # inferred from the existence of a socket.
  transport:
    values: [CONNECTED, DISCONNECTED, NOT_APPLICABLE, UNKNOWN]
  # Can it serve a request it claims to serve? Asked by calling, not by
  # looking. `NOT_APPLICABLE` when the resource declares no callable surface.
  functional:
    values: [OK, FAILED, NOT_APPLICABLE, UNKNOWN]
  # Is it in the state its desired state says it should be in?
  readiness:
    values: [READY, NOT_READY, NOT_APPLICABLE, UNKNOWN]
  # NOT a health axis. This is the slot a diagnostic-backed probe contributes
  # a refined `reason` to, and it holds no state of its own — every value is
  # UNKNOWN, which is what `Observation` enforces. It is declared here so that
  # the same validation applies to it as to the real axes, rather than it
  # being a special case the validator has to be told about.
  reason:
    values: [UNKNOWN]
    pseudo_axis: true

# ---------------------------------------------------------------------------
# The derived state, and why it is a rule list rather than a lookup table.
#
# The fleet availability table is a full cross-product because it has two
# three-valued axes. This one has four axes with four values each: 256 rows is
# a table nobody reads and nobody maintains. So it is ordered rules instead.
#
# The safety property is preserved by a different mechanism: rules are
# evaluated in order, and if NONE matches, `state()` RAISES. There is no
# fallback value. A test enumerates every combination of the declared value
# lists and asserts each one matches at least one rule, so an uncovered
# combination is a test failure rather than a word that looks like an answer.
#
# This is the same defect the fleet table had — a partial table with a silent
# fallback that emitted the one forbidden word — caught one layer up.
# ---------------------------------------------------------------------------
derived_states:
  rule_table_complete: true
  # ORDER IS SEMANTIC. The first matching rule wins, so the most specific and
  # most informative fault is listed first. The last rule is an explicit
  # catch-all rather than an implicit fallback, so that "no rule matched
  # this" stays distinguishable from "this rule is the general case".
  rules:
    # -- nothing was measured. Before anything is assumed. ------------------
    - state: UNAVAILABLE
      when: {liveness: UNAVAILABLE}
      meaning: "nothing on this host can observe it at all"
    - state: UNKNOWN
      when: {liveness: UNKNOWN}
      meaning: "nothing has observed it. Not the same as healthy."
    # -- at rest, or should not be -----------------------------------------
    - state: STOPPED
      when: {liveness: STOPPED, desired: stopped}
      meaning: "at rest; this is the desired state, not a fault"
    - state: NOT_RUNNING
      when: {liveness: STOPPED}
      meaning: "desired running, is not. A reconcile candidate if policy allows."
    # -- desired state expressed on the readiness axis ---------------------
    - state: NOT_READY
      when: {readiness: NOT_READY}
      meaning: "up, and not in the state its desired state calls for"
    # -- the failure this registry exists for ------------------------------
    - state: FUNCTIONALLY_FAILED
      when: {functional: FAILED}
      meaning: >
        the process is up and may be connected; it cannot do its job. Listed
        ahead of the liveness-derived states because a resource in this
        condition would otherwise read as healthy.
    # -- up, and something it needs is missing -----------------------------
    - state: DEGRADED
      when: {liveness: RUNNING, transport: DISCONNECTED}
      meaning: "up, but the channel it depends on is carrying nothing"
    - state: DEGRADED
      when: {functional: UNKNOWN}
      meaning: >
        up, and whether it works has not been established. Deliberately NOT
        HEALTHY: not having asked is not the same as having found it fine.
        This is the state the 2026-09-12 endpoint would have been reported in
        had anyone thought to ask, and it is why the fix is a probe rather
        than a patch.
    # -- healthy requires the functional axis, not just liveness -----------
    - state: HEALTHY
      when: {liveness: RUNNING, functional: OK}
      meaning: "up and answering"
    # -- the explicit general case -----------------------------------------
    - state: DEGRADED
      when: {liveness: RUNNING}
      meaning: >
        up, with no functional surface to ask (NOT_APPLICABLE) or an axis
        nobody measured. Catches everything the rules above do not, and is
        named rather than implied so that a future uncovered combination
        fails the totality test instead of landing here by accident.

# ---------------------------------------------------------------------------
# Actions. Deliberately tiny, and deliberately not the same axis as state.
# ---------------------------------------------------------------------------
actions:
  values: [NONE, RECONCILE, NEEDS_HUMAN, DEFER]
  guidance:
    NONE: nothing is wrong; or something is wrong and automatic action is not permitted
    RECONCILE: >
      a registered, owned, policy-allowed resource whose desired state is not
      met. Restart budget applies. Never a human-only failure.
    NEEDS_HUMAN: >
      the failure is outside this process's authority. On 2026-09-12 this was
      a consumed OAuth refresh token: `Restart=always` supervises a process,
      it cannot renew an authorization. No number of restarts substitutes for
      a person completing a device flow.
    DEFER: "unknown owner, unknown identity, or an active writer may exist"

# ---------------------------------------------------------------------------
# Probe kinds. `observe` finds; `probe` asks. Both are declared per resource.
# ---------------------------------------------------------------------------
probe_kinds:
  process-exists:
    answers: liveness
    formal: true
    note: "the weakest probe. Finding a PID says nothing about capability."
  systemd-unit-state:
    answers: liveness
    formal: true
    note: "asks systemd, not the process table. Prefers the supervisor's view."
  container-state:
    answers: liveness
    formal: true
    note: >
      `docker ps` reports what the runtime thinks. NOT functional: a container
      can be `Up (healthy)` while the app behind it rejects every request.
  container-healthcheck:
    answers: functional
    formal: true
    note: "the image's own healthcheck, if it declares one. Otherwise absent."
  http-health:
    answers: functional
    formal: true
    note: >
      a real request to a real endpoint. Preferred over any inspection,
      because it exercises the thing rather than describing it.
  mcp-tools-list:
    answers: functional
    formal: true
    note: "MCP initialize + tools/list. Proves the server can answer an agent."
  socket-connect:
    answers: transport
    formal: true
    note: >
      connects to the local IPC socket and issues a request. A socket FILE
      existing is not a connection; a stale socket outlives its daemon.
  relay-socket:
    answers: transport
    formal: true
    note: >
      resolves the resource's declared peer host and measures whether the
      process holds an ESTABLISHED connection to it. Reports a MEASUREMENT,
      and on 2026-09-12 this measurement was CONNECTED for the entire
      outage: the endpoint opens the socket before authorizing and keeps it
      while it waits. So this probe is declared `formal` and still never
      sufficient — only `functional: OK` reaches HEALTHY.
  relay-presence:
    answers: transport
    formal: true
    needs_provider: true
    note: >
      asks the provider whether this endpoint is present. The only probe that
      answers the real question for a transport-endpoint, and it needs an API
      this runtime may not have. Absent it, the axis stays UNKNOWN.
  journal-diagnostic:
    answers: reason
    formal: false
    note: >
      reads the journal for a corroborating line. NEVER authority: it is a
      diagnostic, and a diagnostic regex promoted to a health contract is a
      log format away from silently reporting the wrong thing forever. It may
      only REFINE a reason on a resource whose functional axis is already
      FAILED by another probe.

# ---------------------------------------------------------------------------
# Per-kind registration requirements.
#
# These exist because of a specific, repeating pathology in this codebase: a
# declaration layer that runs ahead of the execution layer, with nothing in
# between that fails when the execution side is missing. A kind may be added to
# `kinds` and then registered by someone who never provides the one thing that
# kind is for, and every subsequent run reports clean.
#
# A `tunnel` is the clearest instance. Its entire reason for existing is that
# `liveness: RUNNING` does not mean traffic flows. Register one without a probe
# on the transport or functional axis and the registry will dutifully report
# DEGRADED forever — technically correct, completely useless — or, worse, with
# a functional probe the operator assumed was implied, report HEALTHY on the
# strength of a PID.
#
# So the requirements are enforced at REGISTRATION time, in `validate()`, where
# the author is still present to answer. Where a requirement genuinely cannot
# be met, the contract offers an explicit `not_applicable` declaration with a
# reason rather than a silent omission: the gap has to be a written decision.
# ---------------------------------------------------------------------------
kind_requirements:
  tunnel:
    requires:
      # Both endpoints, because "a tunnel is up" is not a statement anyone can
      # act on without knowing which two things it joins.
      - field: transport.local
        because: "a tunnel that does not name where it starts cannot be attributed"
      - field: transport.remote
        because: "a tunnel that does not name where it ends cannot be checked"
      # A probe that measures the CHANNEL. Without it the transport axis is
      # UNKNOWN forever and the tunnel is permanently DEGRADED.
      - probe_axis: transport
        unless_not_applicable: transport
        because: >
          `liveness: RUNNING` means a forwarding process exists. The channel is
          a different question and it is the one that matters.
    # Not satisfiable by a `not_applicable`: a tunnel either has a functional
    # probe or an explicit, reasoned statement that it has no callable surface.
    requires_one_of:
      - probe_axis: functional
      - not_applicable: functional
    forbids_healthy_without: functional
    note: >
      the registry cannot make a tunnel healthy. It can only refuse to accept a
      tunnel registration whose health could never be established either way.
  agent-runtime:
    requires:
      - probe_axis: liveness
      - decisive_owner: true
        because: >
          an agent runtime is long-lived and consumes real resources, so an
          unowned one is exactly the 2026-09-13 case: 407% CPU for a day and
          eleven hours, no user, and nothing on the machine able to say whose
          work it was. An owner that cannot be confirmed is DEFER, and DEFER
          registrations belong in `defer_refs` rather than in `resources`.
  runtime-group:
    requires:
      - field: members
        because: >
          a group with no members is a name. The whole reason to register one is
          that its members must be reasoned about together.
  mcp-server:
    requires:
      # §40, and the enforcement of `mcp_placement` below. A server with no
      # process between calls cannot be observed here, and one on another host
      # is not this node's to claim — both belong to the provider layer, where
      # "can this device do this" is the question being asked. This makes the
      # boundary a registration failure rather than a paragraph.
      - field: lifecycle.class
        in: [persistent, session-scoped]
        because: >
          only these two are lifetimes of a process this node can see. An
          on-demand server has nothing to observe between calls, and an
          external one is another host's process; both are providers, and
          registering them here would give an ability a runtime identity it
          does not have.

# ---------------------------------------------------------------------------
# Ownership (§36, §37). ARCHITECTURE.md invariant 6, enforced at registration.
#
# The defect this closes was never a wrong answer. Every observation of the
# tunnel in Case A was correct — RUNNING, far side healthy, no failed probe —
# right up to the moment an unrelated Agent session ended and took it with it,
# on time and by design. There is nothing to detect afterwards: between
# creation and retirement the resource is genuinely fine, and a monitor
# watching it reports success for the entire period that matters. The only
# moment the question can be asked is registration, where the author is still
# present to answer it.
# ---------------------------------------------------------------------------
ownership:
  rule: >
    anything that must outlive the Agent session that caused it requires an
    explicit durable owner and an explicit lifecycle. An Agent session may
    cause creation; it may not be the owner of record.
  session_owner_ids:
    # Ids that denote a session lifetime. A registration owned by one of these
    # may not be registered with a lifecycle class outside this list.
    - "session:*"
    - "agent-runtime:*"
  permitted:
    session_owner_lifecycle: [session-scoped, disposable]
    forbidden:
      persistent: >
        a persistent resource owned by a session is destroyed exactly on
        schedule, and every observation up to that moment says it is fine.
        This is Case A, verbatim.
      task-scoped: >
        a task-scoped resource is owned by the work item, never by the session
        working on it. Two sessions working one Item is a normal case, and the
        second one ending must not reclaim the first one's resources.
  on_violation:
    disposition: REFUSE
    alternative: >
      register it as `disposable` with a `note` recording the downgrade. A
      deliberately disposable resource is a legitimate thing; a persistent one
      that is actually session-scoped is not, because it lies to every consumer
      that reads its class.
  because_case: >
    the tunnel a task depended on was registered with session lifetime. It was
    retired when an unrelated Agent session ended, the task lost its transport
    mid-flight, and the far side was healthy throughout — which is why this
    took a real incident to find rather than a code review.

# ---------------------------------------------------------------------------
# Recovery models (§20).
#
# A resource whose failure cannot be fixed by restarting must SAY SO, because
# the default reflex — and, on 2026-09-12, systemd's — is to restart it. That
# reflex restarted the RDC endpoint every ~24 minutes for 54 minutes, and every
# restart produced a fresh device code that expired. The supervisor was working
# exactly as configured and made the outage longer.
#
# This is a declaration, not an action: ServerOS still performs none of these.
# ---------------------------------------------------------------------------
recovery_models:
  - id: restart
    meaning: "the process can be restarted and that is expected to help"
    automatic: allowed_unless_protected
  - id: reauthorize
    meaning: >
      the credential or authorization behind the resource was consumed and a
      HUMAN must renew it. Restarting produces a new attempt at the same wall
      and, where the authorisation flow issues one-shot codes, actively extends
      the outage.
    automatic: never
  - id: reconnect
    meaning: "the channel dropped and re-establishing it is expected to help"
    automatic: allowed_unless_protected
  - id: redeclare
    meaning: >
      the resource is running correctly and its DECLARATION is what is stale.
      Acting on the resource would be acting on the wrong object.
    automatic: never
  - id: none
    meaning: "no automatic path exists; a person decides"
    automatic: never

# ---------------------------------------------------------------------------
# Per-probe required fields.
#
# Found by writing a registration, not by reading the code: a `process-exists`
# probe with no `pattern` reached `pgrep -f None` and raised TypeError inside
# the probe runner. The registration validated, the probe was declared, and the
# only thing standing between that and a crash was nobody having run it yet.
#
# Two of the probe classes index their spec directly (`self.spec["url"]`,
# `self.spec["path"]`), so a missing field is a KeyError at probe time rather
# than a clean UNAVAILABLE. That is the same declared-but-absent shape the
# `kind_requirements` block above exists for, one layer down — and it is
# cheaper to refuse the registration than to make every probe defensive.
# ---------------------------------------------------------------------------
probe_requirements:
  systemd-unit-state: [unit]
  process-exists: [pattern]
  container-state: [container]
  container-healthcheck: [container]
  http-health: [url]
  mcp-tools-list: [url]
  socket-connect: [path]
  relay-socket: [pattern, peer_host]
  journal-diagnostic: [unit, patterns]
  # Empty on purpose rather than absent: `relay-presence` genuinely needs
  # nothing (`provider_api` is optional and its absence is the finding the
  # live registration reports), and an empty list is a decision that it was
  # considered.
  relay-presence: []

# ---------------------------------------------------------------------------
# The operation vocabulary (§8).
#
# DISTINCT FROM `actions.values` ABOVE, and the two are not alternatives. An
# `action` is a *disposition* — what this observation implies. An `operation`
# is a *thing that gets done*. `RECONCILE` appears in both lists and means
# different things: as an action it says "this resource is a candidate"; as an
# operation it says "bring it back to its desired state". Collapsing the two
# axes is how "the model recommends a restart" becomes "a restart happened".
#
# Five values, closed. An operation outside this set is a validation failure,
# which is the point: this list is the whole of what the runtime may do to the
# machine, and a sixth entry has to be written down here before any code can
# reach it.
# ---------------------------------------------------------------------------
operations:
  values: [PROBE, RECONCILE, RESTART, RECONNECT, STOP]
  guidance:
    PROBE: >
      ask the resource a question. Changes no state and is always permitted;
      it is listed anyway because a probe is the only operation that runs
      against a `protected` resource, and leaving it out would make the
      vocabulary look smaller than the runtime's actual reach.
    RECONCILE: >
      the umbrella operation: bring a resource back to its declared desired
      state by whatever means the resource's own `reconcile.mode` names.
      Never issued directly; it is the name of the decision, not of a command.
    RESTART: >
      ask the supervisor to restart it. `systemctl --user restart` for a unit,
      `docker restart` for a container. The only operation with an actuator
      today.
    RECONNECT: >
      re-establish a channel that dropped. Declared here because `tunnel` and
      `transport-endpoint` are first-class kinds whose failure is not a
      process failure and whose recovery is not a restart — but NOT
      implemented, and a `reconcile.mode: reconnect` resource therefore gets
      `NO_ACTUATOR` rather than a guessed command.
    STOP: >
      bring it to its declared `desired: stopped` state. Declared and NOT
      implemented. Stopping is the operation whose blast radius is easiest to
      underestimate: a stopped container may be the only copy of its own
      state, and this host's baseline containers are the reason the
      protection rules exist.
  rules:
    - "An operation must satisfy the resource contract before it is issued.
       `restart` against a resource that forbids it is not a lesser
       operation, it is the wrong one."
    - "Every operation names the resource it targets and the mode that
       authorised it. An operation with no declared authoriser is a bug in
       the caller, not a default."
    - "NOT implemented is a state this file is allowed to be in. A declared
       operation with no actuator reports NO_ACTUATOR — the same answer the
       actuator already gives for a kind nobody wrote an actuator for."

# ---------------------------------------------------------------------------
# Per-resource reconcile policy (§11).
#
# WHY THIS IS PER-RESOURCE AND NOT A DAEMON FLAG
# ----------------------------------------------
# A single switch that turns on automatic recovery for everything is the thing
# this block exists to replace. It reads as "recovery: on" and it means "every
# registered resource is now restartable by a component that has never been
# tested against any of them" — and the resources it reaches include the two
# containers behind the production-parity baseline.
#
# So the authority is here, on the resource, where the person who knows what
# the resource is for is the person writing the block. The default is
# `observe`: a resource that says nothing about reconcile is never acted on.
# Silence is the safe value, and it is the value every registration on this
# host currently has.
# ---------------------------------------------------------------------------
reconcile_policy:
  modes:
    # Report the candidate and change nothing. The default.
    - observe
    # Restart the resource. Requires a budget; see `budget_requirements`.
    - restart
    # Re-establish a dropped channel. No actuator exists (see `operations`).
    - reconnect
  default: observe
  # Which operation each mode authorises. Declared here rather than compiled
  # into the reconciler, because a mapping in code is a second copy of this
  # vocabulary and this project has already paid for having two copies of one
  # rule. `null` is a decision, not an omission: `observe` authorises no
  # operation at all.
  mode_operations:
    observe: null
    restart: RESTART
    reconnect: RECONNECT
  # Mode names are the vocabulary; this is the shape every mode shares.
  block_shape:
    mode: observe
    # Required for any mode other than `observe`. A mode that permits an
    # operation without bounding it is a retry loop with a policy name.
    max_attempts: 1
    # The per-attempt wait. Same units and same intent as the daemon's own
    # backoff ladder; declared here so the budget is a property of the
    # resource rather than a constant compiled into the reconciler.
    backoff: [60, 300, 900]
  budget_requirements:
    # §10's last two conjuncts. Both are about the same thing — that an
    # automatic action is bounded — from two directions: `max_attempts` bounds
    # how many times, `backoff` bounds how often.
    - field: max_attempts
      because: >
        an unbounded restart policy is indistinguishable from a crash loop
        with a comment above it. This host has already paid for that once: the
        endpoint restarted five times in two hours and every restart issued a
        device code nobody could authorize.
    - field: backoff
      because: >
        without it the budget is a count with no rate, and a resource that
        fails fast can exhaust its attempts inside one tick interval.
  # A mode this file does not implement, declared so that the unimplemented
  # half is visible rather than inferred from an absent actuator.
  declared_not_implemented:
    - reconnect

# ---------------------------------------------------------------------------
# §9's default action rules, as a table rather than as prose in three files.
#
# Each row is checked before any operation is considered. They are ordered
# most-specific first, and the last row is the general case.
# ---------------------------------------------------------------------------
default_action_rules:
  - condition: "owner.type is unknown, or the resource is not registered"
    action: "no action"
    because: "fails safe. An unowned resource is DEFER, never a candidate."
  - condition: "the resource is observed but not registered"
    action: "no action"
    because: "nothing is managed by being noticed."
  - condition: "lifecycle.class is task-scoped or session-scoped"
    action: "recommendation only"
    because: >
      it is bounded to a work item or a login session. A restart re-establishes
      it inside a lifetime that is about to end, and the recomputation is
      wasted on an object whose owner is already closing it.
  - condition: "the operation is container cleanup, of any tier"
    action: "recommendation only"
    because: >
      §17. ServerOS emits candidate, reason, estimated reclaim and blast
      radius. Removal is a person's decision at every tier, including STOP.
  - condition: "protection.level is protected"
    action: "no cleanup, no restart, ever"
    because: >
      not a hint and not configurable from a call site. Checked independently
      of criticality and independently of any budget.
  - condition: "lifecycle.class is persistent AND protection is not protected
     AND reconcile.mode is not observe AND a budget is configured AND a
     functional probe exists"
    action: "the operation named by reconcile.mode"
    because: "§10's seven conjuncts, all of which must hold. See `why_not_automatable`."

# ---------------------------------------------------------------------------
# Admission findings (§38, §39, §40, §41). Case C.
#
# A finding is not a rule and not a state. It is something registration NOTICED
# and declined to accept silently. The three severities do different things on
# purpose: the asymmetry is the whole design, because a floating dependency on a
# scratch helper and a floating dependency on the browser automation a safety
# check depends on are the same text and not the same risk.
# ---------------------------------------------------------------------------
admission:
  findings:
    - code: PERSISTENT_RUNTIME_FLOATING_DEPENDENCY
      detects:
        # Ids, commands and note text are scanned. `@latest` and a bare `npx`
        # are the two forms seen in this fleet; the third is a floating branch.
        patterns:
          - "npx <pkg>@latest"
          - "npx <pkg> with no version specifier"
          - "a floating branch: main, HEAD, or a tag expected to move"
          - "install-on-start over a network"
          - "a cache directory not pinned by content"
      severity:
        default: WARN
        HIGH: "criticality is critical, or protection is protected"
      effect:
        WARN: "registered; the finding is reported with the resource"
        HIGH: >
          blocking for registration and for promotion of a critical managed
          persistent runtime. It is not blocking for a task-scoped or
          disposable resource, where the lifetime is short enough that the
          version is not the variable.
      because_case: >
        one node reached Playwright through `npx @playwright/mcp@latest` and
        the other had it pinned to an absolute path to a versioned artifact.
        The two ran "the same" toolchain and did not, and nothing in the
        catalogue could have told you so. "It worked yesterday" and "it works
        today" were then statements about two different programs.
      is_not: >
        a claim that `@latest` is bad practice. It is a claim that an unpinned
        dependency makes a device's capability set unknown, which makes every
        answer the Ability Fabric gives about that device provisional without
        saying so. The finding is what makes it say so.
      repair:
        - "pin to an absolute path to a versioned artifact"
        - "or record the resolved revision alongside the resource, and accept
           DEGRADED in the capability resolution"

    - code: UNDECLARED_DURABLE_RESOURCE
      detects: "a resource in service with no declaration in a reconcilable store"
      severity: WARN
      because_case: >
        the Linux node's outbound tunnel exists as `127.0.0.1:17890` in a
        comment in `~/.bashrc`. Not disabled, not behind a flag — a comment.
        There is no listener and no service owns it. A comment cannot drift,
        because it never claimed anything, which is what makes it worse than no
        declaration: a reader finds the number, believes it, and the belief is
        not checkable.
      is_not: >
        a demand that every process be registered. It fires for a resource a
        durable artifact NAMES as required, which is a much smaller set and one
        that can be enumerated.
      capability_effect: "PROVIDER_NOT_INSTALLED, never UNKNOWN"

  rules:
    - "A finding never blocks a registration silently. It either registers
       with the finding attached, or refuses and names the finding."
    - "Severity is derived from the resource's own criticality and protection,
       never from the caller's. A caller that could choose its own severity
       would choose the one that lets it proceed."
    - "A finding is not a state. It is recorded on the registration and does
       not appear in the health axes; conflating the two is how a policy
       judgement becomes a probe result."

rules:
  - "Every managed resource is explicitly registered. Nothing is managed by
     being noticed — a discovered container is an observation, not a claim."
  - "`protection: protected` resources are never stopped, removed, pruned or
     restarted by ServerOS. Not on a timeout, not on a low-disk trigger."
  - "No health observation without provenance. An axis with no `observed_by`
     is UNKNOWN, and UNKNOWN is never rendered as the healthy value."
  - "A journal line is a diagnostic and never a health authority."
  - "ServerOS supervises nothing. systemd, Docker and the provider own the
     lifecycle; ServerOS observes, asks, and reports. That is why this file
     has `desired` and not `restart_policy`."
  - "Unknown owner fails safe. A resource whose owner cannot be confirmed is
     DEFER, never a reclaim candidate."
  - "Criticality confers attention and nothing else. `critical` and
     `protected` are checked independently and the stricter one wins; there is
     no combination of fields that makes ServerOS act on a protected resource."
  - "A resource with `recovery.reauthorize` is never restarted by ServerOS.
     The restart is what lengthened the 2026-09-12 outage, and a supervisor
     that cannot tell a consumed token from a crashed process will do it
     again."
  - "A tunnel is never HEALTHY on liveness. `liveness: RUNNING` with an
     unmeasured or FAILED functional axis is DEGRADED, and a tunnel
     registration that provides no way to measure that axis is rejected rather
     than accepted and quietly reported DEGRADED forever."
  - "A resource whose declared lifecycle class outlives every owner that can be
     confirmed is refused at registration. Case A is the whole of the
     justification: the resource was healthy for the entire period that
     mattered, so nothing downstream could have caught it."
  - "A resource some durable artifact names as required, and that no
     reconcilable store declares, is an admission finding. Case B — a port
     number in a shell comment is a requirement that cannot be reconciled,
     probed, or found stale."
  - "A managed persistent runtime may not depend on a moving target. A
     floating dependency on a `critical` or `protected` resource blocks
     registration and promotion; elsewhere it is a WARN carried with the
     resource. Case C — `npx @playwright/mcp@latest` on one node, an absolute
     versioned path on the other, and no record anywhere that could say the two
     were different."
