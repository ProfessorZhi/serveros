# ServerOS Runtime Attribution Model — the schema.
#
# What this file is for
# ---------------------
# `managed-runtime.v1` answers "which runtimes does this node manage, and are
# they working". This file answers the question that has to come first and that
# registry never asked:
#
#     who is using this CPU, this RAM, this disk, THIS CONTAINER — and why
#     does it exist?
#
# On 2026-09-13 this host had a `codex app-server` tree burning 407% CPU for
# one day and eleven hours with no user in front of it. Every fact needed to
# explain it was on the machine — /proc held the parent chain, the cgroup named
# the login session, `loginctl` named the sshd peer — and none of it was
# reachable, because nothing joined those sources together. `ps` showed PIDs.
# It could not show *whose work* those PIDs were.
#
# Three rules follow, and they are the whole design.
#
# 1. ATTRIBUTION IS A CLAIM ABOUT PROVENANCE, AND IT HAS AN EPISTEMIC STATUS.
#    "This process belongs to task X" is not one kind of statement. It is
#    either something the machine recorded (the cgroup says so), something
#    inferred from evidence that could be wrong (the command line mentions a
#    task id), or not known. Those three must never render the same way, so
#    every field here carries its status. This is the same rule as
#    `UNKNOWN` health and it is broken by the same temptation.
#
# 2. NEVER GUESS A NAME INTO AN OWNER. A container called `redis-cache-2` is a
#    container called that. The name is a string; it is not an owner, exactly
#    as a compose project label names a compose run and not a person. If the
#    evidence does not reach an owner, the answer is UNKNOWN_OWNER and the
#    resource is DEFER — never a reclaim candidate.
#
# 3. THE DAEMON REPORTS FACTS. IT DOES NOT DIAGNOSE. `serverosd` may say
#    "the cgroup of PID 178978 is session-2382 and session-2382 is closing".
#    It may NOT say "this is a Codex bug". The first is a measurement the
#    machine can defend; the second is a conclusion, and conclusions belong to
#    an agent that can be asked to justify them. Enforced by construction:
#    nothing in this schema has a field for a cause.
schema: serveros/attribution.v1
version: 1

# ---------------------------------------------------------------------------
# What kind of thing is being attributed.
#
# Wider than `managed-runtime.v1`'s kinds on purpose. That file describes
# things this node MANAGES — an unregistered container is not in it at all.
# This file describes things that EXIST, whether or not anyone registered
# them, because "who owns this process" has to be answerable before you can
# decide whether to manage it.
# ---------------------------------------------------------------------------
kinds:
  - process
  - systemd-user-service
  - container
  - mcp-server
  - transport-endpoint
  # A long-lived forwarding path between two machines. First-class because it
  # is the join between a runtime here and the device it belongs to: without
  # it, a remote agent's processes are orphans with no visible origin.
  - tunnel
  # An agent's own supervisor process (app-server, proxy, session broker).
  - agent-runtime
  # Several runtimes that belong to ONE piece of work and must be reasoned
  # about as a unit. See `runtime_groups` below.
  - runtime-group

# ---------------------------------------------------------------------------
# Epistemic status. Every attributed field carries exactly one of these.
#
# This is the vocabulary that stops a plausible story from becoming a fact.
# ---------------------------------------------------------------------------
epistemic:
  # The machine recorded it. Read from a source of record: /proc, a cgroup
  # string, systemd, Docker's own metadata. Not deduced.
  FACT:
    means: "read from a source of record; nothing was inferred"
  # Derived by a rule from facts. The rule is named in `provenance` so the
  # inference can be checked and argued with. An inference is never silently
  # promoted to a fact.
  INFERRED:
    means: "derived from facts by a named rule; the rule is in provenance"
  # Not established. This is a RESULT, not an absence of one — it is what
  # stops an empty field from reading as "nothing to see here".
  UNKNOWN:
    means: "not established; may not be used as if it were"

# ---------------------------------------------------------------------------
# How strongly the evidence supports an owner.
#
# `high` is not "we are fairly sure". It is a named evidence class that
# genuinely decides the question.
# ---------------------------------------------------------------------------
confidence:
  - high
  - medium
  - low
  - unknown

# This list and `epistemic` above are two vocabularies for two questions, and
# they are NOT alternatives to each other:
#
#   epistemic   how the value was obtained      FACT / INFERRED / UNKNOWN
#   confidence  how far what it got binds        high / medium / low / unknown
#
# §12 and §14 report BOTH, because the interesting rows are the ones where they
# disagree: a published binding read straight out of `docker inspect` is a FACT
# about a container nobody has registered, and an owner derived from a bind
# mount is INFERRED and can still be `high`. A single field cannot hold that
# pair, and collapsing them reports "we are sure" about a value that was
# guessed.
#
# The runtime graph and the port view speak the confidence words below rather
# than `high/medium/low`, because their consumers are asking "does this edge
# bind" and not "how strong is the evidence class". The mapping is declared
# here so that the two vocabularies join in exactly one place instead of in
# every consumer that needs both.
#
# Forward direction, source word -> binding word, so that it is a function
# rather than a table with a hole in it: three targets and four sources is
# many-to-one, and a reverse reading would leave `low` undefined.
confidence_alignment:
  high: AUTHORITATIVE
  medium: INFERRED
  low: INFERRED
  unknown: UNKNOWN
  note: >
    `low` maps to INFERRED and not to UNKNOWN. A locator that plausibly names
    an owner is a stronger thing than no evidence at all, and calling it
    UNKNOWN would report a finding as a blank. It is not AUTHORITATIVE either:
    §12 forbids a similar name from becoming an owner edge, and `low` is
    exactly the class that rule is written about.

# ---------------------------------------------------------------------------
# Where an attribution came from. A closed list, because "we got it from
# somewhere" is how an inference becomes indistinguishable from a measurement.
#
# Listed strongest first. A consumer that needs a decision-grade owner must
# require one of the first four.
# ---------------------------------------------------------------------------
provenance:
  # Sources of record. These can decide an owner.
  - docker-label          # a `serveros.owner=` label the owner wrote
  - registry-match        # the resource is explicitly registered here
  - cgroup                # the kernel says which unit/session owns the tree
  - systemd-unit          # the supervisor says which unit it is
  # Strong evidence that still needs a rule to become an owner.
  - bind-mount            # the mounts point at a project path
  - working-directory     # cwd resolves under a project tree
  - process-tree          # inherited from an ancestor's attribution
  - session-origin        # the login session names the remote peer
  # Weak. Never sufficient alone to name an owner.
  - container-name
  - image-name
  - command-line
  - created-time
  - port-binding
  - network-membership

# Sources that may decide an owner on their own. Everything else may only
# corroborate, and a record whose only evidence is below this line is
# UNKNOWN_OWNER no matter how plausible it looks.
decisive_provenance: [docker-label, registry-match, cgroup, systemd-unit]

# ---------------------------------------------------------------------------
# Container attribution (§6). How a container reaches an owner, and the two
# ways it is allowed to stay unattributed.
# ---------------------------------------------------------------------------
container_attribution:
  # A container may declare its own owner. Strongest evidence there is, because
  # the owner wrote it. Measured 2026-09-13: ZERO instances of this label on
  # this node. Implemented anyway, so the day one appears it is decisive
  # without a code change — and implemented FIRST, so that it is not the only
  # path. A design that works only when owners cooperate does nothing today.
  owner_label: serveros.owner

  # The declared label namespace. Surveyed 2026-09-14 across all 38 containers
  # on this host: ZERO `serveros.*` labels exist. So this is a PROPOSAL, not a
  # description of anything running, and it is recorded here — in the one
  # place the reader side reads — so that the day a container carries one it
  # is decisive without a code change.
  #
  # A container MAY carry any subset. None is required. A missing label is not
  # a defect and not a weaker claim about the container; it means the
  # container predates the convention or was created by something that does
  # not know it. Nothing in this round writes a label (§11, read-only), so
  # every one of these is read-and-report only.
  declared_runtime_namespace:
    namespace: serveros
    observed_instances: 0
    observed: "2026-09-14"
    # `serveros.owner` is listed here as well as in `owner_label` above
    # because the two are one rung of one ladder: a container carrying both
    # is not better attributed, it is the same owner written twice.
    labels:
      owner: >
        the original owner key; identical in force to owner_ref
      owner_ref: >
        the owner, under the §9 namespace
      owner_type: >
        qualifies owner_ref when the ref's prefix is not the type
      runtime_ref: >
        the canonical identity. Outranks every other anchor
      device_ref: >
        which device this runtime was AUTHORED for. Reported as written and
        never checked against the host it is running on — those two differing
        is a drift finding, and resolving it here would hide it
      scope: >
        machine / project / work-item / session
      protected: >
        written as the string "true" or "false". Any other value is reported
        as unparseable and NOT coerced to false: bool() of the string "false"
        is True, and a protection flag that reads as False when it was
        written as something else is a protection bypass
      work_item: >
        e.g. LIT-0104
      run_id: >
        e.g. RUN-0019
      session_ref: >
        an agent session
      created_by: >
        who created it
    managed:
      key: serveros.managed
      note: >
        the single label that says a container is under ServerOS management at
        all. This is the MANAGED half of the §11 classification; its absence
        is one of the things that makes a container EXTERNAL or UNKNOWN, and
        absence is NOT the same as `serveros.managed=false`.

  # A label whose KEY is inside a declared namespace delegates ownership to
  # that namespace's ref. THE VALUE IS NEVER READ: a runtime-config label's
  # value is configuration, and configuration is where credentials live. The
  # key namespace is the ownership signal; the value is data.
  #
  # Empty. Declaring a namespace asserts who owns a set of running containers,
  # and on a shared host that assertion changes what may be reclaimed, so it
  # is a human decision and not one this run makes on its own.
  owner_label_namespaces: {}

  # Observed on this host and deliberately NOT declared. Recorded here so the
  # gap is a visible one-line decision rather than something rediscovered by
  # the next reader of the output.
  undeclared_owner_namespaces:
    - namespace: com.multiuserclaw
      label: com.multiuserclaw.hermes-runtime-config
      containers: 4
      observed: "2026-09-13"
      note: >
        the only label on these containers. An ownership declaration in all but
        name. Declaring it here would resolve all four; leaving it undeclared
        keeps them UNKNOWN_OWNER and therefore DEFER, which is the safe
        default for a decision this run has no mandate to make.

    # Surveyed 2026-09-14 and added to this list, which had not been updated
    # since 09-13 and was missing both. They are product-owned namespaces
    # rather than strangers' — which is the reason they are the FIRST
    # candidates for a declaration, and exactly why the decision belongs to a
    # human rather than to a survey that noticed them.
    - namespace: litellm
      labels:
        - litellm.ui-dependency-hash
        - litellm.source-sha
        - litellm.profile
        - litellm.dependency-hash
      containers: 4
      observed: "2026-09-14"
      note: >
        build provenance for the LiteLLM images, written by our own publish
        path. `litellm.source-sha` and `litellm.dependency-hash` are the
        identity of the SOURCE an image was built from, so declaring this
        namespace is how a container would claim its own build. Left
        undeclared: it identifies a build, not an owner.

    - namespace: hwz
      label: hwz.p18
      containers: 2
      observed: "2026-09-14"
      note: >
        not a namespace with a documented meaning on this host. Recorded
        because it contains a dot and is therefore indistinguishable from an
        ownership claim by the rung-2 test alone — which is why it is listed
        here rather than left for the next reader to trip over.

  # A container whose paths sit under ANOTHER user's home.
  #
  # This is evidence about who does NOT own the container, so it never reaches
  # the owner field — and it does NOT move the container out of
  # UNKNOWN_OWNER. It is a third state beside "owned" and "unattributed":
  #
  #   owner known            the ladder found a source of record
  #   foreign_actor: true    positively somebody else's; owner still unknown
  #   neither                unattributed, and nothing says whose it is
  #
  # Collapsing the middle into the third throws away the one thing a cleanup
  # pass needs to know, and collapsing it into the first invents an owner.
  # Measured on this host 2026-09-13: `new-api` and `new-api-postgres` mount
  # `/home/szj/gpt-img-2/data`, a different user's tree; `openclaw`'s five
  # containers name `/opt/applications/data/home-ubuntu/...` among their
  # working directories, with a sibling value that does not exist at all.
  #
  # Read from the path, in one implementation (`attribution.foreign_home`),
  # because the identity of "me" is the part that gets this wrong: the first
  # version read `$USER`, which systemd leaves empty, and under which this
  # node's own `/home/hwz` reads as a stranger's directory.
  foreign_actor:
    decides_owner: false
    changes_unknown_owner: false
    disposition: DEFER
    evidence: [working-directory, bind-mount]
    fails_toward: not_foreign
    layout: ["/home/<other>/...", "/opt/applications/data/home-<other>/..."]

  # Evidence classes that may put a NAME IN THE OWNER FIELD, strongest first.
  # Anything below the line may only produce a `locator`, which is reported
  # separately and never reaches the owner field — because a locator a reader
  # mistakes for an owner is the exact failure this contract exists to stop.
  decisive_evidence:
    - owner-label                 # the owner wrote serveros.owner=
    - owner-label-namespace       # a declared namespace delegates
    - registry-match              # the registry names this container or its owner
    # For a process group the registry-match class is read by
    # `attribution.deployment_units()`: the systemd units this deployment
    # ships in its own tree. That is a declaration, not a list of third-party
    # service names — adding a unit file is what enrols it. The live
    # managed-runtime registry document is a separate, stronger source and is
    # absent on this host; until it is supplied, the shipped units are the
    # only positive evidence of membership there is.
  locator_evidence:
    - working-directory           # resolves under a known root; informative, not decisive
    - bind-mount                  # same, and it can be a whole root
    - compose-project-name        # a string somebody typed

  # Compose project names are normalised to a work-item candidate by a narrow
  # rule — the second hyphen-separated part must be ALL digits — and the
  # REGISTRY then confirms it. Measured against the live host because a rule
  # loose enough to match everything is a guess wearing a rule's clothing:
  #   lit-0104-dev100 -> LIT-0104 (registered, protected)   MATCH
  #   lit-0103-r3     -> LIT-0103 (registered, protected)   MATCH
  #   fjd-req1-e2e    -> `req1` is not all digits           NO MATCH
  #   openclaw        -> no second part                     NO MATCH
  #   litellm-container0 -> `container0` is not all digits  NO MATCH
  project_name_normalisation: "^(?P<prefix>[A-Za-z]+)-(?P<number>\\d{2,5})(?:-|$)"

  # A path EQUAL to a known root is not path evidence. `xpra-gui-hwz`
  # bind-mounts the whole of /home/hwz, which equals ROOTS['home']; accepting
  # it reported a container that mounts a directory wholesale as owned by
  # `path:/home/hwz`. Only a path STRICTLY BELOW a root counts.
  root_match: strictly_below

  # Bind mounts worth reporting regardless of who owns the container, so that
  # any recommendation carries the blast radius it would have.
  host_exposure:
    - /                      # the whole host filesystem
    - /var/run/docker.sock   # control of the Docker daemon itself
    - any known root         # a whole ServerOS root mounted into a container

# ---------------------------------------------------------------------------
# Runtime groups (§5).
#
# The unit of reasoning here is not the PID. One agent task routinely owns a
# dozen processes across a proxy, a supervisor, several MCP servers and a
# browser helper, and every one of them is meaningless in isolation. Judging
# them separately is how a live task gets half-reclaimed.
# ---------------------------------------------------------------------------
runtime_groups:
  # How a group is named. The id is the thing that endures; the label is for
  # humans and may change without anything else moving.
  ref_format: "runtime-group:<kind>:<id>"
  kinds:
    - codex-task        # a Codex remote task and everything serving it
    - agent-session     # one agent login session's whole runtime
    - work-item         # everything serving one work item
    - device-origin     # everything reachable from one remote device
  # A group is judged as a unit, so it carries the aggregate of its members.
  aggregates: [cpu_percent, memory_rss_bytes, process_count, age_seconds, task_state]

# ---------------------------------------------------------------------------
# Tunnels (§8).
#
# A tunnel is the one runtime kind whose failure is routinely reported as
# success. `ssh` alive and TCP ESTABLISHED are both true of a tunnel that is
# forwarding nothing — the same shape as the 2026-09-12 endpoint that held an
# ESTABLISHED socket through a 54-minute outage.
#
# So a tunnel declares BOTH endpoints, and its health is measured on the
# transport and functional axes rather than on the process existing.
# ---------------------------------------------------------------------------
tunnels:
  transports: [ssh, reverse-ssh, socks, other]
  endpoints:
    local: "the address this node listens on or dials from"
    remote: "the address on the far side"
  criticality_default: critical
  note: >
    `liveness: RUNNING` for a tunnel means the forwarding process exists. It
    never means traffic flows. The transport axis asks whether the channel
    carries anything and the functional axis asks whether the far side
    answers; a tunnel with liveness RUNNING and functional UNKNOWN is DEGRADED
    and must never render as healthy.

# ---------------------------------------------------------------------------
# Criticality (§9). Ranks what to look at first when the host is under
# pressure. It confers NOTHING.
#
# Spelled out because the failure mode is obvious: an operator reads
# `critical` as "may do more", and a resource management layer that escalates
# its own authority based on a label it set is a privilege escalation with
# extra steps.
# ---------------------------------------------------------------------------
criticality:
  values: [critical, important, normal]
  meaning:
    critical: >
      its absence degrades the node's ability to observe or control itself, or
      cuts the path back to the device that owns the work. RDC endpoint,
      serverosd, control tunnels.
    important: >
      long-lived references other work depends on. LiteLLM reference,
      persistent MCP servers.
    normal: "everything else, including every temporary helper"
  confers: >
    PRIORITY OF ATTENTION ONLY. It does not grant authority to act, it does
    not relax the retry budget, and it does not exempt a resource from the
    protected/normal/disposable protection rules. A `critical` resource with
    `protection: protected` is still never restarted by ServerOS.

# ---------------------------------------------------------------------------
# Anomaly codes (§10). Deterministic. Every one is a statement about a
# MEASUREMENT — what was seen and over what window — never about a cause.
#
# `severity` ranks the signal. `implies_stale` says whether this code, alone,
# justifies calling a runtime stale — and it is false for every single-signal
# rule, which is the point of §11.
# ---------------------------------------------------------------------------
anomalies:
  - code: HIGH_CPU_SUSTAINED
    severity: medium
    implies_stale: false
    note: >
      alone this means "something is busy". Legitimate work is busy. A build
      is busy. Marking a busy runtime stale is how you kill the build.
  - code: HIGH_MEMORY_SUSTAINED
    severity: medium
    implies_stale: false
  - code: ROOT_FS_PRESSURE
    severity: high
    implies_stale: false
  - code: DATA_FS_PRESSURE
    severity: high
    implies_stale: false
  - code: TASK_IDLE_PROCESS_ACTIVE
    severity: high
    implies_stale: false
    note: >
      the task says idle and its runtime is still consuming. Strong, and still
      not sufficient on its own: a task can be idle between turns of a
      conversation that is very much alive.
  - code: TASK_CLOSED_RESOURCE_RUNNING
    severity: high
    implies_stale: false
  - code: ORPHAN_PROCESS_TREE
    severity: high
    implies_stale: false
    note: >
      the tree's parent is init and the session that started it is not coming
      back. Evidence about lineage, not about whether the work matters. This
      fires only where the cgroup does NOT place the group in the system
      manager's slice: reparenting to init is true of every systemd service,
      so on its own it cannot separate a service from a runtime somebody left
      behind. See EXTERNAL_SYSTEM_PROCESS_TREE and EXTERNAL_PROCESS_TREE for
      the cases where the cgroup shows that being parented to PID1 is what the
      group IS. A group in a `session-<N>.scope` keeps THIS code when its root
      did NOT create its own session, because there the reparenting is the
      finding; when it DID, being parented to PID1 is what daemonising means
      and the group is EXTERNAL_PROCESS_TREE. That test is `/proc/<pid>/stat`
      field 6 read against the root's own pid, so it comes from the kernel
      rather than from the scope name. The role rides on the evidence either
      way, and `detached_by_design` reports which branch fired.
  - code: EXTERNAL_SYSTEM_PROCESS_TREE
    severity: low
    implies_stale: false
    note: >
      the tree's parent is init AND the group's cgroup is under system.slice,
      so the system manager started it from an administrator-installed unit.
      Observe-only on purpose: this is a host service being reported, and the
      classification comes from the cgroup path rather than from a list of
      names, because a list is wrong the day a unit is renamed.

      Narrowed on 2026-09-17 to exactly the case its name claims: the system
      manager starting an installed unit. A per-user login manager, a login
      session, the root cgroup and a vendor agent are attributed now too, but
      as EXTERNAL_PROCESS_TREE with a role, because calling any of them "the
      system manager started this" would be false.

      This code used to carry a second job: keeping `user.slice` out. The
      reasoning was that it holds every user's sessions and does not say
      whose. That is true of the bare `user.slice` segment and false of
      everything under it — `user-1002.slice` names the uid, `session-<N>
      .scope` names the login, and `user_of_cgroup` was already in this file
      reading exactly those segments. So it was refusing evidence it knew how
      to read, and every per-user manager on the host was reported as an
      orphan instead. What stays UNKNOWN is a slice this file has no evidence
      about, and that has not moved.
  - code: EXTERNAL_PROCESS_TREE
    severity: low
    implies_stale: false
    note: >
      the tree's parent is init AND the cgroup shows that PID1 being the
      parent is what the group IS, rather than a sign that its parent died.
      `role` says which kind: EXTERNAL_USER_MANAGER for a
      `user@<uid>.service` login manager, EXTERNAL_UNSLICED for the root
      cgroup and cgroups outside the slice hierarchy such as
      `/YunJing/YDEyes`. Both are things PID1 starts or things outside the
      manager's hierarchy entirely, so for both, being parented to PID1 is by
      design.

      For EXTERNAL_USER_MANAGER that is true of the manager's OWN scope, and
      of a runtime `.scope` under an instance that can be seen to be alive.
      `user@<uid>.service` is a unit the system manager starts, but a SERVICE
      below it has the manager as its parent, so a
      `user@1002.service/dbus.service` parented to PID1 has outlived that
      instance and keeps ORPHAN_PROCESS_TREE. A `.scope` is different: it is
      never backed by a unit file, and systemd does not fork what runs in it.
      `systemd-run --scope` registers the scope around a process it started
      and then exits, so the payload has PPID 1 from the moment the command
      returns — while its instance is still running and its `init.scope` is
      still in the cgroup tree. Measured on `device:tokyo-shared-dev-01`,
      2026-09-18: `tmux-spawn-*.scope` under a live `user@1004.service`.

      So the scope case is decided by evidence about the instance rather than
      by the shape of the path, and it is read from the cgroup the kernel gave
      each process — `init.scope` present under the instance means the
      instance is alive. Session scopes keep their own rule (a login really
      does end; `detached_by_design` is the question to ask of those). Absent
      the cgroup, or a table too short to hold the instance, this is False and
      the alert stands.

      The role cannot express any of this — it answers "whose is this", and
      every one of these is the user manager's — so the scope is read where
      the question is asked.

      EXTERNAL_USER_SESSION is here only when the group's root created its
      OWN POSIX session, and keeps ORPHAN_PROCESS_TREE at `high` when it did
      not. A process inside `session-<N>.scope` whose parent is PID1 MAY have
      outlived its session leader — that is the leftover signature — but the
      scope name cannot tell that apart from a process that called `setsid()`
      and whose parent then exited, which is what daemonising IS. Both live in
      the same kind of scope and both have ppid 1.

      The kernel distinguishes them directly. `/proc/<pid>/stat` field 6 is
      the POSIX session id: a `setsid()` caller is a session leader, so its
      session id IS its own pid; a process whose leader died carries the DEAD
      leader's id, which is not its own and belongs to a pid that no longer
      exists. Measured on `device:tokyo-shared-dev-01` on 2026-09-18, both
      shapes in one reading — the VS Code server (pid 25215), `botmux`
      (1444974) and a live `tmux: server` (328129) each with sid == pid; and
      three `sh` (28541, 317189, 353879) each carrying a sid whose pid was
      already gone.

      So the exemption is asked per group rather than granted by role, and it
      is False when the evidence is absent: a group whose lineage cannot be
      read keeps ORPHAN_PROCESS_TREE at `high`, which is the direction that
      keeps the alert. Nothing here reads a name, so this did not become a
      process-name allowlist by another route — and that is why a live tmux or
      an active claude session is associated rather than mechanically
      orphaned.

      What it deliberately does NOT cover: a daemon whose OWN session leader
      later dies leaves grandchildren carrying the inherited sid, and those
      are still reported as leftovers. That is the correct answer for them —
      they did outlive their leader.

      RUNTIME_OUTLIVED_OWNER does not cover the leftover case either: it fires
      only while the session still reports state `closing`, and a session that
      is simply gone reports no state at all. The role still rides on the
      alert's evidence so a reader can see whose session it was.

      Observe-only, and `lifecycle` carries OBSERVE_ONLY to say so on the
      record rather than leaving a consumer to infer it. Nothing reclaims,
      cleans up or mutates; the role exists so that a reader can tell a
      tenant's login session from the host's own service inventory instead of
      receiving one undifferentiated "external".

      The bar for reaching this code is a cgroup clause that NAMES an owner,
      quoted in `ownership.why`. A group whose owner cannot be read from the
      kernel's record keeps ORPHAN_PROCESS_TREE at `high`. Unattributable was
      not made a synonym for external to quiet an alert.

      NOT on this list, and on neither of the two codes above: a group whose
      class is MANAGED. A unit this deployment ships is not a third party, so
      no EXTERNAL_* claim is true of it, and §1 makes "not managed" a
      precondition of ORPHAN_PROCESS_TREE — a runtime we declared is the
      definition of managed, whatever its lineage looks like. The ServerOS
      daemon runs as `user@1002.service/app.slice/serverosd.service`, and
      before MANAGED existed it was answered EXTERNAL_USER_MANAGER: the
      cgroup half of that answer was true and the membership half was false.
      A class that carries a membership claim cannot be derived from a
      mechanism fact alone.
  - code: RUNTIME_OUTLIVED_OWNER
    severity: medium
    implies_stale: false
    note: >
      the login that owns this group is in a TERMINATING state and the group's
      processes are still consuming. The two halves are separately true of
      things that are fine — a session mid-logout has nothing left to run, and
      a long build has an owner that is still logged in — so neither alone
      fires this. Generic by construction: the subject is a runtime group and
      its origin session, and no runtime family is named here. It exists
      because a transport can be on its way out while the thing it started
      keeps running, which is a lifecycle fact about ANY runtime and was
      written up as a Codex incident only because that is where it was seen.
  - code: UNKNOWN_OWNER_LONG_RUNNING
    severity: medium
    implies_stale: false
  - code: REPEATED_ERROR_LOOP
    severity: medium
    implies_stale: false
  - code: FUNCTIONAL_PROBE_FAILED
    severity: high
    implies_stale: false
  - code: MCP_PROCESS_ALIVE_BUT_UNAVAILABLE
    severity: high
    implies_stale: false
    note: >
      process exists, handshake fails. Exactly the class this whole
      architecture exists for, one layer down.
  - code: STALE_CONTAINER
    severity: medium
    implies_stale: false
  # RENAMED from STOPPED_RECLAIM_CANDIDATE, and the word was the defect. The
  # code named an action while both of its producers refuse to recommend one,
  # and §Y's rule is that a review candidate is not a CLEANUP_CANDIDATE and is
  # not destructive eligibility. The rename cost nothing when it was done — no
  # alert state file existed, so no recorded alert identity carried the old
  # name — which is exactly why it was worth doing now rather than after the
  # first one was written down.
  #
  # ONE NAME, TWO PRODUCERS, OPPOSITE OWNER SEMANTICS. This was measured, not
  # suspected, and it is recorded rather than merged because the two are not
  # the same finding:
  #
  #   `hygiene.py`            a typed owner ref IS present ("stopped,
  #                           unregistered, and declaring a typed owner
  #                           <ref>. Nameable, not abandoned")
  #   `anomaly.py`            the owner is NOT established ("stopped, and its
  #                           owner is not established")
  #
  # They are mutually exclusive by construction — one requires `typed_ref`,
  # the other requires `unknown_owner` — so a consumer that keys on the code
  # alone cannot tell which fact it is looking at. Neither is actionable, and
  # that is the property to keep: `hygiene.NEVER_ACTIONABLE` and
  # `runtime_hygiene.LABEL_ONLY` both contain it. Splitting the code in two is
  # left to the round that gives it a consumer.
  - code: STOPPED_REVIEW_CANDIDATE
    severity: low
    implies_stale: false
    note: >
      a stopped container that somebody should be asked about, and never a
      queue entry. It is in `hygiene.NEVER_ACTIONABLE` and is not the
      actionable class (`hygiene.ACTIONABLE_CLASSES` holds STALE_CANDIDATE
      alone). No alert code reaches actuator authorization: the only path to a
      destructive action is a verified identity plus an approval plus actuator
      admission, and this code supplies none of the three.
  - code: AGE_WITHOUT_ACTIVITY
    severity: low
    implies_stale: false
  # -- added by the runtime-resource round (§38) ---------------------------
  - code: PERSISTENT_RUNTIME_FLOATING_DEPENDENCY
    severity: medium
    implies_stale: false
    note: >
      the resource works and cannot be said to be the same resource tomorrow.
      Recorded as an ANOMALY rather than only as an admission finding because
      the two answer different questions and this one is asked later: admission
      asks "should this be registered", this asks "is what is registered still
      what is running". A resource admitted pinned and restarted from a
      floating source appears here and nowhere else. Never implies stale —
      acting on a working resource because its version is unknown would be
      acting on the wrong object, and the correct disposition is `redeclare`.
  - code: SESSION_OWNED_DURABLE_RESOURCE
    severity: high
    implies_stale: false
    note: >
      a resource whose declared lifecycle class outlives every owner that can
      be confirmed for it. Case A, and the reason this is an anomaly at all: at
      every moment before the retirement the resource is healthy, so this is
      the one finding that must be raised early and never acted on
      automatically. Disposition is `redeclare`, never `restart` — restarting
      it re-creates the same defect with a fresh clock.
  - code: UNDECLARED_DURABLE_RESOURCE
    severity: medium
    implies_stale: false
    note: >
      a resource in service that some durable artifact names as required, and
      that no reconcilable store declares. Case B: `127.0.0.1:17890` in a
      shell comment. The capability it backs resolves to PROVIDER_NOT_INSTALLED
      rather than UNKNOWN, because "we are not sure whether this node has it"
      is false comfort when the answer is that it has no provider at all.
  # -- added by the resource-observation round (§15) ------------------------
  - code: DESIRED_ACTUAL_MISMATCH
    severity: medium
    implies_stale: false
    note: >
      a registered resource that is measurably not in the state its own
      registration declares. Raised as a SIGNAL and never as a conclusion: the
      desired state is a declaration, so a mismatch means the declaration and
      the world disagree — and which of the two is wrong is not something this
      detector can see. Medium rather than high for that reason, and
      `implies_stale` false because a resource that should be running and is
      not is the opposite of a reclamation candidate; every automatic path in
      this system treats a stopped resource under a `running` declaration as
      something to look at, never as something to remove.

      It is a separate code from the whole class of "this looked wrong"
      findings because it is the only one with a declaration on the other
      side of it. A container that exited with `--restart no` and no
      registration is not a mismatch; it is nobody's declared problem, and
      saying otherwise is how a detector acquires a population of one false
      alert per stopped test container.
  # -- added by the protection gate (§17) ----------------------------------
  - code: PROTECTION_LOST_ON_IDENTITY_SWITCH
    severity: high
    implies_stale: false
    note: >
      a resource whose protection is reachable through one of its identities
      and not through another. §9 made `runtime:container:<id>` the canonical
      identity of a container, and every automatic path will use that spelling
      — but protection declarations on this node name work items and container
      names, so under the canonical identity the same container resolves to
      `protected: false`. Both answers are defensible and only one of them is
      safe, which is exactly why it is reported rather than resolved: the fix
      is a declaration somebody has to write, not a fallback a resolver should
      invent. High, because a protection that lapses produces no error, no
      anomaly and no line in any report — the container simply becomes
      reclaimable and looks exactly like one that always was.

      The live gate fires on four containers on this host (measured
      2026-09-14), which is recorded in the round's report and NOT acted on:
      editing the registry's protection list is a declaration change and
      requires authorisation.

# ---------------------------------------------------------------------------
# Thresholds (§10). Declared here, read by the detector, never hard-coded.
#
# A threshold is a POLICY, and a policy that lives in a function's default
# argument is a policy nobody can review or change. Every code below reports
# the threshold it used alongside the value it measured, so a reading can be
# argued with rather than merely believed.
# ---------------------------------------------------------------------------
thresholds:
  # One full core, sustained over the process's whole life. Not an
  # instantaneous sample: "sustained" is the claim, so the measurement has to
  # be able to carry it (see attribution.lifetime_cpu_percent).
  cpu_percent_high: 100.0
  # Below this, "busy" is a build or a test run and means nothing.
  cpu_sustained_seconds: 3600
  memory_rss_high_bytes: 1073741824      # 1 GiB
  age_long_seconds: 86400                # one day
  filesystem_percent_high: 85.0
  # The same question asked of inodes. A filesystem with free bytes and no free
  # inodes cannot create a file, so it is a separate gate with a separate
  # threshold rather than a second reading of the byte one.
  inode_percent_high: 85.0
  # Swap in use — a WATERMARK, and not by itself a claim about now. This
  # number is a high-water mark: pages go to swap when memory was short and
  # come back only when they are touched again, so a swap file that filled
  # once stays full while the machine is idle. Read alone it says what
  # happened to this host, not what is happening to it, and a note that
  # reported it as current pressure was measured here saying "Real memory
  # pressure" while `pswpout` was unmoved and 16.8 GiB of 32.5 GiB was free.
  #
  # So it opens a question rather than settling one, and the two PSI keys
  # below are the answer. Anything that gates admission on swap must read
  # both halves; the watermark alone is a reason to look.
  swap_percent_high: 90.0
  # Memory pressure-stall, `some avg60`. The kernel's own answer to "how much
  # did work stall waiting on memory", which is the question the watermark
  # above only appears to answer.
  #
  # `some` means at least one task stalled. 1.0% of a 60-second window is a
  # low bar deliberately: on an idle host this reads 0.00, and the repair for
  # a false positive here is a reader disagreeing with a number they can see.
  psi_memory_some_avg60_percent_high: 1.0
  # Memory pressure-stall, `full avg60`. `full` means EVERY runnable task was
  # stalled, which is a strictly stronger claim than `some`, so it carries the
  # lower bar. Two keys rather than one for the same reason
  # `filesystem_percent_high` and `filesystem_percent_critical` are two: one
  # number cannot say both "some work is waiting" and "no work is running".
  psi_memory_full_avg60_percent_high: 0.5
  # Load average per logical CPU. Expressed per CPU so that the number does not
  # have to be restated when the machine is resized, and so that a 32-core host
  # and a 4-core host are compared by the same rule.
  load1_per_cpu_high: 1.0
  error_repeats_high: 10
  error_window_seconds: 3600
  # A runtime whose task went idle this long ago and is still consuming.
  idle_grace_seconds: 1800
  # -- §18 resource-observation thresholds ----------------------------------
  # A SECOND disk tier. `filesystem_percent_high` above is the warning tier
  # and already existed; this is the one that says "do not create anything
  # else here". One number cannot say both, and §31's four-valued verdict
  # (`NO ACTION / MONITOR / GOVERNANCE REQUIRED / CRITICAL`) cannot be
  # produced from a single threshold.
  filesystem_percent_critical: 92.0
  # Host-level memory, as opposed to the per-runtime `memory_rss_high_bytes`
  # above. A single process over its own budget and a machine out of memory
  # are different findings and only the second one gates admission.
  memory_percent_high: 90.0
  # The PER-ACCOUNT pair, and the distance they come back by. `memory_percent_high`
  # above grades the MACHINE — "is this host out of memory" — and 90 is a
  # near-death reading for it. These grade ONE ACCOUNT on a host shared by
  # sixteen and answer a different question: "is this account holding the
  # machine". The bar is far lower because the answer is not about death, it is
  # about fairness and about what happens next.
  #
  # Measured on this host 2026-10-14: `vince` uid 1002 ran
  # `python -m pytest -q -p no:cacheprovider` as PID 288992 for about nineteen
  # hours, anon RSS ~145 GiB of 247 GiB total (58.7%), one core saturated, swap
  # nearly exhausted at 32 GiB, MemAvailable ~37 GiB. Every per-account view of
  # this node was, correctly, about somebody else, and nothing reported it. A
  # 90% threshold here would have reported nothing: it would have had to wait
  # for 222 GiB, and the machine was already thrashing at 145.
  #
  # The two tiers are DIFFERENT CLAIMS and not two numbers on one axis:
  #
  #   user_memory_percent_high      SUSTAINED. Both samples of one window over
  #                                 it. A single sample cannot tell a process
  #                                 that is filling memory from one that was
  #                                 always that size, and a soft tier that
  #                                 fired on one sample would fire on every
  #                                 build and every test run that briefly
  #                                 touched a large figure.
  #   user_memory_percent_critical  IMMEDIATE. One reading over it is the claim.
  #                                 An account holding half the machine does not
  #                                 need to hold it twice.
  #
  # `margin_key()` derives `user_memory_percent_recovery_margin` from EITHER
  # key — the two are one quantity read at two places on one axis, and they come
  # back down the same distance. The five points below are the brief's, and a
  # single distance is what keeps an escalation from being a second place for
  # the two tiers to disagree about when an account stopped holding the machine.
  user_memory_percent_high: 30.0
  user_memory_percent_critical: 50.0
  user_memory_percent_recovery_margin: 5.0
  # Per-uid exceptions, keyed by the uid as a string. For the account whose
  # large memory use IS its job — a build worker, a shared gateway — and for
  # machines where 30% is not the same number of GiB. Each entry may carry
  # `percent_high` and `percent_critical`, and an entry that carries neither is
  # inert rather than wrong: the defaults apply and the entry is a place to
  # write down that somebody looked.
  #
  # Empty here on purpose. A special case hard-coded in the branch above would
  # be a policy nobody can review; this is the reviewable spelling of the same
  # thing, and the daemon reads it from this file on every pass.
  user_memory_per_uid: {}
  # Docker's share of the filesystem its data root lands on. Above this the
  # store is the thing filling the disk, which is a different disposition
  # from "something else here is large".
  docker_storage_percent_high: 85.0
  # BuildKit's cache. On this host two buildx instances hold tens of GB and
  # are BUILD INFRASTRUCTURE, not litter — this threshold exists to keep the
  # number in front of a person, not to authorise pruning it.
  docker_build_cache_bytes_high: 21474836480   # 20 GiB
  container_writable_layer_bytes_high: 1073741824   # 1 GiB
  container_log_bytes_high: 1073741824   # 1 GiB

  # -- alert hysteresis margins ----------------------------------------------
  # Every threshold above is an OPEN threshold: the value at which a signal
  # starts firing. None of them says when to stop, and the difference is the
  # whole of §9 — a filesystem at 84.9% then 85.1% then 84.8% crosses the
  # warning tier three times in three ticks and produces three unrelated
  # events, which is how a person learns to stop reading them.
  #
  # So an alert closes at `open - margin`, not at `open`. The margin is a
  # POLICY and lives beside the threshold it modifies rather than in the
  # notification module, because a margin hardcoded next to the code that
  # compares it is a second threshold table nobody reviews.
  #
  # Why a MARGIN and not a second absolute: the two numbers are one decision —
  # "how far back does it have to come before we believe it" — and stating the
  # distance keeps that visible when either end is edited. A second absolute
  # would let someone move the open threshold and leave the close threshold
  # above it, which reads as hysteresis and behaves as a flap.
  #
  # Only the codes whose subject is a MEASUREMENT have one. `RUNTIME_UNOWNED`,
  # `DESIRED_ACTUAL_MISMATCH` and the tunnel codes are not thresholds — a
  # declaration either matches or it does not — so they resolve on the fact
  # disappearing, not on a value coming back down. Absence of a margin is that
  # statement, and the alert layer reads it that way rather than inventing one.
  filesystem_percent_recovery_margin: 3.0
  inode_percent_recovery_margin: 3.0
  memory_percent_recovery_margin: 5.0
  swap_percent_recovery_margin: 5.0
  docker_storage_percent_recovery_margin: 3.0
  # PSI's own recovery margin, and the first entry here whose opening threshold
  # is not a share of a capacity. `psi_memory_some_avg60_percent_high` is 1.0 and
  # its unit is percent of wall-clock time — memory tasks were stalled for 1% of
  # the last minute — so half of it, 0.5, is the same shape `memory_percent_*`
  # and `swap_percent_*` take three lines above.
  #
  # Measured on this host 2026-09-29 to sit in open space on both sides: a quiet
  # stretch reads 0.16 and the episode that produced this code read 3.16-10.53,
  # so nothing oscillates across the line.
  #
  # Derived-but-undeclared is a permanently open alert — `margin_key()` turns a
  # `*_high` into a `*_recovery_margin`, and the alert layer holds with "there
  # is no distance to come back to" when the key is missing, which reads as an
  # open problem nobody is dealing with, forever, because a number was absent.
  # Pointing `_THRESHOLDS` at a PSI name DERIVES this key, so it is declared in
  # the same change as the code that derives it.
  psi_memory_some_avg60_percent_recovery_margin: 0.5

  # The process layer's two continuous measurements. `cpu_percent_high` is the
  # case §5's acceptance run produced: a runtime group sitting at 279% of one
  # core does not sit there — it falls to nothing when the process it is
  # restarted, rises again as it starts working, and with no margin the alert
  # about it opens and closes on every one of those turns. 10 percentage
  # points is one tenth of a core: far enough that ordinary scheduling noise
  # stays inside the open alert, close enough that a group which really stopped
  # working closes it on the next tick.
  cpu_percent_recovery_margin: 10.0
  # `memory_rss_high_bytes` is 1 GiB, so this is 256 MiB back — a quarter of the
  # threshold. Resident memory falls in steps as processes exit, and the step
  # for the case that produced this number was ~390 MB.
  memory_rss_recovery_margin: 268435456

  # The three byte-valued aggregates whose recovery margin was DERIVED but
  # never declared, which made their alerts permanently open: `margin_key()`
  # turned `container_log_bytes_high` into `container_log_bytes_recovery_margin`
  # and nothing looked that key up, so the alert layer held with "there is no
  # distance to come back" — an alert that reads as an open problem nobody is
  # dealing with, forever, because a number was missing. Declared now, and a
  # test asserts that every key `margin_key()` can derive for a graded code is
  # present here, so the next one cannot be missing silently.
  container_log_bytes_recovery_margin: 268435456          # 256 MiB under 1 GiB
  container_writable_layer_bytes_recovery_margin: 268435456
  docker_build_cache_bytes_recovery_margin: 4294967296    # 4 GiB under 20 GiB
  # `error_repeats_high` is a windowed COUNT, and this is the one margin here
  # that is not a continuous quantity: two repeats fewer than the threshold,
  # so a subject oscillating between nine and eleven failures an hour does not
  # produce two events an hour.
  error_repeats_recovery_margin: 2

# ---------------------------------------------------------------------------
# Resource anomaly codes (§18). Seventeen, and a SECOND vocabulary beside the
# process-layer `anomalies:` list above. §18 names fifteen; this layer grades
# those fifteen plus two — `MEMORY_PRESSURE_ACTIVE`, added for the reason given
# at its entry, and `USER_MEMORY_PRESSURE`, added because §18's memory codes are
# all about the MACHINE and on a shared host "the machine is at 58%" and "one
# account is holding 58% of it" are different findings with different readers.
#
# Why a second list rather than fifteen more entries above: the list above is
# the PROCESS layer — a runtime group, a pid tree, a task. This one is the
# RESOURCE layer — a filesystem, the host's memory, the Docker store, a
# container, a tunnel. They share the severity scale and the
# `measured`-carries-its-threshold rule (both are enforced by
# `anomaly.signal`), and they answer different questions about different
# subjects. Merging them would make `anomaly.list` a list where a reader
# cannot tell which half they are looking at.
#
# `emitted_by` names the producer. `alias_of` is set where a code here is the
# GRADED spelling of a code above: DISK_WARNING and DISK_CRITICAL are the
# warning and critical tiers of the same filesystem measurement that
# ROOT_FS_PRESSURE and DATA_FS_PRESSURE report, read from the same threshold
# key. That is stated rather than resolved because the two surfaces are
# asked different questions — the process layer by `serverosd`'s tick, this
# one by the resource surface — and a reader who finds both should be able to
# see they are one measurement rather than two disagreements.
#
# Every code here is `implies_stale: false`, and for the same reason as above:
# a filesystem under pressure, an unowned container and an unhealthy tunnel
# are facts about the host, not verdicts about a runtime.
# ---------------------------------------------------------------------------
resource_anomalies:
  - code: DISK_WARNING
    severity: medium
    implies_stale: false
    emitted_by: resource_anomaly._disk_signals
    threshold: filesystem_percent_high
    alias_of: [ROOT_FS_PRESSURE, DATA_FS_PRESSURE]
    note: >
      the warning tier of a filesystem. It means "plan for this", and the
      section-31 verdict it produces is MONITOR.
  - code: DISK_CRITICAL
    severity: high
    implies_stale: false
    emitted_by: resource_anomaly._disk_signals
    threshold: filesystem_percent_critical
    alias_of: [ROOT_FS_PRESSURE, DATA_FS_PRESSURE]
    permitted_consequence: >
      refuse the CREATION of a new disposable build or runtime resource on
      this filesystem. Never stop, remove or prune an existing one — §25
      states the boundary and §24 states the verbs that do not exist.
  - code: INODE_CRITICAL
    severity: high
    implies_stale: false
    emitted_by: resource_anomaly._disk_signals
    threshold: inode_percent_high
    note: >
      a filesystem with free bytes and no free inodes cannot create a file.
      It gets its own code rather than a second reading of the byte one
      because the two exhaustions have different causes and different fixes.
  - code: MEMORY_PRESSURE
    severity: medium
    implies_stale: false
    emitted_by: resource_anomaly._memory_signals
    threshold: memory_percent_high
    distinct_from: HIGH_MEMORY_SUSTAINED
    note: >
      the HOST is out of memory, as opposed to one runtime being large.
      HIGH_MEMORY_SUSTAINED above is about a process's own RSS; this is about
      the machine. A WATERMARK and not a pressure: it is graded on
      `used_bytes`, which is total minus MemAvailable, and MemAvailable is the
      kernel's own estimate with reclaimable cache already subtracted. A low
      figure is therefore memory the machine genuinely cannot get back, which
      is why this one keeps the admission gate it has always had while the
      swap watermark below does not.
  - code: SWAP_PRESSURE
    severity: medium
    implies_stale: false
    emitted_by: resource_anomaly._memory_signals
    threshold: swap_percent_high
    distinct_from: MEMORY_PRESSURE_ACTIVE
    note: >
      a swap WATERMARK. Pages are written to swap when memory was short and
      read back only when something touches them again, so a swap file that
      filled once stays full while nothing is paging: measured on this host
      2026-09-15 at 99.2% in use, memory PSI flat at 0.00 across every window,
      `pswpout` unmoved over forty minutes. It is `advisory` and not `refuse`
      for exactly that asymmetry — a high-water mark is worth reporting to
      whoever is about to create something, and it is not grounds for
      refusing them. The PSI reading travels in `measured` beside the
      watermark so a reader can tell that machine from a thrashing one.
  - code: MEMORY_PRESSURE_ACTIVE
    severity: medium
    implies_stale: false
    emitted_by: resource_anomaly._memory_signals
    threshold: psi_memory_some_avg60_percent_high
    distinct_from: SWAP_PRESSURE
    permitted_consequence: >
      refuse the CREATION of a new persistent resource while tasks on this
      host are stalling on memory. Never stop, restart or remove an existing
      one — §25 states the boundary and §24 states the verbs that do not
      exist.
    note: >
      PRESSURE, where the two entries above are watermarks: how much work
      stalled, read from `/proc/pressure/memory`. §18 does not name this code
      and it exists because the fifteen it does name cannot express the
      difference between a machine that is full and a machine that is
      stalled. Measured on this host 2026-09-29: swap at 80.5%, below its own
      90% threshold so SWAP_PRESSURE was silent, while memory PSI some avg60
      ran 6.80-10.53 against a threshold of 1.0 and `pswpout` reached 53,238
      pages/second — and the monitoring was green throughout. Graded on `some`
      rather than `full`: on a shared host one tenant's runtime stalling is
      the fact worth knowing about, and `full` would report that machine as
      quiet.
  - code: USER_MEMORY_PRESSURE
    severity: medium
    implies_stale: false
    emitted_by: resource_anomaly._user_memory_signals
    threshold: user_memory_percent_high
    distinct_from: MEMORY_PRESSURE
    note: >
      ONE ACCOUNT is holding this machine's memory, as opposed to the machine
      being out of it. MEMORY_PRESSURE above is graded on `used_bytes` against
      total and asks whether there is memory left; this is graded on one uid's
      summed resident pages against the same total and asks who has it. On a
      host shared by sixteen accounts the two answers are different readers'
      business: the first is everybody's, the second is one account's, and a
      monitoring system that only had the first reported nothing on 2026-10-14
      while a single process held 145 GiB of 247 for nineteen hours.

      SEVERITY IS PER SIGNAL HERE AND NOT PER CODE, which no other entry in
      this file is. The two tiers are the same finding about the same subject
      at two places on one axis, so the second code the disk pair would use
      would be a second identity, a second register row and a second alert for
      one account getting worse — `alerting.identity` is code + device +
      subject_ref, and the brief asks by name for one escalating alert rather
      than two. `medium` below is the soft tier; the critical tier is emitted
      at `high` on the same identity and reads as an escalation.

      THE SUBJECT IS `uid:<number>` — the kernel's own number and never a login
      name, because a name is a string somebody can change and this register
      outlives the string. `alerting.identity` supplies the device, so one uid
      on two machines is two alerts and never one.

      permitted_consequence: nothing. §25 forbids acting on a running process,
      and this code is the case the two forbidden responses in
      `FORBIDDEN_RESPONSES` name ("high memory => kill"). There is no verb in
      the module that stops, restarts, signals, reniced or isolates a process,
      and no entry here grants one. What this code is FOR is telling a person
      early enough that nothing has to be killed.
  - code: DOCKER_STORAGE_HIGH
    severity: medium
    implies_stale: false
    emitted_by: resource_anomaly._docker_signals
    threshold: docker_storage_percent_high
    note: >
      Docker's store, as a share of the filesystem its data root lands on.
      Above this the store is the thing filling the disk, which is a
      different disposition from "something else here is large".
  - code: RUNTIME_UNOWNED
    severity: low
    implies_stale: false
    emitted_by: resource_anomaly._hygiene_signals
    reuses: hygiene.py UNKNOWN_OWNER
    note: >
      No owner could be confirmed. On a shared host this is the expected
      result and not a defect in the classification: a container name is a
      string, and a compose project label names a compose run, not an owner.
      Low severity for exactly that reason.
  - code: RUNTIME_ORPHANED
    severity: medium
    implies_stale: false
    emitted_by: resource_anomaly._hygiene_signals
    reuses: hygiene.py ORPHANED
  - code: DESIRED_ACTUAL_MISMATCH
    severity: medium
    implies_stale: false
    emitted_by: resource_anomaly._desired_signals
    emitted_by_primary: desired.signal_of
    note: >
      already a process-layer code (§15) and reused rather than re-derived:
      `desired.py` owns the comparison, and a second comparison would be a
      second answer to "what does the registration say".
  - code: PROTECTED_RESOURCE_AT_RISK
    severity: high
    implies_stale: false
    emitted_by: resource_anomaly._protected_at_risk
    threshold: filesystem_percent_high
    note: >
      a protected resource standing on a filesystem in a warning tier. High,
      and the only code in this list whose subject is a PERMISSION: the
      protection prevents the automatic path from acting, and nothing else
      was watching the thing the protection was for. The identity half of the
      same sentence is PROTECTION_LOST_ON_IDENTITY_SWITCH above.
  - code: CONTAINER_LOG_LARGE
    severity: low
    implies_stale: false
    emitted_by: resource_anomaly._docker_signals
    threshold: container_log_bytes_high
    note: >
      size only, never content — the same rule `inventory.container_logs`
      enforces one layer down. On this host every log is UNREADABLE to the
      observing user, so this code reports into `codes_not_evaluated` with
      that reason rather than as "all logs are small".
  - code: CONTAINER_WRITABLE_LAYER_LARGE
    severity: low
    implies_stale: false
    emitted_by: resource_anomaly._docker_signals
    threshold: container_writable_layer_bytes_high
    note: >
      from `docker ps -a --size`, which costs 0.54s here against 22s for the
      daemon-wide accounting. The daemon's own rounded figure — a
      classification, not an exact byte count.
  - code: BUILD_CACHE_HIGH
    severity: medium
    implies_stale: false
    emitted_by: resource_anomaly._docker_signals
    threshold: docker_build_cache_bytes_high
    note: >
      Two buildx instances hold tens of GB on this host and are BUILD
      INFRASTRUCTURE, not litter. This code exists to keep the number in
      front of a person; `docker system df`'s reclaimable figure is what a
      prune WOULD free, not what is safe to free.
  - code: TUNNEL_UNHEALTHY
    severity: high
    implies_stale: false
    emitted_by: resource_anomaly._tunnel_signals
    note: >
      the declaration says this tunnel exists and the measurement does not
      agree. §13 forbids restarting it: an observation that repaired what it
      observed would destroy the evidence that it was ever broken.
  - code: TUNNEL_OWNER_MISSING
    severity: medium
    implies_stale: false
    emitted_by: resource_anomaly._tunnel_signals
    note: >
      No owner of record. A process that is forwarding has not declared
      itself anything, and a nearby port or a matching name is not an owner.

# ---------------------------------------------------------------------------
# Combinations (§11).
#
# A single signal never marks anything stale. A named COMBINATION can, and the
# combination is written down here rather than emerging from the agent's mood,
# so that the same facts produce the same classification every time.
#
# The rule that makes this safe: a combination may upgrade the CLASSIFICATION.
# It may never delete the underlying signals from the record.
# ---------------------------------------------------------------------------
combinations:
  - classification: STALE_AGENT_RUNTIME_HIGH_CONFIDENCE
    requires_all: [TASK_IDLE_PROCESS_ACTIVE, HIGH_CPU_SUSTAINED, REPEATED_ERROR_LOOP]
    note: >
      idle task + real consumption + a loop that keeps failing. Three
      independent facts pointing the same way, none of which is sufficient
      alone. This is the codex case of 2026-09-13.
  - classification: STALE_AGENT_RUNTIME_HIGH_CONFIDENCE
    requires_all: [ORPHAN_PROCESS_TREE, TASK_CLOSED_RESOURCE_RUNNING]
    note: "the session that owned it is gone and the work it served is closed"
  - classification: STALE_CANDIDATE
    requires_all: [TASK_IDLE_PROCESS_ACTIVE, HIGH_CPU_SUSTAINED]
    note: "worth a look; not yet a confident call"
  - classification: STALE_CANDIDATE
    requires_all: [ORPHAN_PROCESS_TREE, HIGH_CPU_SUSTAINED, REPEATED_ERROR_LOOP]
    note: >
      the same three-way shape as the task-idle combination, with lineage
      standing in for task state: the origin session is not coming back, the
      runtime is consuming real CPU, and it is failing in a loop.

      Deliberately a CANDIDATE and not high confidence, because it cannot show
      the WORK is finished — only that its origin is gone and it is failing.
      That is a weaker claim than the task-idle version makes, and the weaker
      claim is the one the evidence supports.

      This exists because TASK_IDLE_PROCESS_ACTIVE is structurally unreachable
      on a host with no task-to-process mapping, which includes this one. With
      only the task-idle combinations declared, the 2026-09-13 codex case —
      405% CPU, orphaned, 85 repeats of a failing loop, all three measured —
      would classify as nothing at all. Fail-safe is not the same as
      uninformative, and a detector that can never classify anything is one
      nobody will consult.
  - classification: BROKEN_NOT_STALE
    requires_all: [MCP_PROCESS_ALIVE_BUT_UNAVAILABLE]
    note: >
      a process that is up and cannot answer is broken, and broken is not the
      same as unused. Restarting may be right; reclaiming is not.
  - classification: INFRASTRUCTURE_AT_RISK
    requires_all: [FUNCTIONAL_PROBE_FAILED]
    note: >
      only applies to criticality: critical. A failed critical resource is an
      incident, not a cleanup.

# ---------------------------------------------------------------------------
# What a recommendation may say, and the blast radius that must accompany it.
#
# Every recommendation is a PROPOSAL. Nothing here executes. §18 forbids the
# daemon from removing, pruning, killing or cleaning anything, and §31 requires
# this host's real case to be diagnosed and then left alone.
# ---------------------------------------------------------------------------
recommendations:
  values:
    - NONE
    - STOP_RUNTIME_GROUP
    - RESTART_RESOURCE
    - REQUEST_CLEANUP_APPROVAL
    - NEEDS_HUMAN
    # Added by the runtime-resource round (§40). The resource is running
    # correctly and its DECLARATION is what is stale — a session owns a
    # durable resource, or a required resource has no declaration at all.
    # Distinct from every value above because acting on the resource would be
    # acting on the wrong object: restarting a session-owned tunnel re-creates
    # the same defect with a fresh clock, and starting an undeclared tunnel
    # changes nothing that made it undeclared.
    - REDECLARE_RESOURCE
  every_recommendation_requires:
    - blast_radius          # what else stops if this is done
    - affected_processes    # exactly which PIDs, listed
    - affected_runtime_refs
    - protected_excluded    # which protected things were deliberately left out
  note: >
    A recommendation without a blast radius is not a recommendation. The
    operator cannot consent to a consequence nobody described.

rules:
  - "Every attributed field carries a status. A field with no status is not
     attributable and must be reported as UNKNOWN."
  - "Decisive provenance or UNKNOWN_OWNER. There is no third answer, and
     plausibility is not a provenance class."
  - "A single signal never marks a runtime stale. §11 requires a named
     combination, and the combination is evaluated in code rather than
     described in a report."
  - "A classification never replaces its signals. The facts stay in the
     record after the conclusion is drawn from them."
  - "The daemon reports measurements, never causes. There is no field here
     for a diagnosis, and adding one would be the whole failure mode."
  - "Unknown owner fails safe: DEFER, never reclaim."

# ---------------------------------------------------------------------------
# §25 · the CPU / memory policy boundary.
#
# ServerOS observes pressure. This block is the complete list of what that
# observation is permitted to cause, and it is written as an ALLOW-list because
# the failure it guards against is a reflex rather than an oversight: a host
# under memory pressure and a process with a high resident set are the two
# facts easiest to reach for, and the two responses a person regrets.
#
# The forbidden pair is named in the brief's own words, and it is named here
# rather than paraphrased so that a reader comparing the two cannot conclude
# the document is stricter in spirit and looser in writing.
# ---------------------------------------------------------------------------
resource_admission:
  acts_on_existing_resources: false
  forbidden_responses:
    - "high CPU => kill"
    - "high memory => kill"
  permitted_consequence: >
    REFUSING the creation of a NEW disposable build or runtime on a resource
    that is in a tier where the next allocation may not fit. That is the whole
    of it. The strongest permitted answer is "this host will not take another
    one right now", which leaves everything already running exactly as it is.
  wired_into_a_creation_path: false
  why_not_wired: >
    §25 permits contract and tests only when wiring would significantly expand
    the round. It would: the creation paths are the build runner, the test
    environment provisioner and the agent session launcher, and each of them
    would need its own decision about what a refusal means to a caller
    mid-flight. Wiring an admission gate without having read one live
    observation is the same ordering this round exists to correct — the
    declaration running ahead of the data.
  next_round: "Resource Governance V1 (§38)"
  request_kinds:
    disposable_build: refuse
    disposable_runtime: refuse
    session: refuse
    persistent: refuse
    note: >
      Every kind refuses at the same tier on purpose. A gate that only stopped
      the cheapest kind would leave the expensive one available precisely when
      the host is least able to pay for it.
  gates:
    DISK_CRITICAL:
      level: refuse
      why: >
        the filesystem is above the critical tier. A new disposable resource
        would be created onto a disk that cannot be counted on to hold it.
    INODE_CRITICAL:
      level: refuse
      why: >
        free bytes and no free inodes cannot create a file, so a creation
        would fail in a way that looks like an unrelated error.
    MEMORY_PRESSURE:
      level: refuse
      why: >
        at or above the declared threshold the machine has no headroom it
        would need to absorb one more process. Graded on MemAvailable, the
        kernel's estimate with reclaimable cache already subtracted, so a low
        figure is memory the machine genuinely cannot get back.
    MEMORY_PRESSURE_ACTIVE:
      level: refuse
      why: >
        work on this host is stalling on memory now. A machine in that state
        should not be handed another persistent process, and refusing one is
        the only consequence §25 permits.
    SWAP_PRESSURE:
      level: advisory
      why: >
        a swap high-water mark only rises. Pages are written to swap when
        memory was short and read back only when something touches them
        again, so a swap file that filled once stays full while nothing is
        paging — this host measured 99.2% in use with PSI flat at 0.00 across
        every window. Worth reporting to whoever is about to create
        something, and not grounds for refusing them. The pressure half of
        the same machine is MEMORY_PRESSURE_ACTIVE above, which does refuse.
    DISK_WARNING:
      level: advisory
      why: >
        the warning tier is a fact worth reporting to whoever is about to
        create something, and not a refusal. A gate that closed here would be
        closed most of the time, which is how a gate becomes noise.
    DOCKER_STORAGE_HIGH:
      level: advisory
      why: >
        the store's share of its filesystem. Whether that is a problem depends
        on what is about to be built, which the signal does not know.
    BUILD_CACHE_HIGH:
      level: advisory
      why: >
        build infrastructure rather than litter. A large cache is what makes
        the next build cheap, so refusing on this signal alone would trade a
        slow build for a fast one.
  note: >
    Three of the fifteen §18 codes refuse — DISK_CRITICAL, INODE_CRITICAL and
    MEMORY_PRESSURE — and four advise, SWAP_PRESSURE having moved from refuse to
    advisory when its semantics were narrowed to the watermark it actually
    grades. The remaining eight are statements about things that already exist
    and are not admission questions at all. Counting the code this layer adds,
    four refuse and four advise, and the addition is not a fourth §18 refusal:
    MEMORY_PRESSURE_ACTIVE is nowhere in §18's list. Nothing in this block
    authorises an action on a resource that exists, and a code with no entry
    here cannot refuse anything — the list is closed, so a code added later is
    advisory by default rather than accidentally gating.
