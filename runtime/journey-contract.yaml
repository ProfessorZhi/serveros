# journey-contract — 一条来源修订走到投递回执时，沿途那几个必须停下来的点。
#
# WHY THIS FILE AND NOT CONSTANTS IN THE MODULE
# ---------------------------------------------
# `runtime/journey.py` 是 B1→B3→B4→A7→B8→B10 之间那条缝。缝上要判的东西只有一类：
# **这一处该不该继续**。而「该不该继续」的答案是有限的几个词，它们不是实现细节 ——
# 一个 `if kind == "human"` 写在代码里，就等于把「谁的决定算授权」压成了一次字符串比较；
# 词表写在这里，新增一个「也算授权」的来源就必须由人改一行。
#
# 这份文件刻意**只有**词表与字段名，没有 `producers:` / `enforcement:` 一类的声明：
# 那些是别的契约在管的事（`tests/test_declared_implementations.py` 会逐条核对），
# 而这里每加一样，就多一样必须与代码对上的承诺。
schema: serveros/journey-contract.v1
module: runtime/journey.py

# ── B1：捕获的三种结局 ────────────────────────────────────────────────────────
#
# 判据是**消息身份 + 修订**，不是到达次数。三种结局里只有一种让记录变化，另外两种都是
# 「这次观察没有带来新事实」——而它们的理由不一样，所以是不同的词，不是一个布尔。
capture_states:
  - id: NEW
    means: 这个 (source_id, message_id) 从未被捕获过。
  - id: ALREADY_CAPTURED
    means: >-
      同一条消息以同一个 revision 又答了一次。这是同一件事实被读了第二遍，
      不是第二件事实：再追加一条修订会让「源改过几次」变成「读了几次」的函数。
  - id: NEW_REVISION
    means: >-
      同一条消息换了 revision。这是**同一条消息被改了**，不是第二条消息 ——
      身份仍是 (source_id, message_id)，所以它不会变成第二项工作。

# ── 收据链的环节 ──────────────────────────────────────────────────────────────
#
# 一条旅程的产物是有序的收据，每条收据属于且只属于一个环节。环节名是闭集：
# 认不出的环节意味着有人在没改这份文件的情况下加了一步。
receipt_kinds:
  - id: capture
    is: B1 —— 一条来源观察折进捕获记录，以及它是三种结局里的哪一种。
  - id: requirement
    is: B3 —— 从已捕获的消息形成的一条需求**候选**。它不是 Item。
  - id: decision
    is: >-
      B3 的门 —— 一次**被验证过的**批准，或者它为什么没有成立。这一条收据读的是
      `authorize()` 的判定：`ACCEPTED` 只在一条由 HumanControlProvider 报过、现在
      仍然 FRESH/VERIFIED/FACT、且覆盖当前这一版来源的记录存在时才会出现。
  - id: work
    is: B4 —— 被接受之后才铸造的工作引用与它的 owner。
  - id: acceptance
    is: A7 —— 一次**运行观察**值多少，用 `runtime/daily_report.py` 的同一套词。
  - id: report
    is: B8 —— 从已接受的证据组合并落盘的文档，以及它自己的回执。
  - id: delivery
    is: B10 —— 投递给谁、投到没有，用 `runtime/report_delivery.py` 的四个词。

# ── 旅程为什么停在这里 ────────────────────────────────────────────────────────
#
# 每一种停法都必须是「读者能从这一句里知道下一步归谁」。`REFUSED` 与 `NEEDS_HUMAN` 的
# 区别是这份文件的重点：前者是**这次输入不成立**（比如拿一个模型的决定来当授权），
# 后者是**输入成立，只差一个人的答复**。把后者写成前者，会让一个只是还没问的人
# 看起来像做错了事。
stops:
  - id: CAPTURED_ONLY
    means: 来源捕获了，但没有人提出目标。这不是失败 —— 是这条链到 B1 为止。
  - id: NEEDS_HUMAN
    means: 候选已经成形且输入成立，**只差一个可信人类入口的决定**。
  - id: REFUSED
    means: 这次输入不成立（非人类来源的「授权」、没有被捕获的来源引用等）。
  - id: NOT_ACCEPTED
    means: 有人接受了，但运行**观察**没有通过。—— 自称不算，观察才算。
  - id: DELIVERED
    means: 投递通道自己报告收件端接受了这一版。
  - id: PENDING
    means: 没有人试过或结果未定 —— 待发仍然待发，不是失败。
  - id: UNKNOWN
    means: 试过，但这一次投递到底有没有到达，没有任何人能确定。

# ── 调用方的自述：只用来拒绝，从不用来接受 ────────────────────────────────────
#
# 这一节的名字是 `claim`（声称）而不是 `decision`（决定），因为这就是它在这条链上的地位：
# 一个字符串。`context/actor-context-contract.yaml` 的第一句话是整件事的理由 ——
# **identity is a lookup, not an argument**。一个能宣称自己背后有人的 Agent 运行时，
# 可以为它此后的每一次变更背书，而它背后每一道准入闸门都变成了装饰。
#
# 于是调用方 JSON 里的 `kind` 只有两种去向：**具名拒绝**，或者**进入验证**。没有第三种。
# 没有任何字段（`trusted: true`、`by`、`for_revision`、一段 APPROVE 文本）能让一个声称
# 直接变成一次授权。
claim_kinds:
  # 声称自己是人类入口的，**不因此获得任何东西**：它只是获准被送去验证。
  proceeds_to_verification:
    - id: human
      means: >-
        调用方声称这是一个人。这个声称本身不产生任何东西——它只是把这条输入送去
        `verifier` 那里，由 `context/actor.py` 判一个 `context_ref` 背后到底有没有一条
        由 HumanControlProvider 报过、且现在仍然 FRESH/VERIFIED/FACT 的记录。

  # `docs/architecture/NATIVE-WORK-ENVIRONMENT.md` §3 逐字点名了不能产生授权的三样东西
  # （研究结果、仓库里的 APPROVE 文本、模型生成的卡片与子任务 DONE）。它们在这里是**具名**
  # 拒绝，而不是「格式不合法」——具名之后，下次一个人拿子任务的 DONE 来立项时，得到的答复是
  # 「子任务 DONE 不产生授权」这一句，而不是一个解析错误。
  refused_by_name:
    - id: model
      because: >-
        模型生成的结论是**关于证据的意见**，不是授权。研究结果与它同一类：
        它可能完全正确，但正确与否不是它能否产生授权的判据。
    - id: child-done
      because: >-
        子任务 DONE 是**一次执行的终止状态**，不是父项的验收结论。
        `docs/ABILITY-OPERATING-MODEL.md` §9 把这两件事分得很开：child 自报成功不算 A7。
    - id: task-done
      because: 同 `child-done`——任务状态是执行侧的读数，授权在人类入口那一侧。
    - id: repo-approve-text
      because: >-
        仓库里的一份文本（一个 `APPROVE`、一次 review 的措辞）是**产物**，
        而任何人都能写一份产物。它记录「有人这样写过」，不记录「谁在什么时候为什么答应」。

# ── 授权协议：一个把手，被换成一条记录 ────────────────────────────────────────
#
# 调用方那一半协议只有**一个**字段：`context_ref`。而且它只是一个把手 ——
# `context/actor.py#resolve` 的注释写了这条协议的两半：呈上一个 ref，拿到一条记录或
# 一次 miss，而 miss 不是要被抹平的异常，它就是答案。
#
# 另一半是 `verifier`，一个**注入**的可调用对象。它被注入而不是被配置，因为
# 「谁是权威」是部署的事实而不是一个模块常量：生产入口是
# `runtime/journey.py#signed_delegation_provider`，
# 测试注入一个独立的 fake。它的签名与返回形状如下，因为一个形状说不清的权威接口，正是
# 两份实现开始各自漂移的地方。
authorization:
  caller_supplies:
    - context_ref
    - approver_ref      # 可选：这一项期望的批准主体。它只能**收窄**，不能伪造——
                        # 主体本身来自被验证的记录，这个字段只用来判「是不是这个人」。
    - evidence          # 可选：呈给权威验证器的签名材料。**不可信**，直到被验过。
  verifier:
    signature: "verifier(claim, now) -> resolution"
    resolution_found: true
    resolution_fields:
      - found              # false 表示没有任何 provider 报过这个 ref —— 一次 miss
      - context            # found 时：`context/actor-context-contract.yaml` 形状的记录
      - grant_ref          # found 时：这次批准依据的 grant
      - approved_revision  # found 时：**被签名载荷**覆盖的来源版本，取不到就是 null
      - because
    verified_by: context/actor.py
    # 这些判据一个字都不在本模块里重写：第二份实现就是第二个会漂移的地方。
    checks:
      - validate(record)           # 记录是不是声明的形状
      - authorizes(record, now)    # 现在 FRESH 且 VERIFIED 且 provenance FACT？
      - record.context_ref == claim.context_ref   # 把手必须就是那个把手
      - approved_revision == proposal.source_revision
      - normalize_actor_ref(record.actor_ref) == normalize_actor_ref(approver_ref)

  # 生产实现：一个可注入的 Provider，而不是本模块里写死的函数。
  production_provider:
    entry: runtime/journey.py#signed_delegation_provider
    takes: []                    # 刻意不接受任何参数——包括信任根
    delegates_to: context/actor.py#verify_delegation
    # 信任问题返回 `found: false` 并**原样保留** Actor 契约自己的 code，而不是抛一个
    # 自己编的异常：那样「为什么没通过」就不再是一个说法，而是一个可以 grep 的判据。
    refusal_codes:
      - DELEGATION_PROVIDER_UNBOUND      # 信任根没绑定，或 provider/key/audience 不在其中
      - DELEGATION_SIGNATURE_INVALID     # 签名验不过
      - DELEGATION_EVIDENCE_INVALID      # 信封或载荷不是声明的形状 / 签发时钟不成立
      - DELEGATION_SCOPE_INVALID         # grant 的字段、动作、预算或窗口越界
      - DELEGATION_VERIFIER_UNAVAILABLE  # 本机没有 Ed25519 支持
      - PRESENTED_REF_MISMATCH           # 呈上的把手不是这份委派签发给的那一条
    exercised_by: tests/test_journey_provider.py
    faked_in_that_test:
      - tests/journey_provider_fixture.py#fake_cryptography   # 签名原语，不是协议
      - tests/journey_provider_fixture.py#provider_world      # 信任根的**位置**，不是内容

  unbound_verifier_stops: NEEDS_HUMAN
  unbound_verifier_because: >-
    `verifier is None` 时唯一的答案是 NEEDS_HUMAN，没有别的分支：一个没有验证器的进程
    不能因为调用方在 JSON 里写了 `kind: human` 就产出授权。这不是留给以后的兜底，
    这就是现在生产 CLI 的行为。

# ── B1：来源修订从哪里来 ──────────────────────────────────────────────────────
#
# 与上面的授权边界是**同一族**的问题，只是早了一个阶段：`capture()` 收到的 `revision`
# 是一个字符串，而它在后面会变成承重的值 —— 一次签名的人类批准必须覆盖的正是它。
# 一个由「后来要被它约束的那一方」提供的承重值，不叫输入，叫自证。
#
# 真实答案已经存在于 `intake/source_reading.py#read_packet`：它把来源身份定义为
# `content_identity` —— 对**记录在案的 digest 处实际读到的字节**算出的 sha256，并与
# manifest 核对。那个模块的抬头写着 **Neither a timestamp nor a filename is a revision.**
source_authority:
  caller_supplies:
    - manifest          # 可选。声明了它，就等于声称「我读过真实字节」，那句话必须能被核对。
  verifier:
    signature: "read(observation) -> resolution"
    resolution_found: true
    resolution_fields:
      - found
      - content_identity   # found 时：读取者对实际字节算出的 sha256
      - kind               # DOCUMENT | WEB
      - coverage
      - because
    produced_by: intake/source_reading.py#read_packet
    construction_time_only:      # 绝不从 observation 取
      - records_root
      - allowed_asset_roots
    because: >-
      `read_packet` 的注释：*External asset roots are supplied by the trusted caller,
      never the manifest.* 一个能选择自己证据从哪里读的观察，等于自己决定该信什么。
  rules:
    - id: manifest_without_reader
      outcome: REFUSED
      means: >-
        声明了 manifest 却没有绑定读取者。「我读过真实字节」是一句可以由字节来核对的话；
        没有读取者时它无从核对，所以这条观察不能被记成一次读取。
    - id: revision_disagrees_with_the_bytes
      outcome: REFUSED
      means: 以字节为准。revision 不是调用方的说法。
    - id: manifest_the_reader_cannot_honour
      outcome: REFUSED
      means: 读取者自己的每一条拒绝（digest 不符、路径越界、8 MiB 预算、非 UTF-8、网页快照只有 shell）原样上报。
    - id: no_manifest_declared
      outcome: RECORDED_UNVERIFIED
      means: >-
        仍然被记录，但记录上写着 `verified: false`，收据的 why 里写着「自述，未核对」。
        这不是漏洞：捕获本身不铸造工作，而要求每条观察都有 manifest 会让 `CAPTURED_ONLY`
        永远不可达。「未核对」和「已核对」必须是两句不同的话，而不是同一个默认值。

# ── 一条收据要能回答的问题 ────────────────────────────────────────────────────
#
# 六条，一条都不多。缺任何一条，收据就不能既被核对又被追问：`ref` 与 `revision` 说
# 「哪一件事的哪一版」，`state` 与 `why` 说「它现在算什么、凭什么」，`at` 说「什么时候」，
# `kind` 说「这是哪个环节写的」。
required_fields:
  - kind
  - ref
  - revision
  - state
  - why
  - at
