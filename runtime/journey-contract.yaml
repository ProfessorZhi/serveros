# journey-contract — 一条来源修订走到投递回执时，沿途那几个必须停下来的点。
#
# WHY THIS FILE AND NOT CONSTANTS IN THE MODULE
# ---------------------------------------------
# `runtime/journey.py` 是 B1→B3→B4→A7→B8→B10 之间那条缝。缝上要判的东西只有一类：
# **这一处该不该继续**。而「该不该继续」的答案是有限的几个词，它们不是实现细节 ——
# 一个 `if kind == "human"` 写在代码里，就等于把「谁的决定算授权」压成了一次字符串比较；
# 词表写在这里，新增一个「也算授权」的来源就必须由人改一行。
#
# 这份文件刻意**只有**词表与字段名，没有 `producers:` / `enforcement:` 一类的声明：
# 那些是别的契约在管的事（`tests/test_declared_implementations.py` 会逐条核对），
# 而这里每加一样，就多一样必须与代码对上的承诺。
schema: serveros/journey-contract.v1
module: runtime/journey.py

# ── B1：捕获的三种结局 ────────────────────────────────────────────────────────
#
# 判据是**消息身份 + 修订**，不是到达次数。三种结局里只有一种让记录变化，另外两种都是
# 「这次观察没有带来新事实」——而它们的理由不一样，所以是不同的词，不是一个布尔。
capture_states:
  - id: NEW
    means: 这个 (source_id, message_id) 从未被捕获过。
  - id: ALREADY_CAPTURED
    means: >-
      同一条消息以同一个 revision 又答了一次。这是同一件事实被读了第二遍，
      不是第二件事实：再追加一条修订会让「源改过几次」变成「读了几次」的函数。
  - id: NEW_REVISION
    means: >-
      同一条消息换了 revision。这是**同一条消息被改了**，不是第二条消息 ——
      身份仍是 (source_id, message_id)，所以它不会变成第二项工作。

# ── 收据链的环节 ──────────────────────────────────────────────────────────────
#
# 一条旅程的产物是有序的收据，每条收据属于且只属于一个环节。环节名是闭集：
# 认不出的环节意味着有人在没改这份文件的情况下加了一步。
receipt_kinds:
  - id: capture
    is: B1 —— 一条来源观察折进捕获记录，以及它是三种结局里的哪一种。
  - id: requirement
    is: B3 —— 从已捕获的消息形成的一条需求**候选**。它不是 Item。
  - id: decision
    is: B3 的门 —— 对这条候选作出的一次决定，以及它是否覆盖当前这一版来源。
  - id: work
    is: B4 —— 被接受之后才铸造的工作引用与它的 owner。
  - id: acceptance
    is: A7 —— 一次**运行观察**值多少，用 `runtime/daily_report.py` 的同一套词。
  - id: report
    is: B8 —— 从已接受的证据组合并落盘的文档，以及它自己的回执。
  - id: delivery
    is: B10 —— 投递给谁、投到没有，用 `runtime/report_delivery.py` 的四个词。

# ── 旅程为什么停在这里 ────────────────────────────────────────────────────────
#
# 每一种停法都必须是「读者能从这一句里知道下一步归谁」。`REFUSED` 与 `NEEDS_HUMAN` 的
# 区别是这份文件的重点：前者是**这次输入不成立**（比如拿一个模型的决定来当授权），
# 后者是**输入成立，只差一个人的答复**。把后者写成前者，会让一个只是还没问的人
# 看起来像做错了事。
stops:
  - id: CAPTURED_ONLY
    means: 来源捕获了，但没有人提出目标。这不是失败 —— 是这条链到 B1 为止。
  - id: NEEDS_HUMAN
    means: 候选已经成形且输入成立，**只差一个可信人类入口的决定**。
  - id: REFUSED
    means: 这次输入不成立（非人类来源的「授权」、没有被捕获的来源引用等）。
  - id: NOT_ACCEPTED
    means: 有人接受了，但运行**观察**没有通过。—— 自称不算，观察才算。
  - id: DELIVERED
    means: 投递通道自己报告收件端接受了这一版。
  - id: PENDING
    means: 没有人试过或结果未定 —— 待发仍然待发，不是失败。
  - id: UNKNOWN
    means: 试过，但这一次投递到底有没有到达，没有任何人能确定。

# ── 什么算一次授权 ────────────────────────────────────────────────────────────
#
# `docs/architecture/NATIVE-WORK-ENVIRONMENT.md` §3 逐字点名了不能产生授权的三样东西
# （研究结果、仓库里的 APPROVE 文本、模型生成的卡片与子任务 DONE）。它们在这里是**具名**
# 拒绝，而不是「格式不合法」—— 具名之后，下次一个人拿子任务的 DONE 来立项时，
# 得到的答复是「子任务 DONE 不产生授权」这一句，而不是一个解析错误。
decision_kinds:
  accepted:
    - id: human
      means: 来自可信人类入口的决定。它必须带上作出者与它是对哪一版来源作出的。
  refused_by_name:
    - id: model
      because: >-
        模型生成的结论是**关于证据的意见**，不是授权。研究结果与它同一类：
        它可能完全正确，但正确与否不是它能否产生授权的判据。
    - id: child-done
      because: >-
        子任务 DONE 是**一次执行的终止状态**，不是父项的验收结论。
        `docs/ABILITY-OPERATING-MODEL.md` §9 把这两件事分得很开：child 自报成功不算 A7。
    - id: task-done
      because: 同 `child-done`——任务状态是执行侧的读数，授权在人类入口那一侧。
    - id: repo-approve-text
      because: >-
        仓库里的一份文本（一个 `APPROVE`、一次 review 的措辞）是**产物**，
        而任何人都能写一份产物。它记录「有人这样写过」，不记录「谁在什么时候为什么答应」。

# ── 一条收据要能回答的问题 ────────────────────────────────────────────────────
#
# 六条，一条都不多。缺任何一条，收据就不能既被核对又被追问：`ref` 与 `revision` 说
# 「哪一件事的哪一版」，`state` 与 `why` 说「它现在算什么、凭什么」，`at` 说「什么时候」，
# `kind` 说「这是哪个环节写的」。
required_fields:
  - kind
  - ref
  - revision
  - state
  - why
  - at
