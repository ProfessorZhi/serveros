# periodic-report-contract — SYS-23 的输入边界、窗口与上限。
#
# WHY A CONTRACT AND NOT CONSTANTS IN THE MODULE
# ----------------------------------------------
# 这个文件里只有两种东西：这个 producer **收什么**，和它**一次列多少**。两者都不是实现细节。
# 「收什么」是 SYS-23 那条红线（与工作无关的会议纪要不进日报）唯一可能的载体——把它写成
# 代码里的一个 `if kind == "meeting-note"` 会让红线退化成一条对某个名字的判断，而红线的
# 内容其实是「边界」，不是「黑名单」。「列多少」是仓库里每个生产者都要面对的同一个问题：
# 把上限写在用它做比较的那行旁边，就是一个没人复核的数字，而 `runtime/alert_digest.py` 的
# `policy()` 已经为这件事写下了理由，此处照办。
schema: serveros/periodic-report-contract.v1
module: runtime/daily_report.py

# ── 输入 ──────────────────────────────────────────────────────────────────────
inputs:
  # 这四类是**全部**能被这份文档读到的输入。每一类都写明它是什么、谁产生它，
  # 因为「这个数字从哪来」是这份文档里最容易被含糊过去的一句话。
  accepted:
    - kind: focus
      is: 本周期被选定要做的事，人写的，不是任何命令测出来的
      produced_by: 调用方

    - kind: work-delta
      is: 工作树上的提交与文件变动，由 `git` 读出来
      produced_by: runtime/daily_report.py#measure_worktree

    - kind: quay-record
      is: Quay 自己的闸门账本与任务状态，由 Quay 写、由这里读
      produced_by: runtime/daily_report.py#measure_quay

    - kind: run-status
      is: 被期望跑起来的东西各自的结果，一份观察，不是一份期望
      produced_by: 调用方

  # 不在 `accepted` 上的一律具名拒绝。这一节解释的是**判据**，不是名单。
  #
  # 为什么不做一份「会议纪要」拒绝名单：黑名单只挡住它列出的那一个名字。与工作无关的东西
  # 下一次可能叫 `standup-notes`、叫 `周会`、叫任何别的什么，而一份针对名字的规则对它们
  # 一律放行——且是静默放行，因为没有人会想到去检查一个没被列进黑名单的输入。白名单把
  # 「不在边界上」变成拒绝的**理由本身**，于是新增一类输入这件事必须由人做一次声明，
  # 而不能由调用方顺手塞进来。
  #
  # 下面两条是**例子**，用来让拒绝的措辞有对象；判据永远是上面的 `accepted`。
  examples_of_refused:
    - what: 与工作无关的会议纪要 / meeting minutes
      why: >-
        它与本周期的工作差量之间没有可核对的关系：纪要记录了「开过一次会」，不记录
        「什么东西动了」。把它写进日报会让日报里出现一条无法追溯的推进，而无法追溯的
        推进与编造出来的推进，在读者眼里是同一件事。需要它的地方是信息管理的范围，
        不是这份文档。
    - what: 上一周期的摘要 / a previous period's summary
      why: >-
        日报的第二手来源比没有来源更坏：一份抄来的摘要会把上一个周期的进展记在本周期
        名下，而两个周期都看不出来。这一份必须自己读差量，哪怕读出来是零。

# ── 列多少 ────────────────────────────────────────────────────────────────────
listing:
  # 一次列出多少条提交、多少条闸门记录、多少个任务。**余数是数出来的，不是丢掉的**：
  # 文档同时给出被列出的条数和总数，「三条」和「三百条」因此不会长得一样。
  #
  # 这个数字是一个排版决定，不是一条阈值——它上面没有任何判断依赖它。正因为如此它更
  # 不该写在代码里：一个「只在显示时起作用」的数字最容易被随手改掉，而改掉之后没有任何
  # 测试会红。
  top_n: 8
