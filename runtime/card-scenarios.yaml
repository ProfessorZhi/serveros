  - name: observer_failure
    card: status
    title: 观测器失败
    source: constructed — 本节点今天没有出现过采集全失败。这一张说明读到的东西
      比读不到的东西少时卡会怎么说：三项都未读到，且缺口逐条点名。
      它同时是唯一一张「观测有洞」的卡，而且这个洞出现在两个地方：当天卡在
      10:00–13:00 之间丢了两个时点（折叠里因此有一条独立的区间条目，不是一句
      「无变化」），而 13:00 之后连一行都没有 —— 所以这一拍是第 8 个时点，
      当天卡最新的行停在第 6 个，卡首那一行必须把中间那一拍说出来，否则
      「与 13:00 相同」会把一个没人看过的小时读成一段平静。
      这一张的时刻因此比文档级的 `at` 晚一拍，行与缺口才对得上。
      第四块「当前问题」在这里也是**读不到**，而不是空的，而且这不是补上去的
      一致性：登记表读数走的是同一个 `serverosctl`，采集全失败时它一起失败。
      §3.4 那一整段说的就是这件事 —— 一张卡不能在一个没人打开的登记表上写
      「没有需要处理的问题」。所以这一张同时是那个形状的唯一一张预览。
    at: "2026-09-20T15:20:00+08:00"
    # 四个读数一个都没到，所以这里没有 `reads:`。缺口由 `read` 与 `why` 说出，
    # 命令名从 DEFAULT_READS 取 —— 与 `gather()` 在真实失败时写下的形状一致，
    # 于是「summary（resource summary）未读到：exit 2」这句是生产写的那一句，
    # 不是这里抄的一句。
    gaps:
      - {read: summary, why: "exit 2"}
      - {read: top, why: "exit 2"}
      - {read: user_services, why: "exit 2"}
      - {read: runtime_list, why: "exit 2"}
    # 字符串形态 = 「没有读数」，与文档层那个「读到了、没有 on-face 行」是两句
    # 不同的话。这里写的是**原始读失败文本**，也就是 `_default_run` 在真实失败
    # 时留下的那一行（它取子进程 stderr 的末行，所以可能是一段进程错误文本）；
    # 命令名与「未读到」由渲染层补，因为那一句是卡的话、不是工具的话。与上面
    # 四条缺口同因，所以同一个 `exit 2`。
    problems: "exit 2"
    binding: null
    day_store:
      schema: serveros/card-day.v1
      open:
        day_ref: CN-Mainland/2026-09-20
        kind: WORKDAY
        opened_at: "2026-09-20T08:00:12+08:00"
