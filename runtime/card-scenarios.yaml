# 本节点此刻没有共享网关的 binding（§2：没有声明就没有 gateway 段），所以下面
# 三张需要网关已读到/未读到的卡都借用这一份示例 binding。它是构造的，卡片自己
# 会把这一层说出来：gateway 段的 `maintainer` 那句写着「由 service binding
# 声明，不是授权」。
#
# `gateway.state` 用的是 env_health 认得的词（OK / ATTENTION / UNKNOWN），
# 不是「有没有绑定」的那个 BOUND —— 后者是 binding 块回答的问题，
# `presentation.gateway_section` 自己从 binding 的有无算出 BOUND/UNBOUND。
# 这两个词分别写错一次，卡首就会比出一条「gateway OK→BOUND」：一句看起来像
# 变化、实际上只是同一个事实被写了两遍的话。生产也是这个形状：snapshot 的
# gateway 块逐字就是 binding 文件里的 gateway 块。
_binding_ok: &binding_ok
  service_ref: service:tokyo-shared-ai-gateway
  source: 本节为示例 binding；真实文件尚未写入 ~/.serveros/
  gateway:
    state: OK
    maintainer: （由 service binding 声明，不是授权）
    endpoint: http://127.0.0.1:<port>
    # `state` 是**声明覆盖得到的**词，而不是这份文件拼的句子 ——
    # `card-definitions.yaml` 的 `gateway.probes` 有三个键，OK 那个渲染成
    # 「功能探针：全部路径就绪」。这份 fixture 原来写的是 `state: PASSED` 外加
    # 一句预先拼好的 `text`，两个都不在声明里，于是 `_gateway_probe_line` 走它
    # 那条「未声明的词原样返回」的兜底分支，把英文状态词、裸 ISO 时刻和 JST
    # 一起印在 gateway 栏的第一行上。那条兜底是刻意的（一个读不懂的词仍然是
    # 个读数，抹掉它等于说探针什么都没说），所以该改的是这份 fixture：它此前
    # 展示的是一张任何已声明的 binding 都产不出来的卡。
    probe:
      state: OK
      observed_at: "2026-09-20T14:19:41+08:00"
    providers:
      - text: 声明的 provider 1
      - text: 声明的 provider 2

# 下面每个 status 场景的 `mine` / `host` 两块都不是写在这份文件里的，而是由
# `card_source.snapshot()` 从 `runtime/card-scenario-reads.json` 里那份**真实采集**
# 派生出来的 —— 命令是谁跑的、什么时候跑的、逐字节是什么，都在那个文件里。
#
# 为什么不让 fixture 自己写这两块：写下来的那一刻，它就是作者相信生产者会说的话。
# 这份文件里已经错过两次，而且都错在没人会去找的地方 —— host 块少了「交换区」
# 那一行（生产者每次都写），两块都没有 `metrics`（于是每张预览都是没有两列指标的
# 脸，而线上那张有三行格子）。状态词更严重：手写的 fixture 可以声称 ATTENTION
# 而树里没有任何一条规则同意。派生之后，`host_attention` 之所以是 ⚠️，只是因为
# `card_source._host_section` 拿到那份读数之后得出了这个结论。
#
# `reads:` 指名用哪一份采集；`mutations:` 是「把这份采集里的某个读数换成另一个
# 读数」，形状与 Semantics V2 的证据一致（`before` / `after` / `why`）。`before`
# 会被核对：换成错的路径或采集漂移了都会在这里直接失败，而不是悄悄什么都不做。
# 采集里没有的场景才用它 —— 本机这两周没有越线的交换区水位，而库里记着 92.0%。
scenarios:

  # -- §6's six, in the order the design lists them. The four below them are
  # -- the acceptance criteria AC18–AC21, which are NOT §6's list and are kept
  # -- separate for that reason: if the two lists are merged, a reviewer cannot
  # -- tell a design example from a criterion's fixture. The last one is on
  # -- neither list and says so where it stands. Six + four + one = eleven. The
  # -- twelfth is the watermark/pressure split's own subject and says so where it
  # -- stands; the thirteenth through sixteenth are the four the acceptance round
  # -- of 2026-09-30 named after both lists were already written, and each says so
  # -- in its own comment. Six + four + one + one + four = sixteen. --

  - name: normal
    card: status
    title: 正常
    source: measured — mine / host 两块是本节点 2026-09-30 15:55 那四个读数的直接
      产物（见 runtime/card-scenario-reads.json 的 measured-20260930），没有一处
      数字是抄进来的：命令是谁跑的、什么时候、输出是什么，都在那个文件里。
      共享网关那一段是构造的（本节点还没有 binding），当天卡也是构造的：
      08:00–14:00 七个时点都读到、都无异常，因此卡首比出来的是「与 14:00 相同」，
      折叠里一天没有断口。
    reads: measured-20260930
    binding: *binding_ok
    # 三张 status 卡共同的那一天，见文件头的 `_day_clean`。
    day_store: *day_clean

  - name: unbound_gateway
    card: status
    title: 共享网关未声明绑定 · 其余两项已读到
    source: measured — 共享网关没有 binding，因此该栏为 UNBOUND；其余两项已读到，
      读数同样是 2026-09-30 15:55 那一份采集。
