# The sixteen situations a card has to survive, as input documents.
#
# WHY THIS IS DATA AND NOT A TEST HELPER
#
# The same sixteen documents have two consumers and they must not drift: the
# tests that assert the cards behave, and the previews a person is asked to look
# at before approving any of this. If the previews were generated from one set
# of inputs and the tests asserted against another, a reviewer would be
# approving a card the suite never ran — and the difference would be invisible,
# because both would look like cards.
#
# The count is sixteen and the number is worth keeping exact. It has been wrong
# twice already: the header said "six" while the file held ten, and the figure
# is the only thing that tells a reviewer whether a whole class of card is
# missing from the set they are approving. It is written down in seven places —
# four in this file (the first line, the paragraph above, this paragraph, and
# the scenario-list comment) and three in `card_scenarios.py` (the module
# docstring, the README text `write()` emits, and the `--out` help). Every
# addition edits all seven, and that is the price of writing a count down at
# all: the number is a thing to go looking for, not a thing to remember.
#
# THE TWELFTH IS NOT A FOURTH GROUP
#
# The other eleven come from three places — §6's list, AC18–AC21, and one
# scenario that belongs to neither. The twelfth belongs to none of them either,
# but it is not "the one that renders red" a second time: it is this round's own
# subject, and it is the only preview in the file whose two rows carry the same
# instant and two different measurements. It sits directly after the three
# groups, so that they stay contiguous and readable as groups; the four the
# acceptance round of 2026-09-30 named afterwards close the file.
#
# WHAT SAMPLE MEANS HERE
#
# §6: "下例全部是布局示意，不是实时测量。实现后的预览必须带 SAMPLE 标识与源数据。"
# So every scenario carries a `source` line that says where its shape came
# from, and the card renders that line. The distinction the `source` field is
# making:
#
#   * `measured` — the shape was taken from this node and the numbers are this
#     node's. `mixed_alerts` is one of these: the three events below are three
#     real rows out of the live register, and the omission counts are the live
#     counts.
#   * `constructed` — the situation has not occurred here, or has not been
#     captured, and the document was written to exercise a path. These are the
#     ones a reviewer should read as "the card would look like this", not "the
#     node looks like this".
#
# A constructed scenario is not evidence that the path works. The tests are
# what assert behaviour; these are what a person looks at. Both exist, and
# neither substitutes for the other.
schema: serveros/card-scenarios.v1

# The `at` every scenario is rendered against. Fixed rather than "now", so that
# a preview is reproducible and a duration printed on a card can be checked by
# hand against the timestamps in the same document.
#
# The SHAPE is the live digest's, deliberately: `serverosctl alert digest --json`
# publishes `at` as an ISO-8601 instant with an offset, and this fixture is
# built from that output. An earlier revision of this file wrote it as
# "2026-09-20 14:20:00 JST" — readable, unparseable, and the first thing it did
# was make every duration on every preview read 未知, which looked like a
# renderer defect and was a fixture defect. A fixture that is easier to read
# than the thing it stands in for is a fixture that tests the wrong thing.
#
# The offset is the instance timezone (+08:00), which is the one the rows below
# are measured in: they carry `+00:00` because that is what the producers write,
# and this line is what a person set. So the stamp on every preview reads the
# same 14:20 this line says, and the durations can be checked by hand against
# the row timestamps in the same document.
at: "2026-09-20T14:20:00+08:00"
device_ref: device:tokyo-shared-dev-01

# The instance's business calendar, copied value-for-value from this node's own
# `~/.serveros/business-calendar.yaml` (imported and checked 2026-09-26 22:52);
# this is that file without its commentary, which lives there and is not
# repeated here.
#
# WHY IT IS DOCUMENT-LEVEL
# ------------------------
# A calendar is not a scenario's variable. It is one fact about this machine,
# and the status cards below are three pictures of the same instance on the same
# day. Written per scenario it would be the same forty lines three times, and
# the second copy is the one that goes stale.
#
# It is a DECLARATION and not a schedule. The sentence the card prints — «which
# day, which window, which tick» — is computed from it by
# `business_calendar.routine_window()`, the same function the live path calls. A
# fixture that wrote that sentence by hand would be readable prose asserting
# what its author believed the producer says, which is the one thing a fixture
# may not do.
#
# One value is worth naming: 2026-09-20 is a Sunday, and it is a declared
# WORKDAY here — an official 调休 shift. The document-level `at` lands on it, so
# the «workday» on these previews is derived from a declared make-up day rather
