  # -- the escalation, which is the only path to a red card ----------------
  #
  # WHY THIS ONE EXISTS ON TOP OF THE FOUR THE CRITERIA NAME
  #
  # AC18–AC21 do not ask for it, and without it nothing in this file renders
  # red. The attention axis made that true: colour follows ATTENTION, and every
  # code the criteria name is REVIEW. ACTION_REQUIRED is reached one way only —
  # `alerts.attention.escalation`, a `declared` expectation whose subject
  # resolves to a registration with `criticality: critical` — so a set of
  # previews with no such case is a set that never shows a reader the card this
  # round exists to make trustworthy. The path most likely to be wrong is the
  # one nothing renders.
  - name: critical_service_failed
    card: alert
    title: 声明为 critical 的服务探针失败
    source: measured — 登记表与主体拼写都取自本节点：serveros-control-plane 确实
      以 criticality critical 注册，而实测的 FUNCTIONAL_PROBE_FAILED 行的
      subject_ref 就是裸资源 id（见下方注释）。severity 与首次观测是示例值。
      这一张说明注意力升级：同一条 code 在未注册的主体上是「需确认」（橙），
      在一个声明为 critical 的登记资源上变成「需处理」（红）。颜色差来自
      登记表里的声明，不来自严重度。
    digest:
      counts: {new: 1, escalated: 0, reopened: 0}
      severity_counts: {high: 1}
      more: 0
      backlog: 0
      silent_resolutions: 0
      rows:
        - key: alert:fixture0000001001
          kind: NEW
          code: FUNCTIONAL_PROBE_FAILED
          severity: high
          severity_word: CRITICAL
          # The bare spelling, and it is not a shortcut. `serverosctl alert list`
          # on this node returns `subject_ref: "container0-litellm"` with
          # `resource_ref: null` for this code — a registered resource whose
          # subject carries no prefix and no back-reference. A fixture that
          # wrote `runtime:container:...` here would exercise an index key the
          # live register does not produce, and the escalation rule would look
          # like it worked.
          subject_ref: "serveros-control-plane"
          resource_ref: null
          first_seen: "2026-09-20T05:44:00+00:00"
          resolved_at: null
          occurrence_count: 4
          state: OPEN
          owner: null
          provenance:
            freshness: FRESH
            source: serverosd
            observed_at: "2026-09-20T05:58:00Z"
    registry:
      schema: serveros/managed-runtime-registry.v1
      device_ref: device:tokyo-shared-dev-01
      resources:
        - id: serveros-control-plane
          kind: systemd-user-service
          desired:
            state: running
          # This one word is what turns the level. It is a declaration in a
          # registration, which is the only thing the escalation rule reads —
          # not the severity of the event, and not the word "plane".
          criticality: critical
          probes:
            - id: serverosd-unit-state
              kind: systemd-unit-state
              axis: liveness
              unit: serverosd.service
            - id: serverosd-socket
              kind: socket-connect
              axis: transport
              path: /run/user/1002/serveros/serveros.sock

