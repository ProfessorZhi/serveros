  # -- AC 18–21: the four situations the acceptance criteria name -------------
  #
  # These four are one set and they are only meaningful together. Each of the
  # first three is a case that MUST reach the card; the fourth is a case that
  # must NOT, built from the same shape of evidence as the third. A suite that
  # had only the first three could be satisfied by a rule that raised
  # everything, and the fourth is what makes that rule fail.
  #
  # `attribution` and `registry` are the REAL documents, trimmed to the fields
  # the name resolver reads — the shape is `serveros/attribution.v1` and
  # `serveros/managed-runtime-registry.v1`. They are documents and not a
  # pre-built index on purpose: a hand-written `names:` block would let a
  # preview show a readable name while proving nothing about whether
  # `presentation.name_index` can produce one from evidence.

  - name: pressure_boundary
    card: alert
    title: 资源压力越线
    source: constructed — 本节点内存当前远未到阈值。这一张用 MEMORY_PRESSURE
      说明「一个测量越过为它自己写的阈值」在卡上的样子：它必须能打断人，且
      不必读代码、不必展开任何东西就知道越线的是哪个对象。与 one_critical 用
      不同的 code，是为了让两张预览各自证明一件不同的事，而不是同一张卡印两遍。
      三个头条数字是实测的：本机记录里只有一条 MEMORY_PRESSURE 行
      （runtime/alerts/ledger.json 的 alert:b365d49b09ee39b6，2026-10-02
      00:01:35 北京开、00:05:35 关），97.3% / 阈值 90.0 / 总量 265182715904
      与 resource_ref 为 null 四条与它相符。登记表按 identity 每个 subject 只留
      一行，所以这棵树写作时引的那次 2026-09-29 读数今天已取不回来 —— 不等于
      它没发生过，只等于它不可复核，而不可复核的出处不该写成一条承诺。
      下面的字节数（258050740224 + 7131975680 仍等于同一个总量）、first_seen、
      observed_at、occurrence_count 与 severity 都是示例值：那一条 episode 的
      两个字节数是 258005381120 / 7177334784，与这里各差 45,359,104 字节。
      severity 取 high 而不是 medium，是因为这一张要证明它**能打断人** ——
      卡首的 🚨 是这一张存在的理由，不是对某一次事件的转述。
    digest:
      counts: {new: 1, escalated: 0, reopened: 0}
      severity_counts: {high: 1}
      more: 0
      backlog: 113
      silent_resolutions: 18
      rows:
        - key: alert:fixture0000000d01
          kind: NEW
          code: MEMORY_PRESSURE
          severity: high
          severity_word: CRITICAL
          subject_ref: "host:memory"
          # null, and by measurement rather than by choice: `alerting.
          # resource_ref` returns a ref only for `filesystem:` / `runtime-group:`
          # / `container:` / `runtime:` / `tunnel:` subjects, and the live
          # register's `host:memory` row carries `resource_ref: null`. This line
          # used to read `"host:memory"`, which is a state the resolver cannot
          # produce — a fixture describing a card that would never be built.
          resource_ref: null
          first_seen: "2026-09-20T04:05:00+00:00"
          resolved_at: null
          occurrence_count: 4
          state: OPEN
          # No owner: `_owner_of` reads `measured.ownership`, which the
          # detector that raises this code does not write. Live register:
          # 0 of this code's rows carry one.
          owner: null
          # The measurement, without which this card prints "no measurement"
          # and the scenario named 资源压力越线 shows a card with no number on
          # it. `presentation._for_detail` rebuilds `measured` from the row's
          # own fields, so a digest row that omits them renders as a code with
          # nothing measured — which is what this one did until the numbers
          # below were added.
          #
          # 键只留生产者投影里真的有的那几个：`available_bytes` /
          # `available_percent` 写在这里是合法的，因为
          # `alert_digest.MEASUREMENT_FIELDS` 收着它们 —— 那是本轮水位/压力
          # 分家加进去的，`_row_of` 按这张白名单逐个搬运。加白名单之前它们
          # 会被 `TheFixturesSpeakTheProducersVocabularyTests` 当场挡下，
          # 那条测试的名字就是这条规则（fixture 只许说生产者会说的话）。
          used_percent: 97.3
          threshold_percent: 90.0
          used_bytes: 258050740224
          total_bytes: 265182715904
          available_bytes: 7131975680
          available_percent: 2.7
          provenance:
            freshness: FRESH
            source: host-memory
