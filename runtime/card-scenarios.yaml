  # -- AC 18–21: the four situations the acceptance criteria name -------------
  #
  # These four are one set and they are only meaningful together. Each of the
  # first three is a case that MUST reach the card; the fourth is a case that
  # must NOT, built from the same shape of evidence as the third. A suite that
  # had only the first three could be satisfied by a rule that raised
  # everything, and the fourth is what makes that rule fail.
  #
  # `attribution` and `registry` are the REAL documents, trimmed to the fields
  # the name resolver reads — the shape is `serveros/attribution.v1` and
  # `serveros/managed-runtime-registry.v1`. They are documents and not a
  # pre-built index on purpose: a hand-written `names:` block would let a
  # preview show a readable name while proving nothing about whether
  # `presentation.name_index` can produce one from evidence.

