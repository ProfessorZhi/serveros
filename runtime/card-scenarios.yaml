# §3.4 / §13 第四块「当前问题」的登记表读数 —— 注意这里是**行**，不是计数。
# 块首那句「N 项需要处理」和折叠前那句「登记表里还有 N 项」全部由
# `alert_digest.current` 从下面这些行算出来，与当天卡同一条规矩：fixture 不许
# 自己写下一句判据的结论，否则预览就成了作者相信契约会说的话。
#
# 为什么这一块在文档层：本节点此刻有什么问题，和日历一样是**这一台机器的一个
# 事实**，不是某一张卡片的性质。某一幕要看非空的卡面，就在那一幕自己带一份。
#
# 下面四行取自本节点 2026-10-04 09:31Z 那一刻的真实登记表。那天 13,209 行的
# 登记表里有 1,357 条 state 为 OPEN：1,101 条 WATCH（HIGH_MEMORY_SUSTAINED
# 1,035 + HIGH_CPU_SUSTAINED 65 + DISK_WARNING 1）、256 条 INFORMATIONAL
# （AGE_WITHOUT_ACTIVITY 122 + EXTERNAL_SYSTEM_PROCESS_TREE 48 + 其余四类），
# 而**没有一条的 code 在注意力表上**。所以这一块在本机今天真实的样子，就是
# 这张 fixture 渲染出来的样子：绿色的「没有需要处理的问题」，加一句说明登记表
# 里还有多少条在下面那一档。它不是「一切正常」，是「按契约算得上当前问题的一
# 条也没有」——这两句在登记表非空时不是同一件事，§3.4 那一整段就是为它写的。
#
# **计数是缩减的，判据不是。** 这份 fixture 每个 code 只抄了一条真实行，所以
# 预览印的是「还有 4 项」而不是 1,357。缩减的是行数；哪一档算当前问题、哪些
# code 上卡面、哪些不上，全部由 `alert_digest.current` 按
# `alerts.attention.on_the_face` 算出来，这里一个字都没写死。
#
# 日期是这些行**真实的** first_seen / last_seen。它们晚于本文件的 `at`（09-20）
# 而这不是错：`at` 是**渲染时刻**，决定当天时间线的时区与时刻；登记表读数是它
# 自己那一次采集。与 `reads:` 同例 —— 那一份资源读数是 2026-09-30 15:55 的。
# 这四行都在卡面之下，所以它们的时刻不会被印成任何一句时长；唯一会读它的是
# 计数。
problems:
  # WATCH 那一档里最多的那一类，也是本机 09-21 起那批「没人再看过的 held 行」
  # 的真身：hold_kind 为 unmeasured，last_seen 停在开火那一刻。
  - alert_ref: alert:07fc4bb3e1124642
    code: HIGH_MEMORY_SUSTAINED
    subject_ref: "runtime-group:process-tree:system.slice:docker:edyl7bsgsw8qhqppj7iqviuhw"
    severity: medium
    state: OPEN
    hold_kind: unmeasured
    first_seen: "2026-09-16T08:58:24.628701+00:00"
    last_seen: "2026-09-16T08:58:24.628701+00:00"
    occurrence_count: 1
  - alert_ref: alert:0104944f629de1c3
