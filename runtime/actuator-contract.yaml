  - id: release-verifies-with-the-shipped-interpreter
    kind: unresolved_argv
    verb: <argv0>
    why: >-
      `subprocess.run([sys.executable, str(entry), "--help"])` in
      `scripts/release.py`'s `verify_node_runtime`, the check that a staged
      revision is runnable before anything points at it. The scanner reads
      neither `sys.executable` nor `str(entry)`, so the argv is reported rather
      than assumed; what it cannot show is the part that matters, which is that
      `entry` is `rev_dir / "bin" / "serverosctl"` — the revision's OWN entry
      point, one component under the directory being verified, evaluated by the
      interpreter running this script. The probe imports the revision and prints
      help. It writes nothing: `PYTHONDONTWRITEBYTECODE=1` is passed precisely
      because this probe imports the revision's modules and would otherwise
      leave `__pycache__` inside the artifact it is checking, and `fingerprint`
      runs after it.
      The name was `verify_revision` until the release path learned that a
      revision can be an artifact of more than one kind: `verify_revision` is
      now the dispatcher that picks a verifier from the artifact's declared
      kind, and the subprocess lives in the `node-runtime` verifier it selects.
      The PLUGIN verifier runs no subprocess at all — it reads manifests,
      compares them against the composition, and hashes the payload — so there
      is no second call site to declare. A plugin release therefore does not
      need `serverosd` to be verified, which is the whole reason the two
      verifiers were separated.
    sites:
      - {file: scripts/release.py, symbols: [verify_node_runtime]}

  - id: architecture-check-invokes-reused-checkers
    kind: unresolved_argv
    verb: <argv0>
    why: >-
      `subprocess.run([sys.executable, str(script), *argv])` in
      `skills/serveros/scripts/architecture_check.py`'s `run_reused`. This is
      the "invoke, never reimplement" rule made executable: the architecture
      gate runs the existing checkers — `validate_contract.py`,
      `runtime_truth.py`, `map_check.py`, this scanner — and reads their JSON
      rather than growing a second parser that could disagree with them. `script`
      is a path the caller resolved from the fixed revisions root and `argv` is
      the flag list for that checker; both are the gate's own arguments, so
      nothing a resource declares can steer the command. The `*argv` is why the
      argv is partially read here and fully read at each checker's own entry
      point, which is where this scanner finds its literals.
    sites:
      - {file: skills/serveros/scripts/architecture_check.py, symbols: [run_reused]}

  - id: workbench-runs-the-product-entry-point
    kind: unresolved_argv
    verb: <argv0>
    why: >-
      Four `subprocess.run(<expr>)` sites in `runtime/workbench.py` —
      `run_full`, `out`, `_answers_moved`, and `_families` — where the argv is
      built rather than written: `run_full`/`out`/`_answers_moved` go through
      `argv_for`, which turns the recorded form `serverosctl ...` into
      `[sys.executable, str(ENTRY), ...]`, and `_families` runs
      `[sys.executable, str(script), "--stdout"]` on the ability-management
      clone named by `--ability-repo`. The scanner reads neither
      `sys.executable` nor a `str(...)` of a path, so each argv is reported
      rather than assumed.
      What it cannot show is the part that matters, and the module states it as
      a rule rather than a habit: EVERY COMMAND A BUILDER RUNS IS READ-ONLY.
      That is not a convention — `--check` re-runs precisely these calls, so a
      builder that wrote would make the check itself a mutation. `ENTRY` is
      this revision's OWN `bin/serverosctl`, resolved once at import from the
      directory holding this file, so a render cannot reach a different
      `serverosctl` than the one that produced it; the commands are literal
      tuples in the builders (`device show`, `card status`, `work board`,
      `requirement board`, `ability tree`, `taxonomy tree`), and `_families`
      reaches the renderer ability-management owns rather than reimplementing
      it — §18, at the one place a copy would have been tempting.
      `_answers_moved` is the same call one step removed: it re-runs what a
      document recorded, which is why the recorded form is the `serverosctl`
      form and not an absolute path.
    sites:
      # The verb is overridden per site because the scanner reads these two
      # groups differently and the difference is a fact about the checker, not
      # about the code. `argv_for(...)` is a CALL, so the scanner reports the
      # callee it could not resolve (`subprocess.run`) — the argv is one hop
      # away, behind a helper that is where the `serverosctl` literal is read.
      # `_families` writes its argv inline, so the scanner gets as far as
      # seeing that the first word is an unknown expression and reports
      # `<argv0>` there. Declaring one verb for both would make one of the two
      # rows stale the moment the checker learned to read one of the shapes.
      - {file: runtime/workbench.py,
         symbols: [run_full, out, _answers_moved], verb: subprocess.run}
      - {file: runtime/workbench.py, symbols: [_families]}

  - id: workbench-asks-the-quay-provider
    kind: exec
    verb: node
    why: >-
      `subprocess.run(["node", str(Q), *args, "--json", "--root", str(ws)])`
      in `runtime/workbench.py`'s nested `doc_quay.q`, the one place this
      repository runs a command that is not its own entry point. `Q` is the
      Quay CLI resolved from the pinned Quay worktrees and `ws` is the Quay
      workspace under `--quay-run`; both are read-only queries of a provider's
      goal store — `goal list`, `goal show`, `task list` — and the section is
      rendered from their JSON. Quay is a Provider and not Core (§C): ServerOS
      asks it what its goals are and does not keep a second copy of the answer,
      which is why this is an `exec` reaching outside the revision rather than a
      read of a ServerOS store. The verbs are a literal list in `doc_quay`; a
      Quay verb that writes is not among them, and the provider's own `--root`
      is pinned to the workspace it was given.
    sites:
      - {file: runtime/workbench.py, symbols: [doc_quay.q]}

  - id: release-installs-the-daily-render
    kind: exec
    verb: systemctl
    why: >-
      `subprocess.run(["systemctl", "--user", *args])` in `scripts/release.py`'s
      `cmd_daily_task` — the FIRST of the two systemd actions whose timer can be
      armed and is NOT armed by default; the second is `cmd_evening_brief`, added
      2026-10-08 and declared in its own entry above. Installing
      the unit and arming the timer are two separate invocations, and the
      default polarity is deliberately the opposite of `cmd_alert_worker`'s
      `--no-enable`: a delivery worker that sends nothing is a worker nobody
      notices, while a nightly render that starts running before anybody has
      chosen where it writes is a job that reports success into a directory
      nobody opens. So `daily-task` refuses to install without an explicit
      `--out`, and prints the two commands that arm it rather than arming it.
      Like the rest of the five it is reachable only by a person running the
      release CLI: not from the daemon, not from the MCP layer, not from an
      observation path, and not from any Run.
    sites:
      - {file: scripts/release.py, symbols: [cmd_daily_task]}

  # ---------------------------------------------------------------------
  # `runtime/bounded_invocation.invoke_once` — the fabric's only bounded
  # executor, and the two reaches it needs to be one: it spawns argv it was
  # handed, and it kills the process group it created. They are declared as
  # two capabilities rather than one because a reviewer's two questions are
  # different — "what may it run" and "what may it kill" — and an entry that
  # answered both in one paragraph would be answering one of them by
  # implication.
  #
  # Both entries name the same caller, and until 2026-09-26 they said the same
  # uncomfortable thing instead: this call site had no production consumer, and
  # `tests/test_bounded_invocation_paths.py` was its only caller in the tree.
  # It is declared rather than deleted because the alternative — a module the
  # scanner cannot see — is the failure this file exists to prevent, and
  # because the daily loop it was written for is the thing this round is
  # trying to reach. That consumer now exists and is named in each `why`; what
  # does NOT exist yet is a scheduler, so the reach is live and unarmed.
  # ---------------------------------------------------------------------
  - id: bounded-invocation-runs-a-supplied-argv
    kind: unresolved_argv
    verb: subprocess.Popen
    why: >-
      `subprocess.Popen(argv, cwd=cwd, stdin=<regular file>, stdout=PIPE,
      stderr=PIPE, start_new_session=True)` in `invoke_once`. The scanner
      reports it because the argv is the function's first parameter and cannot
      be resolved statically; what it cannot show is everything that makes the
      reach narrow, so it is written here. The caller is a trusted, configured
      adapter that supplies BOTH the argv and the private receipt directory,
      and there is now exactly one: `runtime/cli.py#cmd_work_dispatch`, reached
      as `serverosctl work dispatch <cycle> -- <command>`. It supplies the argv
      a person typed, the working directory and the receipt directory named on
      that command line, and NOT the action key or the bounds — those come off
      the admission the cycle holds, so a dispatch cannot run under a key or a
      budget the cycle was not admitted with. The module's own docstring says
      it "neither authenticates a grant nor sandboxes commands", and that is
      the design rather than a gap: the authorization question belongs to the
      fabric's admission layer, and this
      function's job is to make a spawned command bounded and idempotent. The
      bounds are real and are the reason the reach is worth granting at all:
      the receipt is written and fsynced as `STARTED` BEFORE the spawn, so a
      crash in the window between them is visible rather than absent; the
      action key is a 100-character `[a-zA-Z0-9_-]` token; a second call with
      the same key and a different input digest raises instead of running; that
      key's receipt lock is taken with `LOCK_NB`, so a call that finds another
      dispatch inside it is refused by name instead of waiting — the lock is
      held across the whole life of the command it guards, and a wait there
      would freeze one scope for another one's wall budget to receive an answer
      the digest check already had (since 2026-09-26; the wait was real, and it
      is J07's fifth criterion); the
      output of each stream is capped at `max_output_bytes` by the reader; and
      the deadline is enforced by the same loop that drains the pipes, so a
      child that never writes cannot outlive its timeout.
      HOW FAR THE CALLER CAN BE REACHED, which is the part a reader cannot get
      from the code: the verb is on the CLI only. It is not in the daemon, not
      in the MCP layer (`mcp/node_mcp.py` names the daemon verbs it exposes and
      this is not one of them), not on any observation path and not in a Run;
      `scripts/release.py` is the only other place this repository puts a
      spawned command behind a person, and it does it the same way. So the
      sentence this entry replaced — that no production caller existed at all —
      was true until 2026-09-26 and is now false, and what replaced it is
      narrower than "it has a caller": it has one, it is a person's command
      line, and nothing schedules it yet. The daily loop it was written for is
      still the thing this round is trying to reach.
    sites:
      - {file: runtime/bounded_invocation.py, symbols: [invoke_once]}

  - id: the-cli-is-run-from-one-place
    kind: unresolved_argv
    verb: subprocess.run
    why: >-
      `subprocess.run(argv, capture_output=True, text=True, timeout=timeout,
      cwd=cwd)` in `runtime/document_transport.py#run` — one function, now five
      call shapes, and the argv is the function's parameter, so the scanner
      reports it rather than reading it. The scanner cannot resolve the argv for
      the reason its own docstring gives: `LARK_CLI` is the module constant
      `"lark-cli"`, named instead of assumed on PATH so a host without it fails
      with a sentence rather than a `FileNotFoundError`. So what is fixed is
      what the binary is ASKED TO DO, and what varies is which binary answers.

      The document half is four shapes and is the same four the publish module's
      contract names: `docs +fetch` (a document's blocks and revision with ids),
      `drive +member-list` (its membership), `docs +update` (replace or insert
      one section's body, with `--revision-id` passed through so the service's
      own currency check runs as well as the caller's), `docs +media-insert`
      (one local file). The fifth is the message half and lives in
      `runtime/message_transport.py`: `im +messages-send --as bot --user-id|
      --chat-id … --markdown … --idempotency-key …`, which is how a period
      report reaches a person.

      **The fifth shape is why this entry's name is about `run` and not about
      documents.** That module does not grow its own subprocess call: it loads
      this one by path and borrows `run`. The rule it is borrowing is not the
      invocation — it is the envelope check, which is that a write command's
      success is `ok: true` and not `code == 0`, a distinction the CLI's own
      shared documentation names as the dangerous mistake. Two copies of that
      rule would be two places to get it wrong, and a mutation in one would
      leave the other looking alive; so there is one, and both surfaces go
      through it. The cost is that this declaration covers argv shapes built in
      a second file, which is stated here rather than left to be inferred.

      Neither caller holds a credential or reads one. Both run an
      already-authenticated CLI and pass through what it returns. `cwd` is passed
      by exactly one caller, `media_writer`, and it passes the SOURCE FILE's own
      directory, because the CLI reads a local path only if it is under its
      working directory, `/tmp` or `~/files` — this host's policy puts temp files
      under the artifacts root and does not create `~/files`, so the default
      working directory would refuse every media file this path is allowed to
      send. A caller who can name a path can name one in that directory, so the
      narrowing is not lost by moving.

      The separation is the point rather than an accident of layering:
      `space/resolver.py` carries the lesson in its own header — a kernel
      primitive that learns one tenant's cloud paths stops being a kernel
      primitive. `intake/document_publish.py` and `runtime/report_delivery.py`
      hold the disciplines and know nothing about how a document or a message is
      reached; these two transports are the halves that do.
    sites:
      - {file: runtime/document_transport.py, symbols: [run]}

  - id: engineering-executor-owns-its-containers
    kind: unresolved_argv
    verb: subprocess.run
    why: >-
      Three `subprocess.run` sites in `runtime/bounded_executor.py` — one in
      `_run`, two in `_worker` — and the scanner reports them for the reason it
      reports the two entries above: the argv is built by `_docker(config)` and
      `create_argv(config)`, so it cannot be resolved from the call. What the
      call cannot show is that the argv is not a CALLER's, and that is the
      whole of what this entry states.

      `_docker` is `[/usr/bin/docker, --host unix:///var/run/docker.sock,
      --config <private>/docker-config]`: the binary is absolute and the
      transport and credential config are named rather than inherited, so no
      `DOCKER_HOST` in the environment and no credential helper on this host's
      `PATH` can redirect the invocation to another daemon. `_run` is this
      module's only way to speak to docker, and the verbs it is ever given are
      `inspect`, `image inspect`, `kill`, `rm`, `create` and `start`. Every one
      of them names a container whose name is derived here — `serveros-exec-`
      plus the SHA-256 of the receipt root, the action key and the caller's key
      — rather than one a caller supplies.

      What the containers may then do is a list rather than a promise, and it
      is in `create_argv`: `--pull=never`; an image that is a pinned LOCAL
      image ID (`binding` requires `sha256:` and 64 hex characters, and the
      `image inspect` in `_worker` refuses if the ID changed or if the image
      declares implicit volumes); `--network=none`; `--read-only`;
      `--cap-drop=ALL`; `--security-opt=no-new-privileges`; `--pids-limit`,
      `--memory` with `--memory-swap` equal to it, and `--cpus`, each an
      integer inside a range `binding` enforces; `--log-driver=none`; exactly
      two `--mount`s — the worktree at `/workspace` and this invocation's
      private artifact directory at `/artifacts`, both of them refused earlier
      if the path is not absolute, not real, or holds a comma; and a 64 MiB
      `nosuid,nodev` `tmpfs` on `/tmp`. The container's own argv is data handed
      to a `python3 -I -c` bootstrap, so it is a program to run INSIDE the
      boundary and not an option to it.

      Stopping is bounded for the same reason starting is, and that is why
      `kill` and `rm` belong to this entry rather than to a teardown entry
      which would imply they are unconditional: `_settle` reads the container
      back, refuses to act unless the `serveros.executor` label equals this
      invocation's identity, and reports `worker_stopped: false` with
      `effect: UNKNOWN` rather than claiming a stop it cannot see. An
      invocation that is uncertain is never launched again under the same key.

      HOW FAR THE CALLER CAN BE REACHED: `execute` is the operation
      `continuation.execute` in `runtime/continuation_control.yaml`, whose
      owner field names this module, and its one caller is the MCP continuation
      adapter. The adapter checks admission first, then `binding`, which
      refuses unless the grant carries an `engineering` binding of schema
      `serveros/engineering-binding.v1`, lists `engineering.execute` in its
      actions, includes this Item, names ONE project worktree at least two
      segments under the worktrees root, and both the envelope's and the
      checkpoint's declared write scopes contain it, with a non-root uid.
      Between `binding` and `execute` the adapter also refuses a worktree that
      contains the adapter itself, its envelope, its receipts or the authority
      store. `execute` then re-checks its own inputs: the key's alphabet and
      length, the container argv's bounds, a positive bounded budget, and a
      receipt root outside the writable worktree. It is not a CLI verb and not
      a daemon verb.

      The site is declared here rather than in the round that wrote it
      (`795df9c`); the RUN-0004 attribution is where the gap was measured, and
      the guard's run of 2026-10-07 is the one that named it.
    sites:
      - {file: runtime/bounded_executor.py, symbols: [_run]}
      - {file: runtime/bounded_executor.py, symbols: [_worker]}

  - id: bounded-invocation-kills-the-group-it-created
    kind: process_termination
    verb: os.killpg
    why: >-
      The three `os.killpg` calls in `invoke_once` — the SIGTERM and SIGKILL
      pair on a timeout or output-limit breach, and the SIGTERM in the
      `finally` that covers `START_FAILED` and `IO_FAILED`. §26 permits a
      teardown of what you started, and this is that: the process is one this
      function created one screen earlier with `start_new_session=True`, and
      the pid comes from the `Popen` object rather than from the process table,
      so the worst case is signalling a group that has already exited —
      `ProcessLookupError` is caught at each site for exactly that reason. The
      group is killed rather than the direct child because the direct child is
      not the whole command: a shell that has backgrounded work leaves a
      grandchild holding the pipe, and killing only the child would make the
      timeout a lie — the caller would return `TIMED_OUT` while the work it
      timed out went on running. `tests/test_bounded_invocation_paths.py`
      asserts that property with a real `sleep 3; touch` that must never
      create the file.
      The caller is the same one the entry above names, `serverosctl work
      dispatch`, and it is worth saying what that means for THIS reach rather
      than leaving it to the sentence above: the kill is now something a
      person's command can ask for, by dispatching a command that runs longer
      than the reservation's `wall_seconds` or writes more than its
      `max_output_bytes`. Both bounds are the admission's and neither has a
      flag, so the worst a caller can do is spend the budget their own cycle
      was admitted with — and the process group that dies is the one this
      function created one screen earlier. The `STARTED` receipt it writes
      first still means a caller that finds one must reconcile the effect
      rather than re-run: the timeout path records `effect: UNKNOWN` with the
      reason that no automatic retry is permitted, and `work dispatch` reports
      that reason verbatim rather than turning it into a status.
    sites:
      - {file: runtime/bounded_invocation.py, symbols: [invoke_once]}

  # ---------------------------------------------------------------------
  # §12's screenshot producer — `runtime/card_shots.py`. It is in this table
  # because it is in the tree, not because it is on a path anyone but a person
  # runs. Stated once here so that the three entries below can each be about
  # their own reach: the module is invoked as
  # `python runtime/card_shots.py --renderer <tree> --out <dir> --label after
  # --run-ref <ref>`, it has no daemon, no timer, no unit, no MCP verb, no CLI
  # subcommand and no caller in this repository, and the only thing that
  # imports it is `tests/test_card_shots.py`. It sends nothing, to anyone: the
  # renderer it drives reaches no transport, which is checkable rather than
  # asserted — the import surface of `card_scenarios`, `cards` and
  # `presentation` is importlib/json/pathlib/re/datetime/yaml and no module in
  # that closure imports `message_transport` or `document_transport`.
  #
  # It is declared rather than deleted for the reason the header gives: an
  # exemption written once must not silently keep covering a file that has
  # since grown a second call site. This file grew five at once, and the
  # mutation guard's own run is what said so.
  # ---------------------------------------------------------------------
  - id: card-shots-drives-a-headless-browser
    kind: unresolved_argv
    verb: "<argv0>"
    why: >-
      `subprocess.run(command, capture_output=True, timeout=self.timeout)` in
      `Chrome._run`. The scanner reports it because `command[0]` is
      `self.binary` — the path to a browser, not a literal — and everything the
      scanner cannot read is written here instead. The `verb` above is the
      placeholder for exactly that and not for a command nobody can see: the
      scanner read this argv in full, flag by flag, and stopped at its first
      word. An entry whose verb is a bare `<argv0>` is the narrower kind of
      gap, and the paragraphs below are what close it. The binary is a
      parameter
      with the default `/opt/google/chrome/chrome`, and it is a parameter for a
      measured reason the class docstring records, re-measured 2026-10-07:
      the Playwright Chromium on this node does not finish either mode —
      `--dump-dom` and `--screenshot` both sat at a 60s bound with nothing on
      stdout and no file written, against 0.27s for the system Chrome on the
      same argv — and the persistent browsers the MCP server attaches to
      (9222/9223) are this account's processes but carry other sessions' pages.
      `--chrome` is how a person names a different one; nothing in the tree
      passes it, and the tests that drive this file hand in a recording
      stand-in rather than a browser.
      WHAT IT IS ASKED TO DO is fixed and short, and it is the whole of the
      reach: `--headless=new`, `--screenshot=<a path the caller supplies>` or
      `--dump-dom`, and a single `file://` URL. The URL is built by this module
      from its own wrapper page under the caller's output directory, with the
      scenario name and viewport as query parameters; no URL is taken from
      anywhere else and there is no mechanism here to fetch one.
      One flag is a genuine widening and is named rather than buried,
      `--allow-file-access-from-files`: framing needs to read the framed
      document's geometry across a `file://` boundary, and without the flag the
      pan does not happen and the shot is the blank area below the card. It
      widens the browser's access to `file://` documents, and the browser is
      given `--user-data-dir=<out_dir>/_chrome-profile` — a fresh profile in
      the caller's own output directory, not a shared or personal one — so what
      it can read is the previews this same run just rendered. There is no
      network in the picture: no scenario URL is remote, and nothing is
      downloaded.
      The failure mode is an exception and not an empty picture, which matters
      for the same reason the shrink rule in this table's header does: a hung
      browser and a page that rendered nothing leave the same thing in a
      directory listing. `TimeoutExpired` is re-raised as a `RuntimeError` that
      says the round does not count.
    sites:
      - {file: runtime/card_shots.py, symbols: [Chrome._run]}

  - id: card-shots-asks-a-revision-what-it-renders
    kind: unresolved_argv
    verb: "<argv0>"
    why: >-
      Two `subprocess.run` sites, reported for the same reason as the entry
      above and answering a different question: `sys.executable` is the
      unresolved `argv[0]`, so the verb the scanner read is `<argv0>` and the
      argv past it is a literal. What varies is which interpreter answers — so
      the reach is best stated as what is asked of it. `_scenario_names` runs a
      one-liner that imports a tree's `card_scenarios` and prints the scenario
      names it declares; `_render` runs that tree's `card_scenarios.py --out
      <dir>`. Both take `cwd=<that tree>`.
      This is the one place in this repository that executes another
      revision's code, and it is deliberate: it is the mechanism of §12's A/B.
      The baseline side is `worktrees/serveros/card-measurement-20260929`, and
      the reason it must be that tree's interpreter and that tree's module is
      the failure `card_shots`' own docstring records: `card_scenarios` caches
      its siblings in `sys.modules` by fixed name, so loading two revisions in
      one process renders both sides with whichever one arrived first and
      raises nothing. One process per side is what makes "Before" the baseline
      rather than the work in progress.
      WHAT THAT IMPLIES, stated plainly because it is the sentence a reviewer
      wants: the code being run is a checkout at a pinned revision whose
      HEAD `f7a446a` is recorded in the run manifest before any picture is
      taken, it is read from disk and never modified (the same module's
      `_revision` reads it with `GIT_OPTIONAL_LOCKS=0`, declared under
      `read-only-git-queries`), and the argv after `sys.executable` is a
      literal script or a path composed from `--renderer`. No scenario name, no
      path and no flag reaches these two calls from a caller who could point
      them elsewhere.
    sites:
      - {file: runtime/card_shots.py, symbols: [_scenario_names, _render]}

  - id: card-shots-clears-the-frame-it-is-about-to-write
    kind: fs_mutation
    verb: ".unlink()"
    why: >-
      `out.unlink()` in `Chrome.shoot`, guarded by `if out.exists()`. It is the
      one destructive call in the module and it is declared rather than argued
      away, because the honest description is not "it can only delete a file it
      wrote": the operation itself is an unconditional delete of whatever path
      it is handed, and the narrowing lives one level up.
      The narrowing is real. `Chrome.shoot` has exactly one caller in the tree,
      `shoot()` in the same module, which composes the path as
      `shots_dir / f"{name}.{suffix}.png"` where `shots_dir` is
      `<out>/shots/`, `name` comes from the renderer's own declared scenario
      list and `suffix` from a module constant. So the delete reaches a PNG
      under the output directory the person named on the command line, and
      nothing else — and it is a delete rather than an overwrite because Chrome
      will write through an existing file but the previous round's picture for
      the same scenario must not survive into a manifest that says what this
      round produced. A stale shot at the right path is precisely the thing
      that would make an unframed result look framed.
      The tool is manual-only (see the section note above): no daemon, no
      timer, no MCP verb, no CLI subcommand, no scheduler, and one test.
    sites:
      - {file: runtime/card_shots.py, symbols: [Chrome.shoot]}

  - id: trust-document-mode-is-chosen-not-inherited
    kind: fs_mutation
    verb: os.chmod
    why: >-
      The third `chmod` in this table, and the only one whose REASON is the
      direction it widens in — which is why it is a third entry rather than a
      fourth site on either of the other two. `daemon-socket-permissions` narrows
      the socket the daemon just bound; `backup-restore-reapplies-the-recorded-mode`
      re-applies a mode the archive itself carries, so neither the path nor the
      mode is that function's choice. Here both are: `mkstemp` hands back 0600 —
      that is the library's creation mode, and a umask can only clear bits from
      it, never add one — so nothing in this host's configuration is what makes
      the result 0644, and this line is the only reason it is not 0600.
      That is the right mode and the module says why in its own docstring: what
      the document holds is base64-encoded PUBLIC keys, an audience string and a
      custodian, so there is no secret in it to protect — and the refusal is not
      only a docstring sentence. `_public_key_bytes`, the only path any key
      reaches this document by, raises on PEM text (`PRIVATE`/`BEGIN` in the
      value) and on any value that decodes to something other than 32 bytes,
      naming the 64-byte case as a libsodium secret key. So a private half cannot
      be in this file through this writer: it is refused by name, one function
      before the write. The direction is the fact worth stating:
      a gate that reported only the chmods that frighten it would stop being a
      gate, and a gate that could not tell a widen from a narrow would report
      this one and the socket one as the same act.
      The bound is the same one the unlink and the replace have, and one thing
      more. The path is `trust_path()`, the verifier's own constant, so no caller
      supplies it; the chmod runs on the TEMPORARY, one statement before the
      replace, so the destination never exists in the 0600 state and there is no
      instant at which a reader could open it at a mode nobody chose. What this
      entry does not claim is that the directory is equally open: `_write` creates
      an absent parent at 0700, so on a node where the parent did not already
      exist the file is reachable only by this user whatever its own mode says.
      The mode states what the file is; the directory states who can reach it,
      and those are two different questions rather than a contradiction.
      It arrived undeclared with `d029d1b` (2026-10-07) and was declared on
      2026-10-08 with the other two mutations of the same function — the same
      one-day lag the two entries above record, in a file whose whole subject is
      that a declaration layer running behind the code is the pathology.
    sites:
      - {file: context/trust_binding.py, symbols: [_write]}

  # ---------------------------------------------------------------------
  # The research-exchange protocol checker's mechanism test. It lives under
  # `research-exchange/tests/`, which is NOT the root `tests/` scope the
  # scanner inventories (`_scope_of` matches the literal prefix `tests/`), so
  # its call sites are product-scope and are declared here by name like any
  # other reach. The test asserts the checker's CLI contract — exit code 0
  # with `ok: true` for a valid packet+result, nonzero with `ok: false` for a
  # packet whose required input list is empty — by running the checker as a
  # subprocess over fixtures it just wrote into a `TemporaryDirectory`.
  # ---------------------------------------------------------------------
  - id: research-exchange-checker-mechanism-test
    kind: unresolved_argv
    verb: "<argv0>"
    why: >-
      Two `subprocess.run([sys.executable, str(script), ...])` sites in
      `PacketCase.test_cli_exit_codes` in
      `research-exchange/tests/check_packet.py`. `script` is
      `ROOT / "tools" / "check_packet.py"`: this subtree's own checker,
      resolved from the test file's location, not a caller-supplied command.
      The scanner reads neither `sys.executable` nor `str(script)`, so the
      argv is reported as `unresolved_argv` and the verb is the `<argv0>`
      placeholder, exactly as the `release-verifies-with-the-shipped-
      interpreter` and `architecture-check-invokes-reused-checkers` entries
      do. What the scanner cannot show is the part that bounds the reach:
      the remaining words are literals `--packet`, `--result`,
      `--input-revision`, and paths under the test's own
      `tempfile.TemporaryDirectory`; the checker reads JSON manifests,
      resolves relative paths, and hashes declared inputs — it opens no
      socket, writes no file, and runs no command of its own (the module's
      only `os` use is `islink`/`realpath`). The grant is therefore "run this
      subtree's own read-only verifier", not "run a command". These are
      mechanism tests in the protocol subtree, not evidence about any real
      packet.
    sites:
      - {file: research-exchange/tests/check_packet.py, symbols: [PacketCase.test_cli_exit_codes]}
