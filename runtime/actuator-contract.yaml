# Everywhere this codebase can change the world, declared once, with a reason.
#
# §18 says one fact has one producer. §26 says no code path may destroy a
# resource this round. Both are statements about a SET, and a set that is only
# ever described in prose is a set nobody can check — which is the pathology
# this project keeps finding: the declaration layer runs ahead of the data
# layer and no gate notices.
#
# So this file is the set, and `skills/serveros/scripts/mutation_guard.py` reads
# the code and checks it against this file IN BOTH DIRECTIONS:
#
#   a hit with no entry      UNDECLARED_ACTUATOR — new reachability nobody
#                            reviewed. This is the direction everyone writes.
#   an entry with no hit     STALE_ACTUATOR — a permission that outlived the
#                            code it was granted for. This is the direction
#                            everybody forgets, and it is the reason an
#                            exemption written once can silently keep covering
#                            a file that has since grown a second call site.
#
# What is in scope
# ----------------
# The shipped surface. `tests/` is scanned and reported but is not held to this
# table: §26 names fixture teardown as its exception, and a test unlinking a
# file under `tmp_path` is teardown by construction. The one rule that does
# apply to tests is that no test may invoke a mutating `docker` verb, and that
# is asserted separately — a test that runs `docker rm` is not tearing down a
# fixture, it is removing something that outlives the test process.
#
# What a `kind` means
# -------------------
#   host_reader          runs one of §18's six read commands (docker, df, free,
#                        ss, du, find). A read, and still a fact worth naming:
#                        it is what would make the MCP layer a second observer.
#   exec                 runs a command that is neither a §26 mutation nor a
#                        host read (git, pgrep, journalctl, systemctl show).
#   command_handoff      hands a command to something that is not `subprocess`.
#                        `runtime/daemon.py` builds a docker command and passes
#                        it to a runner; a scan of `subprocess` call sites alone
#                        would report that this product has no actuator at all.
#   unresolved_argv      runs a command this scanner cannot read. Not a pass and
#                        not a failure: a GAP in the checker's knowledge, and
#                        the entry's `why` is where the gap is closed by hand.
#   fs_mutation          deletes, moves, renames or replaces a path.
#   process_termination  signals a process.
#   mutation             runs one of §26's named mutating commands.
#
# The one rule with no exemption
# ------------------------------
# No entry here may cover a host_reader in `mcp/`. §18's rule is that the MCP
# layer transcribes what the daemon observed and observes nothing itself, and an
# exemption table that could grant an exception to the rule would mean the rule
# was a default. `validate()` enforces that, and it is checked even though the
# current hit list has no MCP-layer host read to declare — a rule that is only
# enforced when it is already satisfied is not being enforced.
schema: serveros/actuator.v1

# What this checker cannot see from here, stated where a reader will find it
# rather than left for the reader to discover.
coverage_limits:
  - >-
    An MCP-layer command whose executable comes from configuration is not
    statically checkable. `mcp/codex_app_server_provider.py` resolves its binary
    through `SERVEROS_CODEX_BIN` / PATH and then runs a FIXED argv
    (`app-server --listen stdio://`), so what varies is which binary answers and
    not what it is asked to do. It is declared below as `unresolved_argv`
    because the scanner reads the argv and not the environment, and this note is
    the difference between a declared gap and a silent one.
  - >-
    A command assembled from a parameter rather than a literal is reported as
    `unresolved_argv` at the site and named in the entry that covers it. Four
    exec chokepoints are declared that way. A fifth appearing anywhere is an
    UNDECLARED_ACTUATOR, because the chokepoint is the call site and not the
    file it lives in.
  - >-
    `.replace()` and `.kill()` are resolved by the argument list, not by the
    receiver's name: `Path.replace(target)` takes one positional argument and no
    keywords, `str.replace(old, new)` takes two or three, `datetime.replace(...)`
    is keyword-only, and `Popen.kill()` takes none. A call that matches neither
    signature is not reported, and a new name introduced with a different
    arity would be the way that stops being true.

# The names §18 forbids the MCP layer to run directly. Kept here as well as in
# the checker so that the rule can be read without reading Python.
mcp_layer_forbidden_commands: [docker, df, free, ss, du, find]

# How each scope is checked. The two are genuinely different questions and
# writing them here is what keeps the difference a decision rather than an
# accident of how the scanner happens to group its output.
scopes:
  - scope: product
    policy: >-
      Every live call site is declared by name in `actuators` below. A product
      call site is a permission, so it is granted one at a time and a new one is
      an UNDECLARED_ACTUATOR until somebody writes down why it is allowed.
  - scope: tests
    policy: >-
      Inventoried, not site-declared. A hundred fixture teardowns declared by
      name would be a table nobody reads, and a table nobody reads is the same
      failure as no table — so the check is inverted: the test surface is
      scanned in full, every hit is recorded, and the kinds below are forbidden
      outright rather than exempted by an entry. §26 permits a test to remove
      what the test itself created; it does not permit a test to run a command
      that changes state it did not create, and no entry can make it one.
    forbidden_kinds: [mutation]

actuators:

  # ---------------------------------------------------------------------
  # Read-only git. Twelve modules shell out to git for a revision, a tree
  # listing or a blob. Every one is a read; none writes to a repository, and
  # `GIT_OPTIONAL_LOCKS=0` is set where it matters so that not even the index
  # is refreshed. Declared as one capability rather than twelve because the
  # question a reviewer has is the same question for all twelve. (The count in
  # this sentence was already stale when the twelfth site arrived, which is
  # itself the argument for the table below being the set and this line being
  # only a summary of it.)
  # ---------------------------------------------------------------------
  - id: read-only-git-queries
    kind: exec
    verb: git
    why: >-
      Reads a revision, a tree listing or a blob. No subcommand that writes is
      reachable from these call sites, and the two that could refresh the index
      set GIT_OPTIONAL_LOCKS=0 so that a query is not a write.
    sites:
      - {file: abilities/packs.py, symbols: [pin_still_describes]}
      - {file: context/resolver.py, symbols: [_git]}
      - {file: runtime/ability_projection.py, symbols: [_git]}
      - {file: runtime/cli.py, symbols: [_ledger_revision]}
      - {file: runtime/daily_report.py, symbols: [_git]}
      - {file: runtime/workspace.py, symbols: [_git]}
      - {file: scripts/build.py, symbols: [_git]}
      # J09: `source_identity._run` is the second reader in that same file, and
      # it is the one that made `GIT_OPTIONAL_LOCKS=0` load-bearing rather than
      # decorative. `_git` above is given only `rev-parse` and `ls-tree`, which
      # cannot refresh anything; `_run` asks `status --porcelain`, which git may
      # answer by writing a refreshed stat cache into `.git/index`. Same three
      # questions, same read, and the flag is what makes it a read — so the
      # declaration is honest about WHERE the flag is needed instead of
      # claiming the whole file was already safe.
      - {file: scripts/build.py, symbols: [source_identity._run]}
      # SYS-09: `revision_of` records WHICH revision a verification ran at.
      # `git rev-parse HEAD`, one argument, no repository write — and the
      # revision is recorded for a reader, never used to decide validity, so a
      # failed or absent git is `UNKNOWN` rather than a refusal.
      - {file: scripts/verify.py, symbols: [revision_of]}
      # §12's screenshot producer asks each side which revision it photographed,
      # and it is the third `status --porcelain` site — the second one where the
      # flag is load-bearing rather than decorative. It reads a baseline tree
      # that is not this worktree's, so a refreshed index there would be a write
      # into somebody else's checkout; it sets the same flag, for the same
      # reason, and the reason is stated at the call site too.
      - {file: runtime/card_shots.py, symbols: [_revision.git]}
      # `extract_source_tree` is the one call site here that does not go
      # through `_git`: it needs the tar bytes, not the text `_git` decodes, so
      # it runs `git archive` itself and captures stdout. `archive` reads a
      # commit and writes nothing anywhere — not the index, not the worktree,
      # not the object database — so it cannot refresh what `status` would, and
      # it is the reason the tree a row is recomputed from can be the artifact's
      # own commit rather than whatever the canonical checkout stands on. What
      # it produces is written under the cache directory, which the
      # `source-cache-extraction` entry below declares. A commit this
      # repository does not have yields None rather than a fetch: a measurement
      # that reaches the network is measuring the network.
      - {file: scripts/runtime_truth.py, symbols: [_git, _git_object_at, _ability_payload_root, pin_superseded, canonical_provenance, extract_source_tree]}
      - {file: skills/serveros/scripts/architecture_check.py, symbols: [_git]}
      - {file: skills/serveros/scripts/map_projection.py, symbols: [_git]}

  # ---------------------------------------------------------------------
  # The exec chokepoints. Four of them, and the four are deliberate.
  # ---------------------------------------------------------------------
  - id: host-measurement-chokepoint
    kind: unresolved_argv
    verb: subprocess.run
    why: >-
      `runtime/probes.py` is the observation chokepoint: every host measurement
      the daemon takes goes through `LiveHost`, whose docstring states the
      read-only claim and whose injectability is what lets a test observe a
      machine it is not on. The argv is a parameter, so the scanner reads the
      chokepoint and not the command; the commands are enumerated by the
      `host-reader-commands` entry below, which covers the call sites that
      supply them.
    sites:
      - {file: runtime/probes.py, symbols: [LiveHost._run]}

  - id: inventory-measurement-chokepoint
    kind: unresolved_argv
    verb: subprocess.run
    why: >-
      `runtime/inventory.py`'s module-level `_run`. The same shape as
      `probes.LiveHost._run` and a second chokepoint on purpose: the two answer
      different questions — probes answer "is this registered runtime up",
      inventory answers "what is on this machine" — and merging them would make
      one module the producer of two unrelated facts. §18's rule is one
      producer per fact, not one producer per product.
    sites:
      - {file: runtime/inventory.py, symbols: [_run]}

  - id: attribution-measurement-chokepoint
    kind: unresolved_argv
    verb: subprocess.run
    why: >-
      `runtime/attribution.py`'s `LiveHost`, which its own docstring records as
      mirroring `probes.LiveHost` deliberately, with the same injectability and
      the same read-only discipline. Named here rather than left implicit so
      that the number of exec chokepoints in this product is a fact a reader
      can count instead of a fact they have to go looking for.
    sites:
      - {file: runtime/attribution.py, symbols: [LiveHost.run]}

  - id: daemon-actuator-chokepoint
    kind: unresolved_argv
    verb: subprocess.run
    why: >-
      The one chokepoint that is not a measurement. `SubprocessRunner.run` is
      where every command the daemon ACTS with leaves the process. It is
      reached from `Actuator.restart` and nowhere else, and that path is
      declaration-gated at every step: `Actuator.perform` reads its operation
      vocabulary from `managed-runtime-contract.yaml` and refuses an
      unrecognised one rather than defaulting to the nearest recognised one;
      `STOP` and `RECONNECT` are declared members of that vocabulary with NO
      actuator, so the daemon cannot stop anything at all — which is why §26's
      `docker stop` / `kill` / `rm` / `prune` have no reachable spelling
      anywhere in this product; the command is `systemctl --user restart
      <declared unit>` or `docker restart <named container>`; and nothing is
      performed unless `--enable-reconcile` was passed, the default being
      observe-only. `docker restart` is not in §26's vocabulary and is not a
      mutation in this contract's sense: it destroys nothing, the container is
      the same container, and it keeps its writable layer. Recording it as a
      mutation because it is "the docker one" is how a vocabulary stops being
      read.
    sites:
      - {file: runtime/daemon.py, symbols: [SubprocessRunner.run]}
      # The caller, and the reason this entry is not one line: the command
      # `SubprocessRunner.run` is handed is bound in two branches of one `if`,
      # and the scanner names both rather than choosing. "Two possible
      # commands" is a fact a reviewer can act on; "unknown" is not.
      - {file: runtime/daemon.py, symbols: [Actuator.restart], verb: "<systemctl|docker>"}

  # ---------------------------------------------------------------------
  # The commands those chokepoints are handed. All reads.
  # ---------------------------------------------------------------------
  - id: host-reader-commands
    kind: command_handoff
    verb: docker
    why: >-
      `docker inspect`, `docker ps`, `docker stats`, `docker images`,
      `docker volume ls`, `docker network ls`, `docker network inspect`,
      `docker system df` and `docker info`. Every one is a read; there is no
      `docker rm`, `stop`, `kill` or `prune` anywhere in the product's own
      code, and that is checked by the scanner rather than promised here.
      `docker network inspect` is here rather than left implied by
      `docker network ls`: the listing reports ID, Name, Driver and Scope and
      no subnet at all, so a network-creation preflight that read only the
      listing would be asking "is this subnet free" of a set of rows that does
      not carry a subnet.

      `LiveHost._docker_json` is the chokepoint those four share and not a
      fifth handoff. It takes an argv a caller already built and hands it to
      `LiveHost._run`; the `docker` literal is at the four call sites, which is
      both where the scanner attributes the handoff and where a reviewer wants
      to read it. It was declared here until 2026-10-07, next to its own
      callers, which reads as a fifth site and covers nothing.
    sites:
      - {file: runtime/probes.py, symbols: [LiveHost.docker_inspect, LiveHost.docker_ps, LiveHost.docker_network_ls, LiveHost.docker_network_inspect]}
      - {file: runtime/inventory.py, symbols: [Inventory._docker_root_dir, Inventory.docker_summary, Inventory.docker_list, Inventory.docker_volumes, Inventory.docker_images, Inventory.docker_stats, Inventory.docker_networks, Inventory.docker_sizes, Inventory.docker_space, Inventory.container_logs]}

  - id: host-topology-commands
    kind: command_handoff
    verb: ip
    why: >-
      `ip -j addr show`, `ip -j route show table all` and `ip route get <addr>`,
      all three read-only and all three reached through the same
      `LiveHost._run` chokepoint as every other host measurement — so the
      number of places this product can reach the host did not change when
      these were added. `ip route get` in particular reads the kernel's own
      routing decision for one address and sends no packet: the alternative
      (parsing the route table and re-implementing longest-prefix, metric and
      policy-rule selection) is a second implementation of the kernel that
      would disagree with it. Named here because `ip` is not among §18's six
      read commands, and a read that is not on the list still has to be
      declared for the declaration to mean anything.
      This entry was STALE_ACTUATOR the first time it was written, and the
      reason is worth keeping: `ip` was not in `HANDOFF_BINARIES` at all, so
      none of the three reads below produced a hit and the declaration covered
      nothing the scanner could see. The scanner was widened rather than the
      declaration trimmed — with `_ip_verb`, so that widening it did not make
      `ip route add` an unfindable read, which is exactly the failure the
      `docker` branch's comment describes.
    sites:
      - {file: runtime/probes.py, symbols: [LiveHost.interface_cidrs, LiveHost.route_table, LiveHost.route_get]}

  - id: network-create-actuator
    kind: unresolved_argv
    verb: subprocess.run
    why: >-
      The first actuator in this product that CREATES something on the host.
      `daemon-actuator-chokepoint` returns an existing thing to its declared
      state; this one brings a network into existence that was not there, and
      that is a different kind of reach even though both end at
      `subprocess.run`.
      It is NOT declared as a `mutation`, and the reason is the one
      `daemon-actuator-chokepoint` already gives for `docker restart`:
      §26's vocabulary is `stop`/`kill`/`rm`/`rmi`/`prune`/`down` — every one
      of which ends a process this code does not own or removes bytes — and
      `MUTATING_DOCKER_VERBS` is that list. `docker network create` is not on
      it, and recording it as a mutation because it is "the docker one that
      writes" is how a vocabulary stops being read. What it destroys is
      nothing; what it changes is the routing table's future contents, which is
      the harm this gate exists to refuse and not the harm §26 enumerates.
      The argv is unresolved at the scan site because it arrives as a
      parameter. It is not unresolved at the call site that builds it:
      `argv_for` emits the literal `docker network create` and appends only
      fields a closed candidate accepted — `candidate()` refuses an unknown key
      outright, so the tail cannot be steered by anything the request smuggles
      in.
      What gates it is one call deep and not advisory: `execute` reads the
      preflight verdict itself and performs nothing unless it is ALLOW, the
      `runner` parameter has no default so there is no built-in route to the
      world, and `--execute` is off unless passed. On a DENY the actuator is
      not entered — which is the assertion C1 §七 asks to be proven rather than
      asserted, and `tests/test_network_policy.py` proves it by passing a
      runner that records being called.
    sites:
      - {file: runtime/network_mutation.py, symbols: [subprocess_runner]}

  - id: disk-measurement-commands
    kind: command_handoff
    verb: df
    why: >-
      `df -B1 -x tmpfs -x devtmpfs -x squashfs`. Byte-exact, with the virtual
      filesystems excluded, so the number the report prints is a measurement of
      real storage rather than of memory.
    sites:
      - {file: runtime/inventory.py, symbols: [Inventory.disk_status]}

  - id: user-unit-enumeration
    kind: command_handoff
    verb: systemctl
    why: >-
      `systemctl --user list-units` and `--user show`. Reads. The mutating
      verbs — stop, restart, kill — are not reachable from this file, which is
      what makes the daemon's actuator the only place a service is acted on.
    sites:
      - {file: runtime/inventory.py, symbols: [Inventory.user_services_list]}

  - id: probe-commands
    kind: exec
    verb: journalctl
    why: >-
      `journalctl --user --no-pager -o cat --since …` and
      `systemctl --user show <unit>` and `pgrep -f <pattern>`. Reads, and each
      is reached only from a probe declared in the registry. The `pgrep -f`
      call site is the one whose zero-match reading is ambiguous on a host with
      `hidepid`, which `runtime/desired.py` records; the command itself is a
      read either way.
    sites:
      # Three probes, three binaries. The verbs are written per site rather
      # than the entry being split three ways: the permission being asked for
      # is one permission — "this file may run read-only probes" — and a
      # reviewer should not have to reassemble it to answer that.
      - {file: runtime/probes.py, symbols: [LiveHost.journal]}
      - {file: runtime/probes.py, symbols: [LiveHost.systemd_user_unit], verb: systemctl}
      - {file: runtime/probes.py, symbols: [LiveHost.process_pids], verb: pgrep}

  - id: runtime-version-probe
    kind: unresolved_argv
    verb: subprocess.run
    why: >-
      `<program> --version`, run by `runtime/cli.py`'s `_probe_cli_version` to
      answer the one question `device agents --probe` exists to answer: which
      version of a runtime is installed on THIS device. It is `unresolved_argv`
      because the binary is not a literal — it is resolved by `shutil.which`
      from the program named in `agent-runtime-contract.yaml`'s
      `version_observation.cli_program`, which is a closed two-entry map, so the
      reachable binaries are `claude` and `codex` and a third would be an edit
      to that contract rather than to this call. The argv is exactly
      `[path, "--version"]`: no shell, no interpolation, no argument taken from
      a caller or from a device, and a 15-second timeout so a binary that hangs
      on start cannot hold the read. The output is taken verbatim and never
      parsed — the first non-empty line is the version, because a parser here
      would be a second opinion about what a version is. It reads and writes
      nothing, installs nothing and upgrades nothing: §20's acceptance is a
      read of two machines, and no command here can change either.
    sites:
      - {file: runtime/cli.py, symbols: [_probe_cli_version], verb: "<argv0>"}

  - id: verification-census-chokepoint
    kind: unresolved_argv
    verb: subprocess.run
    why: >-
      `scripts/verify.py`'s `measure` runs ONE test file in a child process to
      census what it reads, and the argv0 is a variable for the only reason the
      census can work at all: the child must run under an interpreter that HAS
      pytest, which is the caller's `--python` and not necessarily the one
      running the tool. The argv is otherwise fixed and entirely this file's —
      `[<interpreter>, <this file>, __census__, --test <one test file>, --repo
      <root>, --out, --junit]` — with no shell, no interpolation, and no
      argument taken from a device, a session or a caller's instruction. It is
      an exec by shape and a read by effect: the child writes one report into a
      temporary directory, and the pytest run inside it is the same run a person
      would have made by hand.

      The distinction from `daemon-actuator-chokepoint` is the point of this
      entry being separate. That chokepoint is where commands the product ACTS
      with leave the process; this one is a measurement of a test run, and
      merging them would put "runs the tests" and "restarts a container" behind
      one declaration.
    sites:
      - {file: scripts/verify.py, symbols: [measure], verb: "<argv0>"}

  # ---------------------------------------------------------------------
  # Writes that delete, and the two different reasons a delete is allowed.
  # ---------------------------------------------------------------------
  - id: atomic-write-temp-cleanup
    kind: fs_mutation
    verb: os.unlink
    why: >-
      The failure half of write-temp-then-rename. The unlink removes the
      temporary file this same function created one statement earlier, on the
      path where the rename did not happen. It cannot reach a file it did not
      write: the name is a fresh temporary path, not a caller-supplied one.

      `runtime/lease_store.py` is the same function under the same guarantee,
      and it is the newest here — SYS-02's store. It was written in that round
      and declared in this one, because this round's run of the guard is the
      first that included it: the site existed for a round before the
      declaration did, which is a fact worth leaving in the file rather than
      tidying away.

      `intake/understanding_patch.py#write` is the one site here whose
      temporary is named by `tempfile.mkstemp` rather than by the function: the
      name is handed back by the library and is this process's own, so the
      "cannot reach a file it did not write" argument holds by construction
      rather than by a naming rule.

      `intake/understanding_semantic.py#_atomic_write` is the second `mkstemp`
      site and the same argument: the temporary is one this process just made,
      and the unlink runs only on the path where the replace did not happen.

      `intake/understanding_brief.py#write` is the third `mkstemp` site and the
      same argument again: `tempfile.mkstemp` names the temporary, the unlink
      runs only in the `except` arm, and it therefore removes a file this
      process created one statement earlier and nothing else.

      `intake/document_publish.py#write_receipt` is the seventh site and the
      fourth `mkstemp` one, and it is the one whose temporary shares a directory
      with a file a PERSON may have written: the receipt directory is the
      caller's, named `--receipts`. That is not a widening, it is the reason the
      temporary is `.tmp`-suffixed and library-named — the only file this unlink
      can reach is the one `mkstemp` handed back in this call, whatever else is
      in that directory. The commit half of the same function is declared under
      `atomic-write-commit`.

      `runtime/report_delivery.py#_write` is the eighth, and it is the same
      function as `document_publish.py#write_receipt` under a different name,
      which is why the two arrived in the same round: the
      delivery outbox and its receipts are read back by the next attempt to
      answer "has this already gone out?", and half a record there is not a
      missing record — it is the answer "we cannot tell", which is the one
      answer that must never be manufactured. Both of that function's callers
      write into the directory `report daily` published into, which also holds
      the report a person reads; the `mkstemp` name is what keeps this unlink
      off that file.

      Two more arrived after that round and are declared below. Both are the
      `mkstemp` shape again — the temporary is named by the library in the
      destination's own directory, and this unlink runs only on the arm where
      the replace did not happen — so the "cannot reach a file it did not
      write" argument holds by construction, the way it does for the three
      `intake/understanding_*.py` sites above.

      `intake/daily_reading.py#_write` is the writing half of §P5's finite
      intake pass. It writes a model's READING (`reading.json`) and the
      resolution over it (`resolution.json`), and both are read back: the first
      through `semantic.read_reading`, the second by this module's own
      `alignment` view and by `intake/alignment_delivery.py`'s `gather`. That
      is why a half file here is worse than a missing one — a torn artifact is
      not the absence of a reading, it is a reading, and the next step accepts
      what a parser could read rather than what a person judged.

      `intake/alignment_delivery.py#_atomic_text` is the evening brief's
      writer, and its reason is one step sharper than the rest. The brief is
      written first, then read back OFF DISK and hashed, and only then is the
      `version.json` beside it written around that hash — never the hash of
      what was in memory. `runtime/report_delivery.py`'s `held_version`
      re-hashes the file at delivery time and compares it to what the statement
      claims, and that function names this directory as the second kind of
      version statement it resolves. A half-written brief would go out under a
      statement computed from bytes that no longer exist, and the check whose
      whole job is to catch a swapped brief would be comparing two different
      documents and calling them the same one.

      `runtime/daemon.py#_atomic_write` was declared HERE and is not any more:
      as of 2026-10-07 the daemon writes its temporary and replaces it in one
      step, so there is no arm on which it unlinks the name it made and nothing
      left for this row to cover. The commit half of that same function is
      still declared, under `atomic-write-commit`, and still matches. The
      removal is worth this paragraph because a permission that is no longer
      needed and one nobody ever checked are the same two lines of diff, and
      only one of them is fine. The row kept matching through its other sites
      for as long as this was true, which is exactly how it went unnoticed.

      `context/trust_binding.py#_write` is the newest and the last to be declared here, and it is the
      one this row was extended for on 2026-10-08. The function arrived with `d029d1b` (2026-10-07)
      and the declaration did not arrive with it: three mutations of one twelve-line function were
      live for a day while this table still matched through its other sites, which is the same
      sentence the paragraph above just finished saying. It is the `mkstemp` shape again — the
      temporary is named by the library in the destination's own directory and this unlink runs only
      on the arm where the replace did not happen — so the bound is by construction rather than by
      a naming rule.

      What makes it worth its own paragraph rather than being one more file in the list above is the
      reader. `bind()` writes the binding and then calls `verdict(target)` on the file it has just
      written, and refuses if that read does not verify; `disable()` writes and does the same. So a
      torn binding is not a lost write that the next attempt retries — it is read back by the writer
      inside the same call, by the verifier's own reader, and the answer it gives is
      `DELEGATION_PROVIDER_UNBOUND`, which reads as "nothing is bound here" rather than "the write
      was interrupted". That is the one answer this project never lets a failure manufacture, and it
      is why the temporary exists at all.
    sites:
      - {file: relations/project.py, symbols: [write]}
      - {file: runtime/ability_projection.py, symbols: [write_atomic]}
      - {file: runtime/agent_control_store.py, symbols: [_atomic_write]}
      - {file: runtime/lease_store.py, symbols: [_atomic_write]}
      # daily_report 的文本那一半：与 agent_control_store 的写法同一决定，
      # 但 `_atomic_write` 只处理 JSON，日报写的是文本，所以是另一个符号。
      - {file: runtime/daily_report.py, symbols: [_atomic_write_text]}
      - {file: intake/understanding_patch.py, symbols: [write]}
      - {file: intake/understanding_semantic.py, symbols: [_atomic_write]}
      - {file: intake/understanding_brief.py, symbols: [write]}
      - {file: intake/document_publish.py, symbols: [write_receipt], verb: ".unlink()"}
      - {file: runtime/report_delivery.py, symbols: [_write], verb: ".unlink()"}
      - {file: intake/daily_reading.py, symbols: [_write]}
      - {file: intake/alignment_delivery.py, symbols: [_atomic_text]}
      # The trust binding is the newest participant in this idiom and it was
      # the only one still undeclared, which is the shape this whole file is
      # about: the writing half shipped in the round that added `work trust`,
      # and the declaration waited for a run of the guard that included the
      # file. See the paragraph in `why`.
      - {file: context/trust_binding.py, symbols: [_write], verb: ".unlink()"}

  - id: atomic-write-commit
    kind: fs_mutation
    verb: os.replace
    why: >-
      The commit half of the same idiom, plus `Path.replace(target)` resolved by
      signature. `os.replace` is atomic on one filesystem and overwrites the
      destination, which is the point: a reader never sees a half-written file.
      The `Path.replace` spellings in `runtime/daemon.py` are the same act —
      `tmp.replace(destination)` — and are the reason this contract needs the
      arity rule rather than a name-based one.

      `intake/global_board.py#render` is the third spelling and the one with
      the widest destination: the §S board writes `current.json` and
      `current.md` into a directory the CALLER names, so the destination is not
      computed from this process's own roots the way the daemon's writes are.
      Two things bound it. `render()` refuses a relative directory, so the path
      cannot come from the cwd; and the temporary is
      `.{destination.name}.serveros.tmp` in the destination's own directory, so
      the only file ever replaced is the one being written — which is also why
      the two are in the same directory rather than in `tmp/`, and why this is
      one entry and not a rename across filesystems.

      `intake/understanding_patch.py#write` is the fourth spelling, and it is
      bounded the way `global_board.py` is: the destination is a path the
      CALLER names, and it is refused unless it is absolute, so it cannot come
      from the cwd or from a relative argument. It writes exactly one file —
      the patch a person is meant to read — and it is atomic for the reason
      the module is written at all: a reader must never see half a patch and
      decide on it.

      `intake/understanding_semantic.py#_atomic_write` is the fifth, and it is
      the patch writer's twin: `mkstemp` in the destination's own directory,
      the same two reasons. Its destinations are a card and the receipt beside
      it, both under the understanding root, which `_understanding_root`
      refuses unless it is absolute — so, like the two above, the path cannot
      arrive from the cwd. The card write is atomic for a sharper reason than
      the patch write's: the module's whole subject is a card whose fenced
      reading was replaced by a person's correction, and a reader who catches
      half of that splice cannot tell a correction from a lost paragraph.

      `intake/understanding_brief.py#write` is the sixth and the newest, and it
      is the patch writer's shape with the opposite reader: the file it writes
      is the PACKET — the fixed-version material a native Agent session is
      handed before it writes a reading — so the reader who must never see half
      of it is a model, and half a packet is a reading authored against text
      that was never all there. The path is again the caller's and refused
      unless absolute, which is the module's own reason for the rule: a packet
      written relative to whatever directory a CLI happened to stand in is one
      the session cannot find. It was written in the round that added the verb
      and declared in this one, because the guard's run is what says so.

      `intake/document_publish.py#write_receipt` is the seventh site and the
      first here whose destination is named by the CALLER and then read back by
      this process later. `receipts_dir` arrives from the CLI and is refused
      unless absolute, so the path cannot come from the cwd; the file it writes
      is what the next run reads to learn what already happened. That is why the
      commit half is atomic as well: the replace is the instant the answer to
      "did we already write this?" changes, and a reader who catches the file
      between `mkstemp` and `replace` reads the previous answer — which is true
      — rather than half of the new one, which is not. Half a receipt is a wrong
      answer to "what did we already do", and that answer is exactly what stops
      a second write to a document the first one has already touched. The unlink
      half of the same function is declared under `atomic-write-temp-cleanup`.

      `runtime/report_delivery.py#_write` is the eighth and closed that round:
      the delivery outbox and its receipts, written atomically for exactly the
      reason above and one more. A receipt is what a LATER attempt reads to
      decide whether to send again — so a receipt that is half-written is not
      merely lossy, it is the state machine reading a torn record as an answer.
      The destinations are two files in the directory `report daily` published
      into, beside the report a person reads and the publication receipt that
      says which version it is. Those two files are written atomically by
      `runtime/daily_report.py` for the same reason and are declared above.

      `intake/daily_reading.py#_write` and
      `intake/alignment_delivery.py#_atomic_text` are the two that arrived
      after that round, and the commit half of each is declared here for the
      reason the whole idiom exists: the rename is the instant a reader's
      answer changes. In the first, that reader is the next stage of the same
      pass, which reads `reading.json` back through `semantic.read_reading` —
      a torn reading is not an unfinished one, it is a wrong one, and it would
      be judged as written. In the second, the reader is a DELIVERY:
      `held_version` hashes the brief off disk and compares it to the version
      statement, so the instant this replace lands is the instant the pair
      (brief, version) becomes consistent, and a reader who catches the file
      half-written would hash bytes that were never published. Both
      destinations are named by the caller and refused unless absolute —
      `daily_reading`'s under a Run directory it has already required to be
      absolute and real, `alignment_delivery`'s under `out_dir`, refused with
      that sentence in `Refused` — so neither path can arrive from the cwd.

      `context/trust_binding.py#_write` is the ninth and the second late one:
      the same twelve lines that brought the unlink above into this table
      brought this replace, and they arrived here for the same reason. Two
      things make it the narrowest site in this list. The destination is not a
      path any caller picks: `trust_path()` returns the verifier's own constant
      (`context/actor.py`'s `DELEGATION_TRUST`), so the writer and the reader
      cannot disagree about where the binding is — which is a different kind of
      bound from the "refused unless absolute" rule the two above are held by,
      and a stronger one, because there is no value a caller could pass that
      this function would accept as a second location. And the reader is the
      writer: `bind()` calls `verdict(target)` on the file one statement after
      this replace lands, so the instant the rename becomes visible is the
      instant the binding must verify, and a torn file would be read back as an
      ABSENT binding rather than as an interrupted write.
    sites:
      - {file: relations/project.py, symbols: [write]}
      - {file: runtime/ability_projection.py, symbols: [write_atomic]}
      - {file: runtime/agent_control_store.py, symbols: [_atomic_write]}
      - {file: runtime/daily_report.py, symbols: [_atomic_write_text]}
      - {file: runtime/daemon.py, symbols: [_atomic_write, Budget._save], verb: ".replace()"}
      - {file: runtime/lease_store.py, symbols: [_atomic_write]}
      - {file: scripts/release.py, symbols: [_symlink_swap]}
      - {file: scripts/verify.py, symbols: [write_record]}
      - {file: intake/global_board.py, symbols: [render], verb: ".replace()"}
      - {file: intake/understanding_patch.py, symbols: [write]}
      - {file: intake/understanding_semantic.py, symbols: [_atomic_write]}
      - {file: intake/understanding_brief.py, symbols: [write]}
      - {file: intake/document_publish.py, symbols: [write_receipt], verb: ".replace()"}
      - {file: runtime/report_delivery.py, symbols: [_write], verb: ".replace()"}
      - {file: intake/daily_reading.py, symbols: [_write]}
      - {file: intake/alignment_delivery.py, symbols: [_atomic_text]}
      # The trust binding's commit half, and the only site in this list whose
      # destination is not a caller's path at all — it is `trust_path()`, the
      # verifier's own constant. See the paragraph in `why`.
      - {file: context/trust_binding.py, symbols: [_write]}
      # §5 / Layer C: `memory/openviking/backup.py#backup` writes the archive to
      # `<out>.part` and then replaces `<out>` with it, so a reader never sees a
      # half-written archive. The destination is named by the CALLER and the
      # temporary is derived from it by appending a suffix, which is the whole
      # bound: the replace can only ever land on the one file this function was
      # asked to produce. The script's own `verify` verb is what checks the
      # bytes afterwards, which is why this is declared for the rename and not
      # for a durability claim — an archive that replaced correctly can still be
      # wrong, and that is the separate question `verify` answers.
      - {file: memory/openviking/backup.py, symbols: [backup], verb: ".replace()"}

      # §9.48: `scripts/release.py#cmd_continuation_wake` writes the wake-parent
      # launcher to a sibling `<name>.new` and renames it over the destination.
      # The reason is exclusion rather than durability, and it is sharper than
      # the ones above: this file is EXECUTED BY A TIMER THAT MAY ALREADY BE
      # FIRING on a node that has installed the routine before, so a Parent
      # started against a half-written launcher is a shell reading its own tail
      # as commands. The temporary is `target.with_name(target.name + ".new")` —
      # the destination's own directory, so the rename stays inside one
      # filesystem — and the only path it can ever land on is the launcher that
      # `args.bin_dir` names, a directory this command creates itself rather than
      # one it is handed. This is the second declaration for this symbol: the
      # other is under the systemd actuator above, for the single
      # `daemon-reload` the same command runs, and neither covers the other.
      - {file: scripts/release.py, symbols: [cmd_continuation_wake]}

  - id: daemon-owns-its-socket
    kind: fs_mutation
    verb: .unlink()
    why: >-
      `serverosd` removing its own listening socket before binding it and again
      when it stops. The path is `Daemon.socket_path`, computed by this process
      from its own roots; `test_a_daemon_does_not_unlink_a_socket_that_is_not_its_own`
      is the regression that keeps a second daemon from removing the first's.
      A stale socket file is the one file whose presence is indistinguishable
      from a live listener, which is why it is removed rather than left.
    sites:
      - {file: runtime/daemon.py, symbols: [Daemon._prepare_socket, Daemon._release_socket]}

  - id: lease-release-removes-the-last-record
    kind: fs_mutation
    verb: .unlink()
    why: >-
      The resource-leases namespace's one delete, and it is a RELEASE rather
      than a cleanup: `LeaseStore.release` removes a resource's record only when
      no reference to it is left AND the kernel's verdict is ALLOW. Both
      conditions are refusals by default — a record with an expired reference
      keeps its file on purpose, because that file is the only evidence a holder
      ever existed, and turning it into an absence is how a crashed holder comes
      to look like an idle node. The path is `path_for(self.root, resource)`,
      derived by this module from its own namespace root and a resource name it
      validates, so it cannot reach a file it was not given. `absent_means:
      NO_LEASES_HELD` in the root contract stays true when the file is gone,
      which is why this delete does not leave the namespace making a claim it
      cannot support.
    sites:
      - {file: runtime/lease_store.py, symbols: [LeaseStore.release]}

  - id: daemon-socket-permissions
    kind: fs_mutation
    verb: os.chmod
    why: >-
      `os.chmod` on the socket this process just bound, to 0o600. Narrowing
      permissions on a file this process created in this call. Declared because
      it is a mutation, not because it is a risk: a gate that reported only the
      mutations that frighten it would stop being a gate.
    sites:
      - {file: runtime/daemon.py, symbols: [Daemon._open_socket]}

  - id: backup-restore-reapplies-the-recorded-mode
    kind: fs_mutation
    verb: os.chmod
    why: >-
      The restore's half of "a backup that loses a mode is not a backup of what
      was there". `memory/openviking/backup.py` records each file's mode in its
      manifest and re-applies it on the file it has JUST written, in the same
      loop iteration that wrote it — so the path is one this function created
      one statement earlier, and the mode is one the archive itself carries.
      There is no path here that a caller names and no mode a caller chooses.

      Separate from `daemon-socket-permissions` rather than a second site on it,
      because that entry's subject is the socket `Daemon` bound and its id says
      so; a provider's restore path filed under a daemon socket's name is the
      name-that-describes-something-else this file keeps finding.
    sites:
      - {file: memory/openviking/backup.py, symbols: [verify]}

  - id: generated-artifact-is-regenerated
    kind: fs_mutation
    verb: .unlink()
    why: >-
      `scripts/build.py` clearing its own output directory before writing it.
      The directory is generated-only and the unlink is bounded by an inventory
      of what the build expected to produce: anything not in the expected set is
      removed. This is the strongest automatic delete in the repository and the
      reason it is safe is that the directory is derived from the source by this
      same script — nothing a person wrote lives there, and `--check` reporting
      drift is what detects the case where that stops being true.
    sites:
      - {file: scripts/build.py, symbols: [build]}

  - id: generated-artifact-prunes-empty-dirs
    kind: fs_mutation
    verb: .rmdir()
    why: >-
      The second half of the same pass: directories left empty by the removals
      above are pruned, in reverse depth order. `rmdir` refuses a non-empty
      directory, so this call cannot remove content even if the loop above made
      a mistake.
    sites:
      - {file: scripts/build.py, symbols: [build]}

  # ---------------------------------------------------------------------------
  # C3 · the managed path's own writer
  # ---------------------------------------------------------------------------
  # Three entries for one class, because the class is the only place C3 changes
  # anything and each of the three is a different act. They are declared
  # together so that reading the contract's actuator surface shows the whole of
  # what the managed path can do, rather than one third of it.
  #
  # What is NOT here is as much of the claim as what is: there is no subprocess
  # entry for `runtime/managed_mutation.py`, because the module has none. Its
  # executor writes files and nothing else, and it reaches no container, no
  # network, no unit and no process.
  - id: managed-mutation-writes-its-plan
    kind: fs_mutation
    verb: .replace()
    why: >-
      One primitive, three names, and one site — and the count that matters
      here is the site. `_replace` is the rename — temp file, write, rename, the
      same idiom as `atomic-write-commit`; `write` serialises a payload into it
      for the publisher, and `restore` puts captured bytes back through it
      unchanged for the rollback. `write` and `restore` were listed as separate
      sites here until 2026-10-07 and are not any more: neither one renames
      anything, both call `_replace`, and that is where the `.replace()` this
      contract's key names actually is. Listing a caller beside the primitive it
      calls reads as a second place the filesystem is reached. `_replace`'s own
      docstring states the intent from the code's side, in as many words: it is
      kept as a separate name from `write` so that the declaration has one site
      to name, and so that neither caller can quietly grow its own way of
      reaching the filesystem.

      The three are still one reachable path: all are called only from
      `execute()` and `rollback()`, and both refuse before the writer is touched
      unless their own gate said so. The reason the writer is injected rather
      than module-level is this entry: a test asserts on the call log that a
      refusal never reaches it, and a call log can only exist if there is an
      object to keep it on.
    sites:
      - {file: runtime/managed_mutation.py, symbols: [FilesystemWriter._replace]}
  - id: managed-mutation-rollback-removes-what-it-created
    kind: fs_mutation
    verb: .unlink()
    why: >-
      The rollback's removal half, for a path that did not exist before the
      write. Bounded by the plan: it iterates `proposed_changes`, which was
      built before anything ran, so it cannot discover a path to remove at
      rollback time. `missing_ok=True` because a rollback that raises on a file
      it already removed is a rollback that stops halfway.
    sites:
      - {file: runtime/managed_mutation.py, symbols: [FilesystemWriter.remove]}
  - id: managed-mutation-rollback-prunes-the-directory-it-made
    kind: fs_mutation
    verb: .rmdir()
    why: >-
      The destination directory, and only when it is empty — `rmdir` refuses a
      non-empty one, so a rollback that got the paths wrong fails loudly here
      instead of deleting a directory somebody else has since put something in.
    sites:
      - {file: runtime/managed_mutation.py,
         symbols: [FilesystemWriter.rmdir, rollback]}

  - id: release-staging-and-symlink-swap
    kind: fs_mutation
    verb: shutil.rmtree
    why: >-
      `scripts/release.py` clearing a staging directory it has just established
      is its own, and the unlink half of swapping a symlink (the replace half is
      declared under `atomic-write-commit`, whose whole subject is the rename).
      Both act on paths `release.py` owns and neither touches a deployed
      revision: the swap is unlink-then-replace on a temporary symlink whose
      target was already staged, which is why a failed verify can leave
      `current` untouched (there is a test for exactly that).

      The `shutil.rmtree` site was `_symlink_swap` until 2026-10-07 and is
      `stage` now, and the move is the point of that function's rewrite rather
      than a detail of it. The line it replaced was
      `if staging.exists(): shutil.rmtree(staging)` — a default action taken on a
      directory whose owner and intent had not been established, and one that
      would have deleted a finished release's payload, or another actor's
      half-written copy, as readily as its own leftover. It now runs only inside
      the branch that has first read both manifests and established that the
      leftover is a partial copy of THIS artifact by the same hand; the case that
      is not that is refused with a sentence rather than removed. So the reach
      declared here is narrower than the site it replaces: not "removes the
      staging directory" but "removes a staging directory it has proved is its
      own interrupted copy". The row kept matching through its symlink half,
      which is why the drift stayed invisible until the guard began checking one
      site at a time rather than one declaration at a time.
    sites:
      - {file: scripts/release.py, symbols: [stage]}
      # `.swap` is the temporary link beside the destination. Removing it is
      # the recovery half of the same swap, and it acts on a path this function
      # constructed one line earlier.
      - {file: scripts/release.py, symbols: [_symlink_swap], verb: ".unlink()"}

  - id: release-staging-rename
    kind: fs_mutation
    verb: .rename()
    why: >-
      Promoting the staged tree to its revision directory. A directory rename
      within one filesystem, so the revision either exists complete or does not
      exist.
    sites:
      - {file: scripts/release.py, symbols: [stage]}

  - id: source-cache-extraction
    kind: fs_mutation
    verb: shutil.rmtree
    why: >-
      `scripts/runtime_truth.py#extract_source_tree` writing the tree of a
      commit into the source cache — `$SERVEROS_SOURCE_CACHE`, else this node's
      declared temp root, never the system temp dir — so that an artifact can be
      recomputed from the commit THAT ARTIFACT records rather than from whatever
      commit the canonical checkout happens to stand on. The cache is never the
      checkout it reads from:
      `git archive` writes nothing, and everything materialized lands under a
      directory this process named.

      The one deletion is the staging directory `tempfile.mkdtemp` made under
      the cache in this same call, on the path where the extraction or the
      rename failed. Its name is fresh by construction, so it cannot be
      another actor's directory, and the reach is one directory deep.

      An earlier version of this function also ran
      `if target.exists(): shutil.rmtree(target)` before the rename — the same
      default action, on a directory whose owner and intent had not been
      established, that `release.py#stage` was rewritten to stop taking one
      round before (`release-staging-and-symlink-swap` above). On this host
      `$TMPDIR` is shared, so that line would have removed a finished tree, or
      another actor's half-written copy of the same commit, as readily as this
      process's own leftover. The reach was REMOVED rather than declared: a
      commit somebody else has already finished is used as it stands, and one
      somebody else is mid-way through yields None — a row that says it could
      not rebuild — rather than a deletion. `mutation_guard` is what found it,
      which is the direction this table exists for.
    sites:
      - {file: scripts/runtime_truth.py, symbols: [extract_source_tree]}
      # The commit half of the same idiom. A directory rename within one
      # filesystem, so the tree either exists complete or does not exist, and it
      # is also what settles a race between two rows asking about the same
      # commit: the loser's rename fails, and it then reads the tree the winner
      # left rather than writing over it.
      - {file: scripts/runtime_truth.py, symbols: [extract_source_tree], verb: ".rename()"}

  # ---------------------------------------------------------------------
  # The systemd actions this repository will take, and only through a person
  # running the release CLI.
  # ---------------------------------------------------------------------
  - id: release-promotes-and-rolls-back-units
    kind: exec
    verb: systemctl
    why: >-
      Five subcommands a person types — five of the six places in the shipped
      surface that change what systemd is running, the sixth being
      `cmd_daily_task`, declared in its own entry below. `cmd_promote` and
      `cmd_rollback` point the node's unit at a revision and reload.
      `cmd_alert_worker` reloads, then ENABLES A TIMER — added in §W, and it is
      the one that needed saying out loud: enabling `serveros-alert-sync.timer`
      is the act that makes a condition on this machine reach a person, and it
      is separate from `promote` precisely so that it stays one explicit act
      with a destination a person supplies. `cmd_continuation_wake` — added in
      §9.48 — writes the wake routine's two units and then does exactly one
      thing: `systemctl --user daemon-reload`, which is a re-read and not a
      restart, and which leaves every checkpoint on the node exactly as it was.
      It does NOT enable or start the timer, and `--no-reload` skips the reload
      WITHOUT turning the command into a dry run: the units are still written
      and are simply not seen by the manager yet. Arming stays a separate
      command a person types, the same polarity `cmd_daily_task` chose — a
      receiver that starts waking Parents before anybody has chosen a Parent is
      the failure mode, not the goal. `cmd_evening_brief` — added 2026-10-08 —
      writes the evening brief's two units. It is the SECOND of the five that can
      enable a timer, and its REASON is `cmd_alert_worker`'s while its POLARITY is
      `cmd_daily_task`'s. The reason is the one stated above: arming
      `serveros-evening-alignment.timer` is the act that makes this machine's own
      preparation reach a person every evening. The polarity is opt-IN —
      `--enable` is absent by default, and its absence is what leaves the timer
      unarmed. That is `cmd_daily_task`'s shape and the opposite of
      `cmd_alert_worker`'s, which arms by default and whose `--no-enable` opts
      out. Both being true is why the two are named separately: neither follows
      from the other, and a reader who took the polarity from the reason would
      install this one armed. It also
      refuses an install whose `--intake-run-dir` disagrees with the installed
      `serveros-intake.service`, because the two units are related by that one
      directory and by nothing systemd knows about. None of the five is
      reachable from the daemon, the MCP layer or any observation path;
      `--enable-reconcile` does not reach them and no Run can invoke them.
    sites:
      - {file: scripts/release.py, symbols: [cmd_promote, cmd_rollback, cmd_alert_worker, cmd_continuation_wake, cmd_evening_brief]}

  # ---------------------------------------------------------------------
  # The card source. The card is a consumer, and a consumer that imports
  # its producer measures the import rather than the promise.
  # ---------------------------------------------------------------------
  - id: card-source-asks-the-cli
    kind: unresolved_argv
    verb: <argv0>
    why: >-
      `subprocess.run([sys.executable, str(_REPO / "bin" / "serverosctl"),
      *argv, "--json"])` in `runtime/card_source.py`'s `_default_run`. The
      scanner reads neither `sys.executable` nor the `str(...)` of the entry
      path, so the argv is reported rather than assumed. What it cannot show is
      the part that matters: `argv` is one of `DEFAULT_READS`'s four read
      subcommands — `resource summary`, `resource top`, `resource
      user-services`, `runtime list` — every one of which is a read this
      product already ships, and the entry point is the revision's OWN shim,
      one component under this file. `--json` is appended after the `*argv`, so
      no word a caller passes can displace it or reach a subcommand that did
      not come from that tuple; the four are literal string tuples in the same
      module, which is where this scanner reads them.
      WHY A SUBPROCESS AT ALL, since the alternative looks cheaper:
      `card status` is itself `serverosctl`, so this makes the command invoke
      its own CLI once per read. That is the deliberate half. The command is
      the supported interface — a card that called `resource_summary()` in
      process would be asserting what the code does today instead of what the
      command promises, and the two diverge the day a payload key moves. The
      cost is four interpreter starts on a card render, which is a surface a
      person looks at and no timer spins on.
    sites:
      - {file: runtime/card_source.py, symbols: [_default_run]}

  # ---------------------------------------------------------------------
  # The MCP layer. §18's rule lives here.
  # ---------------------------------------------------------------------
  - id: mcp-agent-session-ends-its-own-child
    kind: process_termination
    verb: os.killpg
    why: >-
      `mcp/codex_app_server_provider.py` ending the codex app-server it started
      itself. `close()` sets `self._proc = None` before signalling, so the
      handle is cleared and a second call is a no-op; the pid comes from the
      `Popen` object and never from the process table, so the worst case is
      signalling a process that has already exited. It sends SIGTERM and only
      then SIGKILL, and the process group is the one this object created with
      `start_new_session=True` for the stated reason that killing only the
      direct child leaves a grandchild holding the pipe. This is the one
      process termination in the product, it is the MCP layer's own child, and
      §26's example of the exception it permits: teardown of what you started.
      Nothing in this round's Resource API can reach it.
    sites:
      - {file: mcp/codex_app_server_provider.py, symbols: [AppServerProcess.close]}
      # `Popen.terminate()` in the same method, resolved by its signature —
      # no arguments. The same child, the same decision, the SIGTERM half of
      # the line above it.
      - {file: mcp/codex_app_server_provider.py, symbols: [AppServerProcess.close], verb: ".terminate()"}

  - id: mcp-agent-session-launch
    kind: unresolved_argv
    verb: <argv0>
    why: >-
      `subprocess.Popen([binary, "app-server", "--listen", "stdio://"])`. The
      scanner reads the argv tail and not the binary, because the binary is
      resolved at run time by `resolve_binary()` from `SERVEROS_CODEX_BIN` or
      PATH — the deployed path on this machine is a wrapper, and pinning it
      would break the one machine that has no wrapper. So what is fixed is what
      the binary is ASKED TO DO, and what varies is which binary answers. The
      capability this grants is "start an agent session", not "run a command":
      the argv cannot be steered, and none of §18's six read commands appears in
      any argv this file constructs. See `coverage_limits`: this is the one
      reach in the product that a static scan cannot close, and it is recorded
      as a gap rather than counted as clean.
    sites:
      - {file: mcp/codex_app_server_provider.py, symbols: [AppServerProcess.start]}

  - id: mcp-human-control-identity
    kind: unresolved_argv
    verb: subprocess.run
    why: >-
      The BotMux identity command, run from a `list(...)` of a dataclass
      default. It is not read from the environment — `from_env` does not touch
      `actor_command`, and there is no `SERVEROS_BOTMUX_ACTOR_COMMAND` — so a
      deployed node cannot point it anywhere; only a caller constructing the
      provider in-process can, and that caller is this repository's own code
