# ServerOS capability resolution — the record a query returns.
#
# Why this file exists
# --------------------
# The resolver is pure and the record is its only output, so the record is where
# the honesty has to live. A resolver that returns a bare boolean cannot say why,
# and "why" is the entire product: UNKNOWN and UNAVAILABLE call for opposite
# actions, and a caller that cannot tell them apart does the wrong one.
#
# The shape below is also the reason the resolver can be tested without a
# machine: every input is a record, so a fixture is a set of records and the
# resolution of a three-device fleet can be asserted in a unit test.
#
# Read `docs/ability-fabric.md` for the intersection and why it is one.
schema: serveros/capability-resolution.v1
version: 1

# ---------------------------------------------------------------------------
# The vocabulary, as data. These are the closed sets the resolver holds as
# tuples, and they are declared here rather than only mentioned in a sentence
# because `tests/test_ability_resolver.py::CapabilityContractTests` compares
# them BOTH ways. A value in the code and not here is a value a reader of this
# contract does not know exists; a value here and not in the code is a branch a
# caller writes and never reaches. `inputs:` below is the eighth, and it is
# ordered, so it is compared as a sequence rather than as a set.
#
# Until 2026-10-06 these were named nowhere: the file mentioned `REASONS` once,
# inside a sentence, and the other four appeared in neither a list nor a
# sentence. That is the same absence that let `runtime` and `inputs_missing`
# drift out of `record:` unnoticed — a vocabulary the contract does not carry
# is a vocabulary it cannot be out of date against.
# ---------------------------------------------------------------------------
vocabulary:
  STATUSES: [AVAILABLE, DEGRADED, UNAVAILABLE, INCOMPATIBLE, UNKNOWN]
  REASONS: [AGENT_UNSUPPORTED, DEVICE_DEPENDENCY_MISSING, RUNTIME_UNHEALTHY,
            POLICY_DENIED, NETWORK_UNAVAILABLE, PROVIDER_NOT_INSTALLED,
            ACTION_UNSUPPORTED]
  OPERATION_STATES: [SUPPORTED, UNSUPPORTED, UNKNOWN]
  PRODUCT_ROLE_STATES: [DECLARED, UNDECLARED, AMBIGUOUS, UNKNOWN]
  THIN_LINK_FIELDS: [product_role, routing, handoff, authority]
  THIN_LINK_RECORD_FIELDS: [product_role_state, semantic_owner, realization_role,
                            cross_refs, subroles, subrole, human_boundary]

# ---------------------------------------------------------------------------
# The eight inputs, in evaluation order. Order matters for the REASON, not for
# the answer: the result is an intersection, so any input may refuse, and the
# first one that refuses names the reason. Evaluation stops at the first
# refusal, which is why the cheap, local, unambiguous inputs come first.
# ---------------------------------------------------------------------------
inputs:
  - name: ability
    source: "ability-management manifest, pinned revision"
    refuses_when: "no such ability at the pinned revision"
    reason: PROVIDER_NOT_INSTALLED
    # Keyed by the REFERENCE, not by the bare id: `ability:<id>`, exactly the
    # key `request.ability` carries once `parse_ability_ref` has split any
    # `#<verb>` off it. Declared here because nothing said it, and the result
    # was two incompatible readings of the same field — the tests keyed by
    # reference, the shipped example request wrote a bare id, and the pair
    # produced `not in the pinned catalogue` for an ability that is in it.
    # The reference is the right key rather than the id: it is what every
    # caller and every fixture in the product already writes
    # (`abilities/resolver.py#parse_ability_ref` says so), and keying by it is
    # what makes `ability:x#read` and `ability:x` the same lookup.
    # WHICH `<id>`, because the authority uses that word for two different
    # things and this line read as the wrong one.
    #
    #   abilities-manifest.yaml  `id`    `ProfessorZhi/runtime-management`
    #                            `name`  `runtime-management`
    #   ability-packs.yaml       "WHAT A PACK IS: names. `ability:<kebab-id>`
    #                            members" — and every member it writes is
    #                            `ability:runtime-management`.
    #
    # So the field the manifest calls `id` is `author/kebab`, the field it calls
    # `name` is the kebab-id, and `ability-packs.yaml` calls THAT one the id.
    # The catalogue key is the **`name`** field — the kebab-id — because that is
    # what the authority's own pack members are written as, and what every
    # shipped example in this repo writes (`abilities/requests/resolve-
    # example.json`, `abilities/requests/catalogue-example.txt`). The manifest's
    # `id` is the identity and is NOT the key: its header says so itself —
    # `path = storage locator（name != identity != path）` — and `name` carries
    # an installation suffix in places (`obra/superpowers` is named
    # `superpowers@cc-server-local`), which is a label and not a key.
    catalogue_key: "ability:<name>"
    # Measured 2026-10-06 against `thin-ability-link-20261006@5e666575`: 65
    # records, 60 keys, and a resolution of `ability:grill-me` and
    # `ability:playwright-mcp` both reach their declared Thin Link. The same
    # abilities addressed by manifest `id` — `ability:unknown/grill-me` —
    # resolve to `UNKNOWN` with the link unread, which is the concrete cost of
    # the ambiguity above.
    # Two shapes are readable and only one of them can hit this catalogue. A
    # bare id is accepted by the parser — deliberately, since normalising it
    # would rewrite an input nobody asked to have rewritten — and then misses
    # every entry, reporting a definite finding about the catalogue that is
    # really a finding about how the caller spelled the ref. Naming the gap
    # rather than closing it: refusing a bare ref is a change to the accepted
    # input set, and this round did not make it.
    known_gap: "a bare `<name>` ref is accepted and can never match a ref-keyed catalogue"
  - name: device_capability
    source: "fleet/registry.yaml device record + observed facts"
    refuses_when: "a declared requirement is absent"
    reason: DEVICE_DEPENDENCY_MISSING
  - name: device_profile
    source: "fleet/profiles.yaml"
    refuses_when: "a required path role is UNBOUND or NOT_APPLICABLE here"
    reason: PROVIDER_NOT_INSTALLED
  - name: device_binding
    source: "the device's own state root + registry"
    refuses_when: "no provider instance is registered on this device"
    reason: PROVIDER_NOT_INSTALLED
  - name: agent_runtime
    source: "abilities/agent-runtime-contract.yaml + the calling runtime"
    refuses_when: "the provider kind or surface is not consumable by this runtime"
    reason: AGENT_UNSUPPORTED
  - name: runtime_health
    source: "runtime/probes.py observations"
    refuses_when: "the provider's probe reports FAILED on a required axis"
    reason: RUNTIME_UNHEALTHY
  - name: policy
    source: "the applicable policy set"
    refuses_when: "a policy denies it for this device or Item"
    reason: POLICY_DENIED
  - name: task_context
    source: "the Context Capsule for this run"
    refuses_when: "the Item's context excludes it"
    reason: POLICY_DENIED

# ---------------------------------------------------------------------------
# The record. Everything here is DERIVED; nothing is stored.
#
# This is the same rule the runtime registry states for health observations, and
# it is here for the same reason: a stored resolution is a memory of a past
# machine being read as a statement about the present one. The whole reason the
# resolver is pure is that re-running it is cheap and always correct.
# ---------------------------------------------------------------------------
record:
  required_fields:
    - schema
    - status
    - ability
    - device_ref
    - resolved_at
    - inputs_seen      # which of the eight were actually available to the resolver
  optional_fields:
    - reason
    - provider         # chosen provider id, when one was chosen
    - candidates       # providers considered, with their individual statuses
    - operation        # the verb named on the reference; null when none was (§10)
    - detail           # the sentence behind `reason`/`status`; null when there is none
    - finding          # a named observation that is NOT a refusal (DEGRADED only)
    - runtime          # the agent runtime the question was asked about
    - inputs_missing   # the complement of `inputs_seen`, and not a courtesy
    - note             # written by the CLI, NOT by the resolver — see `added_by`
    # §14 — the Thin Ability Link, read out of input 1. Every one of these is
    # derived from the catalogue the caller supplied plus the caller's own
    # words, and `abilities/resolver.py#THIN_LINK_RECORD_FIELDS` is the list
    # this must stay equal to; `tests/test_ability_resolver.py` asserts it, and
    # asserts that every name appears in this file, so a field cannot be added
    # to the code without being declared here.
    #
    # Three of the seven are absent from a resolution that named no catalogue
    # and from one answered against a file of names — §14's fields answer a
    # question that only the authority can be asked, and "nobody asked" is
    # `product_role_state: UNKNOWN` rather than a null per field.
    - product_role_state  # DECLARED | UNDECLARED | AMBIGUOUS | UNKNOWN
    - semantic_owner      # `product_role.primary` — the L2 that owns it, e.g. `B6`
    - realization_role    # core | primary-skill | specialist | provider | packaging
    - cross_refs          # the other L2s this ability is used with
    - subroles            # the named sub-abilities it fills
    - subrole             # the verb on the reference, when it IS a declared subrole
    - human_boundary      # `authority.human_required`; `[]` means "declared, none"
  # Every candidate, always the same shape — a candidate set whose rows have
  # different keys cannot be read as a table, and `resolve` builds each one from
  # the same literal. Declared because `candidates` above only says the list
  # exists, and until 2026-10-06 nothing said what a row was made of: three of
  # these fields were added in this round (`installed`, `why_candidate`, and
  # `runtime_features_state`) with no table to be out of date against.
  candidate_fields:
    - provider              # the provider id this row is about
    - status                # this candidate's own standing, never the record's
    - reason                # from the same closed list; null when AVAILABLE
    - detail
    - refused_by            # WHICH of the eight inputs said no (§14's `binding_ready`)
    - unevaluated           # inputs that could not be read for THIS candidate
    - finding
    - preference            # the provider's declared ordering weight
    - installed             # instance registered here: true | false | null(unasked)
    - why_candidate         # which declared table put it in the set
    - operations_state      # SUPPORTED | UNSUPPORTED | UNKNOWN | null(no verb named)
    - runtime_features_state
  # Who writes which field, where it matters. `note` is here because a reader
  # of the contract would otherwise conclude the resolver never emits it and
  # 'fix' the record by deleting it.
  added_by:
    note: >
      `runtime/cli.py`'s `cmd_ability_resolve`, and only when input 1 came from
      a named provenance (`--ability-repo`/`--ability-rev` or
      `--catalogue`). The resolver is pure and reads a catalogue it cannot
      attribute, so the provenance sentence is minted by the layer that knows
      it. It is declared here rather than in a CLI-local shape because a caller
      reading one record should not have to know which of two modules wrote
      which key.
  forbidden_fields:
    - "a credential, token, cookie, or key"
    - "an absolute path"   # paths are resolved per device, never embedded
  invariants:
    - "status is never AVAILABLE without a chosen provider, except for a
       `builtin` provider, where the provider is named `builtin`."
    - "reason is present for every status other than AVAILABLE and UNKNOWN, and
       is drawn from the resolver's own closed list
       (`abilities/resolver.py#REASONS`).
       That list is NOT the provider contract's `status.reasons`, and the two
       must not be reconciled into one: the provider vocabulary answers whether
       a provider is there and answers, while ACTION_UNSUPPORTED answers whether
       it implements a named operation. A provider can be installed, healthy,
       and still refuse a verb — which is why that word cannot live in a
       vocabulary whose worst case is RUNTIME_UNHEALTHY. The two share six
       values; the provider contract holds two the resolver cannot emit, and the
       resolver holds one the provider contract must not declare."
    - "`ability` is always the BARE ability id, never the compound reference.
       The verb travels in `operation`, so that naming a verb cannot change the
       identity of the thing being resolved — and so that the catalogue and the
       provider records, both keyed by the bare id, are looked up correctly."
    - "`operation` is null when the caller named no verb, and in that case no
       candidate carries `operations_state` either. Absent, not SUPPORTED:
       'checked and agreed' and 'never in question' are different findings, and
       a default here would erase the difference on every ordinary request."
    - "An unasked operation does not reach `record.reason`. When the verb is
       UNKNOWN the status is UNKNOWN and the reason is null, and
       ACTION_UNSUPPORTED appears only on the candidate — the step's own entry.
       This is `target-contract.yaml`'s
       `reasons.support_unknown_shares_a_reason_because` applied to this record
       rather than re-decided here: an UNEVALUABLE verdict is not a REFUSAL, and
       one word carrying two meanings at one field is how a consumer that
       switches on `reason` reads 'nobody asked' as 'refused'. The distinction
       is not lost — it is in the candidate's `operations_state` and in the
       status, INCOMPATIBLE versus UNKNOWN."
    - "inputs_seen is always present. A resolution that could not see an input
       is UNKNOWN with the missing input named, never a confident answer
       computed from the inputs that happened to be readable."
    - "The field lists above are CLOSED, and this is now enforced rather than
       asserted. Every key the resolver can produce is in `required_fields` or
       `optional_fields`, every candidate row's keys are exactly
       `candidate_fields`, and the only declared field the resolver never
       produces is `note`, which `added_by` names a writer for.
       `tests/test_ability_resolver.py::CapabilityContractTests` drives the
       resolver through every branch it has and compares the union of what came
       back against this file — so a field added to the code without being
       declared here fails, and a declared field that stops being produced is
       named rather than quietly ignored. Until 2026-10-06 nothing read this
       file at all: it was four lists and seven invariants of prose, and four
       fields the resolver had been returning for as long as it has existed
       (`runtime`, `inputs_missing`, `detail`, `finding`) appeared in none of
       them. A contract with no reader and the code it describes are two
       documents, and the one that is wrong is the one a person reads."
    - "The Thin Ability Link grants nothing and denies nothing (§18). Its
       fields are read from input 1 and from the caller's own words, and they
       never reach `status`, `reason`, or a candidate's standing: a resolution
       is identical across every value of `product_role_state` except inside the
       link-owned fields themselves. `UNDECLARED` is a FINDING (§12: no silent
       orphan), not a refusal — an ability nothing declares a home for is still
       resolved, and the finding says only that. Nor is a disagreement a
       refusal: two records of one identity that name different owners resolve
       as `AMBIGUOUS` rather than being refused for the disagreement, because
       the resolver's job is to report which question is open, not to close it
       by picking a record. `tests/test_ability_resolver.py` asserts all four
       states against one baseline."
    - "`subrole` is decided by MEMBERSHIP in the ability's declared
       `product_role.subroles` and by nothing else — no similarity, no scoring,
       no model (§14: the resolver is not a planner). It is deliberately NOT
       the operation axis: a subrole is a responsibility the ability DECLARES
       it fills, while an operation is something a PROVIDER implements, so a
       subrole never makes an operation SUPPORTED and never appears in
       `candidates[].operations_state`. Letting the first answer for the second
       would turn a declaration into a capability, which is the transfer §18
       forbids."
    - "`runtime_compatible` and `binding_ready` are NOT fields of this record,
       although §14 names them. Both questions are already answered inside
       `candidates[]`, and a second spelling of an answer is how one question
       comes to have two answers that disagree. `runtime_compatible` is
       `candidates[].runtime_features_state` together with that candidate's
       `status`; `binding_ready` is the candidate's `refused_by`, which says
       WHICH device input refused — the sharper form, since `device_capability`,
       `device_profile` and `device_binding` all mean 'the binding is not ready
       here' and call for three different repairs. `candidates[].installed` is
       the same lookup at the one input that is specifically about installation,
       and it is three-valued — `null` where no instance inventory was supplied,
       never `false`, because 'nobody looked' is not 'not installed'."
    - "`candidates[].why_candidate` restates which declared table put the
       provider in the candidate set: that it declares the ability, whether it
       declares the named verb, and that the provider implements it. It is
       deterministic and it ranks nothing — three declared facts and the
       caller's own word go in, and the sentence names all three. It exists so
       a person reading a resolution can tell a candidate that was considered
       from one that was assumed (§14)."

# ---------------------------------------------------------------------------
# Degradation. The case that made this necessary: a device was reported as able
# to do something because a provider existed for it somewhere in the catalogue,
# while the provider actually reachable on that machine was a different one, or
# a floating one. A union of evidence reads as AVAILABLE; an intersection with
# a substitution rule reads as DEGRADED and says by what.
# ---------------------------------------------------------------------------
degradation:
  DEGRADED:
    - when: "the preferred provider is not available and a substitute is"
      because: "the work can be done, and not the way it was intended"
    - when: "the chosen provider has an unpinned dependency"
      because: >
        `npx @playwright/mcp@latest`. The provider exists, works, and cannot be
        said to be the same one tomorrow. Reporting it AVAILABLE would make
        "this machine can do browser automation" a claim about a registry's
        current resolution rather than about this machine.
    - when: "one health axis is UNKNOWN and no axis has failed"
      because: "not having asked is not the same as having found it fine"
  never:
    - "DEGRADED may not be used for a missing materialization. That is
       PROVIDER_NOT_INSTALLED, and it is UNAVAILABLE."

# ---------------------------------------------------------------------------
# Query surfaces. Two, with different costs, because the disclosure levels in
# `context/disclosure-contract.yaml` are only meaningful if the cheap one is
# genuinely cheap.
# ---------------------------------------------------------------------------
queries:
  count:
    answers: "how many abilities could this device exercise right now"
    cost: "one pass, no probes"
    discloses: L0
  list:
    answers: "which abilities, filtered by status or domain"
    cost: "one pass, no probes"
    discloses: L1
  resolve:
    answers: "one ability's full record"
    cost: "may run probes; the only query that touches the machine"
    discloses: L2
  resolve_all:
    answers: "the full resolved set with every input"
    cost: "runs every probe"
    discloses: L3
  rules:
    - "`count` never runs a probe. A number that costs a probe is a number a
       session will stop asking for."
    - "A query names the device it is about. There is no default device: the
       machine you are on is a defensible default for `resolve` and a dangerous
       one for `resolve_all`, and one shared default cannot be both."

# ---------------------------------------------------------------------------
# Uncertainty is propagated, never resolved by the resolver.
# ---------------------------------------------------------------------------
unknown_propagation:
  rule: >
    an input that cannot be read makes the result UNKNOWN, with the input
    named, unless a LATER input refuses — in which case the refusal wins,
    because a definite no outranks an indefinite yes.
  example: >
    device_profile UNBOUND (Windows, home role) and device_binding absent:
    the answer is UNAVAILABLE / PROVIDER_NOT_INSTALLED, not UNKNOWN. The
    binding is a definite no.
  because: >
    without this rule a device with nothing installed reports UNKNOWN for
    everything, which reads as "we have not looked" and hides the finding
    that nothing is there.

rules:
  - "The resolver is pure. Same records in, same record out, no clock, no
     filesystem, no network. Everything that touches the machine is a probe
     performed by the caller and passed in."
  - "An answer is always about one device at one time. There is no fleet-wide
     availability, only a fold over per-device answers that preserves UNKNOWN."
  - "UNKNOWN is never collapsed to UNAVAILABLE by a caller. A caller that does
     not handle UNKNOWN is a caller that will report a false negative as a
     decision."
  - "An operation is resolved against the PROVIDER, not the device, and only
     when the caller named one. A bare `ability:x` never consults a provider's
     `operations:` at all — if it did, every provider that declares no such
     table would answer UNKNOWN to an ordinary `#read`, and the operation axis
     would have withdrawn capabilities that already worked."
  - "A definite refusal outranks an unasked operation. A provider that declares
     no `operations:` does not refuse and does not return early: the eight
     inputs are consulted first, and only if none refuses does the unasked
     operation make the answer UNKNOWN. Returning early would let 'nobody asked
     about the verb' mask 'there is nothing installed here', and the reader
     would go looking for the wrong thing."
