# ServerOS ability packs.
#
# Why this file exists
# --------------------
# `plugin/profiles/linux-work.yaml` carries a `recommended:` list that names
# `document-stewardship` with a `status: missing` marker written beside it. The
# marker is honest and the list is still a pack naming an ability that is not
# there. Nothing failed, because nothing was checking.
#
# A pack answers "which abilities, together, for this purpose". It is not a
# composition (`plugin/bundle.yaml` decides what is packaged) and it is not a
# profile (`fleet/profiles.yaml` decides where things live). Keeping it a third,
# smaller thing is what stops it acquiring a payload and becoming a second
# composition.
schema: serveros/ability-pack.v1
version: 1

record:
  required_fields: [id, name, purpose, members, authority]
  optional_fields: [description, domain, note]
  forbidden_fields:
    - "a payload, a path, or a file"
    - "a version of its own"
  because: >
    a pack with a payload is a composition, and this product already has one
    composition authority. A pack with a version of its own would need to be
    released, and the abilities inside it already carry revisions.

member:
  shape:
    ability: "ability:<kebab-id>"
    # Whether this member is required or optional is the ONLY thing a pack may
    # say about criticality. A pack does not rank its members.
    role: required | optional
  resolution:
    # What it means when a member is not resolvable on the target device.
    required_unresolved: PARTIAL          # the pack is usable and incomplete
    all_required_unresolved: UNAVAILABLE
    never: "silently dropped"
  because: >
    dropping an unresolved member turns "this pack has nine of its ten members
    on this machine" into a support ticket. Reporting it turns it into a status,
    which is what the Ability Fabric is for.

# ---------------------------------------------------------------------------
# `authority` — the field `publishing.rule` needs and the record shape had no
# room for.
#
# It is REQUIRED, and that is a change. Until this round no pack carried one,
# which meant `publishing.rule` required a pin that no pack had and nothing
# compared the two. Making it required is not a new abstraction: it is the
# field the rule below already demanded, made visible enough to be checked.
# ---------------------------------------------------------------------------
authority:
  required_for_every_pack: true
  shape:
    repo: "ProfessorZhi/ability-management"
    revision: "the full commit sha the member ids were validated against"
  answers_as: [PIN_MATCH, PIN_MISMATCH, PIN_ABSENT]
  because: >
    the pin is what makes "every member exists" a claim about a catalogue
    rather than about whatever happened to be on disk. The pin is answered as
    a question of its OWN, reported for every pack including the ones whose
    members all resolve — because those are exactly the packs whose stale pin
    is invisible. A correct closure answer about the wrong catalogue reads
    identically to a correct one about the right one.

# ---------------------------------------------------------------------------
# The closure rule. This is the one that was being violated.
# ---------------------------------------------------------------------------
closure:
  rule: >
    every member id must exist in the pinned ability-management manifest at the
    revision the pack declares. A pack naming an ability that does not exist is
    refused at build time, not carried with a marker beside it.
  scope:
    members: enforced
    referenced_but_optional: reported
  because: >
    a `missing` marker is a comment. It is written by the person who already
    knows, read by nobody, and it does not stop the pack from being installed
    and a session from planning around a capability that is not there. The
    marker was accurate for as long as it existed; accuracy was never the
    problem.
  cost_note: >
    this makes a pack unbuildable when the catalogue moves under it, which is
    the intended failure. The repair is to fix the pack or fix the catalogue,
    and both are visible.
  decided_by: >
    `abilities/packs.py — resolve()`, called from `scripts/build.py`. This line
    is not decoration: the rule above was written first and implemented in no
    version of this product, and a `grep` for this filename over the ServerOS
    tree returned exactly one hit — this file. The rule was accurate the whole
    time; accuracy was never the problem.
  found: >
    run against the published catalogue, three of these four packs had a
    required member that resolved to nothing. `pack:cross-device-collaboration`
    named `shared-memory` and `fleet-coordination`, which existed in no
    manifest and no checkout anywhere; `pack:autonomous-quality-loop` and
    `pack:cross-device-collaboration` both named `runtime-management`, which
    exists at the published revision but not at every revision that was checked
    against it. That last one is the whole argument for the pin: the same pack,
    the same members, two catalogues, two different answers, and no way to tell
    which one a reader was looking at.

# ---------------------------------------------------------------------------
# Packs are declarative and carry no payload, so publishing one is publishing
# names. That is what makes a pack safe to publish while the abilities inside it
# remain versioned elsewhere.
# ---------------------------------------------------------------------------
publishing:
  location: "ability-management, beside the manifest it names members from"
  substrate: git
  rule: >
    a published pack pins the ability-management revision its member ids were
    validated against. Without that pin the pack's closure was true of a
    catalogue that no longer exists.
  # The pin is no longer only a rule. Every pack below carries one, and
  # `abilities/packs.py` answers it independently of the members.
  #
  # OPEN, and named rather than left to be discovered: the packs are DECLARED
  # here, in serveros, and `location` says they belong in ability-management.
  # That sentence has never been true. Moving them is not a file move — it
  # needs a pack schema on the ability-management side and a reader that reads
  # the declarations from the pinned revision the same way `read_manifest()`
  # reads the manifest. Until that exists this file is the declaration and
  # ability-management is only the catalogue, which is a smaller claim than
  # the line above makes.
  location_status: DECLARED_NOT_IMPLEMENTED

# ---------------------------------------------------------------------------
# Intent packs, as declared. Each names abilities that EXIST at the pinned
# revision; the closure check is what keeps that sentence true.
#
# Note the members deliberately NOT included. `document-stewardship` and
# `reporting` are named by prose in several places and exist in no manifest, so
# they appear in no pack. An intent that needs them is a NEEDS_HUMAN finding
# against the catalogue, not a pack member with a marker.
#
# Every pack below carries `authority`. The revision is the same for all five
# because they are validated against one catalogue; a pack validated against a
# different one says so by carrying a different sha, and `packs.py` reports
# that as PIN_MISMATCH rather than silently comparing two things.
#
# §62 status: PUBLISHED for 95c31ed. That revision was pushed to
# `ProfessorZhi/ability-management` on 2026-09-13, both as the branch
# `serveros/srv-0007-ability-packs` and on `main` — the second of those is a
# requirement and not a convention, because `scripts/runtime_truth.py` decides
# provenance by reachability from `refs/heads/main`, so a revision that exists
# only on a feature branch still yields PIN_NOT_CANONICAL.
#
# §63 status: NOT YET CANONICAL, and named rather than hidden. The pin above is
# `7bc7687`, which is a descendant of 95c31ed and adds the two abilities this
# round's pack needs. `git branch -r --contains 7bc7687` returns nothing, so the
# pin exists on no remote and `canonical_provenance()` reports
# PIN_NOT_CANONICAL for every pack in this file. That is a true statement about
# the world and the correct output; the alternative — pinning the canonical
# 95c31ed and leaving `human-control` out of the pack — would have produced a
# green closure check about a catalogue that cannot serve the pack, which is the
# exact failure this whole file was written to stop.
#
# The repair is smaller than "publish this work", and the difference matters to
# whoever does it. The pin's PARENT `f97a43b` is already on `origin/main`, and
# that revision's manifest already declares both abilities — so a reader who
# fetched today would find the pack closed one commit behind the pin. What
# `f97a43b` does not have is the regenerated manifest: `7bc7687` is exactly
# `f97a43b` plus the canonical generator run this round's §5 required, and
# pinning `f97a43b` instead would ship the un-regenerated fingerprints that
# commit exists to fix. So the remaining step is to push `7bc7687`, not to
# invent anything.
#
# The push is necessary and NOT sufficient, and the difference has now been
# measured rather than reasoned about. `canonical_provenance()` runs
# `git rev-parse refs/heads/main` against the LOCAL checkout and never fetches —
# there is no `fetch` anywhere in `scripts/runtime_truth.py`. So a push moves
# the remote and leaves the ref the check reads exactly where it was. Re-running
# the check straight after a successful push reproduces PIN_NOT_CANONICAL, and
# the output is indistinguishable from the push having failed. Somebody who
# pushes, sees the same red, and pushes again is not being careless — the tool
# gave them no way to tell the two apart. The repair is therefore push AND
# advance the local `refs/heads/main` (fetch, or `git branch -f main
# origin/main` in the canonical checkout), and whoever does it should confirm
# `git rev-parse refs/heads/main` reads `7bc7687` before believing the check.
# Measured 2026-09-13: pin `f97a43b` — already on `origin/main` — reports
# `PIN_NOT_CANONICAL` against `refs/heads/main` and `CURRENT` against
# `refs/remotes/origin/main`, which is the same defect visible before any push.
#
# One drift observed while checking this and NOT acted on: the local
# `refs/heads/main` in both the canonical checkout and the Item worktree still
# reads 95c31ed, while `origin/main` has moved to f97a43b. `canonical_provenance()`
# reads the local ref, so it will keep answering PIN_NOT_CANONICAL for f97a43b
# itself until somebody fetches. A verdict that a pin is non-canonical is
# therefore only as current as the local clone, and in this state it says
# nothing about what is on the remote. Updating a canonical checkout's refs is
# not something this round does.
#
# Before the push this line said the revision had NOT been pushed, and the pin
# named an unreadable commit. That was written down rather than omitted so the
# obligation stayed legible; it is now written down in the other direction for
# the same reason. A pin whose status is not recorded is a pin whose status is
# re-derived — usually wrongly — by whoever reads it next.
# ---------------------------------------------------------------------------
packs:
  - id: pack:autonomous-quality-loop
    name: Autonomous quality loop
    purpose: >
      a work item that develops, tests itself, reacts to the result, and does
      not need a person to notice that it stopped.
    authority:
      repo: ProfessorZhi/ability-management
      revision: 7bc768709ec93c9264b078f5d72b9dbed735cb43
    members:
      - {ability: "ability:work-management", role: required}
      - {ability: "ability:runtime-management", role: required}
      - {ability: "ability:test-management", role: required}
      - {ability: "ability:quality-feedback-and-iteration", role: required}
      - {ability: "ability:implementation-delivery", role: required}

  - id: pack:litellm-development
    name: LiteLLM development
    purpose: "plan, build, image, test and report a LiteLLM-side change."
    authority:
      repo: ProfessorZhi/ability-management
      revision: 7bc768709ec93c9264b078f5d72b9dbed735cb43
    members:
      - {ability: "ability:technical-architecture-and-planning", role: required}
      - {ability: "ability:backend-solution-design", role: required}
      - {ability: "ability:implementation-delivery", role: required}
      - {ability: "ability:test-management", role: required}
      - {ability: "ability:quality-feedback-and-iteration", role: optional}

  - id: pack:cross-device-collaboration
    name: Cross-device collaboration
    purpose: >
      the same work item picked up on a second device, with the memory and the
      running resources it needs, and without re-establishing either.
    authority:
      repo: ProfessorZhi/ability-management
      revision: 7bc768709ec93c9264b078f5d72b9dbed735cb43
    members:
      - {ability: "ability:work-management", role: required}
      - {ability: "ability:runtime-management", role: required}
      - {ability: "ability:shared-memory", role: required}
      - {ability: "ability:fleet-coordination", role: required}

  - id: pack:agent-orchestration
    name: Agent orchestration
    purpose: >
      pick up a piece of work on a machine, hand it to an agent runtime, watch
      the session that results, and keep enough memory that a second session
      does not start from nothing.
    description: >
      The pack the HumanControlProvider vertical slice runs on. Two of its six
      members did not exist as abilities until this round — `human-control` and
      `agent-session-management` — which is why this pack and their first
      revision land together. The other four were already here and are what
      makes the slice a slice of THIS product rather than a new one: the
      session it drives is a Work Item, the runtimes it chooses between are
      described by `runtime-management`, and the memory a resumed session
      inherits arrives through `shared-memory`.
    note: >
      `fleet-coordination` is a required member and is not yet exercisable: this
      slice is explicitly the single-device path, and the cross-device verbs it
      would supply are absent rather than stubbed. It is required anyway,
      because the Session ref format already carries `device_ref` and the pack
      that describes this work should say what the work is, not how far it has
      been built. A pack that dropped the member until the feature landed would
      report CLOSED for an intent it cannot yet serve.
    authority:
      repo: ProfessorZhi/ability-management
      revision: 7bc768709ec93c9264b078f5d72b9dbed735cb43
    members:
      - {ability: "ability:agent-session-management", role: required}
      - {ability: "ability:human-control", role: required}
      - {ability: "ability:fleet-coordination", role: required}
      - {ability: "ability:shared-memory", role: required}
      - {ability: "ability:runtime-management", role: required}
      - {ability: "ability:work-management", role: required}

  - id: pack:quality-delivery
    name: Quality and delivery
    purpose: "the abilities a node needs to test, react, and report."
    authority:
      repo: ProfessorZhi/ability-management
      revision: 7bc768709ec93c9264b078f5d72b9dbed735cb43
    members:
      - {ability: "ability:test-management", role: required}
      - {ability: "ability:quality-feedback-and-iteration", role: required}
      - {ability: "ability:feishu-report", role: optional}

rules:
  - "A pack names abilities. It never names a provider, a device or a runtime —
     those are resolved, and a pack that names one has decided something it
     cannot know."
  - "A pack is not a composition. Composing a pack means composing its members,
     through the composition mechanism that already exists."
  - "Two packs may share a member. That is not a conflict; there is one copy of
     every ability and a pack holds names."
