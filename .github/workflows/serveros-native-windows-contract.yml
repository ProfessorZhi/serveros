# Hosted Windows build and local named-pipe/journal tests. No SCM/task action,
# installation, credential access, remote endpoint, or user's device is used.
# Green means HOSTED_WINDOWS_BUILD/LOCAL_IPC, never REAL_DEVICE/CLIENT_E2E.
name: serveros-native-windows-contract

on:
  pull_request:
    paths:
      - "native/node-core/windows-core/**"
      - "native/node-core/contract/windows-core-status.v1.schema.json"
      - ".github/workflows/serveros-native-windows-contract.yml"

permissions:
  contents: read

concurrency:
  group: serveros-native-windows-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  windows-contract:
    name: MSVC contract build and unit suites
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out the pull request head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Record the exact source revision
        shell: pwsh
        run: |
          git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw "git rev-parse failed" }

      - name: Show the toolchain
        shell: pwsh
        run: |
          cmake --version
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path -LiteralPath $vswhere) {
            & $vswhere -latest -products * -property installationVersion
            & $vswhere -latest -products * -property installationPath
          } else {
            Write-Host "vswhere not present"
          }

      # No -G: the hosted image decides which Visual Studio it ships, and a
      # version written here would be the thing that goes stale. CMake's default
      # Windows generator is the installed Visual Studio, and the configure log
      # names the MSVC it found.
      - name: Configure the standalone Windows contract
        shell: pwsh
        run: |
          cmake -S native/node-core/windows-core -B build-windows -A x64
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }

      - name: Build under _WIN32 and prove the binaries exist
        shell: pwsh
        run: |
          cmake --build build-windows --config Release --parallel 1
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed" }
          $exes = @(
            "build-windows/Release/test_windows_scm_status.exe",
            "build-windows/Release/test_windows_core_source_contract.exe",
            "build-windows/Release/test_windows_status_document.exe",
            "build-windows/Release/test_windows_recovery.exe",
            "build-windows/Release/test_windows_named_pipe.exe",
            "build-windows/Release/windows-core-status.exe",
            "build-windows/Release/windows-core-watch.exe",
            "build-windows/Release/test_windows_watch.exe"
          )
          foreach ($exe in $exes) {
            if (-not (Test-Path -LiteralPath $exe)) {
              throw "missing compiled test binary: $exe"
            }
            Write-Host "compiled binary present: $exe"
          }

      - name: Run policy and local IPC suites
        shell: pwsh
        run: |
          ctest --test-dir build-windows -C Release --output-on-failure -V
          if ($LASTEXITCODE -ne 0) { throw "ctest failed" }

      - name: Package and start the extracted static candidate
        shell: pwsh
        run: |
          cmake --build build-windows --config Release --target package --parallel 1
          if ($LASTEXITCODE -ne 0) { throw "package failed" }
          $zip = Get-ChildItem -LiteralPath build-windows -Filter 'serveros-windows-core-*-win64.zip' | Select-Object -First 1
          if (-not $zip) { throw "versioned package missing" }
          $unpacked = Join-Path $env:RUNNER_TEMP 'serveros-core-package-smoke'
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $unpacked
          $manifest = Get-ChildItem -LiteralPath $unpacked -Filter manifest.json -Recurse | Select-Object -First 1
          if (-not $manifest) { throw "manifest missing" }
          $metadata = Get-Content -LiteralPath $manifest.FullName -Raw | ConvertFrom-Json
          $expected = (git rev-parse HEAD).Trim()
          if ($metadata.source_revision -ne $expected -or $metadata.static_runtime -ne 'ON') { throw "package identity mismatch" }
          $binary = Join-Path $manifest.Directory.FullName 'bin/windows-core-watch.exe'
          $readback = & $binary --version | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $readback.source_revision -ne $expected) { throw "extracted binary readback failed" }
          $fixture = @{ schema='serveros/windows-core-desired.v1'; node='device:hosted-package-fixture'; principal=[System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value; generation=2; observe_only=$true; services=@() } | ConvertTo-Json -Compress
          $fixture | & $binary configure
          if ($LASTEXITCODE -ne 0) { throw "extracted config publisher failed" }
          $stdout = Join-Path $env:RUNNER_TEMP 'serveros-core-watch-smoke.stdout'
          $stderr = Join-Path $env:RUNNER_TEMP 'serveros-core-watch-smoke.stderr'
          $watch = Start-Process -FilePath $binary -ArgumentList 'console' -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            Start-Sleep -Seconds 2
            if ($watch.HasExited) { throw "extracted watch exited: $(Get-Content -LiteralPath $stderr -Raw)" }
            $status = Join-Path $env:LOCALAPPDATA 'ServerOS/Core/watch-status.v1.json'
            $snapshot = Get-Content -LiteralPath $status -Raw | ConvertFrom-Json
            if ($snapshot.schema -ne 'serveros/windows-core-status.v1') { throw "watch snapshot missing" }
          } finally {
            if (-not $watch.HasExited) { Stop-Process -InputObject $watch -Force }
          }
          $hash = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($zip.Name)" | Set-Content -LiteralPath ($zip.FullName + '.sha256') -Encoding ascii
          Write-Host "HOSTED_WINDOWS_PACKAGE_START: PASS $hash"

      - name: Preserve the complete Windows candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-core-static-candidate
          path: |
            build-windows/serveros-windows-core-*-win64.zip
            build-windows/serveros-windows-core-*-win64.zip.sha256
          if-no-files-found: error
