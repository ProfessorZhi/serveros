# cmake+ctest over native/node-core, plus the daemon and native-facts suites.
# (Was 189 lines: hand-built venv, deadline loop, taskset, ulimit, 8 evidence files.)
name: serveros-native-linux-contract

on:
  pull_request:
    paths: &paths
      - 'native/node-core/**'
      - 'runtime/native_core_facts.py'
      - 'runtime/daemon.py'
      - 'tests/test_daemon.py'
      - 'tests/test_native_core_facts.py'
      - '.github/scripts/hosted_daemon_inputs.py'
      - 'tests/test_hosted_daemon_inputs.py'
      - '.github/workflows/serveros-native-linux-contract.yml'
  push:
    branches: [main]  # was 'test/fleet-v1-complete-*', a prefix no branch matches
    paths: *paths

permissions:
  contents: read

jobs:
  native-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - { uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683, with: { persist-credentials: false } }
      - name: Configure, build and test the native tree
        run: |
          set -euo pipefail
          cmake -S native/node-core -B build-native
          cmake --build build-native --parallel 2
          ctest --test-dir build-native --output-on-failure
  hosted-daemon:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - { uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683, with: { persist-credentials: false } }
      - { uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065, with: { python-version: '3.12' } }
      - run: python -m pip install --disable-pip-version-check 'pytest==9.1.1' 'PyYAML==6.0.2'
      - name: Run the daemon and native-facts suites
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: ${{ github.workspace }}/runtime:${{ github.workspace }}
        run: |
          set -euo pipefail
          umask 077; work="$(mktemp -d)"; trap 'rm -rf "$work"' EXIT   # 077: the private-file rule reads mode bits
          python .github/scripts/hosted_daemon_inputs.py --work-root "$work" --evidence-dir "$work" --github-env "$GITHUB_ENV"
          python -m pytest -q -p no:cacheprovider -o addopts='' tests/test_daemon.py tests/test_native_core_facts.py tests/test_hosted_daemon_inputs.py
