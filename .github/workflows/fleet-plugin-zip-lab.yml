name: Fleet Plugin ZIP Lab
on:
  pull_request:
    paths:
      - plugins/serveros-fleet-zip-lab-20261014/**
      - scripts/build_fleet_plugin_zip.py
      - .github/workflows/fleet-plugin-zip-lab.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build deterministic plugin ZIP
        run: python3 scripts/build_fleet_plugin_zip.py plugins/serveros-fleet-zip-lab-20261014
      - name: Inspect plugin source and archive
        run: |
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          p=Path('plugins/serveros-fleet-zip-lab-20261014/plugin.json')
          m=json.loads(p.read_text())
          f=Path('dist')/f'{m["name"]}-v{m["version"]}.zip'
          with zipfile.ZipFile(f) as z:
              names=z.namelist()
              assert 'plugin.json' in names
              assert sum(n.endswith('/SKILL.md') for n in names)==2
              assert '.app.json' not in names and 'mcp.json' not in names
          print(f'OK: {f}, {len(names)} files')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fleet-plugin-zip-lab
          path: dist/*.zip
          if-no-files-found: error
