# The whole test suite, on a machine that is not a ServerOS node.
#
# `scripts/hermetic_tests.py` binds every node root inside a throwaway
# directory (the same seam serveros-native-linux-contract.yml uses), pins the
# node's umask and time zone, and runs pytest. `tests/hermetic-known-failures.txt`
# lists the tests that cannot pass off a node or already fail on main; a run
# fails only on a failure that file does not list. Reproduce any shard locally:
#
#   python3 scripts/hermetic_tests.py --baseline tests/hermetic-known-failures.txt \
#       --shard 2/4 -n auto
#
# Two sibling trees are read by some tests: ability-management and the ops tree,
# which has lived in hwz-records/ops since hwz-ops was merged there. Both are
# private, so checking them out needs the repository secret SIBLING_REPOS_TOKEN
# (a fine-grained token with read access to ability-management and hwz-records;
# a token that still only reaches the archived hwz-ops keeps working, see the
# fallback below). Without it the tests that need them say which is missing.
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes the older run worthless; a push
# to main is evidence and is never cancelled.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plugin:
    name: Claude Code plugin matches its source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.2' 'pytest==9.1.1'
      - name: The committed plugin is the one its Skills generate
        run: python3 scripts/fleet_plugin.py check
      - name: Every client distribution (Claude Code, Codex, ChatGPT) matches the shared source
        run: python3 distribution/build.py check
      - name: Device kits match devices.yaml
        run: python3 distribution/device_kit.py check
      - name: Every client package builds
        run: |
          for client in openai codex claude-code mcp; do
            python3 distribution/build.py zip --client "$client" --out "$RUNNER_TEMP/dist"
          done
      - name: Plugin and Skill tests
        run: >
          python3 -m pytest -q -p no:cacheprovider
          tests/test_fleet_plugin_marketplace.py tests/test_fleet_operator_skills.py
          tests/test_fleet_cc_dev_plugin_client_e2e_gate.py tests/test_fleet_cc_release_adapter.py
          tests/test_fleet_v1_first_install.py tests/test_fleet_distribution.py tests/test_fleet_device_kits.py

  suite:
    name: Suite (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      SIBLING_TOKEN: ${{ secrets.SIBLING_REPOS_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: serveros
          persist-credentials: false
      - name: Check out ability-management next to it
        if: env.SIBLING_TOKEN != ''
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ProfessorZhi/ability-management
          path: ability-management
          token: ${{ env.SIBLING_TOKEN }}
          # The tests read pinned revisions out of its history.
          fetch-depth: 0
          persist-credentials: false
      - name: Check out hwz-records (the ops tree) next to it
        id: records
        if: env.SIBLING_TOKEN != ''
        continue-on-error: true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ProfessorZhi/hwz-records
          path: hwz-records
          token: ${{ env.SIBLING_TOKEN }}
          sparse-checkout: ops
          persist-credentials: false
      - name: Fall back to the archived hwz-ops
        if: env.SIBLING_TOKEN != '' && steps.records.outcome != 'success'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ProfessorZhi/hwz-ops
          path: hwz-ops
          token: ${{ env.SIBLING_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: >
          python3 -m pip install --disable-pip-version-check
          'PyYAML==6.0.2' 'pytest==9.1.1' 'pytest-xdist==3.8.0' 'cryptography==50.0.1'
      - name: Run shard ${{ matrix.shard }} against throwaway node roots
        working-directory: serveros
        run: >
          python3 scripts/hermetic_tests.py
          --baseline tests/hermetic-known-failures.txt
          --shard ${{ matrix.shard }}/4
          -q -n auto --dist loadfile --continue-on-collection-errors
