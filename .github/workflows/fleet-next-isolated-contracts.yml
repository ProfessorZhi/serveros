name: Fleet Next isolated canary contracts

# WHY THIS FILE'S `paths:` LOOKS THE WAY IT DOES
# ----------------------------------------------
# A path filter fails silently. When it does not match, GitHub runs nothing and
# reports nothing — not a skip, not a red, an absence. Wave 16's release
# preflight (#502) and Wave 17's sidecar release (#506) each added an
# `integrations/fleet-next-*` directory and the test file that proves it, and
# neither is named below, so this workflow never ran on either PR. Their check
# lists show the five `Tests` jobs only; a reader cannot tell the contract is
# NOT_RUN.
#
# The filter therefore names *families* that belong to Fleet Next and nothing
# else. Widening a family to cover its next wave is a one-line change here; a
# pattern that matches the repository is not a filter (`tests/test_fleet_next_ci_path_coverage.py`
# refuses one).
#
# The second half of the same false green is collection: `unittest discover`
# prints `Ran 0 tests ... OK` for a file that is not in the tree. Every job
# below asserts a collected-test floor, and the composition job asserts the
# exact count and refuses a skipped result.
on:
  pull_request:
    paths:
      - 'fleet_mcp/deploy/next_*'
      - 'fleet_mcp/deploy/serveros-fleet-next-mcp.service'
      - 'fleet_mcp/runtime_create_policy.py'
      - 'fleet_mcp/config.py'
      - 'fleet_mcp/fleet.py'
      - 'tests/test_fleet_next_*.py'
      - 'tests/test_fleet_runtime_create_policy.py'
      - 'tests/test_fleet_create_session_runtime.py'
      - 'integrations/fleet-next-*/**'
      - 'docs/integration/FLEET-NEXT-*.md'
      - 'docs/fleet-next-runtime-model-defaults.md'
      - '.github/workflows/fleet-next-isolated-contracts.yml'
  push:
    branches:
      - 'main'
      # A `push` run of the source commit is what the Waves' 5/5 claim is read
      # from; the pull_request run is a merge commit and cannot stand in for it.
      - 'feat/fleet-next-*'
      - 'qa/fleet-next-*'
      - 'fix/fleet-next-*'
      - 'ci/fleet-next-*'
    paths:
      - 'fleet_mcp/deploy/next_*'
      - 'fleet_mcp/deploy/serveros-fleet-next-mcp.service'
      - 'fleet_mcp/runtime_create_policy.py'
      - 'fleet_mcp/config.py'
      - 'fleet_mcp/fleet.py'
      - 'tests/test_fleet_next_*.py'
      - 'tests/test_fleet_runtime_create_policy.py'
      - 'tests/test_fleet_create_session_runtime.py'
      - 'integrations/fleet-next-*/**'
      - 'docs/integration/FLEET-NEXT-*.md'
      - 'docs/fleet-next-runtime-model-defaults.md'
      - '.github/workflows/fleet-next-isolated-contracts.yml'
  workflow_dispatch:

# Superseded pull-request runs cancel each other: the head that matters is the
# newest one, and the composition job clones history that two queued runs would
# clone twice. A push to `main` is never cancelled mid-flight — that run is
# evidence, not a draft.
concurrency:
  group: fleet-next-isolated-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  runner-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm the hosted runner can start
        run: |
          python3 --version
          printf 'runner started; no repository secrets or runtime operations used\n'

  offline-unit-contracts:
    name: offline contracts on the exact head
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # `pull_request` checks out the merge commit by default, which is not the
      # head the PR's checks are read from. Ask for the head explicitly and then
      # prove the checkout is it.
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exactly this head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.EXPECTED_HEAD }}
          persist-credentials: false
          # Some contracts read a commit that is not this branch's tip; a
          # shallow clone would turn that into a FAIL about the clone.
          fetch-depth: 0

      - name: Prepare test log
        run: mkdir -p test-output

      - name: Prove the checkout is the head this run names
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          {
            printf 'expected=%s\n' "$EXPECTED_HEAD"
            printf 'checked_out=%s\n' "$head_sha"
          } | tee test-output/head.log
          if [ "$head_sha" != "$EXPECTED_HEAD" ]; then
            printf 'FAIL_HEAD_MISMATCH: this run names %s but checked out %s\n' \
              "$EXPECTED_HEAD" "$head_sha" | tee -a test-output/head.log
            exit 1
          fi

      - name: Install bounded Python test dependency
        run: python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.2'

      - name: Check Python syntax
        shell: bash
        run: |
          set -euo pipefail
          {
            for source in \
              fleet_mcp/deploy/next_dual_stack_preflight.py \
              fleet_mcp/deploy/next_install.py \
              fleet_mcp/runtime_create_policy.py \
              fleet_mcp/config.py \
              fleet_mcp/fleet.py \
              tests/test_fleet_next_install.py \
              tests/test_fleet_next_dual_stack_preflight.py \
              tests/test_fleet_runtime_create_policy.py \
              tests/test_fleet_create_session_runtime.py \
              tests/test_fleet_next_ci_path_coverage.py
            do
              if [ ! -f "$source" ]; then
                printf 'NOT_RUN: required file missing: %s\n' "$source"
                printf 'required_file_missing %s\n' "$source" >> test-output/gate.status
                exit 2
              fi
              python3 -m py_compile "$source"
            done
          } 2>&1 | tee test-output/compile.log

      - name: Run every Fleet Next contract in this tree, with a collection floor
        shell: bash
        run: |
          set -uo pipefail
          : > test-output/gate.status
          failures=0

          # `unittest discover` answers `Ran 0 tests ... OK` for a file that is
          # not there, and a shard that collected nothing must never read as
          # green. Every file is therefore required to exist, to report at least
          # `floor` collected tests, and to exit zero.
          gate_file() {
            local file="$1"
            local floor="$2"
            local label
            label="$(basename "$file" .py)"
            local log="test-output/${label}.log"
            if [ ! -f "$file" ]; then
              printf 'FAIL_NO_FILE: %s is in the gated set but not in this tree\n' \
                "$file" | tee -a test-output/gate.status
              failures=$((failures + 1))
              return
            fi
            python3 -m unittest discover -s tests -p "$(basename "$file")" -v \
              >"$log" 2>&1
            local status=$?
            local collected
            collected="$(sed -nE 's/^Ran ([0-9]+) tests? in .*/\1/p' "$log" | tail -1)"
            collected="${collected:-0}"
            printf '%-64s exit=%s collected=%s floor=%s\n' \
              "$file" "$status" "$collected" "$floor" | tee -a test-output/gate.status
            if [ "$collected" -lt "$floor" ]; then
              printf 'FAIL_NO_COLLECTION: %s collected %s tests, floor is %s; ' \
                "$file" "$collected" "$floor" >> test-output/gate.status
              printf 'a file that collects nothing is absent, not passing\n' \
                >> test-output/gate.status
              failures=$((failures + 1))
            elif [ "$status" -ne 0 ]; then
              printf 'FAIL: %s exited %s\n' "$file" "$status" >> test-output/gate.status
              failures=$((failures + 1))
            fi
            cat "$log"
          }

          # The coverage check is gated first: it is the file that decides
          # whether a later `paths:` edit still covers what this workflow owns.
          gate_file tests/test_fleet_next_ci_path_coverage.py 10

          # Every other Fleet Next contract in the tree, discovered rather than
          # listed: a new Wave adds its test file and is collected here without
          # editing this workflow, which is the point of the path families.
          # `*_ledger.py` is excluded by name: those record author commits that
          # live on other branches and are gated by the RC's own ledger run.
          shopt -s nullglob
          discovered=(tests/test_fleet_next_*.py)
          shopt -u nullglob
          if [ "${#discovered[@]}" -eq 0 ]; then
            printf 'FAIL_NO_COLLECTION: no tests/test_fleet_next_*.py in this tree\n' \
              | tee -a test-output/gate.status
            failures=$((failures + 1))
          fi
          for file in "${discovered[@]}"; do
            case "$file" in
              *_ledger.py)
                printf '%-64s SKIPPED_BY_NAME (author history, not this tree)\n' \
                  "$file" | tee -a test-output/gate.status
                continue
                ;;
              tests/test_fleet_next_ci_path_coverage.py)
                continue
                ;;
            esac
            gate_file "$file" 1
          done

          if [ "$failures" -ne 0 ]; then
            printf 'FAIL: %s gated file(s) did not collect or did not pass\n' \
              "$failures" | tee -a test-output/gate.status
            exit 1
          fi
          printf 'PASS: every gated Fleet Next contract collected and passed\n' \
            | tee -a test-output/gate.status

      - name: Preserve bounded offline test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-next-test-output
          path: test-output/*.log test-output/gate.status
          retention-days: 2
          if-no-files-found: warn

  composition-runtime-tick:
    name: 'composition #493 runtime:tick × #498/#503 — 3 tests, no skip'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The one tree in this repository where #493's monitor package sits beside
      # #498's activation wrapper and #503's corrected clock ABI. It is a commit
      # and not a branch: a branch moves, and a gate that follows one measures
      # whatever it points at today. Re-pinning is a reviewed diff.
      COMPOSITION_SHA: '05da04f8c78f302b029c6304ed96f4e8ded5fc9b'
      EXPECTED_TESTS: '3'
      RUNTIME_TICK: 'tests/test_fleet_next_agent_monitor_activation_runtime_tick.py'
      MONITOR_RUNTIME: 'integrations/fleet-next-agent-monitor/fleet_next_agent_monitor/runtime.py'
      ACTIVATION: 'integrations/fleet-next-agent-monitor-activation/activation.py'
    steps:
      - name: Check out the pinned composition by exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.COMPOSITION_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prove the checkout is the pinned commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-output
          head_sha="$(git rev-parse HEAD)"
          {
            printf 'pinned=%s\n' "$COMPOSITION_SHA"
            printf 'checked_out=%s\n' "$head_sha"
          } | tee test-output/composition-identity.log
          if [ "$head_sha" != "$COMPOSITION_SHA" ]; then
            printf 'BLOCKED_COMPOSITION_SHA: asked for %s, checked out %s.\n' \
              "$COMPOSITION_SHA" "$head_sha" | tee -a test-output/composition-identity.log
            printf 'The pin is unreachable (force-push, deleted branch or GC).\n' \
              >> test-output/composition-identity.log
            printf 'Re-pin by reviewed diff; a substitute tree is not accepted.\n' \
              >> test-output/composition-identity.log
            exit 1
          fi

      - name: Prove the composition is in the tree, or refuse
        shell: bash
        run: |
          set -euo pipefail
          for required in "$MONITOR_RUNTIME" "$ACTIVATION" "$RUNTIME_TICK"; do
            if [ ! -f "$required" ]; then
              printf 'BLOCKED_COMPOSITION: %s is absent at %s.\n' \
                "$required" "$COMPOSITION_SHA" | tee -a test-output/composition-identity.log
              printf 'The composed source cannot be built in one checkout.\n' \
                >> test-output/composition-identity.log
              printf 'No stub, no override of the core root, no download, no green.\n' \
                >> test-output/composition-identity.log
              exit 1
            fi
          done
          printf 'composition present: monitor runtime, activation wrapper, runtime-tick regression\n' \
            | tee -a test-output/composition-identity.log

      - name: Assert the collection holds exactly the expected tests
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNTIME_TICK" "$EXPECTED_TESTS" <<'PY' 2>&1 | tee test-output/collection.log
          import importlib.util
          import sys
          import unittest

          path, expected = sys.argv[1], int(sys.argv[2])
          spec = importlib.util.spec_from_file_location("runtime_tick", path)
          module = importlib.util.module_from_spec(spec)
          sys.modules["runtime_tick"] = module
          spec.loader.exec_module(module)
          suite = unittest.TestLoader().loadTestsFromModule(module)

          def walk(node):
              """`loadTestsFromModule` nests one suite per TestCase class."""
              for item in node:
                  if isinstance(item, unittest.TestSuite):
                      yield from walk(item)
                  else:
                      yield item.id()

          ids = list(walk(suite))
          print(f"collected={len(ids)} expected={expected}")
          for one in ids:
              print(f"  {one}")
          if len(ids) != expected:
              raise SystemExit(
                  f"FAIL_NO_COLLECTION: collected {len(ids)} tests, the "
                  f"composition contract is {expected}")
          PY

      - name: Run the composed runtime-tick regression and refuse a skip
        shell: bash
        run: |
          set -uo pipefail
          log=test-output/runtime-tick.log
          status=0
          timeout 420s python3 -m unittest discover -s tests \
            -p 'test_fleet_next_agent_monitor_activation_runtime_tick.py' -v \
            >"$log" 2>&1 || status=$?
          tail -n 60 "$log"
          if [ "$status" -ne 0 ]; then
            printf 'FAIL: the composed runtime-tick regression exited %s\n' "$status"
            exit 1
          fi
          # A skip here means the composition was not built: #493's package is
          # absent, or the host cannot import it. `OK (skipped=3)` is exactly the
          # reading #503 was opened to remove, so it is a failure, not a pass.
          if grep -qE 'skipped=' "$log"; then
            printf 'FAIL_SKIPPED_COMPOSITION: the composed regression skipped tests; '
            printf 'a skipped composition is NOT a passing one\n'
            grep -nE 'skipped' "$log" | head -20
            exit 1
          fi
          if ! grep -qE '^Ran 3 tests in ' "$log"; then
            printf 'FAIL_NO_COLLECTION: the run did not report `Ran 3 tests`\n'
            exit 1
          fi
          if ! grep -qx 'OK' "$log"; then
            printf 'FAIL: the run did not end in `OK`\n'
            exit 1
          fi
          printf 'PASS: 3 composed runtime-tick tests ran, none skipped\n' \
            | tee test-output/pass.log

      - name: Preserve composition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-next-composition-${{ env.COMPOSITION_SHA }}
          path: test-output/*.log
          retention-days: 7
          if-no-files-found: warn
