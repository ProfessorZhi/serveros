# The downloadable ServerOS Fleet release: one rolling `fleet-latest` GitHub
# Release, rebuilt from main on every merge that touches what it carries.
#
#   serveros-fleet-openai-v<ver>.zip       ChatGPT web + Codex desktop (bound to the registered App)
#   serveros-fleet-codex-v<ver>.zip        Codex CLI
#   serveros-fleet-claude-code-v<ver>.zip  Claude Code
#   serveros-fleet-mcp-v<ver>.zip          any other MCP agent (mcp.json + skills/)
#   install.sh / install.ps1               one-command install / update on a machine
#   serveros-core-lite-windows-x64.zip     the Windows collector + status builder (MSVC, static)
#
# Two releases: `fleet-v<ver>` is created once per version and never replaced;
# `fleet-latest` is replaced on every run and also carries unversioned
# `serveros-fleet-openai.zip` / `serveros-fleet-mcp.zip`, whose links never change.
# Claude Code and Codex CLI do not need these zips: they install and update from
# the repository root, which is the `serveros-fleet` marketplace.
#
# On a pull request the same assets are built and kept as workflow artifacts,
# so a broken package is caught before it can be released. Only a push to main
# (or a manual run) replaces the release.
name: fleet-release

on:
  push:
    branches: [main]
    paths:
      - "distribution/**"
      - "integrations/fleet-v1-first-install/plugin/**"
      - "native/node-core/**"
      - ".github/workflows/fleet-release.yml"
  pull_request:
    paths:
      - "distribution/**"
      - "integrations/fleet-v1-first-install/plugin/**"
      - "native/node-core/**"
      - ".github/workflows/fleet-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fleet-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugins:
    name: Client plugin packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.2'
      - name: Every client tree matches the shared source
        run: python3 distribution/build.py check
      - name: Package the three clients
        run: |
          for client in openai codex claude-code mcp; do
            python3 distribution/build.py zip --client "$client" --out dist
          done
          cp distribution/install/install.sh distribution/install/install.ps1 dist/
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: |
            dist/*.zip
            dist/install.sh
            dist/install.ps1
          if-no-files-found: error

  windows-collector:
    name: Windows collector package
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build with MSVC
        shell: pwsh
        run: |
          cmake -S native/node-core/core-lite/windows -B build-cl -A x64
          if ($LASTEXITCODE -ne 0) { throw "configure failed" }
          cmake --build build-cl --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "build failed" }
      - name: Package and smoke-run what was packaged
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg, dist | Out-Null
          Copy-Item build-cl/Release/serveros-node-resource-snapshot.exe, build-cl/Release/core-lite-status.exe pkg/
          "commit $env:GITHUB_SHA" | Set-Content pkg/SOURCE.txt
          Compress-Archive -Path pkg/* -DestinationPath dist/serveros-core-lite-windows-x64.zip
          Expand-Archive dist/serveros-core-lite-windows-x64.zip -DestinationPath smoke
          & smoke/serveros-node-resource-snapshot.exe --version
          if ($LASTEXITCODE -ne 0) { throw "the packaged collector does not run" }
          & smoke/serveros-node-resource-snapshot.exe --compact | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "the packaged collector could not take a snapshot" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-collector
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish fleet-latest
    if: github.event_name != 'pull_request'
    needs: [plugins, windows-collector]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish fleet-v<version> (once) and replace fleet-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import json;print(json.load(open('integrations/fleet-v1-first-install/plugin/plugin.json'))['version'])")
          {
            echo "ServerOS Fleet ${version}, built from \`${GITHUB_SHA}\` (main)."
            echo
            echo "**Claude Code / Codex CLI** install and update from GitHub (the repository root is the \`serveros-fleet\` marketplace): run \`install.sh\` / \`install.ps1\` once; later \`claude plugin marketplace update serveros-fleet && claude plugin update serveros-fleet@serveros-fleet\`, \`codex plugin marketplace upgrade serveros-fleet && codex plugin add serveros-fleet@serveros-fleet\`."
            echo
            echo "**ChatGPT web + Codex desktop**: upload the openai zip on the plugin page. Always-current link: https://github.com/ProfessorZhi/serveros/releases/download/fleet-latest/serveros-fleet-openai.zip"
            echo
            echo "| file | for |"
            echo "|---|---|"
            echo "| \`serveros-fleet-openai-v${version}.zip\` | ChatGPT web + Codex desktop: upload on the ServerOS Fleet plugin page (replaces it) |"
            echo "| \`serveros-fleet-claude-code-v${version}.zip\` | Claude Code (install.sh does this) |"
            echo "| \`serveros-fleet-codex-v${version}.zip\` | Codex CLI (install.sh does this) |"
            echo "| \`serveros-fleet-mcp-v${version}.zip\` | any other MCP agent: \`mcp.json\` + \`skills/\` |"
            echo "| \`install.sh\` / \`install.ps1\` | one-command install / update |"
            echo "| \`serveros-core-lite-windows-x64.zip\` | Windows devices: \`distribution/windows/update.ps1 -FromRelease -Apply\` |"
            echo
            echo "MCP server: https://fleet-v1.professorzhi.fun/mcp — sign in with account, password and one-time code. SHA-256:"
            echo
            echo '```'
            (cd dist && sha256sum *)
            echo '```'
          } > notes.md
          if ! gh release view "fleet-v${version}" >/dev/null 2>&1; then
            gh release create "fleet-v${version}" dist/* --target "$GITHUB_SHA" \
              --title "ServerOS Fleet ${version}" --notes-file notes.md --latest=false
          fi
          # fleet-latest also carries unversioned copies, so the download link
          # for the hand-uploaded packages never changes between releases.
          mkdir latest
          cp dist/* latest/
          cp "dist/serveros-fleet-openai-v${version}.zip" latest/serveros-fleet-openai.zip
          cp "dist/serveros-fleet-mcp-v${version}.zip" latest/serveros-fleet-mcp.zip
          gh release delete fleet-latest --cleanup-tag --yes || true
          gh release create fleet-latest latest/* --target "$GITHUB_SHA" \
            --title "ServerOS Fleet ${version} (latest main)" --notes-file notes.md --latest
