# ServerOS memory providers — Layer C, the derived active memory.
#
# Why this file exists
# --------------------
# The tempting design is to make the retrieval index the memory. It is tempting
# because it works: search is fast, embeddings find things keyword search
# misses, and a graph answers questions a list cannot. Every one of those
# properties argues for the index and none of them argues for it being the
# authority.
#
# So Layer C is a provider behind a contract, and the contract's whole purpose
# is to make the authority relationship explicit rather than assumed.
#
# Read `docs/memory-fabric.md` for the layering. This file is the interface.
schema: serveros/memory-provider.v1
version: 1

# ---------------------------------------------------------------------------
# The one rule everything else follows from.
# ---------------------------------------------------------------------------
authority: false
rule: >
  a Layer C provider may not be the only place a fact exists. If deleting the
  index loses information, it was not an index.
consequence:
  - "`index` is idempotent and `search` returns records that also exist in
     Layer B, by id. A provider that returns text not obtainable from B is
     rejected at the contract level, not audited afterwards."
  - "Every returned record carries its Layer B id and revision. A result whose
     record cannot be cited is not a result."
  - "Rebuild is the supported operation. If rebuild is expensive, that is a
     performance finding, not a reason to promote the index."

# ---------------------------------------------------------------------------
# The interface. Four operations, and the small number is deliberate: each one
# is a place a provider could acquire authority it should not have.
# ---------------------------------------------------------------------------
operations:
  index:
    signature: "index(records: [MemoryRecord]) -> {indexed: int, skipped: int}"
    must: "accept records from the ledger without a network round trip per record"
    must_not: "modify a record, or invent ids"
  search:
    signature: "search(query, *, limit, filters) -> [Hit]"
    hit_shape:
      record_id: "mem:<id>"
      revision: "the ledger revision the hit was indexed from"
      score: "provider-defined, comparable only within one provider"
      excerpt: "optional; never authority"
    must: "return citeable ids"
  invalidate:
    signature: "invalidate(record_ids) -> {removed: int}"
    must: "be correct when called for a record the index never held"
  health:
    signature: "health() -> {status, detail}"
    must_not: "reach the network from inside `serverosd`'s tick"

# ---------------------------------------------------------------------------
# Deployment status. `NEEDS_HUMAN` is a first-class outcome and not a failure.
# ---------------------------------------------------------------------------
status:
  values: [AVAILABLE, DEGRADED, UNAVAILABLE, READY_TO_PROMOTE, NEEDS_HUMAN]
  READY_TO_PROMOTE: >
    the contract, the adapter and the fixture all exist and pass; running the
    provider for real is a deployment decision that has not been taken.
  NEEDS_HUMAN: >
    adopting the provider would pull in a large dependency set, require a
    service this machine does not already run, or put a network call on the
    path of the node runtime. The blocker is named, and the deliverable is the
    finding rather than a deployment.
  because: >
    a contract with no deployment is worth more than a deployment with no
    contract. The contract is the part that required thinking; deploying is
    the part that requires permission.

# ---------------------------------------------------------------------------
# The candidate: OpenViking.
#
# Recorded here as a candidate with its adoption conditions written down, so
# that a future round does not have to re-derive whether it was considered.
# ---------------------------------------------------------------------------
candidates:
  - id: provider:openviking
    kind: remote-service
    provides: [search, embeddings, graph]
    adoption_conditions:
      - "no large dependency set pulled into the runtime artifact"
      - "no service that this machine does not already run"
      - "no network call inside serverosd's tick loop"
      - "the index is rebuildable from Layer B alone"
    fixture: "a deterministic in-process double; see memory/fixtures/"
    status_rule: >
      the status is decided by the conditions above and by nothing else. A
      provider that satisfies them is READY_TO_PROMOTE; one that does not is
      NEEDS_HUMAN naming the condition it failed.

# ---------------------------------------------------------------------------
# The daemon boundary. This is the mechanical half of the authority rule.
# ---------------------------------------------------------------------------
daemon_boundary:
  serverosd_may: "ask a provider, over IPC, whether it is alive"
  serverosd_may_not:
    - "call `index` or `search`"
    - "hold a provider connection open across a tick"
    - "make a provider a startup dependency"
  because: >
    an embedding call inside the tick loop makes loop latency a function of a
    model and its availability. Worse, it makes a search index a startup
    dependency of a node whose whole design premise is that it comes up and
    answers without one.
  enforcement: "the daemon's imports are checked by test; a provider import in
     `runtime/daemon.py` fails the suite."

rules:
  - "A provider is chosen per device and per query. There is no product-wide
     memory provider, for the same reason there is no product-wide availability."
  - "A hit without a Layer B id is discarded by the caller, not by the
     provider. The provider is the wrong place to enforce the product's rule."
  - "Scores are comparable within one provider and nowhere else. A ranking
     across two providers is a number that means nothing and sorts anyway."
