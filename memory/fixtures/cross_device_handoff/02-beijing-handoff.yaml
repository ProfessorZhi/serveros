body: |
  The work moves to `device:work-fj`, and it moves because of a fact rather
  than a preference: the half of this that is failing is on that side of the
  channel, and no process on this node can measure it. A probe that runs here
  can say the Linux end is up, and it has been saying exactly that throughout.

  Read `mem:fixture-beijing-checkpoint-1` first. It says what to run and what
  to write back; this record only says who is being asked.

  The sender is not waiting. If the forward is gone, write that down and the
  handoff is answered — the answer being "it is not there" is a result, and a
  result that arrives in the ledger is worth more than a probe that could not
  be run.
