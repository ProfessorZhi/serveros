# ServerOS memory records — Layer B, the durable ledger.
#
# Why this file exists
# --------------------
# A work Item's memory today lives in four places that were never designed to
# agree: Git history, `records/` cards, `artifacts/` evidence, and whatever a
# given Agent session still happens to be holding. The fourth is the problem.
# It is the only one that is not durable, it is the one an Agent consults first,
# and it is the one that disappears at the worst moment — mid-Item, on the
# device that is no longer the one the work started on.
#
# The fix is not a new store. It is a record type with a named authority, so
# that the durable copy is identifiable and the session copy is a cache of it.
#
# Read `docs/memory-fabric.md` for the three layers. This file is the record.
schema: serveros/memory-record.v1
version: 1

# ---------------------------------------------------------------------------
# Layer B is the only authority. This is stated in the schema because
# everything else here follows from it.
# ---------------------------------------------------------------------------
layer: B
authority: true
substrate: git
because: >
  the ledger inherits `blame`, `diff`, `revert` and a history nobody has to be
  trusted to maintain. A purpose-built store would have to re-implement all
  four, and the one it would get wrong is `revert`.

kinds:
  decision:   "a choice was made, and what it rules out"
  observation: "something was measured or seen, with its provenance"
  revision:   "a pinned artifact, revision, or hash this work is now bound to"
  handoff:    "the work moved to another device, session or agent"
  finding:    "a defect, a risk, or a gap, with its evidence"
  question:   "an open question with the person who can answer it"
  checkpoint: "the state of work at a moment, written so another device can resume it"
  incident:   "something happened, with a timeline, and what it cost"

# ---------------------------------------------------------------------------
# The vocabulary this contract was asked for, against the one it has.
#
# §21 named seven things a memory record should hold — checkpoint, handoff,
# decision, incident, environment fact, experience, artifact ref — and §22
# lists them as a `type` enum. This file has `kind`s, and the two lists did not
# match. That is the same defect this round keeps finding, one layer down: two
# closed vocabularies, one fact, and nothing comparing them. So the comparison
# is written down, and a test asserts that every name below resolves.
#
# Two of the brief's seven had no home and are now kinds. The other five did
# have one, and the interesting part is why:
#
#   environment fact  → observation. An environment fact IS a measurement with
#                       provenance; what makes it durable is that it is in the
#                       ledger, not that it is a different kind. A second kind
#                       here would be a distinction about how long something
#                       lives, which `retention` is for.
#   experience        → finding. "A defect, a risk, or a gap, WITH ITS
#                       EVIDENCE" is what a lesson is. A separate `experience`
#                       kind would be the same claim with the evidence optional,
#                       which is the one thing this contract refuses.
#   artifact ref      → revision. The contract's wording already is the brief's
#                       meaning: "a pinned artifact, revision, or hash this work
#                       is now bound to".
#   incident          → now a kind, and NOT folded into `finding`, because the
#                       two differ in who did the looking. A `finding` is a
#                       problem found by inspection; an `incident` is a problem
#                       that found us. Case A and the 2026-09-12 restart loop
#                       are incidents, and filing them as findings would lose
#                       the timeline and the cost.
#   checkpoint        → now a kind, and it is the one genuinely missing. A
#                       `revision` binds an artifact; an `observation` says what
#                       was measured; neither says where the WORK stopped and
#                       what the next device should do first. That is what §59's
#                       cross-device fixture turns on, and it had no kind.
# ---------------------------------------------------------------------------
brief_vocabulary:
  checkpoint: checkpoint
  handoff: handoff
  decision: decision
  incident: incident
  environment_fact: observation
  experience: finding
  artifact_ref: revision
  because: >
    every name above resolves to exactly one kind. A name that resolved to two
    would put the choice back on the author, silently, at write time.

required_fields:
  - id            # "mem:<kebab>", stable, never reused
  - kind
  - subject       # "project/repo/Item" or "device:<id>" — what this is about.
                  # In practice `project/<project>/<Item>`, e.g.
                  # `project/serveros/SRV-0007` — three slash-separated parts,
                  # which is what `SUBJECT_RE` enforces. The template above
                  # reads as if the first part were the literal word `project`
                  # AND the second a repository name, and there is no such
                  # string: following it produces `project/repo/SRV-0007`, which
                  # validates and names nothing. Every record in the ledger
                  # beside this contract says `project/serveros/…`, and the
                  # fixture in `fixtures/cross_device_handoff/` was corrected to
                  # match — two devices reading one work under two subject
                  # strings is a handoff neither end can find.
  - at            # ISO-8601 UTC. When the fact became true, not when written.
  - by            # who or what recorded it: an agent runtime, a person, a node
  - source        # where it came from: a revision, a Run id, a file, a URL
  - revision      # the repository revision the fact is about
optional_fields:
  - body
  - supersedes    # "mem:<id>" — the record this one corrects
  - related       # ["mem:<id>"]
  - device_ref    # "device:<id>" — the device this fact is ON or FROM
  - to_device_ref # "device:<id>" — the device a handoff was sent TO. Required
                  # for `handoff`; see `required_for_kind` below.
  - confidence    # high | medium | low — for observations only
  - note

# Required only for some kinds. `confidence` is here because the contract
# scopes it ("for observations only") and then makes it a refusal in `rules`.
#
# `handoff` needs `to_device_ref` for the same reason a tunnel needs both its
# endpoints, and the failure it prevents is quiet. A handoff with no addressee
# is a record that says the work moved and does not say where; the receiving
# device cannot select it, so nothing arrives, and nothing reports that nothing
# arrived — the ledger is append-mostly and a record nobody reads looks
# identical to a record everybody read. §59's whole fixture is the receiving
# device asking "is there a handoff for me", and that question has no answer
# unless the sender wrote one down.
#
# A movement the author genuinely cannot address is not a handoff. It is a
# `revision` (the work moved to a new pinned state) or an `observation` (the
# work is now on another device, seen from here), and both are cheap to write.
required_for_kind:
  observation: [confidence]
  handoff: [to_device_ref]

forbidden_fields:
  - "any credential, token, cookie, key, or private key"
  - "a raw transcript body"
  - "a message body from a chat or meeting"
  - "a raw hardware identifier"
because: >
  the ledger is versioned, shared, and synced to a second device, and every one
  of those properties makes a leaked secret worse rather than better. A record
  points at a protected object; it does not contain one.

# ---------------------------------------------------------------------------
# `at` and `by` and `source` are the three fields that make a record citable.
# Each is here because of a specific way a record without it is useless.
# ---------------------------------------------------------------------------
required_because:
  at: >
    without it, ordering two records about the same subject is guesswork and
    "which came first" — the only question a ledger answers better than a wiki
    — becomes unanswerable.
  by: >
    a fact recorded by an agent and a fact recorded by a person carry different
    weight when they disagree, and a record that does not say which is not
    weighable.
  source: >
    a record with no source is an assertion. It cannot be checked, only
    believed or ignored, and both are wrong.
  revision: >
    a claim about a repository that may have moved. `docs/../ARCHITECTURE.md`
    at one revision is not the same document as at another, and this product
    has already shipped a release note describing a file that never existed.

# ---------------------------------------------------------------------------
# Supersession, not mutation. A ledger that edits is a ledger that cannot be
# diffed against its own past.
# ---------------------------------------------------------------------------
supersession:
  rule: >
    a record is never edited to say something different. A corrected record
    names the one it supersedes and states what changed.
  because: >
    the corrected release note in SRV-0007 is the precedent: the sentence was
    wrong, the correction was more useful than the original, and both are now
    legible. Editing the original would have destroyed the finding.
  resolution: >
    the current value of a subject is the newest record in its supersession
    chain, and the chain is the history.

# ---------------------------------------------------------------------------
# What a memory record is NOT. Each line names an object that already has an
# owner, and the failure mode is always the same: a second copy becomes a
# second authority.
# ---------------------------------------------------------------------------
not_memory:
  - "an Item's lifecycle state          → work-management, via serverosctl"
  - "a running resource's health        → the Node Runtime Plane"
  - "an evidence artifact               → the Evidence plane; this points at it"
  - "a card, brief or board view        → the Human plane; those are projections"
  - "another system's object body       → that system's authority"

# ---------------------------------------------------------------------------
# Projection. Layer A keeps what this node needs without a network round trip,
# and a projection is derived in the strict sense used everywhere else here.
# ---------------------------------------------------------------------------
projection:
  # §24. This was `state/serveros/memory/` — a second projections namespace
  # beside the one that already exists. `fleet/state-root-contract.yaml` is the
  # authority for `state/serveros/` and forbids exactly that, in the reason it
  # gives for the namespace it declares: "a second top-level root for derived
  # material would itself become a durable-looking location, and the whole
  # point is that this namespace's contents are disposable". Two declarations,
  # one fact, and nothing compared them.
  #
  # The state root contract wins because it owns the root, and because the
  # memory projection is a projection — which is a claim the other namespace
  # has a manifest, five invariants and a reader for, all of which would have
  # had to be re-implemented here.
  location: "state/serveros/projections/memory/"
  namespace_authority: "fleet/state-root-contract.yaml#projections"
  manifest: projection.yaml
  derived_from: ledger
  regenerable: true
  hand_edit: forbidden
  because: >
    if the projection and the ledger disagree, exactly one repair is correct
    and it is not reconciliation. The projection is rebuilt.
  carries: >
    pointers, not content — `id`, `kind`, `at`, `by`, `source`, `revision`, and
    no `body`. A node offline with its projection can say THAT a decision
    exists and what it was about; it cannot say what the decision was, because
    a projection that carried the text would be a second copy of the ledger
    sitting in the one namespace declared to have no authority.
  staleness:
    recorded: "the ledger revision the projection was built from"
    visible: "a projection that cannot name its revision is reported STALE"
    decided_by: "memory/projection.py — `build`, `manifest_for`, `staleness`"

# ---------------------------------------------------------------------------
# Who enforces this. Every rule above names something a program can check, and
# for as long as nothing checked them the contract was a description of a
# ledger that did not exist.
# ---------------------------------------------------------------------------
enforcement:
  validate: >
    `memory/record.py — validate()` refuses one record against one record's
    rules, and is deliberately callable on a record the ledger does not contain
    yet, because the caller that matters is an author checking before writing.
  audit: >
    `memory/record.py — audit()` reports the whole-ledger properties no single
    record can have: duplicate ids, supersession cycles, a `supersedes` naming
    a record that is not here, a correction of a different subject.
  partial: >
    the forbidden-content list is enforced only where it is checkable — key
    blocks, token prefixes, JWTs, MAC addresses, credential-shaped assignments.
    `audit()` returns a `not_checked` list naming the rest rather than
    reporting a clean ledger it has no basis to report.

rules:
  - "A record names its authority. A fact that lives only in a session's
     context window is not a record, and no design may treat summarization as
     persistence."
  - "Retention is by kind and is explicit. Nothing is deleted by age alone;
     `question` resolves, `decision` and `revision` do not. A `checkpoint`
     is superseded by the next checkpoint on the same subject — it describes
     a moving state, and keeping every one of them turns the ledger into a
     heartbeat log, which is the thing §21 excludes by name."
  - "A `checkpoint` answers `where the work stopped` and `what to do first`.
     It is not a status, not a heartbeat, and not a copy of the plan; it is
     the shortest thing a different device needs in order to continue, and
     the test for it is whether that device can continue from it alone."
  - "A `handoff` names the device it is for. The receiving device finds it by
     `to_device_ref`, which is the only way it can be found at all."
  - "An observation without confidence is refused. `confidence: high` on a
     guess is a lie the schema cannot detect, but a missing field forces the
     author to make the claim out loud, which is all a schema can do."
  - "Cross-device sync is a git operation and carries no ServerOS-specific
     merge logic. A conflict is a conflict; it is never auto-resolved."
