# ServerOS component registry — relationship and canonical locator only.
#
# This file does NOT carry state, maps, or Item data. It records which component
# owns what, so a reader can find the canonical source of each concern.
# Do not duplicate runtime state, maps, or an Item database here.

schema: serveros/components.v1

components:
  serveros:
    role: product-entry
    locator: https://github.com/ProfessorZhi/serveros
    owns:
      # what the plugin IS, and how it is built deterministically
      - architecture
      - plugin-composition-canonical      # the decision of which capabilities compose it
      - plugin-bundle                     # plugin/bundle.yaml
      - plugin-manifests-and-adapters     # .claude-plugin / .codex-plugin
      # `bootstrap-skill-source` is a ruled term (Phase 1.1 A) and is kept
      # verbatim. It means the skills whose canonical source is THIS repository
      # — today `serveros` alone — as opposed to the reusable ones composed in
      # from ability-management. The name says "bootstrap" because there was one
      # of them when it was ruled; the distinction it encodes is source-of-truth,
      # not count. `runtime-management` was briefly a second one and was moved to
      # its canonical home in ability-management (§24), which is why the list is
      # back to a single member without the term changing meaning.
      - bootstrap-skill-source
      - node-mcp-surface                  # mcp/ — the adapter and its .mcp.json
      - context-kernel
      - space-kernel
      - relations-kernel
      - deterministic-bundle-build
      - context-contract
      - component-boundaries
      - release-pointers
    does_not_own:
      - reusable-skill-canonical-source
      - runtime-state
      - topology
      - item-state

  ability-management:
    role: capability-canonical
    locator: https://github.com/ProfessorZhi/ability-management
    owns:
      # identity / version / discovery / distribution of REUSABLE abilities
      - reusable-skill-canonical-source
      - ability-registry
      - revisions
      - compatibility
      - discovery
      - reconcile
      - installation
      - distribution
    does_not_own:
      - plugin-composition-canonical
      - bootstrap-skill-source
      - plugin-bundle
      - runtime-state
      - topology
      - item-state
    note: >
      The canonical source for the reusable Skills that are composed INTO the
      plugin. It does not own the composition itself: which skills the plugin
      contains, and how the bundle is built from them, belongs to serveros.

      The former claim — "the only canonical source for the hwz-server-os plugin
      and its Skills", carried as `plugin-canonical-source` — was stale. It
      conflated two different things under one ambiguous word, `skill-source`:

        bootstrap-skill-source            serveros            the `serveros` Skill
        reusable-skill-canonical-source   ability-management  the composed Skills

      One owner for each, no overlap. Use the qualified names; the bare
      `skill-source` is retired because it does not say which of the two it
      means.

      Runtime copies are derived installations and never reverse-write canonical.

  work-engine:
    role: deterministic-control-plane
    locator: https://github.com/ProfessorZhi/work-engine
    owns: [serverosctl, item-activity-run-state, lease, board-projection]
    does_not_own: [skill-content, topology, cloud-objects]

  hwz-ops:
    role: environment-topology
    locator: https://github.com/ProfessorZhi/hwz-ops
    owns: [maps, policies, governance, authority-boundary]
    does_not_own: [skill-content, runtime-installation]

  records:
    role: human-readable-work-records
    locator: https://github.com/ProfessorZhi/hwz-records
    owns: [cards, briefs, board-views, reports]
    does_not_own: [machine-state, cloud-bodies]

  feishu-space-management:
    role: capability-owner
    owns: [feishu-placement, feishu-maps, feishu-drift, feishu-lifecycle]
    does_not_own: [semantic-interpretation]

  information-management:
    role: capability-owner
    owns: [raw-observations, traceable-claims, understanding]
    does_not_own: [item-lifecycle, test-environments]

distribution:
  # One-way only. Nothing here may be edited in place and synced back.
  #
  # This is the payload flow for REUSABLE skills, and its owner is named above
  # as `distribution`. It is not the plugin composition: the bundle decides what
  # is composed, and ability-management supplies the reusable parts of it.
  from: ability-management
  to: runtime-installation
  generated_notice: "GENERATED — DO NOT EDIT"

non_goals:
  - global-workflow-engine
  - forced-activity-pipeline
  - new-daemon
  - new-lease-system
  - new-approval-layer
  - new-directory-layer
  - second-source-of-truth
