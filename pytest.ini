# 这个仓库的套件在哪里。
#
# 这一行不是偏好，是让**两个决定「跑什么」的量具说同一句话**。
#
# `scripts/verify.py` 的 `discovered_tests()` 枚举的是 `tests/test_*.py` ——
# 它从一开始就知道套件在哪。裸 `pytest` 不知道：它按 `python_files` 的默认
# glob（`test_*.py` / `*_test.py`）在**整棵树**里找。两者不一致的那一块，
# 就是任何放在 `tests/` 之外、名字以 `test_` 起头的模块。
#
# 2026-09-29 实测：`runtime/test_contract.py`（Project Testing Contract 的
# 读取器，本轮新增）正落在那一块里。整个模块被当成测试文件收集，而它有一个
# 正常的公开 API 恰好叫 `testing_dir(roots)` —— 名字命中 `python_functions`
# 的 `test*`，于是全套的第一个条目是一个 error：
#
#     ERROR runtime/test_contract.py::testing_dir
#     E  fixture 'roots' not found
#
# 一个 collection error 与一条真的跑了并失败的用例，在 `-q` 里长得一样；
# 而这件事最坏的地方是它不改变结论的形状 —— 进度条照旧往前走，后面 3000 条
# 照旧绿。同族最短形态是 `[ "" = "" ]`：两次查询都失败，比较的结果是相等。
#
# 两道防线，这一行是第二道：
#   1. 文件不再误名 —— `runtime/test_contract.py` 已改名
#      `runtime/testing_contract.py`。它从来不是测试，是运行时模块，
#      `runtime/` 下其余 60 个模块都按主语命名。
#   2. 收集范围在这里声明 —— 裸 `pytest` 与 census 因此看同一片地方。
#
# `tests/test_collection_scope.py` 同时守着这两条，且带正控：它拿**当时真的
# 在盘上的那个路径**去问同一个判据，证明判据认得出来。没有那一步的话，
# 下面这条扫描在一个取空了的 `python_files` 上也会绿。
[pytest]
testpaths = tests
