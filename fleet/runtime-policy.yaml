# Which agent, configured how, may run where — the owner's DEFAULT rules.
#
# Not the live rules: the hub reads ~/.serveros/runtime-policy.yaml over this
# file (same shape; a device entry there replaces the one here, `null` removes
# it). Change rules there — no code change, no pull request. This file is the
# starting point a fresh hub gets.
#
# The commander chooses everything else on its own (which skill, plugin or MCP,
# single agent, subagents or a workflow, which model for the task). It chooses
# INSIDE these rules: fleet/intelligence.py `policy_allows` is applied to every
# candidate before a dispatch, and a choice outside them is refused, not warned.
#
# A rule names what is allowed; anything not named is refused. A device with no
# entry of its own gets `default`. Rules are by device and runtime kind, and
# constrain the model SOURCE and, optionally, the model name and the gateway.
#
# `default_model` (optional) is what a session runs when nobody names a model:
# the commander omits `model` and the owner never has to choose. It names a
# CloudCLI model entry id (see fleet_models_list) and must satisfy the rule.
schema: serveros/fleet-runtime-policy.v1

# What an agent may change on its own, inside the rules below, without a code
# change or a release (fleet_tune). Every change is journalled beside the hub's
# local policy file, announced by card, and revertible. Rules themselves —
# sources, gateways, which agent runs where — are never tunable.
tunable:
  default_model: true

# Which base URLs are which gateway, so a model entry's route can be judged
# without the writer declaring it (host:port; local overlay adds to these).
# A6000 reaches gateway 0 through an SSH forward on 26601; Tokyo serves it on
# 26500 (LiteLLM in container0).
gateway_hosts:
  target:gateway0: ["127.0.0.1:26601", "127.0.0.1:26500"]

default:
  runtimes:
    claude-code:
      model_sources: [official_subscription, gateway]
    codex:
      # GPT runs on our own ChatGPT account quota, never on API billing.
      model_sources: [official_subscription]

devices:
  device:llm-lab-dell:
    # Owner, 2026-11-06: on the A6000 only Claude Code, and only through
    # gateway 0's DeepSeek. Codex is not named, so it is refused here.
    runtimes:
      claude-code:
        model_sources: [gateway]
        gateways: [target:gateway0]
        # No model-name pattern here: gateway 0 serves DeepSeek under names that
        # change (e.g. v4.1flash-anthropic). Source and gateway are what the
        # owner fixed; an entry is judged on both when it is written. Add
        # `model_patterns` in ~/.serveros/runtime-policy.yaml to narrow further.
        # The A6000's existing gateway-0 entry (东京网关0 · v4.1flash), as its
        # CloudCLI model library lists it; used only while the library holds it.
        default_model: v4.1flash-anthropic
