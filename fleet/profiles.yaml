# ServerOS Fleet environment profiles.
#
# Why a role vocabulary instead of "the paths we happen to have"
# --------------------------------------------------------------
# The devices are not meant to converge on the same directories. They are
# meant to converge on the same *questions*: where does source live, where do
# toolchains live, where does evidence live, what is corporate knowledge.
#
# A profile answers those questions with physical paths that differ per device.
# Anything that consumes a path asks for the ROLE. Nothing above this layer is
# allowed to know that source is `D:\projects` on one machine and
# `/opt/applications/data/home-hwz/workspace/src` on another.
#
# Binding state is explicit, because "we have not looked" and "this role does
# not exist here" are different facts and only one of them is a gap.
schema: serveros/fleet-profiles.v1

path_roles:
  workspace.src:        source checkouts (read-mostly)
  workspace.worktrees:  per-Item development worktrees
  artifacts:            Item and Skill run evidence
  state:                ServerOS machine state
  toolchains:           language/runtime toolchains
  runtime-assets:       materialized agent runtime artifacts
  downloads:            acquired archives and installers
  software.gui:         installed GUI applications
  knowledge.corporate:  corporate knowledge / onboarding source
  # Added when the Agent Runtime contract needed to say where a runtime reads
  # its own configuration without naming a home directory. `~/.claude.json`,
  # `~/.codex/config.toml` and `~/.serveros` are all this role's business, and
  # the devices answer it differently as a fact about them rather than as a
  # matter of taste: HOME on Linux, %USERPROFILE% on Windows, an actual
  # difference in where the agent runtimes keep their config, and (since the
  # Dell LLM Lab host was enrolled) two Linux profiles whose `home` bindings
  # are `/home/<user>` and `/data/home/<user>` respectively.
  #
  # UNBOUND on both Windows profiles is the honest value and it is a finding,
  # not an omission: nobody has asserted where those machines keep it. A
  # capability resolved through this role on either of them is therefore
  # UNKNOWN, which is correct — see `abilities/agent-runtime-contract.yaml`.
  home:                 user home directory; agent runtime config roots
  # The seed the derived roots are built from. It is the role the vocabulary
  # was missing, and the gap had a cost: with no way to say where the shared
  # root is, `runtime/paths.py` carried a compiled-in answer instead -- the
  # first node's -- so every other node resolved `{DATA_ROOT}/...` to a
  # directory that does not exist there, and resolved it silently.
  #
  # Declared, the resolver has something to read. Undeclared, it would have to
  # invent, and `runtime/paths.py` no longer does: an unbound role leaves the
  # root UNBOUND, and a caller about to say where a file belongs checks.
  data_root:            the root the artifacts/state/toolchains roles sit under

  # Unlike `data_root`, this role was not missing because a layer above had to
  # invent an answer. It was missing because the answer existed in exactly one
  # place and was never projected. `/data/scratch/vince` is bound by this node's
  # own host profile -- `roots.scratch_root`, and `scratch_area.this_account_path`
  # -- and `runtime/workspace.py` already consumes that binding through its
  # SCRATCH_SURFACES table, which cites the host profile as provenance, i.e. it
  # points at the authority instead of duplicating it. What no fleet profile
  # could do was confirm the binding, so every consumer above the host profile,
  # the device's own map included, had to take it on trust. This is the
  # projection, not a second authority.
  #
  # Single segment on purpose. It is a root with no sub-roles, like `artifacts`
  # and `downloads`; the dotted form names a member of a namespace
  # (`workspace.src`, `software.gui`) and scratch has no such parent.
  #
  # Declared here but bound on `linux-shared-multiuser` alone, and the asymmetry
  # is the honest shape rather than an omission -- profiles are not required to
  # be isomorphic. On every other device nobody has looked, and this
  # vocabulary has no word for that: UNBOUND would assert the role applies and
  # is a gap, NOT_APPLICABLE would assert it does not apply, and neither has
  # been established there.
  scratch:              disposable per-instance working space

# BOUND            — path known, and the source of that knowledge is recorded
# UNBOUND          — role applies here but no path is known yet (a real gap)
# NOT_APPLICABLE   — role has no meaning on this device (not a gap)
binding_states: [BOUND, UNBOUND, NOT_APPLICABLE]

# Volume states answer a different question from binding states, so they get
# their own vocabulary rather than being squeezed into the one above.
# BOUND         — the volume exists and something is known about it
# NOT_ASSERTED  — nobody has looked; neither presence nor absence is claimed
# ABSENT        — looked, and it is not there
volume_states: [BOUND, NOT_ASSERTED, ABSENT]

profiles:
  windows-corporate:
    device_ref: device:work-fj
    platform: windows
    # Physical volumes, as reported. NOT a path-role binding — this block says
    # which volumes exist and roughly what they hold; the `paths:` block below
    # says which semantic role resolves to which directory.
    #
    # Why it is written down at all: `volume` and `path role` are different
    # questions, and answering only the second lets a reader conclude the
    # machine has exactly the directories this file happens to name. It does
    # not; it has three volumes, most of whose interior is unrecorded.
    #
    # The E:/F: line is the important one. Dell's profile binds F:\ and E:\
    # because those are Dell's volumes. They are NOT this machine's, and a
    # Windows filesystem that resembles another Windows filesystem is still a
    # different machine. Recording the absence here makes "we did not check"
    # distinguishable from "we checked and they are not there" — neither of
    # which is the same as "they are there".
    volumes:
      'C:':
        state: BOUND
        provenance: user_reported
        holds: Windows OS and the user runtime (Claude / Codex installation surface)
      'D:':
        state: BOUND
        provenance: user_reported
        holds: >-
          apps · develop · download · projects · onboard · artifacts-temp-legacy
      'Z:':
        state: BOUND
        provenance: user_reported
        holds: mapped filesystem (network volume; not locally owned storage)
      'E:':
        state: NOT_ASSERTED
        provenance: UNRECORDED
      'F:':
        state: NOT_ASSERTED
        provenance: UNRECORDED
    volumes_note: >-
      E: and F: are NOT_ASSERTED, not NOT_APPLICABLE and not UNBOUND. Nobody
      has looked, so neither presence nor absence is claimed. Dell binds F:\
      and E:\ — that is a fact about Dell and it stays there.
    paths:
      data_root:
        state: UNBOUND
        provenance: user_reported
        note: >-
          UNBOUND rather than a drive letter. This machine's roles resolve
          to separate volumes -- D:\projects, D:\artifacts, D:\develop --
          and there is no single root they are all under, so no value here
          would reproduce them. A `{DATA_ROOT}/artifacts` on this profile is
          a path that means nothing, and saying so is the honest entry.
      workspace.src:
        path: 'D:\projects'
        state: BOUND
        provenance: user_reported
      software.gui:
        path: 'D:\apps'
        state: BOUND
        provenance: user_reported
      toolchains:
        path: 'D:\develop'
        state: BOUND
        provenance: user_reported
      downloads:
        path: 'D:\download'
        state: BOUND
        provenance: user_reported
      knowledge.corporate:
        path: 'D:\onboard'
        state: BOUND
        provenance: user_reported
        note: >-
          Corporate knowledge source. NOT a control plane — see the Authority
          section of ARCHITECTURE.md, which names it directly. Ownership here
          is knowledge, not fleet. (This cited a `docs/authority-model.md` that
          never existed, while the statement it wanted was in ARCHITECTURE.md
          all along. Repointed, not written: ARCHITECTURE.md's own closing line
          forbids "documentation manufactured merely to close a schema".)
      artifacts:
        path: 'D:\artifacts'
        state: BOUND
        provenance: user_reported
        note: >-
          UNVERIFIED PATH, flagged rather than smoothed over. The device's D:
          volume was reported as holding `artifacts-temp-legacy`, which may be
          this directory under a different name, a different directory, or the
          same directory at an earlier time. The two have not been reconciled
          and this binding keeps the value it already had rather than adopting
          the newer string: a path silently rewritten to match a description
          is indistinguishable from a path that was checked. Resolving it needs
          a device-local read, and there is no route from here to take one.
      workspace.worktrees:
        state: UNBOUND
        provenance: user_reported
      state:
        state: UNBOUND
        provenance: user_reported
      runtime-assets:
        state: UNBOUND
        provenance: user_reported
      home:
        state: UNBOUND
        provenance: user_reported
        note: >-
          The role applies and no path has been asserted. Deliberately left
          UNBOUND rather than filled with a plausible `%USERPROFILE%`: a
          guessed path here resolves an agent runtime's config surface to a
          location nobody checked, and every capability resolved through it
          would read AVAILABLE on the strength of a guess. UNBOUND produces
          UNKNOWN, which is the answer that is actually true from here.

  windows-personal:
    device_ref: device:personal-dell
    platform: windows
    paths:
      data_root:
        state: UNBOUND
        provenance: user_reported
        note: >-
          UNBOUND for the same reason as `windows-corporate`: the roles
          resolve to separate volumes and no single root reproduces them.
      workspace.src:
        path: 'F:\'
        state: BOUND
        provenance: user_reported
        note: >-
          Reported as holding projects, data and experiments. Its interior is
          explicitly un-converged; this binding records the volume, not an
          endorsed layout.
      toolchains:
        path: 'E:\develop'
        state: BOUND
        provenance: user_reported
      software.gui:
        path: 'D:\'
        state: BOUND
        provenance: user_reported
      downloads:
        path: 'D:\'
        state: BOUND
        provenance: user_reported
      artifacts:
        state: UNBOUND
        provenance: user_reported
      state:
        state: UNBOUND
        provenance: user_reported
      runtime-assets:
        state: UNBOUND
        provenance: user_reported
      knowledge.corporate:
        state: NOT_APPLICABLE
        provenance: user_reported
      workspace.worktrees:
        state: UNBOUND
        provenance: user_reported
      home:
        state: UNBOUND
        provenance: user_reported
        note: >-
          See `windows-corporate`. UNBOUND, not NOT_APPLICABLE: the role has
          meaning on this device and no path has been asserted for it. The one
          fact this round established about Dell's runtime surfaces is that
          Playwright was reached through `npx @playwright/mcp@latest` — which
          is a floating dependency and is recorded as an admission finding, not
          as a path.

  # ---------------------------------------------------------------------------
  # Tokyo shared development host.
  #
  # Every path below was measured ON THIS DEVICE. None was inferred from the
  # Beijing profile it superficially resembles: the two hosts answer the same
  # ten questions with unrelated physical paths, which is the point of this
  # file. (`linux-server` was the profile it is compared with here; it was
  # retired with its only device on 2026-10-21.) Where the shapes are alike (runtime-assets binds the parent on both)
  # that is a decision repeated, not a value copied.
  #
  # `server_local_agent` is the provenance throughout: an agent running on this
  # host read these directories. It is NOT `user_reported` -- nobody was asked
  # -- and it is not a scan of a remote machine.
  #
  # One thing this profile does NOT say: /data is a shared 4 TB volume and
  # /data/home/vince is one home among eight. A BOUND path here means the role
  # resolves. It does not mean the path is private to this device's owner, and
  # nothing in this fleet layer should be read as claiming that.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # A shared development host, named for its SHAPE and not for the device.
  #
  # `fleet/registry.yaml` states the rule - "A device names one; it does not
  # carry the profile inline, so a profile cannot fork per device" - and every
  # other profile here follows it: `windows-corporate`, `windows-personal`.
  # This was first written as `tokyo-shared-dev-01`, which
  # is a device id, and a device id as a profile name is the fork the rule
  # forbids.
  #
  # Every path below was measured ON THIS DEVICE. None was inferred from the
  # Beijing profile it superficially resembles: the two hosts answer the same
  # ten questions with unrelated physical paths, which is the point of this
  # file. (`linux-server` was the profile it is compared with here; it was
  # retired with its only device on 2026-10-21.) Where the shapes are alike (runtime-assets binds the parent on both)
  # that is a decision repeated, not a value copied.
  #
  # `server_local_agent` is the provenance throughout: an agent running on this
  # host read these directories. It is NOT `user_reported` -- nobody was asked
  # -- and it is not a scan of a remote machine.
  #
  # One thing this profile does NOT say: /data is a shared 4 TB volume and
  # /data/home/vince is one home among eight. A BOUND path here means the role
  # resolves; it does not mean the volume is this user's. The tenancy rules --
  # what may be deleted, whose processes may be touched, what is read-only --
  # are on the `shared_host` section of this node's host profile, at
  # `~/.config/serveros/host-profile.yaml`, because they are authored facts
  # about a machine rather than path bindings, and §6 of this round requires
  # them to exist rather than to be restated in two places.
  # ---------------------------------------------------------------------------
  linux-shared-multiuser:
    device_ref: device:tokyo-shared-dev-01
    platform: linux
    volumes:
      '/':
        state: BOUND
        provenance: server_local_agent
        holds: >-
          Ubuntu 24.04 system disk (/dev/vda2, ext4, 50G). NOT a working
          volume -- it carries the OS and the package database and has roughly
          26G free.
      '/data':
        state: BOUND
        provenance: server_local_agent
        holds: >-
          4 TB XFS data disk (/dev/vdb) with `usrquota,prjquota`, carrying
          every human home under /data/home/<user>, the per-user scratch under
          /data/scratch/<user>, the Docker data-root and the read-only
          admin-maintained /data/shared.
    volumes_note: >-
      `/data/shared` is BOUND but is NOT represented as a path role. It is
      read-only, admin-maintained, and usable for none of the things a path
      role is for: not a workspace, not ServerOS state, not container
      writable state, not credential storage.
    paths:
      data_root:
        path: /data/home/vince
        state: BOUND
        provenance: server_local_agent
      scratch:
        path: /data/scratch/vince
        state: BOUND
        provenance: server_local_agent
        note: >-
          Projects the host profile's `scratch_area.this_account_path`. This is
          not a second authority: the host profile binds it and
          `runtime/workspace.py` consumes it from there, so the only thing added
          here is the fleet-visible projection the device's own map was
          asserting without one. Disposable by contract -- 117 entries were
          observed under it on 2026-09-18 and none of them is registered
          anywhere, which is the design, not a coverage gap.
      workspace.src:
        path: /data/home/vince/workspace/src
        state: BOUND
        provenance: server_local_agent
      workspace.worktrees:
        path: /data/home/vince/workspace/worktrees
        state: BOUND
        provenance: server_local_agent
      artifacts:
        path: /data/home/vince/artifacts
        state: BOUND
        provenance: server_local_agent
      state:
        path: /data/home/vince/state/serveros
        state: BOUND
        provenance: server_local_agent
      toolchains:
        path: /data/home/vince/toolchains
        state: BOUND
        provenance: server_local_agent
      runtime-assets:
        path: /data/home/vince/runtime-assets
        state: BOUND
        provenance: server_local_agent
        note: >-
          Binds the PARENT, so the two Linux profiles stay shaped alike. The distribution inside it is `hwz-server-os`, not
          `serveros`, and `SEMANTIC_ROLES["runtime.serveros-distribution"]`
          names it. This note used to record a disagreement: `runtime/paths.py`
          declared `runtime-assets/serveros`, nothing had ever been there, and
          `serverosctl path resolve runtime-assets` printed it to a person.
          RUN-0056 fixed the root rather than the reader, so `paths.py` now
          binds this same parent and the two doors agree; the note is kept
          because what it recorded is why the fix was written, and a deleted
          note is indistinguishable from a disagreement nobody noticed.
      downloads:
        path: /data/home/vince/downloads
        state: BOUND
        provenance: server_local_agent
      software.gui:
        state: NOT_APPLICABLE
        provenance: server_local_agent
        note: >-
          NOT_APPLICABLE rather than UNBOUND: this is a headless shared server
          with no desktop session, so the role has no meaning here. The one
          graphical surface that does exist -- the browser-stack noVNC console
          on loopback -- is a development tool reached over a tunnel, not
          installed GUI software, and it lives under `state`, not here.
      knowledge.corporate:
        path: /data/home/vince/workspace/knowledge
        state: BOUND
        provenance: server_local_agent
        note: >-
          Bound on measurement, not on hope. This was recorded UNBOUND while
          the corporate knowledge repository had not been cloned on this node;
          it has been, and the directory carries CLAUDE.md, INDEX.md and the
          `feishu`, `git`, `linux` and sibling trees.
      home:
        path: /data/home/vince
        state: BOUND
        provenance: server_local_agent
        note: >-
          Note where this points: NOT `/home/vince`. On this host every human
          home is under /data/home, on the 4 TB volume, and /home is not where
          a user's files are. A profile that assumed the usual Linux answer
          would resolve every agent runtime's config root to a directory this
          user does not own.

  # ---------------------------------------------------------------------------
  # Dell LLM Lab: a company-owned GPU compute and development worker, enrolled
  # 2026-10-12. Named for its SHAPE and not for the device -- `linux-gpu-compute`
  # is a shape name, and `fleet/registry.yaml` states the rule it obeys:
  # a device NAMES a profile and does not carry one inline, so a profile name
  # may not be a device id.
  #
  # Every binding below is `server_local_agent`, and not one of them is
  # `user_reported`. The distinction is the `rules:` block's, and it is the one
  # that matters when a value turns out to be wrong: a `user_reported` binding
  # is a design input nobody has confirmed against the machine, and this
  # profile holds none of those.
  #
  # A BOUND path here means the role resolves. It does not mean the directory
  # is converged, or private to this user, or shared the way Tokyo's are: this
  # is one account on a machine in a lab, and the tenancy rules for it belong
  # to that machine rather than to this layer.
  #
  # `scratch` is deliberately ABSENT, and it is the one role this profile does
  # not list. The declaration of `path_roles.scratch` above records why no
  # profile binds it except `linux-shared-multiuser`: UNBOUND would assert the
  # role applies on this machine and is a gap, NOT_APPLICABLE would assert it
  # does not apply, and nobody has established either one here. Writing a key
  # would be choosing between two answers on no evidence, and the chosen one
  # would read exactly like an answer that was looked for and found.
  #
  # What this profile does NOT carry: a `volumes:` block, and the omission is
  # deliberate rather than unfinished. Capacity was measured on this machine,
  # and a capacity measurement is not a path role -- what holds it for a device
  # is that device's own host profile, which is where the numbers are. A `'/':`
  # written here would be a mount layout nobody read, placed in the fleet
  # authority where the next reader would take it for one somebody did.
  # ---------------------------------------------------------------------------
  linux-gpu-compute:
    device_ref: device:llm-lab-dell
    platform: linux
    paths:
      data_root:
        state: UNBOUND
        provenance: server_local_agent
        note: >-
          UNBOUND for a structural reason rather than as a gap somebody has yet
          to close: the roles below do not sit under one root. Source and
          worktrees resolve under the home directory; toolchains resolve to
          `~/.local/opt`. Any single value here would make
          `{DATA_ROOT}/toolchains` resolve to a path that means nothing. The
          two Windows profiles give this answer for the same reason -- separate
          volumes there, separate trees here -- reached from the same question
          rather than copied from them.
      workspace.src:
        path: /home/vince/projects
        state: BOUND
        provenance: server_local_agent
        note: >-
          The directory source checkouts live in, bound the way
          `windows-corporate` binds `D:\projects`: the parent, not one
          checkout. The primary checkout inside it is `llm-lab-dev`. Binding a
          single repository here would answer "where does source live" with the
          name of one project, and the next checkout would have no role to
          resolve through.
      workspace.worktrees:
        path: /home/vince/projects/worktrees
        state: BOUND
        provenance: server_local_agent
      artifacts:
        state: UNBOUND
        provenance: server_local_agent
      state:
        state: UNBOUND
        provenance: server_local_agent
      toolchains:
        path: /home/vince/.local/opt
        state: BOUND
        provenance: server_local_agent
        note: >-
          User-level toolchains, under the home directory rather than under a
          per-host toolchains root. Worth stating out loud because Beijing and
          Tokyo both bind a `toolchains` directory OUTSIDE the home directory:
          a reader who assumed the usual shape would resolve this role to a
          path that does not exist on this machine, and would be right about
          the pattern and wrong about the device.
      runtime-assets:
        state: UNBOUND
        provenance: server_local_agent
      downloads:
        state: UNBOUND
        provenance: server_local_agent
      software.gui:
        state: NOT_APPLICABLE
        provenance: server_local_agent
        note: >-
          NOT_APPLICABLE rather than UNBOUND: this machine's role is a headless
          compute and development worker, so the role has no meaning on it.
          This is the same kind of claim `linux-shared-multiuser` makes about
          itself, and it is falsifiable in the same way -- a desktop session
          observed on the device would make this line wrong rather than merely
          old.
      knowledge.corporate:
        state: UNBOUND
        provenance: server_local_agent
        note: >-
          UNBOUND, and NOT NOT_APPLICABLE -- the distinction `windows-personal`
          turns the other way. This device is company-owned and used for
          company work, so the role plausibly applies and its path is simply
          not known from here; a personal machine can say the role has no
          meaning on it at all. Neither answer has been read off this machine,
          so the one that keeps the question open is the one written down.
      home:
        path: /home/vince
        state: BOUND
        provenance: server_local_agent
        note: >-
          Note that this is `/home/vince`, which is Tokyo's answer inverted.
          On `linux-shared-multiuser` the human homes are on the 4 TB data
          volume and `/home/vince` is specifically where a user's files are
          NOT; here `/home/vince` IS the home. The two Windows profiles say
          nothing about this role at all -- UNBOUND, which is a gap and not a
          different value -- so the pair of Linux answers is where this file's
          point is visible: one role, two unrelated physical paths, and no
          layer above allowed to know either literal.

rules:
  - "A profile is selected by the device, not by the caller. Asking for a path
     role resolves through the profile of the device holding the work."
  - "Profiles are not required to be isomorphic. Two profiles may bind
     different roles, and the same role to unrelated physical paths."
  - "`provenance` is required on every binding. `user_reported` bindings are
     design inputs until a device-local scan replaces them; they are never
     evidence that a device was inspected."
  - "Windows volumes observed on one device are not transferred to another.
     In particular, the absence of E: and F: on one Windows machine says
     nothing about their presence on another."
