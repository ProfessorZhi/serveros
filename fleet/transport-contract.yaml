# ServerOS Fleet Transport contract.
#
# Why this file exists
# --------------------
# ServerOS owns *semantic* device identity. Reachability is a separate,
# disposable fact. The two are routinely conflated because a transport's
# own name for a machine (a hostname, a computer name, a relay UUID) is the
# first thing an operator sees — and therefore the first thing that gets
# copied into a registry, a policy, or a Skill.
#
# That conflation has a specific failure mode: reorganising the network
# silently renames the fleet, and two machines that happen to look alike
# (same OS, same installed skills) get merged into one identity.
#
# So the separation below is not stylistic. `device_ref` is authored, stable
# and public. A transport binding is observed, disposable and local-only.
schema: serveros/fleet-transport.v1

# ---------------------------------------------------------------------------
# Identity
# ---------------------------------------------------------------------------

identity:
  # A device reference is a TYPED ref, the same shape AbilityRef uses:
  #   device:work-fj   ·   skill:ProfessorZhi/serveros   ·   mcp:ProfessorZhi/meta-cc
  # One relation vocabulary, one primary key shape. `{type, id}`.
  ref_pattern: '^device:[a-z0-9][a-z0-9-]{1,62}$'
  id_pattern: '^[a-z0-9][a-z0-9-]{1,62}$'

  # A transport's name for a device is NEVER its identity. These fields may
  # be observed and recorded, but they may not be used to key, join, match or
  # deduplicate a device.
  never_identity:
    - hostname
    - computer_name
    - transport_locator
    - transport_uuid
    # The controller plane's names for the same two things. Listed separately
    # because they arrive in a different shape and would otherwise read as
    # product-level identifiers rather than as a route's name for a machine —
    # `device_uuid` is assigned at registration and changes when a device
    # re-enrols, which is the opposite of an identity.
    - device_name
    - device_uuid
    - ip
    - ssh_alias
    - display_name
    - os_family
    - installed_abilities

  rule: >-
    Two devices that present identical ability scans are still two devices.
    Merging identities requires enrollment evidence, never resemblance.

# ---------------------------------------------------------------------------
# Transport
# ---------------------------------------------------------------------------

transport:
  # Adapters are replaceable. Swapping one for another must not change any
  # device_ref, any profile, or any policy.
  kinds:
    - local
    - remote-desktop-commander
    - ssh
    - winrm
    - mcp
    - a2a

  # A binding answers "how may this runtime reach that device", nothing else.
  binding_fields:
    - device_ref
    - kind
    - locator        # opaque transport-side handle; carry no meaning upward
    - observed_name  # what the transport calls it, for human debugging
    - notes

  # Credentials are held by the transport, not described by the contract.
  # A binding that carries any of these is malformed, not merely unwise.
  forbidden_binding_fields:
    - token
    - access_token
    - refresh_token
    - password
    - secret
    - private_key
    - credential
    - cookie
    - authorization

  # Bindings are local-only: they describe one machine's route to another and
  # go stale the moment the network changes. They are never committed.
  binding_location: '~/.serveros/targets.yaml'

  # When a transport cannot serve a call, the call fails. It does not try a
  # different transport. A silent fallback changes the trust boundary without
  # anyone deciding to.
  no_silent_fallback: true

# ---------------------------------------------------------------------------
# Capability levels
# ---------------------------------------------------------------------------
#
# Declared ONCE, weakest first. A transport is granted a subset; nothing above
# this layer may assume a level it was not granted.
#
# This list previously existed in two files (`transport.py` as a constant and
# `mcp-contract.yaml` as `remote_execution.levels`). Two declarations of one
# closed vocabulary agree until the day someone edits one of them, and then
# the disagreement is silent — the code grants what the contract does not.

capability_levels:
  order:
    - discover          # list what devices exist at all
    - inspect           # environment facts about one device
    - read              # read a file's bytes
    - execute-safe      # run a command admitted as side-effect-free
    - write-workspace   # write inside a workspace root
    - install-ability   # materialize or remove an ability
    - system-change     # mutate host configuration
    - gui-control       # drive a graphical session
    - admin             # unrestricted

  # The same levels under the names used by the Fleet brief. Kept as a mapping
  # rather than a second list, so there is one vocabulary with two spellings
  # instead of two vocabularies that drift.
  alias_of:
    DISCOVER: discover
    INSPECT: inspect
    READ_FS: read
    WRITE_FS: write-workspace
    EXECUTE: execute-safe
    GUI_CONTROL: gui-control
    ADMIN: admin

  rule: >-
    Absence from a transport's granted set is a denial, not a hint. A caller
    that needs a level the transport was not granted fails at the boundary; it
    does not discover the gap by attempting the operation.

# ---------------------------------------------------------------------------
# Per-capability availability
# ---------------------------------------------------------------------------
#
# Availability is NOT one boolean. "Can this runtime reach that machine at
# all" and "can this runtime, right now, read a file there" are different
# questions, and a transport can answer yes to the first and no to the second.
#
# The distinction that matters here is EXTERNAL_ONLY: a controller surface
# genuinely exists and genuinely works — it is simply on another plane, so
# this runtime cannot call it. That is not the same as the capability being
# absent from the product, and collapsing the two produces either a false
# claim of control or a false claim of impossibility.

capability_availability:
  values:
    AVAILABLE: this runtime can exercise the capability now
    EXTERNAL_ONLY: a controller surface exists on another plane, not callable here
    NOT_GRANTED: the transport does not offer this capability at all
    UNKNOWN: not established; must not be read as either yes or no

  endpoint:
    # Reported alongside, because it is the field most often mistaken for
    # controller availability: an endpoint process can be running and healthy
    # on this host while nothing here can call it.
    values: [AVAILABLE, ABSENT, UNKNOWN]
    meaning: the transport's own endpoint is present on this host

  rule: >-
    Reporting EXTERNAL_ONLY is a statement about this runtime's reach, not
    about the capability's existence. A consumer that summarizes
    EXTERNAL_ONLY as "unavailable" and then as "unsupported" has destroyed the
    only fact that makes the gap actionable.

# ---------------------------------------------------------------------------
# Availability
# ---------------------------------------------------------------------------
#
# Three independent questions, three independent answers. Collapsing them into
# one "unobserved" flag is what makes an unreachable-controller condition look
# like a missing device — and then a missing device looks like a reason to
# re-enrol or delete it.

availability:
  fields:
    fleet_presence:
      values: [KNOWN_ONLINE, KNOWN_OFFLINE, UNKNOWN]
      meaning: whether the fleet plane currently sees the device at all
      # Evidence for this is routinely produced by another plane entirely
      # (a relay, an operator console). It is not a local observation.
      typical_provenance: [chatgpt_remote_device_control, fleet_relay]

    local_agent_controller:
      values: [AVAILABLE, NOT_EXPOSED, UNKNOWN]
      meaning: whether THIS agent runtime holds a callable controller surface
      # An endpoint process running locally is not a controller surface.
      # A process that dials outbound and listens on nothing cannot be called.

    remote_inventory_from_this_runtime:
      values: [AVAILABLE, UNAVAILABLE]
      meaning: whether this runtime can currently enumerate the device's tree

  # The derived single state, for consumers that want one word. Ordered:
  # the first matching row wins.
  derived_states:
    - state: CONTROLLER_AVAILABLE
      when: {local_agent_controller: AVAILABLE, fleet_presence: KNOWN_ONLINE}
    - state: DEVICE_UNREACHABLE
      when: {local_agent_controller: AVAILABLE, fleet_presence: KNOWN_OFFLINE}
    - state: REMOTE_CONTROLLER_NOT_EXPOSED
      when: {local_agent_controller: NOT_EXPOSED, fleet_presence: KNOWN_ONLINE}
    - state: CONTROLLER_NOT_EXPOSED_AND_PRESENCE_UNKNOWN
      when: {local_agent_controller: NOT_EXPOSED, fleet_presence: UNKNOWN}
    - state: DEVICE_UNOBSERVED
      when: {fleet_presence: UNKNOWN, local_agent_controller: UNKNOWN}

  rule: >-
    REMOTE_CONTROLLER_NOT_EXPOSED is a statement about THIS runtime's
    integration, not about the device. It must never be recorded as, reported
    as, or acted upon as DEVICE_UNOBSERVED.

# ---------------------------------------------------------------------------
# Provenance
# ---------------------------------------------------------------------------
#
# Every observed fact carries who observed it. A fact learned from a remote
# control plane is not a local observation, even when it is correct.

provenance_sources:
  - chatgpt_remote_device_control   # remote plane; correct but not local
  - fleet_relay                      # relay-side presence
  - local_endpoint                   # this host's transport endpoint
  - server_local_agent               # this agent runtime, locally
  - device_scanner                   # a scanner executed ON the device
  - user_reported                    # a human stated it; not machine-verified

rules:
  - "An observation records its source. Downstream consumers may filter by
     source; none may silently promote a remote or human claim to a local one."
  - "`device_scanner` outranks every other source for filesystem facts,
     because it is the only one that ran on the device."
  - "A fact with source `user_reported` is admissible for design work and
     inadmissible as evidence that a device was inspected."
