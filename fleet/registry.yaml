# ServerOS Fleet device registry — the stable identity layer.
#
# This file answers "who is in the fleet". It does not answer "where is it",
# "how do I reach it", or "is it up right now" — see transport-contract.yaml
# and the local-only bindings it points at.
#
# Not present here, by contract: hostnames, computer names, transport
# locators/uuids, addresses, SSH aliases, tokens, machine ids, MACs, asset
# tags, hardware serials. A device is enrolled here by a human decision; it is
# never auto-derived from a discovered endpoint.
schema: serveros/fleet-registry.v1

# ---------------------------------------------------------------------------
# `runtime_bindings:` is the canonical statement that a runtime family is
# resolved on a device; `agents:` is the same relationship in its older
# spelling, kept as a projection. Where the two disagree the binding is the
# answer, and the disagreement is reported rather than reconciled —
# `BINDING_MEMBERSHIP_MISMATCH`, from `abilities/runtime_parity.py`.
#
# What a binding entry does NOT carry, and why it matters more than what it
# does: no surface, no version, no install path, no feature list. Those are
# OBSERVATIONS — a fact about a machine at a time, made by a producer that
# reached it — and this file is authored by a human who did not. A surface
# written here for `device:personal-dell` would be a claim about a Windows
# laptop nobody has queried, and it would be indistinguishable in the record
# from the same line written after checking.
#
# So an entry says the two things a human decision can actually say: this
# runtime family belongs on this device, and when that was decided. Everything
# else is measured per device by `abilities/runtime_binding.py`, and where
# nothing measured it, it is UNKNOWN.
# ---------------------------------------------------------------------------

# Environment profiles are declared in fleet/profiles.yaml. A device names one;
# it does not carry the profile inline, so a profile cannot fork per device.
devices:
  - device_ref: device:server-beijing
    device_id: server-beijing
    display_name: Beijing-Server
    platform: linux
    ownership: personal
    # `server` was this device's earlier role. It restated `platform: linux`,
    # which is the one thing a role must not do: a role that duplicates a
    # field next to it hides the role that carries information. The role that
    # carries information here is the one below — that this host is the node
    # the fleet is controlled FROM.
    #
    # Roles are not identities and not aliases: nothing resolves by role, and
    # changing this line renames nothing and strands no evidence.
    roles: [fleet-controller-primary]
    environment_profile: linux-server
    agents: [claude-code, codex]
    runtime_bindings:
      - runtime_ref: agent-runtime:claude-code
        declared_at: 2026-09-14
      - runtime_ref: agent-runtime:codex
        declared_at: 2026-09-14
    # Historical ids remain resolvable. They renamed; they did not disappear.
    # Preserving them keeps earlier Installation and Revision evidence attached
    # to a stable identity instead of stranding it under a dead key.
    legacy_ids: [linux-server]
    enrollment: enrolled

  - device_ref: device:work-fj
    device_id: work-fj
    display_name: FJPCOS
    platform: windows
    os_family: windows-10
    ownership: company
    roles: [corporate-workstation]
    environment_profile: windows-corporate
    agents: [claude-code, codex]
    runtime_bindings:
      - runtime_ref: agent-runtime:claude-code
        declared_at: 2026-09-14
      - runtime_ref: agent-runtime:codex
        declared_at: 2026-09-14
    legacy_ids: []
    enrollment: enrolled

  - device_ref: device:personal-dell
    device_id: personal-dell
    display_name: DellPCOS
    platform: windows
    os_family: windows-11
    ownership: personal
    roles: [personal-workstation]
    environment_profile: windows-personal
    agents: [claude-code, codex]
    runtime_bindings:
      - runtime_ref: agent-runtime:claude-code
        declared_at: 2026-09-14
      - runtime_ref: agent-runtime:codex
        declared_at: 2026-09-14
    # `dell-work` was this machine's earlier registration. It migrates here by
    # alias; its Installation and Revision history stays attached.
    # It was NOT migrated into work-fj: two Windows laptops that look alike are
    # still two machines, and merging them would have been unrecoverable.
    legacy_ids: [dell-work]
    enrollment: enrolled

  # ---------------------------------------------------------------------------
  # Enrolled 2026-09-16 by the Beijing -> Tokyo primary-node migration.
  #
  # This is a NEW device, not a rename of an old one, so it gets a new
  # device_id and an empty `legacy_ids`. `device:server-beijing` stays exactly
  # as it was: the migration names Beijing SEALED REFERENCE / ROLLBACK, and a
  # rollback node whose record was rewritten during the migration is not a
  # rollback node.
  #
  # `roles` is `development-primary`, NOT `fleet-controller-primary`. Two
  # devices claiming to be the node the fleet is controlled from is the one
  # role collision worth refusing on sight. Beijing keeps that role until a
  # formal cutover; Tokyo's role says what Tokyo is FOR, not what it outranks.
  # The value is this node's own - `~/.config/serveros/host-profile.yaml`
  # states it under `node.roles` - so it is a fact about the device and not a
  # promotion invented here.
  #
  # `agents` lists only `claude-code`. Measured on this host through a login
  # shell: node v24.19.0 and npm 11.17.0 are present and the npm global list is
  # exactly `@anthropic-ai/claude-code` and `@playwright/mcp`. Codex is not
  # installed here and never has been. The `~/.codex` tree on this node is
  # MIGRATED SESSION STATE - its `sessions` directory carries a mtime from
  # before this node was bootstrapped - so it is evidence of what the migration
  # moved, not of what runs here. Registering `codex` because Beijing has it
  # would be the same defect as a surface written for a machine nobody queried.
  #
  # `ownership: company` and `os_family` are likewise this node's own, from the
  # same host profile. They were first written here as `personal` and omitted,
  # which is `device:server-beijing`'s ownership copied across; a shared
  # corporate host is not a personal one.
  # ---------------------------------------------------------------------------
  - device_ref: device:tokyo-shared-dev-01
    device_id: tokyo-shared-dev-01
    display_name: Tokyo-Shared-Dev-01
    platform: linux
    os_family: linux-ubuntu-24.04
    ownership: company
    roles: [development-primary]
    environment_profile: linux-shared-multiuser
    agents: [claude-code]
    runtime_bindings:
      - runtime_ref: agent-runtime:claude-code
        declared_at: 2026-09-16
    # No legacy_ids: this device has never been known by another name. The two
    # Windows machines each carry an earlier id here; Tokyo does not, and an
    # empty list is the true answer rather than a placeholder.
    legacy_ids: []
    enrollment: enrolled

  # ---------------------------------------------------------------------------
  # Enrolled 2026-10-12. Dell LLM Lab: a GPU compute box, and a machine that
  # shares its maker with the Windows laptop already in this file.
  #
  # A new device, not a rename. This is `personal-dell`'s own rule applied
  # again -- "two Windows laptops that look alike are still two machines" --
  # and it does not weaken because the two now differ in platform: the display
  # names resemble each other because the hardware does, and nothing about
  # hardware is an identity. `legacy_ids` is empty because this machine has
  # never been known here by another name, and an empty list is that answer
  # rather than a placeholder waiting to be filled.
  #
  # What is deliberately NOT here, and it is the same list as everywhere else:
  # the corporate asset name this machine is known by, its address, its SSH
  # locator, its tokens. `device-contract.yaml` puts those in
  # `forbidden_public_fields`, and this is the file every "who is in the fleet"
  # question reads. The asset name is how a person finds the machine in a rack;
  # it is not how the fleet identifies it, and a registry keyed by it would
  # stop resolving the moment the rack was relabelled. Both of those belong in
  # the local-only operator binding, which is where the ports are too.
  #
  # `roles: [gpu-compute-worker, development-worker]` says what this device is
  # FOR. It is not `development-primary` and not `fleet-controller-primary`:
  # Tokyo is where the fleet is developed and Beijing is where it is
  # controlled, and a third device claiming either role is the collision this
  # file refuses on sight. Roles are not ranks and nothing resolves by them.
  #
  # `agents` lists only `claude-code`, and `runtime_bindings` is the same fact
  # in the spelling that is authoritative for it. Codex is not installed on
  # this machine. The versions and install paths measured there stay out of
  # this file on purpose: an authored entry may say that a runtime family
  # belongs on a device and when that was decided, and a version written here
  # would be an observation nobody is keeping current, sitting where a reader
  # would take it for one.
  #
  # `ownership: company` is this machine's own answer and NOT copied from the
  # Windows Dell above it, whose answer is `personal`. The hardware is the
  # operator's own; what this field records is who the device belongs to as a
  # fleet fact, and for this machine that is the company.
  # ---------------------------------------------------------------------------
  - device_ref: device:llm-lab-dell
    device_id: llm-lab-dell
    display_name: Dell-LLM-Lab
    platform: linux
    os_family: linux-ubuntu-26.04
    ownership: company
    roles: [gpu-compute-worker, development-worker]
    environment_profile: linux-gpu-compute
    agents: [claude-code]
    runtime_bindings:
      - runtime_ref: agent-runtime:claude-code
        declared_at: 2026-10-12
    legacy_ids: []
    enrollment: enrolled


rules:
  - "device_id is stable. Renaming a device is an alias addition, not a
     replacement, so that historical evidence keeps resolving."
  - "platform is recorded because profiles are platform-shaped, not because it
     is an identity. Two devices sharing a platform are not one device."
  - "This registry is authored. It is never rewritten by a scanner."
  - "runtime_bindings is authoritative for which runtimes a device runs.
     agents is a projection of it. A device may list a binding without listing
     the same agent, and that difference is a finding rather than a preference:
     see BINDING_MEMBERSHIP_MISMATCH in abilities/runtime_parity.py."
