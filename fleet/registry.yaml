# ServerOS Fleet device registry — the stable identity layer.
#
# This file answers "who is in the fleet". It does not answer "where is it",
# "how do I reach it", or "is it up right now" — see transport-contract.yaml
# and the local-only bindings it points at.
#
# Not present here, by contract: hostnames, computer names, transport
# locators/uuids, addresses, SSH aliases, tokens, machine ids, MACs, asset
# tags, hardware serials. A device is enrolled here by a human decision; it is
# never auto-derived from a discovered endpoint.
schema: serveros/fleet-registry.v1

# ---------------------------------------------------------------------------
# `runtime_bindings:` is the canonical statement that a runtime family is
# resolved on a device; `agents:` is the same relationship in its older
# spelling, kept as a projection. Where the two disagree the binding is the
# answer, and the disagreement is reported rather than reconciled —
# `BINDING_MEMBERSHIP_MISMATCH`, from `abilities/runtime_parity.py`.
#
# What a binding entry does NOT carry, and why it matters more than what it
# does: no surface, no version, no install path, no feature list. Those are
# OBSERVATIONS — a fact about a machine at a time, made by a producer that
# reached it — and this file is authored by a human who did not. A surface
# written here for `device:personal-dell` would be a claim about a Windows
# laptop nobody has queried, and it would be indistinguishable in the record
# from the same line written after checking.
#
# So an entry says the two things a human decision can actually say: this
# runtime family belongs on this device, and when that was decided. Everything
# else is measured per device by `abilities/runtime_binding.py`, and where
# nothing measured it, it is UNKNOWN.
# ---------------------------------------------------------------------------

# Environment profiles are declared in fleet/profiles.yaml. A device names one;
# it does not carry the profile inline, so a profile cannot fork per device.
devices:
  - device_ref: device:server-beijing
    device_id: server-beijing
    display_name: Beijing-Server
    platform: linux
    ownership: personal
    # `server` was this device's earlier role. It restated `platform: linux`,
    # which is the one thing a role must not do: a role that duplicates a
    # field next to it hides the role that carries information. The role that
    # carries information here is the one below — that this host is the node
    # the fleet is controlled FROM.
    #
    # Roles are not identities and not aliases: nothing resolves by role, and
    # changing this line renames nothing and strands no evidence.
    roles: [fleet-controller-primary]
    environment_profile: linux-server
    agents: [claude-code, codex]
    runtime_bindings:
      - runtime_ref: agent-runtime:claude-code
        declared_at: 2026-09-14
      - runtime_ref: agent-runtime:codex
        declared_at: 2026-09-14
    # Historical ids remain resolvable. They renamed; they did not disappear.
    # Preserving them keeps earlier Installation and Revision evidence attached
    # to a stable identity instead of stranding it under a dead key.
    legacy_ids: [linux-server]
    enrollment: enrolled

  - device_ref: device:work-fj
    device_id: work-fj
    display_name: FJPCOS
    platform: windows
    os_family: windows-10
    ownership: company
    roles: [corporate-workstation]
    environment_profile: windows-corporate
    agents: [claude-code, codex]
    runtime_bindings:
      - runtime_ref: agent-runtime:claude-code
        declared_at: 2026-09-14
      - runtime_ref: agent-runtime:codex
        declared_at: 2026-09-14
    legacy_ids: []
    enrollment: enrolled

  - device_ref: device:personal-dell
    device_id: personal-dell
    display_name: DellPCOS
    platform: windows
    os_family: windows-11
    ownership: personal
    roles: [personal-workstation]
    environment_profile: windows-personal
    agents: [claude-code, codex]
    runtime_bindings:
      - runtime_ref: agent-runtime:claude-code
        declared_at: 2026-09-14
      - runtime_ref: agent-runtime:codex
        declared_at: 2026-09-14
    # `dell-work` was this machine's earlier registration. It migrates here by
    # alias; its Installation and Revision history stays attached.
    # It was NOT migrated into work-fj: two Windows laptops that look alike are
    # still two machines, and merging them would have been unrecoverable.
    legacy_ids: [dell-work]
    enrollment: enrolled

rules:
  - "device_id is stable. Renaming a device is an alias addition, not a
     replacement, so that historical evidence keeps resolving."
  - "platform is recorded because profiles are platform-shaped, not because it
     is an identity. Two devices sharing a platform are not one device."
  - "This registry is authored. It is never rewritten by a scanner."
  - "runtime_bindings is authoritative for which runtimes a device runs.
     agents is a projection of it. A device may list a binding without listing
     the same agent, and that difference is a finding rather than a preference:
     see BINDING_MEMBERSHIP_MISMATCH in abilities/runtime_parity.py."
