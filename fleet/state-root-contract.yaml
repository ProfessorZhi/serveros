# state/serveros — what this root owns, and what "authority" means inside it.
#
# Two claims, kept apart on purpose
# ---------------------------------
# OWNERSHIP: `DATA_ROOT/state/serveros` is the ServerOS-owned mutable durable
# state root. Anything ServerOS must remember between runs and cannot re-derive
# from the machine belongs here, and nothing else may claim to be this root.
#
# AUTHORITY: being under this root does NOT make a path authoritative.
# Authority is a property of a NAMESPACE, not of a prefix. Two namespaces do
# not have it at all: `locks/` records that a lease is held, and
# `projections/` holds derived material that can be regenerated and may never
# be read back as the thing it was derived from.
#
# The failure this contract exists to prevent is the one-sentence version:
# "it is under state/serveros, so it is the truth." That sentence is how a
# generated view becomes a source, how a cache becomes a record, and how an
# external snapshot of the machine becomes the machine.
#
# What this root is NOT
# ---------------------
# It is not the machine's single state authority. Other domains keep their own
# state at the same level — `state/personal`, `state/litellm-image-build` — and
# neither is migrated here to make a diagram look closed. A domain that owns
# its state owns it; consolidating unrelated state under one root would
# manufacture exactly the cross-domain coupling this project spends its time
# removing. `~/.serveros` is likewise not a state authority: it is a small,
# disposable node binding root (see `node-root-contract.yaml`).
schema: serveros/state-root.v1

root:
  ref: DATA_ROOT/state/serveros
  resolved_by: paths.py#ROOTS.state
  claim: ServerOS-owned mutable durable state root
  not_a_claim: >
    not "the entire machine's state authority", and not a requirement that
    other domain-owned state roots move here.

# ---------------------------------------------------------------------------
# Namespace-level authority (§22/§23)
# ---------------------------------------------------------------------------
#
# Every namespace below states who produces it and whether its absence is a
# fault. The distinction matters because the obvious check — "is the directory
# there" — cannot tell the three cases apart, and the obvious fix — create it —
# converts a finding into a fact about an empty directory.
#
#   PRESENT         a producer exists and has written
#   EXPECTED_ABSENT no producer yet; absence is the correct state
#   MISSING_REQUIRED a producer is declared and its output is not there
#
# `required: false` is not a weaker declaration. It says a directory whose
# existence nothing depends on must not be conjured into existence to make a
# conformance run green.
namespaces:
  node:
    class: authority
    holds: the local binding of this host to a device
    producer: fleet/node.py
    required: false
    absent_means: NODE_UNBOUND
  context:
    class: authority
    holds: the resolved working-environment context
    producer: context/
    required: false
    absent_means: CONTEXT_UNRESOLVED
  abilities:
    class: projection
    holds: the last-observed LOCAL capability projection
    producer: ability-management (writes), this node (observes)
    required: false
    authority: false
    # Deliberately classed as a projection even though it sits in the
    # authority root: ability-management is the authority for abilities and
    # always has been. A file here is what this node last SAW, and every
    # reader is told so.
    absent_means: NOT_MATERIALIZED
  runtime:
    class: authority
    holds: the managed-runtime registry and its observed/derived state
    producer: runtime/
    required: false
    children:
      registry:
        class: authority
        holds: declared managed runtimes
        producer: runtime/registry.py
        required: false
        absent_means: NO_REGISTRY
      observed:
        class: authority
        holds: what the last observation tick saw
        producer: runtime/inventory.py
        required: false
      health:
        class: authority
        holds: four-axis health and reconcile bookkeeping
        producer: runtime/health.py
        required: false
      hygiene:
        class: projection
        holds: container classification for a tick
        producer: runtime/containers.py
        required: false
        authority: false
      resources:
        class: authority
        holds: machine resource pressure
        producer: runtime/inventory.py
        required: false
        # Measured live on 2026-09-13: `runtime/` holds `health/`, `hygiene/`,
        # `observed/` and `registry/`, and nothing else. These four namespaces
        # declare producers that exist and are reachable, but that **compute on
        # demand and never persist** — `grep` for a state write in
        # `attribution.py`, `graph.py` and `anomaly.py` returns nothing, because
        # the daemon answers these over IPC and keeps no file.
        #
        # `NOT_YET_WRITTEN` was the wrong word for that. It promises a write
        # that is coming, so a reader waits for one; `COMPUTED_ON_DEMAND` says
        # the absence is the steady state, which is what is true. Both were
        # `required: false`, so nothing depended on either — which is exactly
        # why the wording could sit here being subtly wrong without anything
        # failing.
        absent_means: COMPUTED_ON_DEMAND
      attribution:
        class: authority
        holds: process → agent/task/group attribution as measured
        producer: runtime/attribution.py
        required: false
        absent_means: COMPUTED_ON_DEMAND
      graph:
        class: authority
        holds: the runtime groups derived from the process table
        producer: runtime/graph.py
        required: false
        absent_means: COMPUTED_ON_DEMAND
      agent-control:
        class: authority
        holds: >-
          trusted actor contexts and human approvals — who a request came from,
          what a person approved, and until when
        producer: runtime/agent_control_store.py (writes), runtime/daemon.py (mints)
        required: false
        absent_means: NO_AGENT_CONTROL_ACTIVITY
        # AUTHORITY, and deliberately not a projection. A record loaded from
        # this file is not re-verified by being loaded: `expires_at` is read
        # back and re-checked against the clock by every reader, so a process
        # that starts after an outage finds its approvals expired rather than
        # intact. Same rule as the rest of this root, applied to the one
        # namespace where being wrong means acting on authority nobody still
        # holds.
        #
        # It is also NOT a HumanIdentity DB, and the distinction is structural
        # rather than a policy: the store is keyed by `context_ref` and
        # `approval_ref`. An actor appears on records as a field and is never a
        # key, and `AgentControlStore` has no method returning everything about
        # a person — asserted by a test, because the tempting method is the
        # change that turns an evidence log into a directory of people.
        #
        # One file, not two. Contexts and approvals are written in the same
        # transaction when an approval is consumed, and two files written
        # together are two files that can disagree after a crash.
        not_a_claim: >
          not a source of identity, and not readable as one. Nothing here may
          be used to answer "who is this"; a context is evidence about one
          event and authorizes nothing on its own.
      anomalies:
        class: projection
        holds: anomaly classifications, including the combinations that did not fire
        producer: runtime/anomaly.py
        required: false
        authority: false
        absent_means: COMPUTED_ON_DEMAND
  fleet:
    class: projection
    holds: fleet-level observed state as seen from this node
    producer: fleet/
    required: false
    authority: false
    # §51: Fleet is optional per device. A node that declares no fleet
    # participation has no fleet state to observe, and that is the defined
    # state, not a missing one.
    absent_means: FLEET_NOT_DECLARED
  source-index:
    class: projection
    holds: an index over source locations
    producer: workspace-management
    required: false
    authority: false
    absent_means: NO_SOURCE_INDEX
  locks:
    class: non_authority
    holds: lease intent — that a holder believes it holds something
    producer: runtime/
    required: false
    # A lock file is evidence that someone CLAIMED a lease. It is not the
    # lease, and it must never be the only record that a resource is in use,
    # because a lock that outlives its holder then reads as an occupied
    # resource forever.
    authority: false
    # An empty lock directory is the ordinary state of an idle node. It is not
    # a producer that has not run yet: there is no periodic lock writer, and
    # there never will be one.
    absent_means: NO_LOCKS_HELD
  projections:
    class: projection
    holds: generated, derived, reproducible, non-authoritative views of anything
    producer: see each projection's manifest
    required: false
    authority: false
    absent_means: NO_PROJECTIONS
  # §38: these four existed on disk while this vocabulary omitted them, so the
  # conformance check reported each as an exemption rather than a declaration.
  # Their exception entries classified them CONTRACT_GAP, defined there as "the
  # vocabulary is behind reality and the fix is a ruling that widens it, not a
  # move". Declaring them here is that ruling, and it is the same treatment
  # `abilities` already gets: a namespace can belong to this root's shape while
  # still not being an authority.
  boards:
    class: projection
    holds: the derived Board current view, per project
    producer: serverosctl board render
    required: false
    authority: false
    absent_means: NO_BOARDS
  federation:
    class: projection
    holds: locator-only observed projections for external domains (feishu, github)
    producer: the federation collectors
    required: false
    authority: false
    # HWZ-MAP.md, FEISHU-MAP.md and GITHUB-MAP.md name
    # `federation/<domain>/current.jsonl` as the L3 observed SSOT. Being a
    # projection here and the SSOT there is not a contradiction: what this
    # root regenerates is what those documents point at.
    absent_means: NO_FEDERATION_OBSERVATION
  work-items:
    class: authority
    holds: runtime stage and liveness for one Work Item
    producer: work-management, through the control plane
    required: false
    # Explicitly not stored in Git. state/serveros/README.md and DEV-OS-SPEC
    # name `work-items/<project>/<WI>.json` as the work-state authority.
    absent_means: NO_WORK_ITEM_STATE
  resource-leases:
    class: authority
    holds: current resource occupancy
    producer: runtime/
    required: false
    # Empty is a state, not an absence: it means nothing is leased, which is
    # the ordinary reading on an idle node. Read by
    # ops/workspace/serveros/resources.yaml.
    absent_means: NO_LEASES_HELD

# ---------------------------------------------------------------------------
# Preexisting entries with no producer declaration
# ---------------------------------------------------------------------------
#
# These are HERE, and not in a second table in the checker, because two tables
# listing the same directories is the failure this project has already paid for
# three times: they agree on the day they are written and diverge silently
# after. `runtime/conformance.py` owns the exception table with its classes and
# dispositions; this section names the same entries so that the state-root
# report does not call a known directory "foreign", and a test asserts the two
# agree.
#
# `environment` is deliberately NOT listed. It was a point-in-time capture that
# passed through this state root on its way to the evidence plane; an exception
# for a directory that no longer exists is how an exception table stops
# describing anything.
preexisting:
  source_of_truth: runtime/conformance.py#EXCEPTIONS
  entries:
    - README.md
    - document-stewardship
    - migrations
    - serveros.db
    - serveros.db-shm
    - serveros.db-wal
  note: >
    §38 shrank this list from ten to six by ruling on the four that were
    classified CONTRACT_GAP — `boards`, `federation`, `work-items` and
    `resource-leases`. CONTRACT_GAP means the vocabulary is behind reality and
    the fix is to widen it rather than move anything, so all four are now in
    `paths.STATE_SERVEROS_TOP_LEVEL` and are declarations instead of
    exemptions. The four above that are FILES (README.md and the three SQLite
    WAL artefacts) cannot be namespaces and stay listed; the two directories
    that remain are unresolved rather than designed, and are kept out of the
    vocabulary deliberately so the question stays open. See
    conformance.EXCEPTIONS for why each is unresolved. None of them is created
    or moved by anything here.

# ---------------------------------------------------------------------------
# Projections (§24)
# ---------------------------------------------------------------------------
projections:
  # `state/serveros/projections/` is the ONLY projections namespace. It is not
  # `DATA_ROOT/projections`: a second top-level root for derived material would
  # itself become a durable-looking location, and the whole point is that this
  # namespace's contents are disposable.
  ref: state/serveros/projections
  no_top_level_root: DATA_ROOT/projections

  # Each projection directory carries this manifest, and a projection without
  # one is not a projection — it is undeclared material that happens to sit in
  # a directory with a promising name.
  manifest:
    name: projection.yaml
    required_fields: [authority, generated, generator, generated_at, source_refs, reproducible]
    # The literal `false`. Not "false or absent" — absence is what every
    # undeclared file already has, and accepting it here would make the
    # manifest additive rather than load-bearing.
    authority_must_be: false
    generated_must_be: true
    # And the same gate on the property that decides whether this namespace is
    # the right one at all. `reproducible` is stated rather than assumed:
    # "generated" only says a tool wrote it, so a machine snapshot is generated
    # and still cannot be regenerated. A manifest declaring `reproducible:
    # false` is not a broken projection to be repaired — it is a correct
    # description of EVIDENCE, in the wrong namespace, and the fix is to move
    # it, not to relax the invariant.
    reproducible_must_be: true
    source_refs: "what this was derived FROM. Never this namespace."
    generator: "what wrote it. A foreign generator is allowed; see below."
    generated_at: "when, so staleness is a fact rather than a guess."

  invariants:
    - id: NO_SOURCE_AUTHORITY
      means: >
        a projection may not become the source authority for anything. Nothing
        reads a projection to decide what is true; it reads it to see what was
        last derived.
    - id: NO_OVERWRITE_AUTHORITY
      means: >
        regenerating a projection may not write into an authority namespace.
        A generator that can only express its result by overwriting the
        authority has made the authority derived, whatever the manifest says.
    - id: DRIFT_REGENERATES
      means: >
        when a projection disagrees with its source, the fix is to regenerate
        the projection. Editing the projection to match is the reverse
        direction and is how derived material becomes a second source.
    - id: LOSS_REPRODUCIBLE
      means: >
        deleting a projection must be recoverable by regenerating it. An
        artifact whose loss is not recoverable is NOT a projection, whatever
        directory it is in — it is evidence, and evidence belongs in the
        evidence plane with a retention rule.
      enforced_by: >
        read_manifest, which requires `reproducible: true` in the manifest. The
        invariant is the reason; the manifest field is the gate, so a
        non-reproducible snapshot is refused on the way IN rather than
        discovered later by someone trying to regenerate it.
    - id: NO_SELF_REFERENCE
      means: >
        a projection's source_refs may not name projections/ itself. A
        projection derived from a projection is a chain with no authority at
        its root, and the chain looks stable for as long as nobody regenerates
        the middle link.

  foreign_generators:
    allowed: true
    # A generator that is not ServerOS — a machine baseline probe, an external
    # scanner, another domain's tool — may write a projection here.
    gains_authority: false
    # Writing into this namespace never makes the writer an authority for the
    # content. That is the whole point of putting it here rather than in an
    # authority namespace: the placement is the statement.
    must_declare: generator
    # Naming the generator is what lets a reader decide how much to trust it,
    # and lets a later check find every projection one tool wrote.

# ---------------------------------------------------------------------------
# The check this contract asks for
# ---------------------------------------------------------------------------
authority_conflict:
  # One semantic fact declared authoritative in an authority namespace AND in
  # projections/ is two answers to one question, and the second one will win
  # eventually because it is easier to read.
  id: AUTHORITY_CONFLICT
  severity: HIGH
  enforcement: WARN          # Phase-1: reported, does not block
  promotable_to: BLOCK
  detects:
    - "a projection whose source_refs resolve inside an authority namespace that also declares the same fact"
    - "a projection file whose path mirrors an authority path (projections/runtime/health/current.json vs runtime/health/current.json)"
  does_not_detect:
    - "a projection that merely CONTAINS a value the authority also contains. Agreement is not conflict, and a check that flagged it would flag every correct projection."

# ---------------------------------------------------------------------------
# What this contract does not say
# ---------------------------------------------------------------------------
not_claimed:
  - "that every namespace above exists. Most do not, and their absence is a valid state."
  - "that a namespace may not gain a child. A child appears when a producer exists; it is declared here at the same time."
  - "that other DATA_ROOT top-level roots are not authorities. `artifacts/`, `records/` and `workspace/` are authorities for what they own — this contract is about one root, not about the machine."
