# state/serveros — what this root owns, and what "authority" means inside it.
#
# Two claims, kept apart on purpose
# ---------------------------------
# OWNERSHIP: `DATA_ROOT/state/serveros` is the ServerOS-owned mutable durable
# state root. Anything ServerOS must remember between runs and cannot re-derive
# from the machine belongs here, and nothing else may claim to be this root.
#
# AUTHORITY: being under this root does NOT make a path authoritative.
# Authority is a property of a NAMESPACE, not of a prefix. Two namespaces do
# not have it at all: `locks/` records that a lease is held, and
# `projections/` holds derived material that can be regenerated and may never
# be read back as the thing it was derived from.
#
# The failure this contract exists to prevent is the one-sentence version:
# "it is under state/serveros, so it is the truth." That sentence is how a
# generated view becomes a source, how a cache becomes a record, and how an
# external snapshot of the machine becomes the machine.
#
# What this root is NOT
# ---------------------
# It is not the machine's single state authority. Other domains keep their own
# state at the same level — `state/personal`, `state/litellm-image-build` — and
# neither is migrated here to make a diagram look closed. A domain that owns
# its state owns it; consolidating unrelated state under one root would
# manufacture exactly the cross-domain coupling this project spends its time
# removing. `~/.serveros` is likewise not a state authority: it is a small,
# disposable node binding root (see `node-root-contract.yaml`).
schema: serveros/state-root.v1

root:
  ref: DATA_ROOT/state/serveros
  resolved_by: paths.py#ROOTS.state
  claim: ServerOS-owned mutable durable state root
  not_a_claim: >
    not "the entire machine's state authority", and not a requirement that
    other domain-owned state roots move here.

# ---------------------------------------------------------------------------
# Namespace-level authority (§22/§23)
# ---------------------------------------------------------------------------
#
# Every namespace below states who produces it and whether its absence is a
# fault. The distinction matters because the obvious check — "is the directory
# there" — cannot tell the three cases apart, and the obvious fix — create it —
# converts a finding into a fact about an empty directory.
#
#   PRESENT         a producer exists and has written
#   EXPECTED_ABSENT no producer yet; absence is the correct state
#   MISSING_REQUIRED a producer is declared and its output is not there
#
# `required: false` is not a weaker declaration. It says a directory whose
# existence nothing depends on must not be conjured into existence to make a
# conformance run green.
#
# Producers named by domain
# -------------------------
# Some of these facts are produced by a skill or a repository that does not
# live in this tree. §18 asks for one producer per fact and a producer that can
# be resolved, so the domains this contract cannot read from here are listed
# rather than left as prose. The distinction the list draws is exact: a name in
# it is a declaration that the producer is real and elsewhere, and a producer
# naming neither a path nor one of these is reported as unresolvable — which is
# what makes "we cannot see it from here" different from "nobody can see it".
external_producers:
  - ability-management
  - workspace-management
  - work-management

namespaces:
  node:
    class: authority
    holds: the local binding of this host to a device
    producer: fleet/node.py
    required: false
    absent_means: NODE_UNBOUND
  context:
    class: authority
    holds: the resolved working-environment context
    producer: context/
    required: false
    absent_means: CONTEXT_UNRESOLVED
  abilities:
    class: projection
    holds: the last-observed LOCAL capability projection
    # The producer used to be prose — "ability-management (writes), this node
    # (observes)" — and neither half was true of any program in this tree:
    # ability-management never wrote here, and `runtime/ability_projection.py`
    # had no caller outside its own tests. So the Discovery surface read a file
    # with no producer, which is `DECLARED_ABSENT` in its purest form.
    #
    # The producer is the module below, reached as `serverosctl ability
    # refresh`. It is a command rather than a daemon tick on purpose: a tick
    # that ran `git show` against another repository would make the loop's
    # latency depend on that repository's state, which is what §28 forbids.
    #
    # The field names the MODULE, not the command, and that is a correction
    # rather than a preference. "serverosctl ability refresh" is a sentence,
    # and every reader of this field that matters resolves producers by asking
    # three questions — is this a path in the tree, is it a domain this
    # contract declares external, is it a section of this contract — and a
    # sentence answers none of them. So the field reported as unresolvable,
    # and an unresolvable producer is read as an unwritten one. Naming the
    # module answers the first question, and the command stays one line up
    # where a reader can type it.
    producer: runtime/ability_projection.py
    required: false
    authority: false
    # Deliberately classed as a projection even though it sits in the
    # authority root: ability-management is the authority for abilities and
    # always has been. A file here is what this node last SAW, and every
    # reader is told so.
    absent_means: NOT_MATERIALIZED
  runtime:
    class: authority
    holds: the managed-runtime registry and its observed/derived state
    producer: runtime/
    required: false
    children:
      registry:
        class: authority
        holds: declared managed runtimes
        producer: runtime/registry.py
        required: false
        absent_means: NO_REGISTRY
      observed:
        class: authority
        holds: what the last observation tick saw
        producer: runtime/inventory.py
        required: false
      health:
        class: authority
        holds: four-axis health and reconcile bookkeeping
        producer: runtime/health.py
        required: false
      hygiene:
        class: projection
        holds: container classification for a tick
        producer: runtime/containers.py
        required: false
        authority: false
      resources:
        class: authority
        holds: machine resource pressure
        producer: runtime/inventory.py
        required: false
        # Measured live on 2026-09-13: `runtime/` holds `health/`, `hygiene/`,
        # `observed/` and `registry/`, and nothing else. These four namespaces
        # declare producers that exist and are reachable, but that **compute on
        # demand and never persist** — `grep` for a state write in
        # `attribution.py`, `graph.py` and `anomaly.py` returns nothing, because
        # the daemon answers these over IPC and keeps no file.
        #
        # `NOT_YET_WRITTEN` was the wrong word for that. It promises a write
        # that is coming, so a reader waits for one; `COMPUTED_ON_DEMAND` says
        # the absence is the steady state, which is what is true. Both were
        # `required: false`, so nothing depended on either — which is exactly
        # why the wording could sit here being subtly wrong without anything
        # failing.
        absent_means: COMPUTED_ON_DEMAND
      attribution:
        class: authority
        holds: process → agent/task/group attribution as measured
        producer: runtime/attribution.py
        required: false
        absent_means: COMPUTED_ON_DEMAND
      graph:
        class: authority
        holds: the runtime groups derived from the process table
        producer: runtime/graph.py
        required: false
        absent_means: COMPUTED_ON_DEMAND
      agent-control:
        class: authority
        holds: >-
          trusted actor contexts, human approvals and standing delegations —
          who a request came from, what a person approved, until when, and the
          scope a cycle may carry without asking again
        # One producer, and it is the store. `runtime/daemon.py` mints the
        # identifiers and writes through the same module — that is a caller,
        # not a second producer, and §18's whole rule is that the two are not
        # the same thing. Written as a path because a parenthetical made it
        # unresolvable: prose that names two files cannot be checked, and a
        # checker that cannot check it has no opinion to offer.
        producer: runtime/agent_control_store.py
        required: false
        absent_means: NO_AGENT_CONTROL_ACTIVITY
        # AUTHORITY, and deliberately not a projection. A record loaded from
        # this file is not re-verified by being loaded: `expires_at` is read
        # back and re-checked against the clock by every reader, so a process
        # that starts after an outage finds its approvals expired rather than
        # intact. Same rule as the rest of this root, applied to the one
        # namespace where being wrong means acting on authority nobody still
        # holds.
        #
        # It is also NOT a HumanIdentity DB, and the distinction is structural
        # rather than a policy: the store is keyed by `context_ref` and
        # `approval_ref`. An actor appears on records as a field and is never a
        # key, and `AgentControlStore` has no method returning everything about
        # a person — asserted by a test, because the tempting method is the
        # change that turns an evidence log into a directory of people.
        #
        # One file, not two. Contexts and approvals are written in the same
        # transaction when an approval is consumed, and two files written
        # together are two files that can disagree after a crash.
        #
        # The namespace also holds `<file>.lock` beside the store, created on
        # the first write. It is not a record, it never becomes one, and it is
        # listed here because a reader who finds a file in an authority
        # namespace is entitled to know what it is. It is what
        # `runtime/agent_control_store.py` takes an exclusive kernel lock on
        # while a mutation is applied, so that two writers cannot each write a
        # document missing the other's records. Deliberately never unlinked, and
        # its presence says nothing about whether a lock is held — the kernel
        # drops the lock when the holder exits, however it exits. Not the same
        # thing as the `locks/` namespace below, where a file IS a holder's
        # claim; a lock file whose existence is the lock is the reading
        # `runtime/state_root.py` warns about, and this is the other kind.
        not_a_claim: >
          not a source of identity, and not readable as one. Nothing here may
          be used to answer "who is this"; a context is evidence about one
          event and authorizes nothing on its own.
      anomalies:
        class: projection
        holds: anomaly classifications, including the combinations that did not fire
        producer: runtime/anomaly.py
        required: false
        authority: false
        absent_means: COMPUTED_ON_DEMAND
      alerts:
        class: authority
        holds: >-
          the alert state machine — one row per open or closed anomaly, keyed by
          code + device + subject, with what was measured and what a person has
          done about it
        producer: runtime/alerting.py
        required: false
        absent_means: NO_ALERTS_RECORDED
        # AUTHORITY, and not a projection, and the distinction is the one this
        # namespace is most likely to lose. A projection is recomputed from a
        # source of record — `anomalies` above is exactly that, and a reader who
        # disagrees with it can recompute it. This file cannot be recomputed:
        # whether a person has acknowledged an alert, and when it last spoke, are
        # not derivable from the process table, so the file IS the record. A
        # reader that threw it away and started fresh would re-notify every open
        # alert as if it were new, which is the failure the whole module exists
        # to prevent.
        #
        # What it deliberately is NOT is a metrics store. There is no history
        # here, no per-tick row and no series: `occurrence_count` is a counter
        # and `last_seen` is one timestamp, and neither can answer "what was the
        # disk usage at 3pm". A reader wanting that asks the observation surface,
        # which measures it again.
        not_a_claim: >
          not a source of truth about the world, only about what this node said.
          An OPEN row is not evidence that something is broken right now — the
          detector is what answers that — and a RESOLVED row is not evidence
          that a fault was fixed by anything this system did, because nothing
          this system does fixes anything.
      cards:
        class: authority
        holds: >-
          the two documents the card subsystem keeps — the delivery ledger
          (which card version a transport was handed, and under what state) and
          the day's own memory (today's card, which message carries it, and the
          hours it has folded)
        # The producer is the module that DEFINES the directory, and it is one
        # module rather than two on purpose: `card_day.day_path` is documented
        # as "`card_delivery.ledger_path` for the same reason and the same
        # shape", so the day store follows this convention instead of restating
        # it. A producer field naming both files would be a sentence, and a
        # sentence naming two files resolves to neither — which is why
        # `agent-control` above spells its two-writer situation out instead.
        producer: runtime/card_delivery.py
        required: false
        absent_means: NO_CARDS_RECORDED
        # Declared 2026-09-26, and it was a CONTRACT_GAP in the sense §38 gives
        # the word: the vocabulary was behind reality and the fix is a ruling
        # that widens it, not a move. `<state>/runtime/cards/` had been on disk
        # since the card ledger shipped (the 21:00 broadcast wrote
        # `delivery.json`), no declaration here named it, and the node's own
        # `architecture check` could not see it: the namespace comparison reads
        # top-level entries only, so an undeclared CHILD of a declared parent is
        # outside what that check covers. It was found by wiring the card
        # subsystem to this node's live sender, not by reading.
        #
        # `~/.serveros/` was the alternative home and is refused by that root's
        # own contract rather than by preference: `fleet/node-root-contract.yaml`
        # declares three files and says "large state does not live here", i.e.
        # every entry there can be deleted and re-derived. A day's card cannot —
        # losing the record of which message carries it is what makes the next
        # tick create the second card V28 forbids — so it is not a legitimate
        # member of a disposable root. Until 2026-09-26 the day store pointed
        # there anyway, and the one feature's two documents sat in two roots.
        not_a_claim: >
          not a metrics store and not a history of what the node saw. The folded
          rows are the card's own memory of what it already said, kept so that a
          reader can tell «this hour says nothing new» from «this hour was never
          reported»; they are not a series and cannot answer "what was the disk
          usage at 3pm". Nothing here is a claim about the world — the ledger
          records what a TRANSPORT did with a payload, and a DELIVERED row is
          evidence that the service accepted a message, not that a person read
          it.
  fleet:
    class: projection
    holds: fleet-level observed state as seen from this node
    producer: fleet/
    required: false
    authority: false
    # §51: Fleet is optional per device. A node that declares no fleet
    # participation has no fleet state to observe, and that is the defined
    # state, not a missing one.
    absent_means: FLEET_NOT_DECLARED
  source-index:
    class: projection
    holds: an index over source locations
    producer: workspace-management
    required: false
    authority: false
    absent_means: NO_SOURCE_INDEX
  locks:
    class: non_authority
    holds: lease intent — that a holder believes it holds something
    producer: runtime/
    required: false
    # A lock file is evidence that someone CLAIMED a lease. It is not the
    # lease, and it must never be the only record that a resource is in use,
    # because a lock that outlives its holder then reads as an occupied
    # resource forever.
    authority: false
    # An empty lock directory is the ordinary state of an idle node. It is not
    # a producer that has not run yet: there is no periodic lock writer, and
    # there never will be one.
    absent_means: NO_LOCKS_HELD
  projections:
    class: projection
    holds: generated, derived, reproducible, non-authoritative views of anything
    # Resolvable, and the resolution is the point: a projection's producer is
    # the `generator` field its own manifest must carry, and the section below
    # is where that manifest is described. Writing it as "see each projection's
    # manifest" was a sentence that named nothing — §18's checker reported it,
    # correctly, as a producer nobody could resolve.
    producer: projections.manifest
    required: false
    authority: false
    absent_means: NO_PROJECTIONS
  # §38: these four existed on disk while this vocabulary omitted them, so the
  # conformance check reported each as an exemption rather than a declaration.
  # Their exception entries classified them CONTRACT_GAP, defined there as "the
  # vocabulary is behind reality and the fix is a ruling that widens it, not a
  # move". Declaring them here is that ruling, and it is the same treatment
  # `abilities` already gets: a namespace can belong to this root's shape while
  # still not being an authority.
  boards:
    class: projection
    holds: the derived Board current view, per project
    # The producer is real and is NOT a command of this repository — and both
    # halves of that took reading to establish, because the name is genuinely
    # ambiguous on this machine.
    #
    # TWO PROGRAMS ARE CALLED `serverosctl`, AND PATH GIVES THE NAME TO THIS ONE
    # -------------------------------------------------------------------------
    #   ~/.local/bin/serverosctl -> runtime-assets/hwz-server-os/
    #       serveros-linux-work/current/bin/serverosctl          = THIS repo's
    #       node CLI. Subcommands: status, device, context, path, resource,
    #       runtime, process, anomaly, container, ability, memory, probe. It
    #       has no `board`, and never had one.
    #   envs/python/serveros-control-plane/bin/serverosctl       = the
    #       work-engine control plane. `pyproject.toml` declares BOTH
    #       `workengine` and `serverosctl` as console scripts for
    #       `workengine.cli:main`, and that CLI's argparse prog is literally
    #       `serverosctl`. It has `board render`, and it wrote every file under
    #       this namespace: `workengine/board.py` — `render()`, schema
    #       `serveros/board.v3`, `current.json` + `current.md`.
    #
    # So the previous spelling of this field — this repository's CLI name,
    # followed by the control plane's `board render` — named a command that
    # EXISTS, in the other distribution. On this node a reader who typed it was
    # answered `invalid choice: 'board'` by the node CLI, and both gates in
    # this tree reported the namespace as one whose producer nobody could
    # resolve, which reads as unwritable rather than as misattributed.
    #
    # `work-management` is the ability that owns Item/Run/board state, and it
    # is the external domain this contract already declares for it; the command
    # is named beside it so that a reader can run the thing rather than look up
    # which program the ability resolves to today. Reached on this node as:
    #   <control-plane>/bin/workengine board render \
    #       --project P --output-dir <state>/boards/P
    producer: work-management (the control plane's `workengine board render`,
      whose own argparse prog is `serverosctl`)
    required: false
    authority: false
    absent_means: NO_BOARDS
  federation:
    class: projection
    holds: locator-only observed projections for external domains (feishu, github)
    # "the federation collectors" named a GROUP, and a group is not something a
    # reader can run, check, or be told is missing. The collectors are real:
    # `workengine/federation.py` on the control plane — `publish_inventory`,
    # `check_inventory` and `proposal` — exposed as `workengine federation
    # <domain> publish|check|proposal`. The same correction as `boards` and
    # `abilities` in this file: name the owning ability first, so the field
    # resolves, and put the command beside it so a reader can run the thing.
    producer: work-management (the control plane's `workengine federation
      <domain> publish`)
    required: false
    authority: false
    # HWZ-MAP.md, FEISHU-MAP.md and GITHUB-MAP.md name
    # `federation/<domain>/current.jsonl` as the L3 observed SSOT. Being a
    # projection here and the SSOT there is not a contradiction: what this
    # root regenerates is what those documents point at.
    absent_means: NO_FEDERATION_OBSERVATION
  work-items:
    class: authority
    holds: runtime stage and liveness for one Work Item
    producer: work-management, through the control plane
    required: false
    # Explicitly not stored in Git. state/serveros/README.md and DEV-OS-SPEC
    # name `work-items/<project>/<WI>.json` as the work-state authority.
    absent_means: NO_WORK_ITEM_STATE
  resource-leases:
    class: authority
    holds: current resource occupancy
    producer: runtime/
    required: false
    # Empty is a state, not an absence: it means nothing is leased, which is
    # the ordinary reading on an idle node. Read by
    # ops/workspace/serveros/resources.yaml.
    absent_means: NO_LEASES_HELD
  verification:
    class: authority
    holds: >
      which test files were verified, what each of them read, and the
      fingerprints of those bytes at the moment the verdict was recorded
    producer: scripts/verify.py
    required: false
    # A RECORD OF A PAST ACT, like an approval — and it is an authority for the
    # same reason an approval is: nothing can re-derive it. The bytes a test
    # read at the moment it passed are not recoverable from the tree later,
    # which is exactly why they are written down here rather than recomputed on
    # demand.
    #
    # It is NOT an authority about whether the code is correct. `CURRENT` means
    # nothing this verdict was a statement about has moved; it does not mean the
    # test still covers what changed, and it is not a substitute for the run.
    #
    # Empty is the ordinary state of a node that has verified nothing, and it is
    # also the state a reader must not mistake for a clean one: a namespace with
    # no record answers "nobody looked", which is why `scripts/verify.py status`
    # exits COULD_NOT_ANSWER rather than OK when the record it was asked about is
    # not there.
    absent_means: NOTHING_VERIFIED_YET
  recipes:
    class: authority
    holds: >
      one record per §7 loop per scope per period: the claim written before the
      first step, the outcome written after the last one, what the run read,
      what it spent and — when it stopped — the word it stopped with
    producer: runtime/recipes.py
    required: false
    # A RECORD OF A PAST ACT, like an approval and like `verification`. Nothing
    # can re-derive it: whether a period was advanced, and how far, is not
    # recoverable from the tree afterwards, which is why it is written down
    # rather than recomputed.
    #
    # The path is the key. `recipes/<recipe>/<scope>/<period>.json` means a
    # person asking "has this period been done" answers by looking at one file,
    # and it means the loop's own re-entrancy rule -- a restart does not
    # dispatch one work twice -- is enforced by the filesystem rather than by a
    # check inside the loop.
    #
    # Empty is the ordinary state of a node that has run nothing, and it is not
    # a clean bill: a namespace with no record answers "nobody ran this", which
    # is why `serverosctl recipe status` exits COULD_NOT_ANSWER rather than OK
    # for a period in which no loop has a record.
    #
    # `schedules.yaml` and `model-binding.yaml` live under this namespace too,
    # and they are the two authored files in it: an operator writes the
    # instance's timezone, window, recipients, data scope and cost ceiling, and
    # a loop driven by `--schedule` refuses rather than inferring a window when
    # that file is absent. §7: the bindings are made by hand, and no timer is
    # enabled by this repository.
    absent_means: NO_RECIPE_HAS_RUN
  requirement-board:
    class: projection
    holds: §S's Global Requirement Board — every project's Items in one view
    # A THIRD kind of derived document, beside `boards` and `federation`, and
    # the difference is what it is derived FROM: `boards` is per project and
    # written by the control plane from the authority, this one is all projects
    # at once and is derived from those boards. It therefore has no authority
    # to reconcile with — it reads `boards/<project>/current.json`, never the
    # work-engine store, and the state column it prints is the state the
    # control plane already published.
    #
    # IT IS NOT WRITTEN BACK AND NOTHING READS IT. §S's board is for a person
    # and for the report; no routing, admission or resolution decision consults
    # it, and a second reader appearing here would make a projection into a
    # second authority. That is why the CLI's default is to print and write
    # nothing.
    #
    # This producer is a MODULE and not a command name, which is the opposite
    # of the choice made for `boards` and `federation` two entries up — those
    # name an ability and a command because the producer is in another
    # distribution. Here it is in this repository, and both readers of this
    # field answer a path by asking whether it exists: a sentence with spaces
    # in it answers none of their questions and is read as an unwritten
    # producer. The command is named in the comment instead, and in
    # `intake/board-contract.yaml#generation.command`, which is where a
    # command belongs.
    #
    # Reached on this node as:
    #   serverosctl requirement board [--write] [--output-dir <abs>]
    producer: intake/global_board.py
    required: false
    authority: false
    absent_means: NO_BOARD_GENERATED_YET

# ---------------------------------------------------------------------------
# Preexisting entries with no producer declaration
# ---------------------------------------------------------------------------
#
# These are HERE, and not in a second table in the checker, because two tables
# listing the same directories is the failure this project has already paid for
# three times: they agree on the day they are written and diverge silently
# after. `runtime/conformance.py` owns the exception table with its classes and
# dispositions; this section names the same entries so that the state-root
# report does not call a known directory "foreign", and a test asserts the two
# agree.
#
# `environment` is deliberately NOT listed. It was a point-in-time capture that
# passed through this state root on its way to the evidence plane; an exception
# for a directory that no longer exists is how an exception table stops
# describing anything. `archive` IS listed, and the difference between the two
# is presence rather than kind — see the note below.
preexisting:
  source_of_truth: runtime/conformance.py#EXCEPTIONS
  entries:
    - README.md
    - archive
    - document-stewardship
    - laya-shared
    - migrations
    - serveros.db
    - serveros.db-shm
    - serveros.db-wal
  note: >
    §38 shrank this list from ten to six by ruling on the four that were
    classified CONTRACT_GAP — `boards`, `federation`, `work-items` and
    `resource-leases`. CONTRACT_GAP means the vocabulary is behind reality and
    the fix is to widen it rather than move anything, so all four are now in
    `paths.STATE_SERVEROS_TOP_LEVEL` and are declarations instead of
    exemptions. `archive` and `laya-shared` were added on 2026-09-23, which took
    the list back to eight; the paragraph after next says why, and neither is
    CONTRACT_GAP — widening the vocabulary for either would assert exactly the
    thing that is still open. The four above that are FILES (README.md and the three SQLite
    WAL artefacts) cannot be namespaces and stay listed; the two directories
    §38 left are unresolved rather than designed, and are kept out of the
    vocabulary deliberately so the question stays open. See
    conformance.EXCEPTIONS for why each is unresolved. None of them is created
    or moved by anything here.

    The 2026-09-23 pair, and why filing beats reporting. Both were on disk in
    no list at all — not here, not in `conformance.EXCEPTIONS`, not in
    `paths.STATE_SERVEROS_TOP_LEVEL` — and a name in no list is a name no report
    can describe. `archive/` holds the sealed Beijing node's state root,
    captured by the 2026-09-18 migration. That makes it the same kind of object
    as `environment` above, a point-in-time capture, and it is listed rather
    than moved for the reason `environment` is not listed: the two differ in
    whether the capture is still here, not in what it is, and the ruling that
    sent one to the evidence plane has not been applied to the other.
    `laya-shared/` holds the socket of the running `laya-shared.service` and
    belongs to ability-management's shared-provider contract rather than to any
    ServerOS producer, so whether it sits under this root is a boundary
    question. While it was undescribed, `fs_hygiene` called a live service's
    socket directory MISPLACED and unprotected, and `misplaced` is the class
    with a move behind it: under §1's proposal-only cleanup rule that verdict
    was one approval away from being acted on. Filing it does not settle the
    boundary question and is not meant to; it changes the answer from "in the
    wrong place" to "somebody else's decision", which is the true one.

# ---------------------------------------------------------------------------
# Projections (§24)
# ---------------------------------------------------------------------------
projections:
  # `state/serveros/projections/` is the ONLY projections namespace. It is not
  # `DATA_ROOT/projections`: a second top-level root for derived material would
  # itself become a durable-looking location, and the whole point is that this
  # namespace's contents are disposable.
  ref: state/serveros/projections
  no_top_level_root: DATA_ROOT/projections

  # Each projection directory carries this manifest, and a projection without
  # one is not a projection — it is undeclared material that happens to sit in
  # a directory with a promising name.
  manifest:
    name: projection.yaml
    required_fields: [authority, generated, generator, generated_at, source_refs, reproducible]
    # The literal `false`. Not "false or absent" — absence is what every
    # undeclared file already has, and accepting it here would make the
    # manifest additive rather than load-bearing.
    authority_must_be: false
    generated_must_be: true
    # And the same gate on the property that decides whether this namespace is
    # the right one at all. `reproducible` is stated rather than assumed:
    # "generated" only says a tool wrote it, so a machine snapshot is generated
    # and still cannot be regenerated. A manifest declaring `reproducible:
    # false` is not a broken projection to be repaired — it is a correct
    # description of EVIDENCE, in the wrong namespace, and the fix is to move
    # it, not to relax the invariant.
    reproducible_must_be: true
    source_refs: "what this was derived FROM. Never this namespace."
    generator: "what wrote it. A foreign generator is allowed; see below."
    generated_at: "when, so staleness is a fact rather than a guess."

  invariants:
    - id: NO_SOURCE_AUTHORITY
      means: >
        a projection may not become the source authority for anything. Nothing
        reads a projection to decide what is true; it reads it to see what was
        last derived.
    - id: NO_OVERWRITE_AUTHORITY
      means: >
        regenerating a projection may not write into an authority namespace.
        A generator that can only express its result by overwriting the
        authority has made the authority derived, whatever the manifest says.
    - id: DRIFT_REGENERATES
      means: >
        when a projection disagrees with its source, the fix is to regenerate
        the projection. Editing the projection to match is the reverse
        direction and is how derived material becomes a second source.
    - id: LOSS_REPRODUCIBLE
      means: >
        deleting a projection must be recoverable by regenerating it. An
        artifact whose loss is not recoverable is NOT a projection, whatever
        directory it is in — it is evidence, and evidence belongs in the
        evidence plane with a retention rule.
      enforced_by: >
        read_manifest, which requires `reproducible: true` in the manifest. The
        invariant is the reason; the manifest field is the gate, so a
        non-reproducible snapshot is refused on the way IN rather than
        discovered later by someone trying to regenerate it.
    - id: NO_SELF_REFERENCE
      means: >
        a projection's source_refs may not name projections/ itself. A
        projection derived from a projection is a chain with no authority at
        its root, and the chain looks stable for as long as nobody regenerates
        the middle link.

  foreign_generators:
    allowed: true
    # A generator that is not ServerOS — a machine baseline probe, an external
    # scanner, another domain's tool — may write a projection here.
    gains_authority: false
    # Writing into this namespace never makes the writer an authority for the
    # content. That is the whole point of putting it here rather than in an
    # authority namespace: the placement is the statement.
    must_declare: generator
    # Naming the generator is what lets a reader decide how much to trust it,
    # and lets a later check find every projection one tool wrote.

# ---------------------------------------------------------------------------
# The check this contract asks for
# ---------------------------------------------------------------------------
authority_conflict:
  # One semantic fact declared authoritative in an authority namespace AND in
  # projections/ is two answers to one question, and the second one will win
  # eventually because it is easier to read.
  id: AUTHORITY_CONFLICT
  severity: HIGH
  enforcement: WARN          # Phase-1: reported, does not block
  promotable_to: BLOCK
  detects:
    - "a projection whose source_refs resolve inside an authority namespace that also declares the same fact"
    - "a projection file whose path mirrors an authority path (projections/runtime/health/current.json vs runtime/health/current.json)"
  does_not_detect:
    - "a projection that merely CONTAINS a value the authority also contains. Agreement is not conflict, and a check that flagged it would flag every correct projection."

# ---------------------------------------------------------------------------
# What this contract does not say
# ---------------------------------------------------------------------------
not_claimed:
  - "that every namespace above exists. Most do not, and their absence is a valid state."
  - "that a namespace may not gain a child. A child appears when a producer exists; it is declared here at the same time."
  - "that other DATA_ROOT top-level roots are not authorities. `artifacts/`, `records/` and `workspace/` are authorities for what they own — this contract is about one root, not about the machine."
