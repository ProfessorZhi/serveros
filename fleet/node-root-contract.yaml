# ServerOS node root — the small local control root at `~/.serveros/`.
#
# What this root is
# -----------------
# It is the *binding* layer for one host: which enrolled device this machine
# is, and where its transports actually point. It is small, local-only, and
# disposable — every file in it can be deleted and re-derived from the machine
# itself plus a human decision.
#
# What this root is NOT
# ---------------------
# It is not an authority, and it is not a second registry. The failure it is
# shaped to prevent is a machine carrying its own copy of its identity: once
# `~/.serveros/node.yaml` can say `display_name:` or `platform:` or `roles:`,
# there are two answers to "what is this device", they agree on the day they
# are written, and they diverge silently afterwards. So this root records only
# the *claim* "this host is device:X" — every attribute of that device is read
# from the fleet registry, at read time, by whoever asks.
#
# The same reasoning already governs transport bindings: a binding says where
# a transport points, never what a device is, and never carries a credential.
schema: serveros/node-root.v1

root:
  default: '~/.serveros'
  # Absolute, expanded, and never inside a repository. A control root that
  # lives in a checkout becomes a committed artifact the first time someone
  # runs `git add .`, which is how a machine-local binding turns into a
  # claim about every machine.
  inside_a_repository: forbidden
  # Large state does not live here. A control root that accumulates runtime
  # state stops being disposable, and then it stops being safe to delete, and
  # then it becomes an authority by accident.
  large_state_lives_in: DATA_ROOT/state/serveros

# The files this root BINDS. These are the names `fleet/node.py` opens
# (`NODE_FILE`, `TARGETS_FILE`, and `controller.yaml` via
# `local_controller_declaration`), and the same list is transcribed into
# `paths.HOME_DOT_SERVEROS_FILES`, one of the two halves of the tuple
# `admit()` refuses stray writes against. `conformance.declaration_conflicts`
# asserts this key and that tuple are equal — and the `declarations:` key
# further down against its own tuple, the same way — so a name added here is
# not a comment: it is the claim "node.py opens this file", and a name that is
# not true makes that check report HIGH drift.
#
# `README.md` is NOT in this list, and must not be added to it — and it is not
# merely unwritten, it is gone. A file of that name used to sit here; it was
# retired on 2026-09-13 with its bytes preserved in
# artifacts/work-items/serveros/SRV-0007/RUN-0001/. §41 allows bindings only in
# `~/.serveros` and gives documentation the disposition "repo/docs or
# artifacts", so this file is the authority for the root and there is
# deliberately no second document beside it restating what is written here.
# Listing it would also falsify the claim above and desynchronise this list from
# `paths.py`, which `conformance.declaration_conflicts` reports as HIGH drift.
files:
  node.yaml:
    # The whole file, in the general case:
    #
    #   schema: serveros/node.v1
    #   device_ref: device:server-beijing
    #
    # Deliberately this short. `display_name`, `platform`, `os_family`,
    # `roles`, `environment_profile`, `agents` and `legacy_ids` are all
    # attributes of the device and are all owned by `fleet/registry.yaml`.
    # A device that is not in the registry is not bound by editing this file;
    # it is not bound at all.
    required_fields: [schema, device_ref]
    optional_fields: [note]
    # Anything else is rejected at load time rather than ignored. An ignored
    # attribute here is the fork this whole contract exists to prevent, and a
    # silently ignored one is worse than a rejected one because it looks like
    # it took effect.
    unknown_fields: reject
    absent_means: NODE_UNBOUND
    # Absent is a legitimate state, not an error: a freshly imaged host, or a
    # host that has not been enrolled yet, is a real thing to be. It is not
    # "the fleet is empty" and it is not "this device does not exist".

  targets.yaml:
    # Local-only transport bindings: where a transport points, for THIS host.
    # Read by `transport.load_bindings()`, which validates every entry against
    # `transport.forbidden_binding_fields` before returning it.
    #
    #   bindings:
    #     device:work-fj:
    #       kind: remote-desktop-commander
    #       observed_name: <what the relay calls that machine>
    #
    # `observed_name` is how a transport names a device. It is not an
    # identity, it is not stable, and it is never committed — see
    # `identity.never_identity` in transport-contract.yaml, which lists
    # `hostname`, `computer_name` and `device_name` as non-identities.
    required_fields: []
    schema_key: serveros/transport-bindings.v1
    absent_means: NO_BINDINGS
    forbidden_fields_source: transport-contract.yaml#transport.forbidden_binding_fields

  controller.yaml:
    # Whether THIS runtime holds a callable controller surface. Written by a
    # human after authorizing an MCP client, never by an agent — an agent that
    # could write this file could claim a control surface it does not have.
    absent_means: REMOTE_CONTROLLER_NOT_EXPOSED
    required_fields: [kind, surface]
    kinds_source: controller-contract.yaml#declaration.kinds
    forbidden_fields_source: controller-contract.yaml#declaration.forbidden_fields
    # No field of this file can hold a token. That is not an oversight: a
    # declaration records *that* a surface was authorized, and the authorized
    # client holds its own credential in its own credential store.

# Host-level declarations this root CARRIES but `node.py` does not open.
#
# Why a second key instead of one more name under `files:` — `files:` makes one
# specific claim, "node.py opens this file", and a name added there to satisfy a
# different reader would falsify it. This key makes the claim it can keep: the
# module in `opened_by` opens it, on this host, read-only, at the path
# `<root>/<name>`. `paths.HOME_DOT_SERVEROS_DECLARATIONS` transcribes these
# names and `conformance.declaration_conflicts` asserts the two are equal, the
# same way `files:` and `paths.HOME_DOT_SERVEROS_FILES` are asserted equal.
#
# This key exists because the alternative was measured and found to be a dead
# end. `serverosctl card day --business-calendar` printed
# `default ~/.serveros/business-calendar.yaml` as the place to put the year's
# notice, while this node's own `path.admit` refused that exact path by name:
# `admit()` consulted `HOME_DOT_SERVEROS_ALLOWED`, which held the three names
# above and nothing else, and neither declaration had a name there. A printed
# remedy that the product refuses is worse than a missing file — the operator's
# next move is to write it anyway, and then the root holds a file the contract
# says cannot exist.
#
# The rule this does NOT break: §41's "bindings only" and the "move it rather
# than widen this list" line in `admit()`'s refusal are about MACHINE STATE
# drifting into this root, and neither declaration is state. Both are
# per-host by construction — a jurisdiction, a timezone, a fallback's
# `declared_by:` naming the person who decided it, and a set of delivery
# targets — so a copy in the repository cannot be the same answer for two
# hosts, which is why "put it in the repository" is not available either. Both
# pass `never_in_this_root` and both pass the `rules:` at the bottom, including
# "deleting this directory loses one host's local binding, and nothing that is
# not re-derivable": one is re-derived from the notice it cites, the other from
# a person's decision.
declarations:
  business-calendar.yaml:
    opened_by: runtime/reports/business_calendar.py
    holds: >-
      the business-day calendar this host's broadcasts are scheduled by —
      which days are workdays, which are rest days, and which year the
      declaration covers
    # The declaration carries its own `source:` (a notice locator plus the date
    # it was published), which is the whole reason it may live here: what is
    # lost by deleting this file is re-obtainable from that locator. The
    # absence is the state the card surface already renders out loud — a
    # missing year is `CALENDAR_UNKNOWN`, never a fallback to Monday-to-Friday
    # presented as an official one.
    absent_means: CALENDAR_NOT_IMPORTED
  service-bindings.yaml:
    opened_by: runtime/card_source.py
    holds: >-
      where this host's card deliveries point — one entry per service, saying
      which conversation a card of that kind is sent to
    # Same shape as `targets.yaml` one key up, and the same reason it is not
    # committed: it names routes that exist for this host only.
    absent_means: NO_SERVICE_BINDINGS

never_in_this_root:
  - credentials, tokens, refresh tokens, cookies, private keys, code verifiers
  - device uuids or transport uuids          # assigned at enrolment; change on re-enrolment
  - hostnames or computer names as keys      # a route, not an identity
  - display names, platforms, roles          # owned by the fleet registry
  - item, run or artifact state              # owned by DATA_ROOT/state/serveros

rules:
  - "This root is read by the host it describes. A copy of it is a claim about
     the wrong machine, so it is gitignored and never travels."
  - "Absence is reported as absence. NODE_UNBOUND, NO_BINDINGS and
     REMOTE_CONTROLLER_NOT_EXPOSED are states, not failures, and a caller that
     renders any of them as an error will eventually render them as an empty
     fleet instead."
  - "Nothing here may be the only record of anything. Deleting this directory
     loses one host's local binding, and nothing that is not re-derivable."
