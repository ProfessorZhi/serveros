# ServerOS MCP surfaces — what each one owns, and what it must not.
#
# An MCP server is a typed tool/context boundary. It is not the product, and
# it is not an authority. ServerOS decides identity, policy and desired state;
# an MCP surface is one way an agent asks about them.
#
# Three surfaces, because node observation, local Agent Session control and
# fleet reasoning have different authorities and blast radii. Keeping them
# separate prevents a read-only node adapter from acquiring provider/network
# side effects merely because Agent control also needs an MCP surface.
schema: serveros/mcp-surfaces.v1

principle: >-
  MCP carries typed Tool / Context calls and never becomes authority. The
  dedicated Agent Session surface may submit local typed session intents to an
  AgentSessionProvider; that is a control facade, not the A2A wire protocol.
  Cross-device Agent-to-Agent delegation remains an A2A/Fleet concern. MCP also
  does not own fleet lifecycle state (heartbeat, presence or leases).

surfaces:
  serveros-node-mcp:
    scope: one device — the node it runs on
    ownership: current node
    # Where this surface's implementation lives, so the declaration above and
    # the code below cannot drift apart unobserved. `tool_names()` in that file
    # is asserted equal to the `tools:` list below.
    implementation: mcp/node_mcp.py

    # Deliberately empty, and deliberately not `resources: []` alone.
    #
    # An earlier revision listed six `serveros://…` URIs here. None was ever
    # served: the adapter answers `resources/list` with a method-not-found
    # error, on purpose, because an empty list from a surface that was never
    # asked is a claim that the set is empty rather than that it does not
    # exist. A declared-but-unserved capability list is the same error one
    # level up — it tells a reader the surface has something it does not.
    #
    # §24 lists this surface's interface as tools only. State is reachable
    # through a tool, which carries provenance; a bare URI does not.
    resources: []
    resources_declined: >-
      No resources are offered, by design rather than by omission.

    tools:
      # The order and spelling below are the adapter's own; it is the
      # implementation, and this list is checked against it.
      - device.show
      - context.current
      - path.resolve
      - path.admit
      - runtime.list
      - runtime.status
      - runtime.explain
      - resource.summary
      - resource.hygiene
      - observation.get
      - ability.list
      - ability.status
      # From §3/§5/§6/§10/§14 of the runtime-attribution brief. Every one is
      # read-only, and every one answers the question a pid cannot: whose work
      # is this, is it still valid, and what does it not justify.
      - runtime.groups
      - runtime.group
      - runtime.tree
      - runtime.budget
      - process.top
      - process.trace
      - anomaly.list
      - anomaly.explain
      - container.attribution
    owns:
      - current-node environment facts
      - current-node path role resolution
      - current-node ability materialization status
      - current-node protected resources
      - current-node runtime groups, their lineage and their chains
      - current-node anomalies, their combinations and their blind spots
      - current-node container attribution from evidence
    does_not_own:
      - other devices
      - fleet device identity
      - cross-device routing
      - desired state for any device
      - process lifecycle — no tool here stops, restarts or signals anything
      - container lifecycle — no tool here removes, stops or prunes anything
    explicitly_absent:
      - remote.shell
      - process.stop
      - process.kill
      - container.remove
      - container.prune
      - runtime.reconcile
    note: >-
      A node surface has no verb for acting on another machine. Not a
      restricted one — none at all, so that an agent cannot express the
      intention and then argue about the permission.

      The same rule is applied one level down to this node's OWN processes and
      containers: the lifecycle verbs are absent rather than present-and-
      refusing. `anomaly.explain` returns a recommendation, and a
      recommendation is a proposal that travels to a human — there is no tool
      that carries it back as an action.

  serveros-agent-mcp:
    scope: one device — Agent sessions exposed by providers on this node
    ownership: typed Agent Session control facade
    implementation: mcp/agent_mcp.py
    resources: []
    tools:
      - agent.list
      - agent.inspect
      - session.list
      - session.inspect
      - session.create
      - session.send
      - session.result
    owns:
      - typed normalization of provider-backed Agent/session operations
      - forwarding mutation intents through serverosd admission before providers
    does_not_own:
      - device identity
      - Agent Runtime definitions
      - provider-native session truth
      - admission policy
      - Ability authority
      - cross-device routing
    explicitly_absent:
      - remote.shell
      - session.interrupt
      - session.stop
      - session.handoff
      - session.resume
    note: >-
      Unsupported or not-yet-adapted verbs remain visible through each session's
      action_support field rather than being translated to a stronger operation.
      In particular BotMux close is not exposed as turn interrupt.

      Why the four control verbs are absent rather than present-and-refusing:
      admission returns REQUIRE_HUMAN for every human_gated verb, and this
      vertical slice has no human approval channel — HumanControlProvider owns
      approvals and v1 does not yet route one back. A tool that always fails
      teaches a caller that the operation is broken; an absent tool plus a
      declared reason teaches it that the operation is not yet reachable. The
      gate itself is implemented and tested in SessionService, so wiring the
      approval channel is what remains, not building the gate.

      `SessionService` resolves provider support, then provider readiness, then
      admission. Checking either of the first two first is not a way around the
      gate: both can only narrow, and a SUPPORTED verb on a READY provider still
      needs its own ALLOW.

      Why readiness did NOT get a tool of its own. It is a provider-instance
      fact, not an Agent Session verb, so a `readiness.list` tool would have been
      a name in this surface that the Agent Session contract never declared —
      and the gate that keeps this surface honest is `served <= declared`. It is
      reported instead where the question is actually asked: as `providers[]` on
      `agent.list`, beside the agents an operator is about to drive, and as
      `provider_readiness` on the result of every mutation. The finding it
      exists for — agents listed, every action SUPPORTED, provider unable to
      execute — is visible in exactly that first place.

  serveros-fleet-mcp:
    scope: the fleet
    ownership: fleet semantic layer
    tools:
      - fleet.devices
      - fleet.device.inspect
      - fleet.capability.find
      - fleet.ability.diff
      - fleet.context.resolve
      - fleet.task.route
      - fleet.task.status
    owns:
      - fleet device identity (read)
      - capability resolution across devices
      - ability diff across devices
      - task routing and status
    does_not_own:
      - device-local path resolution
      - device-local protected resources
      - device identity mutation
      - transport credentials
    explicitly_absent:
      - remote.shell
    note: >-
      fleet.device.inspect reports what the fleet KNOWS about a device,
      including that it cannot currently be reached. It is not a synonym for
      "connect and enumerate", and it must be able to answer successfully
      while a device is unreachable.

# ---------------------------------------------------------------------------
# Remote execution, when it is added
# ---------------------------------------------------------------------------

remote_execution:
  # Not an API level. An admission model.
  #
  # The level vocabulary is NOT restated here. It is declared once, in
  # `transport-contract.yaml`, and this file references it — because a second
  # copy of a closed vocabulary is a copy that will disagree eventually, and
  # the disagreement will be that admission accepts a level the transport
  # contract has never heard of.
  levels_source: fleet/transport-contract.yaml#capability_levels.order

  # Admission default. Deliberately not the weakest level: `discover` only
  # lists that devices exist, so defaulting to it would make every unnamed
  # call a listing call and let a read slip through under a weaker name.
  default_level: inspect

  rules:
    - "A call states its intent level. The level is admitted by BOTH the fleet
       policy and the target node's local policy. Fleet approval alone does not
       execute anything."
    - "There is no default `remote.shell(device, arbitrary_command)` agent API.
       A transport may support shell internally; the semantic layer above it
       admits calls by nameable intent."
    - "An agent reaching a device directly over a shell is not equivalent to
       delegating a task to the agent on that device. Delegation (A2A) is
       preferred: the remote agent executes under its own local policy, so the
       trust boundary stays where the device is."

# ---------------------------------------------------------------------------
# Boundaries with the other words
# ---------------------------------------------------------------------------

vocabulary:
  ServerOS: product / control model — decides identity, policy, desired state
  Skill: procedural / semantic / policy knowledge — decides "when and how"
  MCP: typed tool / context boundary — the only one of these that is an interface
  Plugin: packaging / distribution — carries the others to a runtime
  Transport: execution backend — moves bytes, decides nothing

boundary_rules:
  - "An MCP surface contains no policy of its own. If a rule exists only in an
     MCP server, it is not a ServerOS rule and no other consumer will honor it."
  - "A Skill may describe how to use an MCP surface. It may not re-implement
     the authority that surface reads from."
  - "A Plugin distributes MCP configuration. It is not a second place where
     MCP ownership is declared."
