# serveros-testing — the A7 composition.
#
# WHY THIS ONE HAS NO `extends:`
#
# Every other file in `profiles/` extends `../bundle.yaml`, because a wider
# product is core plus more. This one deliberately does not, and the reason is
# not stylistic.
#
# `bundle.yaml` carries `runtime` and `bin` — `serverosd`, its MCP adapters and
# the entry points that reach them. A node that has the ServerOS workbench
# installed already has those. A node that wants to PROVE something behaves as
# required is a different node: it may be a build worker, a CI runner, or a
# machine whose only job is to run a headed browser against a real environment.
# Making it inherit the daemon would install a second ServerOS on it to answer a
# question that does not mention one — and would make the testing plugin's
# footprint a function of the workbench's, which is the coupling this file
# exists to avoid.
#
# So this is a root composition, like `bundle.yaml` itself: schema, identity,
# skills, and nothing it does not use. It carries no hook, no subagent and no
# MCP server of its own. A hook that binds "the goal is complete" to a Stop
# event would turn a reported failure into a rerun loop, and the Playwright
# surface already exists as the upstream `playwright-mcp` — a copy declared here
# would be a second identity for one provider (design/AUTOMATED-TESTING-ABILITY.md §8).
#
# WHAT IT SHIPS
#
#   automated-testing  the judgment: scenario selection, real-vs-synthetic
#                      evidence, verdict, and the stop rule on a real FAIL.
#   test-management    the environment: what a reproducible test environment IS
#                      and how one is smoke-checked before it is reused.
#
# Two, because the second is not part of the first: a node can define an
# environment and never run a requirement E2E against it, and the A7 design
# moves environment definition OUT of testing rather than into it (§10). They
# are composed together here because a testing plugin without a way to resolve
# an environment cannot reach the boundary it is supposed to test.
schema: serveros/bundle.v1

# `plugin` alone, and the omission is the same decision as the absent `extends:`
# above. This composition ships no `runtime` and no `bin`, so there is nothing
# for a node runtime verifier to check and no daemon for a revision to point a
# unit at. Declaring it here is what lets `release.py` reach the plugin verifier
# without being told the answer, and a second entry claiming `node-runtime`
# would be a statement this payload cannot keep.
artifacts:
  - plugin

composition: serveros-testing

name: serveros-testing
display_name: HWZ ServerOS Testing
description: ServerOS automated testing and requirement acceptance
short_description: Prove that a requirement's behaviour is really implemented
long_description: >-
  Scenario selection, real-environment execution and evidence for requirement
  and scope E2E. Reports PASS / FAIL / BLOCKED / PARTIAL / NOT_RUN against a
  pinned revision, keeps the raw evidence, and stops on a real product failure
  instead of repairing it into a pass.
author: ProfessorZhi
category: Productivity
license: MIT
brand_color: "#315C92"

version: "1.0.0"

# Its own payload, so its own cache identity. A cachebuster shared with the
# workbench would let two different payloads claim one version string.
#
# Moved to `b` on 2026-09-22, and the move is the point of the field: the
# payload changed after `a` was named — `artifacts: [plugin]` was added so that
# `release.py` could reach the plugin verifier without being told the answer —
# and an installed cache keyed on `…20260922a` would then have been served a
# different payload than the one it was named for. `a` was only ever loaded
# with `--plugin-dir`, which caches nothing, so no cache is stale; the label
# moved because the content did, and not because a target was chosen first.
#
# Moved to `27a` on 2026-09-27, and this time the divergence was MEASURED on
# this node rather than argued. `build.py --check` over this composition, read
# from `serveros-completion-20260925@50a86fa` against
# `--ability-rev 368c1be63a0d6bf48ae83d91ce6008094ba048ef`, reports against the
# payload built under `22b`:
#
#   README.md                              generated from that rev
#   skills/test-management/SKILL.md        taken from `ability-management`
#   RELEASE.json                           present in the installed payload and
#                                          produced by no build here
#
# The one that forces the move is the second. The installed payload instructs
# its reader that this node's test-environment root is
# `/opt/applications/data/home-hwz/workspace/test-envs/<repo>/<ITEM>/` — one
# machine's literal, written as an absolute fact about whichever node is
# reading. It is not cosmetic on the machine that carries this plugin: the
# entry is ENABLED here, so every new session that resolves `test-management`
# is told to write into a directory that does not exist on this host. The
# payload that replaces it writes `$WORKSPACE_ROOT/test-envs/<repo>/<ITEM>/`,
# and `WORKSPACE_ROOT` is a symbol this node's own root contract fills in.
#
# This is the same defect `srv0003.20260924d` and `srv0003.20260927a` were both
# moved to repair, one composition over: the literals lived in the shared
# `ability-management` Skills, so every composition that inherits one inherits
# the stale sentence with it. The workbench composition was rebuilt and
# promoted; this one was not, and its installed cache has been serving the old
# text under a version string that still names it. Keeping `22b` would leave
# that cache in place, because `claude plugin update` compares version strings
# and an unchanged one is read as "already current".
#
# `RELEASE.json` is reported by the same check and is NOT touched here: it is a
# file this node's installed payload carries and no build in this repository
# produces, so it belongs to whatever wrote it, not to this composition. Named
# so that it is a recorded leftover rather than a silent one.
#
# Moved to `27b` on 2026-09-27, by the same instrument and for a defect the
# previous move did not cover. `27a` was built against
# `--ability-rev 368c1be63a0d6bf48ae83d91ce6008094ba048ef`; the pin has since
# advanced to `da5f89b1b1313c942bee8c03e19ad51931746f66`, and a plugin is
# recomputed against the pin as it stands, so the installed payload now differs
# in exactly two paths. Both were reproduced byte by byte rather than inferred:
#
#   ARTIFACT.json   the installed record has no `recommended` key; the
#                   generator writes one now (`[]` for this composition, which
#                   declares nothing recommended). A key the generator added
#                   after these bytes were written, so the installed record is
#                   one revision behind its own producer.
#   README.md       prints the pin it was read from, verbatim and on purpose
#                   ("the pin below is the authority for what it was read
#                   from"). `368c1be6…` against `da5f89b1b131…` is not a defect
#                   in either revision; it is this payload being older than the
#                   pin, which is a fact about the payload.
#
# The Skills themselves are byte-identical across the two pins, so the
# substantive defect `27a` was moved to repair is NOT what is at stake here.
# What is at stake is the other half of the same rule: keeping `27a` would leave
# an installed cache that disagrees with canonical under a version string that
# `claude plugin update` reads as "already current". The label moves because the
# content did, once more, and not because a target was chosen first.
cachebuster: srvtest0001.20260927b

skills:
  - name: automated-testing
    source: ability-management

  - name: test-management
    source: ability-management

default_prompt:
  - Prove this requirement's behaviour in a real environment and show the evidence.
  - Run the bounded regression scope and report per-scenario verdicts.
  - A scenario failed — keep the evidence and report it; do not repair the product.
