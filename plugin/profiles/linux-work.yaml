# serveros-linux-work — the working set for a Linux node that does real work.
#
# §28: this is a composition, not a fork. It EXTENDS `serveros-core` and adds
# the specialists such a node needs; it carries no payload of its own and no
# copy of what it inherits, so it cannot drift from core about the members they
# share. Nothing here is a second source of truth for an ability — a profile
# chooses what to compose, and ability-management remains the canonical source
# of every reusable Skill named below.
#
# The rule for what belongs here: the node's ordinary day. Runtime, workspace
# and test are the three a Linux workstation exercises without deciding to.
# Everything else is recommended rather than bundled, so that a node pays for a
# specialist when it reaches for one — see §27's "do not eagerly bundle the
# catalogue".
# Declared here even though it is inherited, because a composition file that
# can only be identified through the file it points at has no meaning of its
# own — and the point of a profile is that its contents are readable on their
# own terms.
schema: serveros/bundle.v1

extends: ../bundle.yaml

composition: serveros-linux-work

# Same two faces as core, and for the reason this profile exists: a Linux work
# node runs the daemon AND has the plugin installed, from one payload. Declared
# here rather than inherited, because a profile that left it out would build an
# artifact carrying no statement about what it is, and the release path would
# then have to infer the kind from the artifact's name — the one thing §9 rules
# out. A profile that ships no runtime would declare `[plugin]` alone.
artifacts:
  - node-runtime
  - plugin

# The plugin identity this composition builds. Core keeps `hwz-server-os`, which
# is the distribution's existing name; a profile builds a different artifact and
# so must not claim the same name, or the two would be distinguishable only by
# the version string.
name: hwz-server-os-linux-work
display_name: HWZ ServerOS (Linux Work)
short_description: Agent Engineering Workbench for a Linux work node

# A profile's payload differs from its parent's, so it declares its own cache
# identity. The builder refuses a profile that inherits this one — a shared
# cachebuster would let two different payloads claim one version string.
#
# Bumped here because that is exactly what had just happened. `15b` is the
# cachebuster of the revision promoted at 11:00, whose README says
# `document-stewardship (missing)`; re-building the same profile after the
# Skill landed produces a DIFFERENT payload (the recommended line now says
# `available`) under the SAME version string. Nothing in the builder can see
# that — it compares a profile against its parent, not against what has already
# been released — so the bump is the author's to make, and skipping it would
# leave an installed plugin cache serving the old payload for a version that no
# longer describes it.
#
# Moved to `23b` on 2026-09-23 for the same reason and by the same rule. The
# promoted revision `cards-and-release-20260922@2f77b02` was built from a
# source tree 28 commits behind canonical, and the difference is not cosmetic:
# a fresh build of this same profile from `origin/main` adds eleven members the
# installed payload does not have (`context/delegation.py`,
# `intake/capture_coverage.py`, `intake/support_handoff.py`,
# `intake/watch_coverage.py`, `runtime/report_publication.py`, and the two
# contracts that go with them) and changes eighteen more. Rebuilding under
# `22a` would have shipped a different payload behind a version string that
# already names a released one.
#
# Moved to `23d` on 2026-09-23, after `0a0d11e`. The same commit that moved
# core's label to `c` also changes this composition's payload, because this
# profile inherits the `serveros` skill from core. This is the composition the
# node's Agent sessions actually LOAD — `hwz-server-os-linux-work@…` is the
# enabled entry in `settings.json` — so a stale label here is not bookkeeping:
# `claude plugin update` compares version strings, and an unchanged one leaves
# every new session running the checker from before the fix.
#
# Moved to `24a` on 2026-09-24, by the same rule and for the same reason. The
# payload changed: the alert-scope and attention work edits `runtime/anomaly.py`
# (a per-item finding is now scoped to this deployment's own uid, and a whole
# class of hygiene codes moved off the alert face), plus
# `runtime/notification-contract.yaml` (where that face is declared),
# `runtime/presentation.py` (the subject word is taken from the identity layer
# rather than from an agent name), `runtime/cards.py` and
# `runtime/card-definitions.yaml`. All five are members of this composition, so
# rebuilding without this bump would hand an installed cache a different payload
# under the version string `srv0003.20260923d` — which already names the
# revision running before the fix, and which is exactly the string that made the
# card keep saying 需确认 after every earlier attempt to change it.
#
# Core's label is stale for the same reason and is NOT touched here: every
# member above is inherited by this profile from `plugin/bundle.yaml`, so core's
# payload has changed too, while `srv0003.20260923c` still names a released one.
# No core artifact is being released from this node and none is installed on it
# (`runtime-assets/hwz-server-os/serveros-core` does not exist), so the bump
# belongs to whoever next releases core rather than to this change — recorded
# here so it is a named leftover and not a silent one.
#
# Moved to `24b` on 2026-09-24, hours after `24a`, by the same rule and for the
# same reason: the payload changed again, this time in
# `runtime/alert_digest.py` and `runtime/notification-contract.yaml`, both
# members of this composition. The digest's send gate read the severity axis
# alone, so on this node 460 findings at high/medium — 434
# `HIGH_MEMORY_SUSTAINED` and 24 `HIGH_CPU_SUSTAINED`, every one of them
# `consumption` at WATCH — caused a card an hour whose face was empty. The card
# arrived saying `✅ 没有需要处理的变化` and taught its reader to skip the one
# surface a real finding has. All four of the node's most recent cards had
# arrived LESS than `interval_seconds` after the one before, so the out-of-band
# door was the door actually firing, and the fix has to close both. Leaving the
# label at `24a` would hand an installed cache the old gate under a version
# string that already names it — which is exactly the failure `24a` was bumped
# for.
#
# Core's label is stale for the third time for the same reason and is again NOT
# touched here, per the paragraph above: every member this change touches is
# inherited from `plugin/bundle.yaml`, no core artifact is released from this
# node, and none is installed on it.
#
# Moved to `24c` on 2026-09-24, hours after `24b`, by the same rule: the payload
# changed again, in `runtime/alert_digest.py`, and this is the half `24b` did not
# finish. `24b` closed both doors with a per-row call to `presentation`, and that
# call re-read and re-parsed a 46 KB contract every time — 53.8 ms a row.
# Measured against this node's own register: 459 rows at high/medium came to
# 24.7 s inside `alert.digest`, whose client waits 5.0 s, so the command that was
# supposed to answer "nothing to report" answered with a timeout. The gate was
# right and the node had stopped being answerable, which is not a quieter card
# but a broken one: `tokyo-alert-digest` runs `serverosctl alert digest` through
# `alert_digest_card.py`, and a command that times out there is a card that
# never arrives at all. `face_table()` is the repair — the answer belongs to the
# contract and not to the row, so it is read once and handed down, and the same
# decision now costs 88 ms. `24b` is the label that names the revision which was
# promoted and which timed out; leaving it in place would hand an installed
# cache a version string that already names it.
#
# Moved to `24d` on 2026-09-25, by the same rule, and this time the divergence
# was MEASURED rather than argued. Rebuilding this profile from the source trees
# this branch carries and diffing the result against the promoted revision
# `alert-card-scope-20260924@8ce6fe7` gives eight differing files under the same
# version string `3.1.0+srv0003.20260924c`:
#
#   skills/serveros/SKILL.md                          this composition's own
#   skills/serveros/scripts/architecture_check.py     root Skill
#   skills/ability-management/control_plane.py        taken from
#   skills/test-management/SKILL.md                   `ability-management` at
#   skills/workspace-management/SKILL.md              `--ability-rev`
#   skills/workspace-management/scripts/capacity_check.py
#   skills/workspace-management/scripts/map_check.py
#   README.md                                         generated from that rev
#
# The change is not cosmetic and it is the release the node's sessions need.
# `skills/serveros/SKILL.md` is the root Skill every session loads, and it told
# its reader that one machine's `/opt/applications` is this node's data volume;
# `skills/workspace-management/SKILL.md` carried the same sentence, plus
# `SYSTEM_ROOT`/`DATA_ROOT`/`OPS_ROOT` written as one node's literals. An
# installed cache holding the old text under this string would go on instructing
# new sessions to write into a path that is not this node's. That is the failure
# this field exists to prevent, and `24b`/`24c` are both the story of it
# happening anyway.
#
# The bump is made here, before the candidate build, rather than at promotion:
# the payload has ALREADY diverged from the released string -- the build above
# is the proof -- and a window in which a rebuild under `24c` produces something
# other than what `24c` names is the window this field is meant never to have.
#
# Core's label is stale for the fourth time for the same reason and is again NOT
# touched here, per the paragraphs above: every member this change touches is
# inherited from `plugin/bundle.yaml`, no core artifact is released from this
# node, and none is installed on it.
#
# Moved to `27a` on 2026-09-27, by the same rule, and again MEASURED. Rebuilding
# this profile from `serveros-completion-20260925@0f8bb9c` against
# `--ability-rev 368c1be` and diffing the result against the payload built under
# `24d` gives six differing files under the version string
# `3.1.0+srv0003.20260924d`:
#
#   README.md                                        generated from that rev
#   skills/ability-management/control_plane.py       taken from
#   skills/test-management/SKILL.md                  `ability-management` at
#   skills/workspace-management/SKILL.md             `--ability-rev`
#   skills/workspace-management/scripts/capacity_check.py
#   skills/workspace-management/scripts/map_check.py
#
# It is the same defect `24d` was moved to repair, one repository further on.
# `24d` was bumped for sentences in `skills/serveros` and
# `skills/workspace-management` that told a reader one machine's
# `/opt/applications` is this node's data volume. The same literals survived
# here: `skills/test-management/SKILL.md` spells the test environment root as
# `/opt/applications/data/home-hwz/workspace/test-envs/...`, and
# `skills/workspace-management/SKILL.md` states `SYSTEM_ROOT = /home/hwz` and
# `DATA_ROOT   = /opt/applications/data/home-hwz` as absolute facts of the node
# the reader is on. A session that installs a cache under `24d` would be
# instructed to write into paths that do not exist here, which is the failure
# this field exists to prevent and which `24b`, `24c` and `24d` are all, in
# turn, the story of.
#
# That `24d` was never promoted is why no installed cache holds it. It is not a
# reason the string may be reused: `24d` already names a payload, and this
# rebuild produces a different one under it.
#
# The bump is made here, before the candidate build, for the reason the
# paragraphs above give.
#
# Moved to `srv0004` on 2026-09-27 because §J09 changed the payload without
# changing any file NAME: `runtime/daemon.py` now reads and reports the
# installation's own identity, `runtime/cli.py` prints it, and `scripts/
# runtime_truth.py` compares the artifact's recorded source. Four members that
# were already on the list carry different bytes, and `ARTIFACT.json` itself
# gained a `source` block — so a rebuild of this profile produces a different
# artifact under the version string `srv0003` still names. That is the case this
# comment exists for, and the builder cannot see it: it compares a profile
# against its parent, not against what has already been released.
#
# Core's label is stale for the fifth time for the same reason and is again NOT
# touched here.
#
# Moved to `b` on 2026-09-27, hours after `a`, because §5 changed the payload
# again. `memory/provider-contract.yaml` moves to v2: the three assumptions that
# made a real deployment unacceptable ("no service this machine does not already
# run", "the index is rebuildable from Layer B alone", "no product-wide
# provider") are replaced by the twelve conditions of the accepted target, and
# `memory/provider_status.py` is changed with it because the module transcribes
# the contract's condition list and a test asserts the transcription verbatim.
# Two files are NEW members — `memory/openviking/backup.py`, whose verbs are the
# backup and restore path the contract now requires be exercised rather than
# described, and `memory/openviking/openviking.unit`, the node's unit kept
# verbatim in the repository under a suffix that is deliberately not
# `.service` (see its own header: `tests/test_core_freeze.py` asserts that the
# set of `.service`/`.timer` files in this repository is exactly the node
# runtime's unit surface, and this provider is not a member of it).
# `scripts/build.py` and `runtime/actuator-contract.yaml` change together
# because the mutation guard found an undeclared call site in the J09 work
# above — `source_identity` shells out to `git status`, which is the one
# subcommand in that file that can refresh an index, so the declaration and the
# `GIT_OPTIONAL_LOCKS=0` that makes it true landed in the same change.
#
# The reason this is a bump and not a rebuild: every one of those is already on
# the payload list or newly added to it, and a build of this profile now
# produces a different artifact under a string `srv0004.20260927a` already
# names. Core's label is still stale and is still NOT touched here.
#
# Bumped again for the same reason, one release later. `runtime/ability_projection.py`,
# `runtime/daemon.py`, `runtime/cli.py`, `runtime/workbench.py`,
# `runtime/workbench_sources.py`, `intake/global_board.py` and
# `intake/workchain.py` all change, and every one of them is on the payload
# list. The two readings they fix were both about a number that read as current
# without being current — an ability counted once per catalogue row, and Item
# state dated to the composition instead of to when the projection was taken —
# so an installed plugin cache left on the old string would serve the old
# answers to a reader who had just been told they were fixed.
#
# Bumped a third time on the same day, and this time the payload is nearly
# byte-identical — 259 of 261 members are unchanged across the two revisions.
# The two that move are `ARTIFACT.json` and `README.md`, and between them they
# carry the answer to "what am I running": the artifact's `source` block and the
# README line that names the catalogue revision the Skills were read from.
#
# They move because the pins moved. The five packs pinned `981c92b`, whose
# `abilities-manifest.yaml` stopped being byte-identical to main's once the two
# registry commits landed on top of it, so `scripts/build.py` refused to build
# at all. The repin put them on `2cd8a1f`; this build reads from `1f2339b`.
# Separately the serveros half of the same block moved off a branch ref
# (`serveros-completion-20260925@3a4fd5f`) and onto `main@1db8730`, which is
# what "INSTALLED is built from main" is supposed to mean.
#
# So the payload a reader would be served differs from the previous revision in
# exactly the place that reader looks to find out where the payload came from.
# An installed cache left on `27c` would answer `368c1be`/`3a4fd5f` — two
# revisions that are no longer what either repository's main says — which is the
# same defect as the one `27c` was bumped for: a reading that claims a currency
# it does not have. The builder cannot see this; it compares a profile against
# its parent, not against what has already been released.
#
# Moved to `27e` on 2026-09-27 for the same reason one more time, and both halves
# moved again. The ability half moves `1f2339b` → `c623825`: the `provides` block
# gained its second axis (bundled / recommended / unavailable), B9 converged onto
# one contract, one Skill source and scripts that say what the Skill says, and
# the registry ledger caught up with the canonical it describes. Those files are
# shipped into this artifact, so an installed cache left on `27d` serves the old
# `abilities-manifest.yaml` while claiming to be current.
#
# The serveros half moves because `skills/serveros/SKILL.md` changed in the one
# place its reader looks: the bootstrap now says that a routing target which is
# not installed here is neither "absent" nor "usable", and names the verb that
# installs it. `27d` carries no such paragraph at all — the promoted file is
# byte-identical to `c473ea9`, so three revisions of source, including the one
# that introduced the routing fact, have never been on this machine. The line
# count is unchanged (157) because the same commit removed §5's restatement of
# the architecture, which the file's own tenth line says belongs in
# `ARCHITECTURE.md`; the diff is real and the builder, which compares a profile
# against its parent, cannot see either half of it.
# Moved to `27f` on 2026-09-27, and the reason is visible from outside this file:
# `abilities/taxonomy.v2.yaml` is a shipped member, and it gained the eighth
# retained v1 node. `scripts/runtime_truth.py` said so before anyone decided
# anything — four rows went to SOURCE_RUNTIME_DRIFT naming that one path
# (`… @ runtime-assets (built)`, the Claude plugin cache, the Codex plugin, and
# the running node revision), which is exactly the reading a cachebuster exists
# to keep honest.
#
# Its reader is installed-side: `abilities/taxonomy.py:108` resolves
# `root / abilities/taxonomy.v2.yaml`, so `serverosctl taxonomy tree|show` reads
# the copy in the artifact. An installed cache left on `27e` would render a tree
# that omits the node the catalogue has been placing two abilities at since
# `ce6e103` — a navigation view missing a family its own catalogue names.
#
# The serveros half moves alone this time: the ability half's pin
# (`da5f89b1b131`) did not change, so the payload delta `27e` → `27f` is two
# files — the taxonomy above and this one — plus the version string that names
# them.
cachebuster: srv0005.20260927f

skills:
  - name: runtime-management
    source: ability-management
  - name: workspace-management
    source: ability-management
  - name: test-management
    source: ability-management

# On demand, NOT bundled. These are resolved per node at the moment a node
# reaches for them, and `status` records whether that resolution can succeed
# today. The build checks the claim against the pinned revision in both
# directions, so a stale `missing` is as much an error as a broken `available`.
#
# This list is a SUBSET of the registry, not "the registry, minus what this
# composition ships". The registry is the catalogue of everything any product on
# any node may resolve — 41 `skill` names at the pinned revision — and most of
# them belong to other products' compositions and to toolchains this node does
# not carry. This list is the part of that catalogue whose resolution THIS node
# promises, and it is short on purpose.
#
# What forces the decision is not registration, it is PLACEMENT. A name added to
# a plugin record's `provides` makes this profile either ship it or recommend it
# here, or else A1 reports `COMPOSITION_MEMBER_UNREACHABLE` at HIGH — because
# A1's rules pair each composition with ITS OWN artifact's record and judge that
# record's members. A bare `skill` entry that no record provides enters no
# comparison at all; measured 2026-09-22, 29 of the registry's 41 `skill` names
# appear in no composition here and A1 says nothing about them. So an ability
# that is registered and never placed widens this node's gap silently, and the
# gate that closes it is the record's `provides`, not this file's silence.
recommended:
  - name: information-management
    source: ability-management
    status: available
    reason: Raw observation and understanding work is real but occasional, so it
      is installed when a node begins it rather than carried by every node.
  - name: work-management
    source: ability-management
    status: available
    reason: Item and Run lifecycle is driven by the work a node is handed, not
      by the node being present, so it is resolved when work arrives.
  - name: feishu-space-management
    source: ability-management
    status: available
    reason: Only a node that owns Feishu objects needs it; a Linux work node
      reaches for it when it does.
  - name: feishu-report
    source: ability-management
    status: available
    reason: Reporting is an output of finished work, not a precondition for
      starting it.
  - name: inventory-publishing
    source: ability-management
    status: available
    reason: The frequency judgment, on data rather than on plausibility. L3
      inventory refreshes in hwz-ops run in bursts tied to topology change —
      17 events across 09-03..09-10, five of them on one day, and one in the
      six days after the convergence work stopped. That is an operation a node
      performs when the machine materially changes, not one it exercises
      without deciding to, so it is resolved at the moment it is reached for
      rather than carried by every node. Bundling it would ship the channel,
      compression and conflict logic to nodes that never publish; the payload
      is small, but a member that is present is a member the node maintains,
      and §18's rule is that the catalogue is not eagerly bundled.
  - name: document-stewardship
    source: ability-management
    status: available
    # Folded, because the reason contains colons and a plain multi-line scalar
    # would read one of them as a mapping — which is how this line was caught:
    # `yaml.safe_load` refused the file and `composition.py::_parse` fell
    # through to `json.loads`, so the failure surfaced as a JSONDecodeError on a
    # YAML document rather than as "this profile does not parse".
    reason: >-
      §26 baseline member, and now implemented — the canonical
      `document-stewardship` Skill landed the 正文 side: local diff, versioned
      verification, readback and receipt, and the rule that an unreliably
      protected conflict range produces a candidate rather than an unattended
      whole-body overwrite. It stays recommended rather than bundled because
      the node that maintains a document is the node that has been given one to
      maintain, and the Skill is explicit that the position/ACL side remains
      with `feishu-space-management`, so a node without that grant would carry
      a member it cannot exercise. The status moves because it is now true that
      the registry can resolve it; a status is a claim about the registry, and
      `build.py` checks it in both directions against the payload.
