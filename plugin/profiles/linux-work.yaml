# serveros-linux-work — the working set for a Linux node that does real work.
#
# §28: this is a composition, not a fork. It EXTENDS `serveros-core` and adds
# the specialists such a node needs; it carries no payload of its own and no
# copy of what it inherits, so it cannot drift from core about the members they
# share. Nothing here is a second source of truth for an ability — a profile
# chooses what to compose, and ability-management remains the canonical source
# of every reusable Skill named below.
#
# The rule for what belongs here: the node's ordinary day. Runtime, workspace
# and test are the three a Linux workstation exercises without deciding to.
# Everything else is recommended rather than bundled, so that a node pays for a
# specialist when it reaches for one — see §27's "do not eagerly bundle the
# catalogue".
# Declared here even though it is inherited, because a composition file that
# can only be identified through the file it points at has no meaning of its
# own — and the point of a profile is that its contents are readable on their
# own terms.
schema: serveros/bundle.v1

extends: ../bundle.yaml

composition: serveros-linux-work

# Same two faces as core, and for the reason this profile exists: a Linux work
# node runs the daemon AND has the plugin installed, from one payload. Declared
# here rather than inherited, because a profile that left it out would build an
# artifact carrying no statement about what it is, and the release path would
# then have to infer the kind from the artifact's name — the one thing §9 rules
# out. A profile that ships no runtime would declare `[plugin]` alone.
artifacts:
  - node-runtime
  - plugin

# The plugin identity this composition builds. Core keeps `hwz-server-os`, which
# is the distribution's existing name; a profile builds a different artifact and
# so must not claim the same name, or the two would be distinguishable only by
# the version string.
name: hwz-server-os-linux-work
display_name: HWZ ServerOS (Linux Work)
short_description: Agent Engineering Workbench for a Linux work node

# A profile's payload differs from its parent's, so it declares its own cache
# identity. The builder refuses a profile that inherits this one — a shared
# cachebuster would let two different payloads claim one version string.
#
# Bumped here because that is exactly what had just happened. `15b` is the
# cachebuster of the revision promoted at 11:00, whose README says
# `document-stewardship (missing)`; re-building the same profile after the
# Skill landed produces a DIFFERENT payload (the recommended line now says
# `available`) under the SAME version string. Nothing in the builder can see
# that — it compares a profile against its parent, not against what has already
# been released — so the bump is the author's to make, and skipping it would
# leave an installed plugin cache serving the old payload for a version that no
# longer describes it.
#
# Moved to `23b` on 2026-09-23 for the same reason and by the same rule. The
# promoted revision `cards-and-release-20260922@2f77b02` was built from a
# source tree 28 commits behind canonical, and the difference is not cosmetic:
# a fresh build of this same profile from `origin/main` adds eleven members the
# installed payload does not have (`context/delegation.py`,
# `intake/capture_coverage.py`, `intake/support_handoff.py`,
# `intake/watch_coverage.py`, `runtime/report_publication.py`, and the two
# contracts that go with them) and changes eighteen more. Rebuilding under
# `22a` would have shipped a different payload behind a version string that
# already names a released one.
#
# Moved to `23d` on 2026-09-23, after `0a0d11e`. The same commit that moved
# core's label to `c` also changes this composition's payload, because this
# profile inherits the `serveros` skill from core. This is the composition the
# node's Agent sessions actually LOAD — `hwz-server-os-linux-work@…` is the
# enabled entry in `settings.json` — so a stale label here is not bookkeeping:
# `claude plugin update` compares version strings, and an unchanged one leaves
# every new session running the checker from before the fix.
#
# Moved to `24a` on 2026-09-24, by the same rule and for the same reason. The
# payload changed: the alert-scope and attention work edits `runtime/anomaly.py`
# (a per-item finding is now scoped to this deployment's own uid, and a whole
# class of hygiene codes moved off the alert face), plus
# `runtime/notification-contract.yaml` (where that face is declared),
# `runtime/presentation.py` (the subject word is taken from the identity layer
# rather than from an agent name), `runtime/cards.py` and
# `runtime/card-definitions.yaml`. All five are members of this composition, so
# rebuilding without this bump would hand an installed cache a different payload
# under the version string `srv0003.20260923d` — which already names the
# revision running before the fix, and which is exactly the string that made the
# card keep saying 需确认 after every earlier attempt to change it.
#
# Core's label is stale for the same reason and is NOT touched here: every
# member above is inherited by this profile from `plugin/bundle.yaml`, so core's
# payload has changed too, while `srv0003.20260923c` still names a released one.
# No core artifact is being released from this node and none is installed on it
# (`runtime-assets/hwz-server-os/serveros-core` does not exist), so the bump
# belongs to whoever next releases core rather than to this change — recorded
# here so it is a named leftover and not a silent one.
cachebuster: srv0003.20260924a

skills:
  - name: runtime-management
    source: ability-management
  - name: workspace-management
    source: ability-management
  - name: test-management
    source: ability-management

# On demand, NOT bundled. These are resolved per node at the moment a node
# reaches for them, and `status` records whether that resolution can succeed
# today. The build checks the claim against the pinned revision in both
# directions, so a stale `missing` is as much an error as a broken `available`.
#
# This list is a SUBSET of the registry, not "the registry, minus what this
# composition ships". The registry is the catalogue of everything any product on
# any node may resolve — 41 `skill` names at the pinned revision — and most of
# them belong to other products' compositions and to toolchains this node does
# not carry. This list is the part of that catalogue whose resolution THIS node
# promises, and it is short on purpose.
#
# What forces the decision is not registration, it is PLACEMENT. A name added to
# a plugin record's `provides` makes this profile either ship it or recommend it
# here, or else A1 reports `COMPOSITION_MEMBER_UNREACHABLE` at HIGH — because
# A1's rules pair each composition with ITS OWN artifact's record and judge that
# record's members. A bare `skill` entry that no record provides enters no
# comparison at all; measured 2026-09-22, 29 of the registry's 41 `skill` names
# appear in no composition here and A1 says nothing about them. So an ability
# that is registered and never placed widens this node's gap silently, and the
# gate that closes it is the record's `provides`, not this file's silence.
recommended:
  - name: information-management
    source: ability-management
    status: available
    reason: Raw observation and understanding work is real but occasional, so it
      is installed when a node begins it rather than carried by every node.
  - name: work-management
    source: ability-management
    status: available
    reason: Item and Run lifecycle is driven by the work a node is handed, not
      by the node being present, so it is resolved when work arrives.
  - name: feishu-space-management
    source: ability-management
    status: available
    reason: Only a node that owns Feishu objects needs it; a Linux work node
      reaches for it when it does.
  - name: feishu-report
    source: ability-management
    status: available
    reason: Reporting is an output of finished work, not a precondition for
      starting it.
  - name: inventory-publishing
    source: ability-management
    status: available
    reason: The frequency judgment, on data rather than on plausibility. L3
      inventory refreshes in hwz-ops run in bursts tied to topology change —
      17 events across 09-03..09-10, five of them on one day, and one in the
      six days after the convergence work stopped. That is an operation a node
      performs when the machine materially changes, not one it exercises
      without deciding to, so it is resolved at the moment it is reached for
      rather than carried by every node. Bundling it would ship the channel,
      compression and conflict logic to nodes that never publish; the payload
      is small, but a member that is present is a member the node maintains,
      and §18's rule is that the catalogue is not eagerly bundled.
  - name: document-stewardship
    source: ability-management
    status: available
    # Folded, because the reason contains colons and a plain multi-line scalar
    # would read one of them as a mapping — which is how this line was caught:
    # `yaml.safe_load` refused the file and `composition.py::_parse` fell
    # through to `json.loads`, so the failure surfaced as a JSONDecodeError on a
    # YAML document rather than as "this profile does not parse".
    reason: >-
      §26 baseline member, and now implemented — the canonical
      `document-stewardship` Skill landed the 正文 side: local diff, versioned
      verification, readback and receipt, and the rule that an unreliably
      protected conflict range produces a candidate rather than an unattended
      whole-body overwrite. It stays recommended rather than bundled because
      the node that maintains a document is the node that has been given one to
      maintain, and the Skill is explicit that the position/ACL side remains
      with `feishu-space-management`, so a node without that grant would carry
      a member it cannot exercise. The status moves because it is now true that
      the registry can resolve it; a status is a claim about the registry, and
      `build.py` checks it in both directions against the payload.
