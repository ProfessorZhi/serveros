# node, and only one of them was true. Fixed in `7bdc7f9` (PR #27).
#
# The other half of the same change is what makes the fix legible rather than
# merely correct. The contract requires `conversation_ref` and `message_ref` of
# the provider, and BotMux publishes neither: the only channel that reaches a
# client through the daemon's own turn gate is the actor document, and that
# document carries no locator. Neither can be filled in from outside. The
# environment is writable by whoever spawns the process — which is why BotMux's
# own gate refuses to read one — and the per-turn variable a client can see is
# frozen at exec time on this platform, so every turn after the first would carry
# the first turn's reference, one message authorising many actions. So a verified
# turn now produces a report `build` refuses BY FIELD NAME. A probe reporting
# `BLOCKED` for a reason it never measured and a probe reporting `REFUSED` while
# naming the two fields BotMux does not publish are different statements, and the
# second is the one this node can support. The upstream request is item 3 of the
# BotMux actor-document proposal, alongside PR #27.
#
# One member changes, `mcp/human_control.py`; its tests are not part of this
# composition. The ability pin is unchanged (`da5f89b1b131`).
#
# ── 28c → 28d (2026-09-28, later the same day) ────────────────────────────────
#
# `28c` made the probe read the actor document BotMux actually publishes, and
# that document carries an enterprise email and nothing else. Requiring the
# email was the other half of the same defect, and the quieter half: the email
# needs the field-level scope `contact:user.email:readonly`, the tenant grants
# 0 of the 233 scopes containing `email` to the app this device runs, and the
# Contact API answers a `union_id` and no email at all. So the gate was blocked
# on every turn, correctly, with nothing visible on the Feishu side to say why.
#
# The daemon's v3 document answers the question it can answer, with a
# `union_id`: developer-scoped, the same value in every app of the tenant, and
# readable without the permission the email needs. `18787e5` reads both
# documents — this composition ships before the daemon that publishes v3, so a
# reader that only understood v3 would refuse every turn until BotMux is
# upgraded — and prefers v3 by its DECLARED schema. It is not a fallback: a v3
# document whose canonical id is missing or malformed is refused, never read
# from the email or the app-local pair beside it. A reader that settled for the
# email would mint a context naming whoever the email belonged to.
#
# MEASURED, the way `24d` and `27a` were. Four members of this composition
# differ from the promoted payload under the version string
# `3.1.0+srv0005.20260928c`:
#
#   context/actor.py                     aaab857b → 9ad62cb9
#   context/actor-context-contract.yaml  b5a410ca → c574ea67
#   mcp/human_control.py                 e7270b6a → 2945b498
#   runtime/approval.py                  c0e7875c → b6e728a1
#
# All four are members of the 261-member payload. Leaving the label at `28c`
# would hand an installed cache a different identity path under a version
# string that already names the promoted revision — and the difference here is
# the gate itself, so the stale copy is not a cosmetic lag: it is the version
# whose every turn is BLOCKED. That is the failure this field exists to
# prevent, and `24b`/`24c` are both the story of it happening anyway.
#
# `runtime/approval.py` is the fourth member and is not incidental. `--actor`
# now goes through the ref grammar rather than into the record verbatim,
# because `approval_ref` hashes the ref and `agent_control_store` matches it
# exactly: a bare id that should have carried a namespace binds the approval to
# an actor that can never consume it while the approval reads ISSUED the whole
# time. A member whose whole job is that hash cannot be left at the old gate.
#
# Tests are not members of this composition. The ability pin is unchanged
# (`da5f89b1b131`).
cachebuster: srv0005.20260928d

skills:
  - name: runtime-management
    source: ability-management
  - name: workspace-management
    source: ability-management
  - name: test-management
    source: ability-management

# On demand, NOT bundled. These are resolved per node at the moment a node
# reaches for them, and `status` records whether that resolution can succeed
# today. The build checks the claim against the pinned revision in both
# directions, so a stale `missing` is as much an error as a broken `available`.
#
# This list is a SUBSET of the registry, not "the registry, minus what this
# composition ships". The registry is the catalogue of everything any product on
# any node may resolve — 41 `skill` names at the pinned revision — and most of
# them belong to other products' compositions and to toolchains this node does
# not carry. This list is the part of that catalogue whose resolution THIS node
# promises, and it is short on purpose.
#
# What forces the decision is not registration, it is PLACEMENT. A name added to
# a plugin record's `provides` makes this profile either ship it or recommend it
# here, or else A1 reports `COMPOSITION_MEMBER_UNREACHABLE` at HIGH — because
# A1's rules pair each composition with ITS OWN artifact's record and judge that
# record's members. A bare `skill` entry that no record provides enters no
# comparison at all; measured 2026-09-22, 29 of the registry's 41 `skill` names
# appear in no composition here and A1 says nothing about them. So an ability
# that is registered and never placed widens this node's gap silently, and the
# gate that closes it is the record's `provides`, not this file's silence.
recommended:
  - name: information-management
    source: ability-management
    status: available
    reason: Raw observation and understanding work is real but occasional, so it
      is installed when a node begins it rather than carried by every node.
  - name: work-management
    source: ability-management
    status: available
    reason: Item and Run lifecycle is driven by the work a node is handed, not
      by the node being present, so it is resolved when work arrives.
  - name: feishu-space-management
    source: ability-management
    status: available
    reason: Only a node that owns Feishu objects needs it; a Linux work node
      reaches for it when it does.
  - name: feishu-report
    source: ability-management
    status: available
    reason: Reporting is an output of finished work, not a precondition for
      starting it.
  - name: inventory-publishing
    source: ability-management
    status: available
    reason: The frequency judgment, on data rather than on plausibility. L3
      inventory refreshes in hwz-ops run in bursts tied to topology change —
      17 events across 09-03..09-10, five of them on one day, and one in the
      six days after the convergence work stopped. That is an operation a node
      performs when the machine materially changes, not one it exercises
      without deciding to, so it is resolved at the moment it is reached for
      rather than carried by every node. Bundling it would ship the channel,
      compression and conflict logic to nodes that never publish; the payload
      is small, but a member that is present is a member the node maintains,
      and §18's rule is that the catalogue is not eagerly bundled.
  - name: document-stewardship
    source: ability-management
    status: available
    # Folded, because the reason contains colons and a plain multi-line scalar
    # would read one of them as a mapping — which is how this line was caught:
    # `yaml.safe_load` refused the file and `composition.py::_parse` fell
    # through to `json.loads`, so the failure surfaced as a JSONDecodeError on a
    # YAML document rather than as "this profile does not parse".
    reason: >-
      §26 baseline member, and now implemented — the canonical
      `document-stewardship` Skill landed the 正文 side: local diff, versioned
      verification, readback and receipt, and the rule that an unreliably
      protected conflict range produces a candidate rather than an unattended
      whole-body overwrite. It stays recommended rather than bundled because
      the node that maintains a document is the node that has been given one to
      maintain, and the Skill is explicit that the position/ACL side remains
      with `feishu-space-management`, so a node without that grant would carry
      a member it cannot exercise. The status moves because it is now true that
      the registry can resolve it; a status is a claim about the registry, and
      `build.py` checks it in both directions against the payload.
