#   i → j: the card's own read joins the one the `●` row already made, and the
#   delivery surface stops being a count of registered rows. Two members change:
#
#   intake/workchain.py     the decision to borrow from the ref moves out of
#     `_read_from_the_authority` into `_authority_bytes`, and `load_card` takes
#     the same read through it. Both readers now go through one function, so the
#     header and the row beneath it cannot answer about different surfaces.
#     `read_from` is set on every outcome of `load_card`, including the
#     unreadable one, and the two new keywords are optional, so a caller that
#     passes nothing keeps the behaviour it had. `_parse_yaml_text` is the
#     extracted verdict about CONTENT, so bytes from either surface get the same
#     one. Separately, `_delivery` compares the card's `expected_deliverables`
#     against the register's `kind` strings and reports both directions —
#     `matched`, `absent`, `undeclared` — with `DECLARED`, `NOT_DECLARED` and
#     `UNREADABLE` kept as three distinct states.
#   runtime/cli.py          `work item` prints the delivery surface under the
#     count instead of leaving `制品 18` as the only answer about delivery, and
#     `卡片` answers whether there is content and from which surface while the
#     locator's own state moves to `卡片定位`.
#
#   The label moves because the previous one answers a question wrongly, and the
#   measurement is one Item: `serverosctl work item LIT-0220`, whose card lives
#   at `origin/main` and not in this checkout's records, prints `交付面 未读到
#   卡片`, `来源优先级 ... no card` and `卡片 UNRESOLVED` around a `● card.yaml
#   PRESENT` line that is reading the card. Three faces of one card disagreeing
#   is this module's own defect with its newest field as one of the faces, and a
#   node left on `i` cannot tell a card it may not read from a card nobody can.
#   No classification rule changes: an absent document is still absent, and the
#   three delivery states stay three.
#
#   `tests/` is not a member of this composition, so the 104 tests and the three
#   mutations that come with this do not move the label.
#
#   `h` is skipped, and the reason is a defect in the round before this one.
#   The revision currently promoted is named `product-tree-20261007h@3f9f6e8`
#   and was built WITHOUT a bump, so it claims `srv0005.20261007g` — the same
#   version string as the payload it replaced. Two promoted revisions, two
#   different payloads, one version string: exactly the failure this file's own
#   rule names, and the builder cannot see it because it compares a profile
#   against its parent and not against what is released. The letter is not
#   reused for the revision name either, so no two revisions carry the same
#   name AND the same version. `h` stays on the node it is; the next build from
#   this profile cannot repeat it, because g is now behind whatever is current
#   rather than beside it.
#
#   No enforcing path changes. `_resolve_document`'s spellings and their ORDER
#   are reused rather than restated — `_resolve_from_ref` walks the same
#   `resolved_by` list in the same sequence against the second surface — and
#   `check_skeleton` runs on the real bytes. `tests/` is not a member of this
#   composition, so the ten tests and the non-vacuity check that come with it
#   do not move the label.
#
#   j → k: an Item the projection does not carry is still answered for. Three
#   members change:
#
#   intake/workchain.py     `_row_from_the_records` reads the card at the
#     conventional records path when no projection row carries the Item, and
#     marks the row `in_projection.listed=False`. The three columns a projection
#     row owns — state, Run count, deliverable count — are reported `UNKNOWN`
#     and not as zero, because zero is a count and this is the absence of a
#     read. `_documents` gains a fourth answer, `REQUIREMENT_UNKNOWN`: whether an
#     Item owes a document is a function of its STATE, so a reader holding no
#     state cannot fall back on either `MISSING` or `NOT_YET_REQUIRED`. And
#     `_delivery` accepts a register that was never consulted, answering
#     `登记未查` rather than a count of zero.
#   runtime/cli.py          `work item` prints a `控制面` line above the columns
#     that line explains, renders the Run row as `未读` instead of a number, and
#     prints the delivery surface as `声明 N 类 · 登记未查` instead of `登记 0 条`.
#   mcp/continuation_mcp.py the wake gate requires `in_projection.listed` as well
#     as `found`. This is the member that keeps the label honest rather than the
#     one that moves it: `runtime/continuation_control.verify` denies only on
#     `state == "COMPLETE"`, so a boundary carrying a card but no state would turn
#     today's UNASKABLE wake into an ALLOW — a permission widened by a fact about
#     the reader, which is this module's oldest defect wearing a new field.
#
#   The label moves because the previous one cannot answer a question it is
#   asked. Measured on the promoted revision, one command and twelve Items:
#   `serverosctl work item LIT-0106 --project litellm` prints `未找到 —— LIT-0106
#   is in no projection under …` while the card has been at
#   `records/projects/litellm/items/LIT-0106/card.yaml` all along. Seven litellm
#   Items (0106, 0107, 0215, 0216, 0217, 0218, 0219) and five serveros Items
#   (SRV-0001, 0002, 0003, 0005, 0008) answer `未找到` with rc=2, and all twelve
#   carry a card on the same disk. A node left on `j` reports a fact about its
#   board projection as a fact about the Item: that is the module's recurring
#   shape, and it was measured, not reasoned about.
#
#   No classification rule changes. An Item in neither place is still `未找到`
#   and now names both places; an Item a projection carries is still answered
#   from the projection with no `控制面` line; a document that is genuinely
#   absent is still absent. `tests/` is not a member of this composition, so the
#   tests and the two mutations that come with this do not move the label.
#
# Two members change, and the reason is a sentence the promoted revision says
# aloud rather than a rule it applies:
#   intake/understanding_delta.py  a card citing a content digest records WHERE
#     that digest stands among the two versions the manifest keeps, instead of
#     contributing only `lag`.
#   intake/understanding_patch.py  and runtime/cli.py  carry that standing to the
#     proposal and to the line an operator reads.
#
#   The label moves because the previous one states a transition it did not
#   measure. Measured on the promoted revision, one command: a card citing
#   `b9fe2535` for the LiteLLM work-doc link is rendered as
#   `文档已换版  摘要 b9fe2535 → 7a586f53…`. That digest appears in none of the
#   document's twelve committed versions — on 2026-09-07 it was the value the
#   manifest itself recorded as `content_sha256` while the committed file hashed
#   to `9c480c4f` — so the sentence names a version that never existed on the
#   page. Reading "the citation does not match the current version" and saying
#   "the document changed version" is this module's recurring shape: a fact about
#   the reader reported as a fact about the world.
#
#   No state changes. A mismatch is still `STALE_IN_PLACE` with a whole-document
#   range; a citation that IS the recorded predecessor still renders as
#   「文档已换版」; a citation of the current version is still `CURRENT` with no
#   range. `tests/` is not a member of this composition, so the tests and the
#   thirteen mutations that come with this do not move the label.
#
#   l → m: the word for "some projects chose and some did not" travels with the
#   projects that made it that word, and the recommender's slot count stops
#   wearing the continuation's name. Two members change:
#
#   intake/daily_cycle.py  `continue_focus` carries `accepted_why` beside
#     `accepted_state` — `intake/workchain.compose_board` computes both and
#     `work board` already prints both — and `select_focus` returns `spare_slots`
#     instead of `unused_slots`, which was the continuation's name for a
#     different set. The continuation keeps `unused_slots` on all three of its
#     own paths, unchanged.
#   runtime/cli.py         `work focus` prints the projects behind `PARTIAL`,
#     and prints the recommender's slot count under the sentence that describes
#     the recommender's count rather than under the continuation's.
#
#   The label moves because the promoted revision reports a partial READING as a
#   state with nothing behind it, and prints a number beside a sentence about a
#   set it was not computed over. Measured on the promoted revision, two
#   commands: `serverosctl work board` says
#   `今日重点   PARTIAL：litellm: UNPRODUCED；marketops: UNPRODUCED；
#   multi-user-claw: UNPRODUCED；tokyo: UNPRODUCED`, while `serverosctl work
#   focus` — the verb a person reads to ask what today's focus is — says
#   `accepted    PARTIAL` and never which project produced the word, so
#   `UNPRODUCED` (nobody recorded a selection at all) and `UNREADABLE` (a
#   selection this reader could not open) are one answer; and the same
#   invocation prints `spare       0 of 2 slot(s) the accepted objectives did
#   not take` beside `objectives  1`, a count over the six rows on the node
#   carrying a sentence about the one objective that was accepted. Both are this
#   module's recurring shape: a fact about the reading reported as a fact about
#   the world.
#
#   No classification changes. What `PARTIAL` is composed from is untouched:
#   `compose_board` still merges the per-project states by the same rule and
#   `why` still names every project whose state is not `SELECTED`. The
#   recommender still excludes the rows already in flight and still counts a
#   slot the read could not decide, so `spare_slots` carries `unused_slots`'s
#   former value under a name that says which question it answers. `tests/` is
#   not a member of this composition, so the seven tests and the nine mutations
#   that come with this do not move the label.
#   m → n: the subjects a delegation names are read as a SCOPE, and a value that
#   is not one is refused rather than matched against. Two members change:
#
#   intake/understanding_semantic.py  `_delegation_covers` (a boolean: «is there
#     a grant at all») becomes `delegation_scope`, which answers with the
#     prefixes and refuses a `covers` that is not a list of non-blank strings.
#     `_confirmation_for` takes that scope, so «there is no delegation» and «the
#     delegation names no subject» stop being one sentence.
#   runtime/cli.py  `_delegation_from_grant` asks that function instead of
#     restating the check, so the record path and the caller's-file path cannot
#     answer «which subjects does this delegation name» differently; `work
#     delegate` refuses a blank `--covers` instead of recording one.
#
#   The label moves because the promoted revision reads a value's SHAPE as a
#   SCOPE, and every way of doing that WIDENS the grant instead of failing to
#   match it. Measured on the promoted revision, six `covers` shapes, same tree,
#   same reading, judged by exit code and by the card's bytes:
#
#     covers=['x']      rc=0 state=COMPLETE         written=2 card_changed=True
#     covers=['']       rc=0 state=COMPLETE         written=2 card_changed=True
#     covers='xyz'      rc=0 state=COMPLETE         written=2 card_changed=True
#     covers=['x','']   rc=0 state=COMPLETE         written=2 card_changed=True
#     covers=[' ']      rc=0 state=NOTHING_TO_WRITE written=0 card_changed=False
#     covers=[123]      rc=0 state=NOTHING_TO_WRITE written=0 card_changed=False
#
#   `[""]` is a prefix of every subject there is, so one blank entry turns a
#   bounded scope into an unbounded one; `"xyz"` is iterated character by
#   character, so it covers every subject beginning with `x`, `y` or `z`; `[123]`
#   is coerced by `str()` into a prefix nobody wrote. Each of the three then
#   commits an ordinary fact on the grant's own authority — and the commit is the
#   smaller half, because the sentence a resolution carries names the SUBJECT, so
#   all four committing shapes printed BYTE-IDENTICAL `confirmation_why` lines. A
#   misread scope that leaves no trace in the output is the one thing a reader has
#   no way to check. The same five lines also reported «no standing delegation
#   covers this work» for a grant that IS on the record and merely names nothing,
#   while `work grants` warns at the moment it hands that same grant over that it
#   «names no `covers` — so it delegates no subject». That is this module's
#   recurring shape: a fact about the reading reported as a fact about the world.
#
#   No commit rule changes. An ordinary fact inside a real prefix still commits
#   as `agent_reconciled` with the reason it printed before; a `PROPOSAL` or a
#   `MAJOR_CHANGES` touch still awaits a person however certain the facts are; a
#   grant that records no scope still covers nothing and every claim under it
#   still lands as a candidate. What changed is that the five shapes above are
#   refusals with a sentence naming what reading them as a scope would have
#   covered. `tests/` is not a member of this composition, so the fourteen tests
#   (four of them parametrized, twenty-two cases) and the fourteen mutations that
#   come with this do not move the label.
#
#   n → o: a recorded digest is not a measured body. Two members change:
#
#   intake/understanding_delta.py
#     `content_identity` for a document range is the digest the manifest
#     RECORDED, and this module compared a card's citation against it and handed
#     it out as a range's revision without asking whether that value describes
#     the `content.md` it names. On this node it often does not: of the
#     twenty-one link manifests under `information/raw`, fourteen record a
#     64-hex value that is not the file beside them and three record a
#     twelve-character prefix of it. The prior question is now asked once, from
#     the file's own bytes, with four answers — the record is this file's digest;
#     it describes other bytes (comparison NOT made, citation unmeasured, the
#     manifest named, no range formed); no readable body is beside it (not made
#     either, and kept apart from the previous answer); or the body is held under
#     an asset root this reader is not given (`web_capture`, where the comparison
#     IS made and the standing travels beside it). The comparison reaches only
#     as far as the shorter of the two records, in either direction. `partial`
#     counts the citations whose digest could not be compared.
#
#   runtime/cli.py
#     The measurement line says what the `一致` was agreed WITH, and the refusal
#     for a reading about a span the reader no longer proposes names the reason
#     the reader measured instead of ending at "it proposes no range".
#
#   The label moves because an installed cache left on `n` would answer the prior
#   question the old way — printing a comparison against a value no file here has
#   as though it were a body check. The measurement behind the four answers is on
#   this node's own tree (21 manifests: MATCH 4 / ABBREV 3 / DIFFERS 14), and the
#   live layer changes no verdict today: of 21 citations on 14 cards exactly one
#   carries a digest and its manifest is MATCH, so the fix is preventive for the
#   layer as it stands. `tests/` is not a member of this composition, so the
#   tests and the eighteen mutations that come with this do not move the label.
cachebuster: srv0005.20261008o

skills:
  - name: runtime-management
    source: ability-management
  - name: workspace-management
    source: ability-management
  - name: test-management
    source: ability-management

# On demand, NOT bundled. These are resolved per node at the moment a node
# reaches for them, and `status` records whether that resolution can succeed
# today. The build checks the claim against the pinned revision in both
# directions, so a stale `missing` is as much an error as a broken `available`.
#
# This list is a SUBSET of the registry, not "the registry, minus what this
# composition ships". The registry is the catalogue of everything any product on
# any node may resolve — 41 `skill` names at the pinned revision — and most of
# them belong to other products' compositions and to toolchains this node does
# not carry. This list is the part of that catalogue whose resolution THIS node
# promises, and it is short on purpose.
#
# What forces the decision is not registration, it is PLACEMENT. A name added to
# a plugin record's `provides` makes this profile either ship it or recommend it
# here, or else A1 reports `COMPOSITION_MEMBER_UNREACHABLE` at HIGH — because
# A1's rules pair each composition with ITS OWN artifact's record and judge that
# record's members. A bare `skill` entry that no record provides enters no
# comparison at all; measured 2026-09-22, 29 of the registry's 41 `skill` names
# appear in no composition here and A1 says nothing about them. So an ability
# that is registered and never placed widens this node's gap silently, and the
# gate that closes it is the record's `provides`, not this file's silence.
recommended:
  - name: information-management
    source: ability-management
    status: available
    reason: Raw observation and understanding work is real but occasional, so it
      is installed when a node begins it rather than carried by every node.
  - name: work-management
    source: ability-management
    status: available
    reason: Item and Run lifecycle is driven by the work a node is handed, not
      by the node being present, so it is resolved when work arrives.
  - name: feishu-space-management
    source: ability-management
    status: available
    reason: Only a node that owns Feishu objects needs it; a Linux work node
      reaches for it when it does.
  - name: feishu-report
    source: ability-management
    status: available
    reason: Reporting is an output of finished work, not a precondition for
      starting it.
  - name: inventory-publishing
    source: ability-management
    status: available
    reason: The frequency judgment, on data rather than on plausibility. L3
      inventory refreshes in hwz-ops run in bursts tied to topology change —
      17 events across 09-03..09-10, five of them on one day, and one in the
      six days after the convergence work stopped. That is an operation a node
      performs when the machine materially changes, not one it exercises
      without deciding to, so it is resolved at the moment it is reached for
      rather than carried by every node. Bundling it would ship the channel,
      compression and conflict logic to nodes that never publish; the payload
      is small, but a member that is present is a member the node maintains,
      and §18's rule is that the catalogue is not eagerly bundled.
  - name: document-stewardship
    source: ability-management
    status: available
    # Folded, because the reason contains colons and a plain multi-line scalar
    # would read one of them as a mapping — which is how this line was caught:
    # `yaml.safe_load` refused the file and `composition.py::_parse` fell
    # through to `json.loads`, so the failure surfaced as a JSONDecodeError on a
    # YAML document rather than as "this profile does not parse".
    reason: >-
      §26 baseline member, and now implemented — the canonical
      `document-stewardship` Skill landed the 正文 side: local diff, versioned
      verification, readback and receipt, and the rule that an unreliably
      protected conflict range produces a candidate rather than an unattended
      whole-body overwrite. It stays recommended rather than bundled because
      the node that maintains a document is the node that has been given one to
      maintain, and the Skill is explicit that the position/ACL side remains
      with `feishu-space-management`, so a node without that grant would carry
      a member it cannot exercise. The status moves because it is now true that
      the registry can resolve it; a status is a claim about the registry, and
      `build.py` checks it in both directions against the payload.
