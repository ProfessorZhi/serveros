# serveros-linux-work — the working set for a Linux node that does real work.
#
# §28: this is a composition, not a fork. It EXTENDS `serveros-core` and adds
# the specialists such a node needs; it carries no payload of its own and no
# copy of what it inherits, so it cannot drift from core about the members they
# share. Nothing here is a second source of truth for an ability — a profile
# chooses what to compose, and ability-management remains the canonical source
# of every reusable Skill named below.
#
# The rule for what belongs here: the node's ordinary day. Runtime, workspace
# and test are the three a Linux workstation exercises without deciding to.
# Everything else is recommended rather than bundled, so that a node pays for a
# specialist when it reaches for one — see §27's "do not eagerly bundle the
# catalogue".
# Declared here even though it is inherited, because a composition file that
# can only be identified through the file it points at has no meaning of its
# own — and the point of a profile is that its contents are readable on their
# own terms.
schema: serveros/bundle.v1

extends: ../bundle.yaml

composition: serveros-linux-work

# Same two faces as core, and for the reason this profile exists: a Linux work
# node runs the daemon AND has the plugin installed, from one payload. Declared
# here rather than inherited, because a profile that left it out would build an
# artifact carrying no statement about what it is, and the release path would
# then have to infer the kind from the artifact's name — the one thing §9 rules
# out. A profile that ships no runtime would declare `[plugin]` alone.
artifacts:
  - node-runtime
  - plugin

# The plugin identity this composition builds. Core keeps `hwz-server-os`, which
# is the distribution's existing name; a profile builds a different artifact and
# so must not claim the same name, or the two would be distinguishable only by
# the version string.
name: hwz-server-os-linux-work
display_name: HWZ ServerOS (Linux Work)
short_description: Agent Engineering Workbench for a Linux work node

