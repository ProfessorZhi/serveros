# hwz-server-os core composition.
#
# This file is a COMPOSITION contract. It declares which capabilities make up
# one composition, and nothing else. Wider compositions live in
# `plugin/profiles/`, each `extends:`ing this one.
#
#   serveros            owns this file, the plugin manifests, the Claude/Codex
#                       adapters, its own bootstrap Skill, the Context Capsule,
#                       and the deterministic build entry.
#   ability-management  owns the reusable Skill source and the Ability Registry
#                       (revision / compatibility / installation / discovery /
#                       reconcile).
#
# Reusable Skills are NEVER copied into this repository. The build reads them
# from an explicitly pinned ability-management revision, so a stale or dirty
# checkout on this machine cannot silently downgrade the distribution.
schema: serveros/bundle.v1

# §27: this file is the `serveros-core` composition — the bootstrap Skill, the
# node surface, the Core modules, and the ability dependencies the bootstrap
# itself calls. It is deliberately NOT the whole product.
#
# A composition is not a fork and not a checkout. Everything a wider set adds is
# declared in a profile that `extends:` this file (`plugin/profiles/`), so the
# members named here exist once, in one file, and a profile cannot disagree with
# this one about what they are. Specialists are composed by the profile that
# needs them; nothing here eagerly bundles the catalogue.
composition: serveros-core

name: hwz-server-os
display_name: HWZ ServerOS
description: ServerOS Agent Engineering Workbench
short_description: Agent Engineering Workbench for traceable work
long_description: >-
  A flexible Agent Engineering Workbench with a top-level dispatcher and
  on-demand specialist skills for information, work, tests, local and Feishu
  space, reports, and ability distribution.
author: ProfessorZhi
category: Productivity
license: MIT
brand_color: "#315C92"

version: "3.1.0"

# Cache identity of the generated payload. Bump this once whenever a
# regenerated payload must invalidate an already-installed plugin cache. Leave
# it unchanged otherwise, so that rebuilding from unchanged inputs stays
# byte-identical.
cachebuster: srv0003.20260915a

# Skills composed into the plugin, in bundle order.
#
#   source: local             canonical in this repository, at skills/<name>/
#   source: ability-management canonical in ability-management, payload at
#                             skills/<name>/payload on the pinned revision
skills:
  - name: serveros
    source: local

  # §24: runtime-management is a REUSABLE Ability, not a bootstrap one, so its
  # canonical source is ability-management and this repository composes it from
  # the pinned revision like every other reusable Skill. It was `source: local`,
  # which made the serveros repo a second source of truth for it.
  #
  # §27 names it as THE ability dependency of core, and it is the one the
  # bootstrap reaches for by name: `runtime status` is §25's third
  # responsibility, and a node with no runtime-management cannot answer it.
  - name: runtime-management
    source: ability-management

  # `ability-management` is here for the other half of §25 — `capability
  # resolve` — and §20 already classes it as Core rather than Operations, as a
  # sibling of `serveros` rather than a specialist. §27's tree shows only
  # runtime-management because it enumerates the runtime dependency; the
  # capability-resolution dependency belongs to core for the same reason and by
  # the same rule, and without it `capability resolve` has no implementation to
  # resolve with.
  - name: ability-management
    source: ability-management

# ServerOS Core modules, shipped inside the runtime artifact so that a delegating
# CLI can load the canonical implementation from the installed bundle rather than
# from a movable source checkout. Both are read-only decision kernels: they are
# given inputs and return a record, so shipping them is the whole integration.
context:
  path: context
space:
  path: space
relations:
  path: relations

# The fleet plane ships because the Agent MCP surface reads it at import time.
# `mcp/agent_mcp.py` loads `fleet/agent_control_router.py`, which loads
# `fleet/transport.py` in turn; the adapter therefore cannot start without the
# directory, and an artifact that ships the adapter and not the fleet ships an
# entry point that raises FileNotFoundError before it reads a byte of stdin.
#
# Named here rather than left to the `mcp` block because the dependency runs
# adapter -> fleet -> abilities/runtime/context, and the module that has to be
# present is the one nothing else in this file would have mentioned.
fleet:
  path: fleet

# The Ability Fabric and the Memory-Context Fabric ship for the same reason the
# three kernels above do: their contracts are what a node validates against and
# their resolvers are read-only functions of records. Shipping the resolver
# without the contract it validates against would put a rule in code and its
# statement nowhere, which is the shape this product keeps finding.
#
# Neither adds a service. `abilities/` is a resolver and four contract files;
# `memory/` is two contracts and a projection reader. The daemon does not import
# either — see `memory/provider-contract.yaml#daemon_boundary`, which is
# enforced by a test rather than asserted here.
abilities:
  path: abilities
memory:
  path: memory

# `intake` is the same defect a third time, and the first one a gate could not
# have caught by reading this file.
#
# `runtime/cli.py` loads `intake/global_board.py` at call time for
# `serverosctl requirement board`. The directory was therefore required by a
# shipped surface and declared by nothing: it was in neither this file nor
# `CORE_MODULES`, and the packaging loop treats that as "not a module" rather
# than as an error. A source checkout runs the verb; an installed artifact
# raises FileNotFoundError, which is how it was found.
#
# The mechanism matters more than the instance. The gate that was supposed to
# catch this iterated `CORE_MODULES` — the list a module is missing FROM — so
# it could only ever confirm a module somebody had already remembered. Named
# here so the composition ships it; `test_build.py`'s
# `test_the_artifact_answers_the_production_loader_closure` derives the
# requirement from the loader graph instead, so the next one is a failure
# rather than a discovery.
intake:
  path: intake

# Document identity and authority. `runtime/cli.py` loads
# `documents/document_governance.py` at call time for
# `serverosctl document resolve`, so this directory is on the production loader
# closure and the artifact has to carry it. The kernel is the fourth instance of
# the C4 defect named above `CORE_MODULES`: written, tested, and reachable from
# no artifact and no product surface, which is indistinguishable on an installed
# node from never having been written.
#
# The vocabulary ships beside the kernel rather than being an operator input.
# A judgement read against a different closed set is a different judgement, and
# `default_vocabulary_path()` resolves it relative to the module so an installed
# node judges by the same set a source checkout does.
documents:
  path: documents

# The node runtime, shipped for the reason the `mcp` block below states and for
# one more that the artifact was getting wrong.
#
# The `mcp` block declares a stdio adapter whose entire purpose is to call
# `serverosd` over its Unix socket. `runtime/` is `serverosd`, `bin/` is its
# entry point, and until now neither was in the artifact: the build shipped an
# adapter for a daemon the distribution could not start, and the node's only
# working unit pointed `ExecStart` at a per-Item worktree because there was no
# other location that contained one. That is the whole of the split brain this
# composition closes — not a missing install step, a missing member.
#
# `runtime` and `bin` are declared here rather than in the `mcp` block because
# the dependency runs the other way: the adapter depends on the runtime, not the
# runtime on the adapter, and a composition that carried one without the other
# would be describing an adapter with nothing behind it.
#
# `bin/` ships alongside because both entry points resolve the runtime through
# `Path(__file__).resolve().parent.parent / "runtime"`. Keeping that pair
# adjacent is what lets the shim in the artifact be the same file as the shim in
# the source tree, rather than a second, subtly different one.
runtime:
  path: runtime
bin:
  path: bin

# The MCP payload. `path` is copied into the artifact; `servers` are declared
# at the plugin root. Node observation and Agent Session control stay separate.
#
# §23: this is a thin stdio adapter over serverosd's Unix socket. It holds no
# state, reaches no shell, and when the daemon is down it refuses by name rather
# than answering with an empty list — the failure mode this whole architecture
# exists to prevent. The server name appears in an agent's tool namespace, so it
# is declared once, here, and the builder renders it rather than keeping a second
# list of server names of its own.
mcp:
  path: mcp
  servers:
    - name: serveros-node
      # `python3` rather than the entry point itself: the artifact writer
      # restores an executable bit only for `.sh`/`.py`, so naming the
      # interpreter is what makes this entry work regardless of the mode the
      # file lands with. A manifest that depends on a mode the build has to
      # remember is a manifest that works only where it was built.
      command: python3
      entry: bin/serveros-node-mcp
      # Without this, starting the adapter writes a `__pycache__` into the
      # plugin install directory — observed doing exactly that. That directory
      # is replaced wholesale on the next plugin update, so the cache is thrown
      # away by the very event it was meant to speed up, and in the meantime the
      # artifact contains files the build did not put there.
      env:
        PYTHONDONTWRITEBYTECODE: "1"

    - name: serveros-agent
      # Separate from serveros-node: this facade may call provider APIs after
      # serverosd admission, while the node surface remains strictly read-only.
      command: python3
      entry: bin/serveros-agent-mcp
      env:
        PYTHONDONTWRITEBYTECODE: "1"

# Default prompts surfaced by the runtime plugin UI.
default_prompt:
  - Turn this information into a traceable ServerOS work item.
  - Check ServerOS workspace and cloud-space drift.
  - Plan an isolated run with evidence and deliverables.
